name: Build and Push to ACR

on:
  push:
    branches:
      - staging
      - main
  pull_request:
    branches:
      - staging
      - main

env:
  ACR_NAME: skyacrstaging
  IMAGE_NAME: sky-poc-ai

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Azure Login (Federated Identity)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: |
          az acr login --name ${{ env.ACR_NAME }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:buildcache,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Image digest
        run: echo ${{ steps.build.outputs.digest }}

      - name: Update GitOps Manifest
        if: github.ref == 'refs/heads/staging'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          echo "Cloning infrastructure repository..."
          git clone https://x-access-token:${GH_TOKEN}@github.com/sky-first/sky-poc-infra.git infra-repo
          cd infra-repo
          
          echo "Updating rollout-trigger..."
          # Update the timestamp using sed
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          sed -i "s/rollout-trigger: \".*\"/rollout-trigger: \"$TIMESTAMP\"/" gitops/bootstrap/staging/ai.yaml
          
          # Check if there are changes
          if git diff --quiet; then
            echo "No changes to commit"
          else
            echo "Committing and pushing changes..."
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git add gitops/bootstrap/staging/ai.yaml
            git commit -m "GitOps: Update rollout-trigger for ai at $TIMESTAMP"
            git push
            echo "Successfully triggered rollout"
          fi
