services:
  postgres:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    container_name: ai_saas_postgres_prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ai_saas_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    restart: unless-stopped
    # Limites de recursos
    mem_limit: 2g
    mem_reservation: 1g
    cpus: 2.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai_saas_network

  redis:
    image: redis:7-alpine
    container_name: ai_saas_redis_prod
    # Configuração otimizada: maxmemory 400MB, política LRU, sem persistência em disco
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 400mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    restart: unless-stopped
    # Limites de recursos
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ai_saas_network

  backend:
    build:
      context: ../sky-poc-backend
      dockerfile: docker/Dockerfile
    container_name: ai_saas_backend_prod
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ai_saas_db}?sslmode=require
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      DEBUG: ${DEBUG:-false}
      ENVIRONMENT: production
      # CRÍTICO: CORS_ORIGINS deve ser configurado explicitamente no .env
      # NUNCA use "*" ou "0.0.0.0" - isso permite qualquer origem (vulnerabilidade)
      # Validação deve ser feita no código do backend
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # Limites de recursos
    mem_limit: 2g
    mem_reservation: 1g
    cpus: 2.0
    networks:
      - ai_saas_network
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        sleep 5 &&
        uvicorn src.main:app --host 0.0.0.0 --port 8000 --workers 2
      "
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || curl -f http://localhost:8000/api/health || curl -f http://localhost:8000/ || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

  worker:
    build:
      context: ../sky-poc-backend
      dockerfile: docker/Dockerfile.worker
    container_name: ai_saas_worker_prod
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ai_saas_db}?sslmode=require
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # CELERY_BROKER_URL and CELERY_RESULT_BACKEND are built in code with proper encoding
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # Limites de recursos
    mem_limit: 1g
    mem_reservation: 512m
    cpus: 1.0
    networks:
      - ai_saas_network
    # Reduzido de 4 para 2 concurrency para economizar recursos e conexões
    command: celery -A src.workers.celery_app worker --loglevel=info --concurrency=2
    healthcheck:
      test: ["CMD", "bash", "-c", "pgrep -f 'celery worker'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  beat:
    build:
      context: ../sky-poc-backend
      dockerfile: docker/Dockerfile.worker
    container_name: ai_saas_beat_prod
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ai_saas_db}?sslmode=require
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # CELERY_BROKER_URL and CELERY_RESULT_BACKEND are built in code with proper encoding
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # Limites de recursos
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    networks:
      - ai_saas_network
    command: celery -A src.workers.celery_app beat --loglevel=info
    healthcheck:
      test: ["CMD", "bash", "-c", "pgrep -f 'celery beat'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  migrate:
    build:
      context: ../sky-poc-backend
      dockerfile: docker/Dockerfile
    container_name: ai_saas_migrate
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ai_saas_db}?sslmode=require
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "
        echo 'Running alembic migrations...' &&
        alembic upgrade head &&
        echo 'Migrations done.'
      "
    restart: "no"
    networks:
      - ai_saas_network

  frontend:
    build:
      context: ../sky-poc-frontend
      dockerfile: docker/Dockerfile
    container_name: ai_saas_frontend_prod
    environment:
      # IMPORTANTE: Esta variável deve ser configurada no .env
      # Para local: http://localhost:8000/api/v1
      # Para produção: http://<IP_DA_VM>/api/v1 (ex: http://172.191.77.30/api/v1)
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      NODE_ENV: production
    depends_on:
      - backend
    restart: unless-stopped
    # Limites de recursos
    mem_limit: 1g
    mem_reservation: 512m
    cpus: 1.0
    networks:
      - ai_saas_network

  proxy:
    image: nginx:1.25-alpine
    container_name: ai_saas_proxy
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nginx -t"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - ai_saas_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  ai_saas_network:
    driver: bridge

