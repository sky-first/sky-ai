services:
  postgres:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    container_name: ai_saas_postgres_prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ai_saas_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    restart: unless-stopped
    # Limites de recursos
    mem_limit: 2g
    mem_reservation: 1g
    cpus: 2.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai_saas_network

  redis:
    image: redis:7-alpine
    container_name: ai_saas_redis_prod
    # Configuração otimizada: maxmemory 400MB, política LRU, sem persistência em disco
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 400mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    restart: unless-stopped
    # Limites de recursos
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai_saas_network

  backend:
    build:
      context: ../backend
      dockerfile: docker/Dockerfile
    container_name: ai_saas_backend_prod
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ai_saas_db}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      DEBUG: ${DEBUG:-false}
      ENVIRONMENT: production
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: production
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    # Limites de recursos
    mem_limit: 2g
    mem_reservation: 1g
    cpus: 2.0
    networks:
      - ai_saas_network
    # Reduzido de 4 para 2 workers para economizar recursos e conexões
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        sleep 5 &&
        alembic upgrade head &&
        uvicorn src.main:app --host 0.0.0.0 --port 8000 --workers 2
      "

  worker:
    build:
      context: ../backend
      dockerfile: docker/Dockerfile.worker
    container_name: ai_saas_worker_prod
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ai_saas_db}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # CELERY_BROKER_URL and CELERY_RESULT_BACKEND are built in code with proper encoding
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    # Limites de recursos
    mem_limit: 1g
    mem_reservation: 512m
    cpus: 1.0
    networks:
      - ai_saas_network
    # Reduzido de 4 para 2 concurrency para economizar recursos e conexões
    command: celery -A src.workers.celery_app worker --loglevel=info --concurrency=2

  beat:
    build:
      context: ../backend
      dockerfile: docker/Dockerfile.worker
    container_name: ai_saas_beat_prod
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ai_saas_db}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # CELERY_BROKER_URL and CELERY_RESULT_BACKEND are built in code with proper encoding
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    # Limites de recursos
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    networks:
      - ai_saas_network
    command: celery -A src.workers.celery_app beat --loglevel=info

  frontend:
    build:
      context: ../frontend
      dockerfile: docker/Dockerfile
    container_name: ai_saas_frontend_prod
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      NODE_ENV: production
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    restart: unless-stopped
    # Limites de recursos
    mem_limit: 1g
    mem_reservation: 512m
    cpus: 1.0
    networks:
      - ai_saas_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  ai_saas_network:
    driver: bridge

