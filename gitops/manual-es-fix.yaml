---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: sky-backend-staging-common-app-es
  namespace: staging
  labels:
    app.kubernetes.io/instance: sky-backend-staging
    app.kubernetes.io/name: common-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault
    kind: ClusterSecretStore
  target:
    name: sky-backend-staging-common-app-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        jwt-secret-key: "{{ .jwt_secret_key }}"
        encryption-key: "{{ .encryption_key }}"
        openai-api-key: "{{ .openai_api_key }}"
        redis-url: "{{ .redis_url }}"
        database-url: "{{ .database_url | replace \"postgresql://\" \"postgresql+asyncpg://\" }}"
  data:
    - secretKey: jwt_secret_key
      remoteRef:
        key: jwt-secret-key
    - secretKey: encryption_key
      remoteRef:
        key: encryption-key
    - secretKey: openai_api_key
      remoteRef:
        key: openai-api-key
    - secretKey: database_url
      remoteRef:
        key: database-url
    - secretKey: redis_url
      remoteRef:
        key: redis-url
