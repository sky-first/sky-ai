apiVersion: v1
kind: ConfigMap
metadata:
  name: ollama-init-scripts
  namespace: ollama
data:
  setup-models.sh: |
    #!/bin/bash
    set -e
    echo "🚀 Starting Ollama model setup..."
    
    # Wait for Ollama to be ready
    until curl -s http://localhost:11434/api/tags > /dev/null 2>&1; do
      echo "Waiting for Ollama API..."
      sleep 2
    done
    
    echo "📥 Checking base models..."
    # Always attempt pull, Ollama skips if already exists and matches digest
    ollama pull phi3:mini
    ollama pull sqlcoder:7b
    ollama pull nomic-embed-text

    echo "⚙️ Creating customized context models..."
    # Create custom models if they don't exist or need update
    ollama create sqlcoder-sky -f - <<EOF
    FROM sqlcoder:7b
    PARAMETER num_ctx 4096
    PARAMETER temperature 0
    EOF

    ollama create phi3-sky -f - <<EOF
    FROM phi3:mini
    PARAMETER num_ctx 4096
    PARAMETER temperature 0.3
    EOF
    
    echo "✅ Setup complete. Ready."
