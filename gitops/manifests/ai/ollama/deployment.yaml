apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ollama
  labels:
    app: ollama
spec:
  replicas: 0
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      # Ensure it runs on the AI CPU Node Pool
      # Ensure it runs on the AI CPU Node Pool (Turbo)
      nodeSelector:
        sky-poc-type: ai-turbo
        workload_type: ai-turbo
      
      tolerations:
        - key: "sku"
          operator: "Equal"
          value: "cpu-turbo"
          effect: "NoSchedule"

      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - containerPort: 11434
              name: http
          resources:
            limits:
              memory: "28Gi"
              cpu: "15"
            requests:
              memory: "8Gi"
              cpu: "4"
          volumeMounts:
            - name: ollama-data
              mountPath: /root/.ollama
            - name: init-scripts
              mountPath: /scripts
          
          # Lifecycle hook to run setup script in background isn't ideal for main process.
          # Better to use postStart or just run it in the main command.
          # Using the command override pattern from the proposal:
          command: ["/bin/sh", "-c"]
          args:
            - |
              # Start server in background
              ollama serve &
              pid=$!
              
              # Run setup script
              sleep 5
              /bin/bash /scripts/setup-models.sh
              
              # Wait for server process
              wait $pid
          
          # Probes adjusted for initial heavy download
          readinessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          
          livenessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 120 # Give 2 minutes for initial startup/download
            periodSeconds: 20
            failureThreshold: 5 # Total ~3-4 minutes tolerance
            
      volumes:
        - name: ollama-data
          persistentVolumeClaim:
            claimName: ollama-models-pvc
        - name: init-scripts
          configMap:
            name: ollama-init-scripts
            defaultMode: 0755
