apiVersion: batch/v1
kind: Job
metadata:
  name: sky-smoke-test-job
  namespace: staging
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  template:
    spec:
      containers:
      - name: smoke-test
        image: curlimages/curl:latest
        command: ["/bin/sh", "/scripts/smoke-test.sh"]
        env:
        - name: BACKEND_URL
          value: "https://workspace-stg-api.skyfirstlabs.com/api/health"
        - name: FRONTEND_URL
          value: "https://workspace-stg.skyfirstlabs.com/"
        - name: MAX_RETRIES
          value: "5"
        - name: RETRY_DELAY
          value: "10"
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
        volumeMounts:
        - name: scripts
          mountPath: /scripts
      volumes:
      - name: scripts
        configMap:
          name: sky-smoke-test-script
          defaultMode: 0777
      restartPolicy: Never
  backoffLimit: 0
