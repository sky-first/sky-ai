apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: azure-keyvault
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      # NOTE: vaultUrl será diferente por ambiente
      # Staging: https://akv-sky-prod-30877422.vault.azure.net
      # Prod: https://akv-sky-prod-{RANDOM_SUFFIX}.vault.azure.net (gerado por Terraform)
      # Após terraform apply, executar: terraform output key_vault_uri
      vaultUrl: "https://akv-sky-prod-30877422.vault.azure.net"
      serviceAccountRef:
        name: external-secrets
        namespace: external-secrets
---
# PRODUCTION ClusterSecretStore (por environment)
# Esta configuração será sobrescrita por Kustomize ou ArgoCD AppProject por ambiente
# Staging: usa akv-sky-staging-*
# Prod: usa akv-sky-prod-* (gerado por Terraform prod/workspace)
