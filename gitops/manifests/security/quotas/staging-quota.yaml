# gitops/manifests/security/quotas/staging-quota.yaml
apiVersion: v1
kind: ResourceQuota
metadata:
  name: finops-budget-staging
  namespace: staging
  annotations:
    description: "Teto Orçamentário FinOps. Evita escalonamento infinito e explosão de billing Azure."
spec:
  hard:
    pods: "30"             # Máximo absoluto de Pods simultâneos
    requests.cpu: "8"      # Máximo absoluto (8 vCPUs)
    requests.memory: 16Gi  # Máximo absoluto (16 GB RAM)
    limits.memory: 16Gi    # Hard Cap idêntico aos requests
