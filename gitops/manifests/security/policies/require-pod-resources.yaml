apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-pod-resources
  annotations:
    policies.kyverno.io/title: "Require Pod Resources (Limits/Requests)"
    policies.kyverno.io/category: "SRE, FinOps, Best Practices"
    policies.kyverno.io/severity: "high"
    policies.kyverno.io/subject: "Pod"
    policies.kyverno.io/description: >-
      Bloqueia o provisionamento de Pods sem configurações de CPU e Memória (requests/limits). 
      Política Zero-trust: Tolerância zero para workloads "BestEffort" que causam "Noisy Neighbor".
spec:
  validationFailureAction: Enforce
  background: true
  rules:
  - name: validate-resources-exist
    match:
      any:
      - resources:
          kinds:
          - Pod
    exclude:
      any:
      - resources:
          namespaces:
          - kube-system
          - ingress-nginx
          - kyverno
          - argocd
          - external-dns
          - cert-manager
    validate:
      message: "Security / FinOps Block: Todo workload crítico no Cluster deve possuir declarative resources (`requests.cpu`, `requests.memory` e `limits.memory`). Retorne ao IaC (Helm/Kustomize) e declare-os."
      pattern:
        spec:
          containers:
          - resources:
              requests:
                memory: "?*"
                cpu: "?*"
              limits:
                memory: "?*"
