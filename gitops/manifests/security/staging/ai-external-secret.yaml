apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: sky-ai-stg-secrets
  namespace: staging
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: azure-keyvault
    kind: ClusterSecretStore
  target:
    name: sky-ai-stg-secrets
    creationPolicy: Owner
  data:
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: openai-api-key
    - secretKey: QDRANT_URL
      remoteRef:
        key: qdrant-url
    - secretKey: DATABASE_URL
      remoteRef:
        key: database-url
    - secretKey: REDIS_URL
      remoteRef:
        key: redis-url
