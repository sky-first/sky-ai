apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: sky-ai-stg-secrets
  namespace: staging
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: azure-keyvault
    kind: SecretStore
  target:
    name: sky-ai-stg-secrets
    creationPolicy: Owner
  data:
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: stg-openai-api-key
    - secretKey: QDRANT_URL
      remoteRef:
        key: stg-qdrant-url
    - secretKey: DATABASE_URL
      remoteRef:
        key: stg-database-url
    - secretKey: REDIS_URL
      remoteRef:
        key: stg-redis-url
