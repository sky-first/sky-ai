apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: sky-be-stg-secrets
  namespace: staging
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: azure-keyvault
    kind: SecretStore
  target:
    name: sky-be-stg-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: stg-database-url
    - secretKey: REDIS_URL
      remoteRef:
        key: stg-redis-url
    - secretKey: JWT_SECRET
      remoteRef:
        key: stg-jwt-secret
