apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: sky-be-stg-secrets
  namespace: staging
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: azure-keyvault
    kind: ClusterSecretStore
  target:
    name: sky-be-stg-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "{{ .database_url | replace \"postgresql://\" \"postgresql+asyncpg://\" }}"
        REDIS_URL: "{{ .redis_url }}"
        JWT_SECRET: "{{ .jwt_secret_key }}"
        ENCRYPTION_KEY: "{{ .encryption_key }}"
        OPENAI_API_KEY: "{{ .openai_api_key }}"
  data:
    - secretKey: database_url
      remoteRef:
        key: database-url
    - secretKey: redis_url
      remoteRef:
        key: redis-url
    - secretKey: jwt_secret_key
      remoteRef:
        key: jwt-secret-key
    - secretKey: encryption_key
      remoteRef:
        key: encryption-key
    - secretKey: openai_api_key
      remoteRef:
        key: openai-api-key
