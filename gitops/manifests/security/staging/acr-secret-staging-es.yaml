apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: acr-secret-staging-docker-std
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault
    kind: ClusterSecretStore
  target:
    name: acr-secret-staging-docker-std
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "skyacrstagingj3minh.azurecr.io": {
                "username": "skyacrstagingj3minh",
                "password": "{{ .password }}",
                "auth": "{{ printf "skyacrstagingj3minh:%s" .password | b64enc }}"
              }
            }
          }
  data:
  - secretKey: password
    remoteRef:
      key: acr-password
