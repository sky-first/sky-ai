apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: sky-ai-worker-stg-secrets
  namespace: staging
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: azure-keyvault
    kind: ClusterSecretStore
  target:
    name: sky-ai-worker-stg-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Complex mappings previously handled in values.yaml
        OPENAI_API_KEY: "{{ .openai_api_key }}"
        QDRANT_URL: "{{ .qdrant_url }}"
        REDIS_URL: "{{ .redis_url }}"
        DATABASE_URL: "{{ .database_url | replace \"postgresql://\" \"postgresql+asyncpg://\" }}"
        CELERY_BROKER_URL: "{{ .redis_url | replace \"/0\" \"/1\" }}"
        CELERY_RESULT_BACKEND: "{{ .redis_url | replace \"/0\" \"/2\" }}"
  data:
    - secretKey: openai_api_key
      remoteRef:
        key: openai-api-key
    - secretKey: qdrant_url
      remoteRef:
        key: qdrant-url
    - secretKey: database_url
      remoteRef:
        key: database-url
    - secretKey: redis_url
      remoteRef:
        key: redis-url
