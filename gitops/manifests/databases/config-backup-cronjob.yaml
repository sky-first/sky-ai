apiVersion: v1
kind: ServiceAccount
metadata:
  name: sky-config-backup
  namespace: prod
  annotations:
    azure.workload.identity/client-id: "fe7a5318-f7d1-4191-9fe2-477534fd8b02"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sky-config-backup-role
  namespace: prod
rules:
- apiGroups: [""]
  resources: ["secrets", "configmaps"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sky-config-backup-rb
  namespace: prod
subjects:
- kind: ServiceAccount
  name: sky-config-backup
  namespace: prod
roleRef:
  kind: Role
  name: sky-config-backup-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: sky-config-backup
  namespace: prod
spec:
  schedule: "0 3 * * *" # Diariamente às 3 AM (após o DB backup)
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            azure.workload.identity/use: "true"
        spec:
          serviceAccountName: sky-config-backup
          restartPolicy: OnFailure
          containers:
          - name: backup-config
            image: mcr.microsoft.com/azure-cli:latest
            command:
            - /bin/sh
            - -c
            - |
              set -e
              # Instalar kubectl se não houver na imagem
              if ! command -v kubectl >/dev/null; then
                curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
                chmod +x kubectl
                mv kubectl /usr/local/bin/
              fi

              STORAGE_ACCOUNT="skybkpprod8ooz9z"
              CONTAINER_NAME="config-backups"
              FILENAME="config-prod-$(date +%Y%m%d-%H%M%S).yaml.gz"
              
              echo "🔑 Autenticando na Azure..."
              TOKEN=$(cat $AZURE_FEDERATED_TOKEN_FILE)
              az login --service-principal -u "$AZURE_CLIENT_ID" -t "$AZURE_TENANT_ID" --federated-token "$TOKEN"

              echo "📦 Fazendo dump de ConfigMaps e Secrets..."
              kubectl get configmaps,secrets -n prod -o yaml | gzip > /tmp/configs.yaml.gz

              echo "🚀 Enviando para Azure..."
              az storage blob upload \
                --account-name "$STORAGE_ACCOUNT" \
                --container-name "$CONTAINER_NAME" \
                --name "$FILENAME" \
                --auth-mode login \
                --file "/tmp/configs.yaml.gz"

              echo "✅ Backup de configurações concluído!"
