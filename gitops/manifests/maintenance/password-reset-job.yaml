apiVersion: batch/v1
kind: Job
metadata:
  name: sky-stg-password-reset-final
  namespace: staging
  labels:
    app: sky-backend
    component: maintenance
spec:
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: sky-backend
    spec:
      containers:
      - name: resetter
        image: skyacrstagingj3minh.azurecr.io/sky-poc-backend:latest
        command: ["python3", "-c"]
        args:
        - |
          import asyncio
          import os
          import bcrypt
          from sqlalchemy.ext.asyncio import create_async_engine
          from sqlalchemy import MetaData, Table, update, select

          async def run():
              db_url = os.getenv("DATABASE_URL")
              if not db_url:
                  print("DATABASE_URL not found!")
                  return
              
              db_url = db_url.replace("postgresql://", "postgresql+asyncpg://")
              print(f"Connecting to DB...")
              engine = create_async_engine(db_url)
              
              metadata = MetaData()
              password = "SkyFirst2026!"
              hashed = bcrypt.hashpw(password.encode("utf-8"), bcrypt.gensalt()).decode("utf-8")

              async with engine.begin() as conn:
                  print("Reflecting table...")
                  users_table = await conn.run_sync(
                      lambda sync_conn: Table("users", metadata, autoload_with=sync_conn)
                  )

                  emails = [
                    "lais.bispo@skyfirstlabs.com", 
                    "paulo.richau@skyfirstlabs.com",
                    "cherloquez.souto@skyfirstlabs.com",
                    "kamilly.mendonca@skyfirstlabs.com",
                    "test@example.com"
                  ]

                  for email in emails:
                      print(f"Processing {email}...")
                      stmt = update(users_table).where(users_table.c.email == email).values(
                          password_hash=hashed,
                          auth_provider="local",
                          email_verified=True,
                          status="offline"
                      )
                      await conn.execute(stmt)
                      print(f" [OK] {email} reset successful.")
                  
              print("All passwords reset successfully.")

          if __name__ == "__main__":
              asyncio.run(run())
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: sky-be-stg-secrets
              key: DATABASE_URL
        - name: REDIS_PORT
          value: "6379"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
      restartPolicy: Never
