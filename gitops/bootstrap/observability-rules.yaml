---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-rules
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"  # Após prometheus e loki
spec:
  project: default
  source:
    repoURL: "https://github.com/sky-first/sky-poc-infra.git"
    targetRevision: staging
    path: gitops/charts/observability
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: "https://kubernetes.default.svc"
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
