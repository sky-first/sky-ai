apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: "https://charts.external-secrets.io"
    targetRevision: "0.9.9"
    chart: external-secrets
    helm:
      values: |
        installCRDs: true
        serviceAccount:
          create: true
          name: external-secrets
          annotations:
            azure.workload.identity/client-id: "0d2f3a95-c84f-4d28-8cdd-29f8f3c984d1"
            azure.workload.identity/tenant-id: "a1b3ce06-b7ba-4d99-8a26-3347ab865f36"
  destination:
    server: "https://kubernetes.default.svc"
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
