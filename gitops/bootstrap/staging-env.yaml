apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: staging-env
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/sky-first/sky-poc-infra.git"
    targetRevision: staging
    path: gitops/bootstrap/staging
  destination:
    server: "https://kubernetes.default.svc"
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
