# Network Policies para o workspace TeamBlue
# Padrão: Deny-all implícito via seletores restritos (Melhores Práticas: Zero-Trust Network)
# Espelha a estrutura das network-policies do staging com isolamento por namespace

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-teamblue-network-policy
  namespace: teamblue
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: sky-be-teamblue-stg
  policyTypes:
  - Ingress
  - Egress

  # INGRESS: nginx-ingress e frontend podem enviar para o backend
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
    - podSelector:
        matchLabels:
          app.kubernetes.io/instance: sky-fe-teamblue-stg
    ports:
    - protocol: TCP
      port: 8000

  # EGRESS: Backend pode sair apenas para:
  egress:
  # DNS (obrigatório para qualquer comunicação)
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: UDP
      port: 53

  # Postgres (banco isolado do TeamBlue no mesmo cluster)
  - to:
    - podSelector:
        matchLabels:
          app: postgres
    ports:
    - protocol: TCP
      port: 5432

  # Redis (cache compartilhado - namespace staging)
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: staging
      podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379

  # AI Service (serviço compartilhado no namespace staging)
  # Acesso cross-namespace intencional - TeamBlue usa o AI do Staging
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: staging
      podSelector:
        matchLabels:
          app.kubernetes.io/instance: sky-ai-stg
    ports:
    - protocol: TCP
      port: 8001

  # External HTTPS (Azure Key Vault, OpenAI API, ACR)
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-teamblue-network-policy
  namespace: teamblue
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: sky-fe-teamblue-stg
  policyTypes:
  - Ingress
  - Egress

  # INGRESS: Apenas nginx-ingress pode enviar para o frontend
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
    ports:
    - protocol: TCP
      port: 3000

  # EGRESS: Frontend pode sair para:
  egress:
  # DNS
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: UDP
      port: 53

  # Backend API TeamBlue (mesmo namespace)
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/instance: sky-be-teamblue-stg
    ports:
    - protocol: TCP
      port: 8000

  # External HTTPS (Obrigatório para NextAuth Providers e API Pública Server-Side)
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443
