apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: teamblue-databases
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: "https://github.com/sky-first/sky-poc-infra.git"
    targetRevision: staging
    path: gitops/manifests/databases
  destination:
    server: https://kubernetes.default.svc
    namespace: teamblue
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
