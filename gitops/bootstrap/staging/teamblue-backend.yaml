apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sky-be-teamblue-stg
  namespace: argocd
  annotations:
    # Image Updater: Monitora o ACR por imagens com SHA e faz write-back isolado
    # Escreve de volta em arquivo EXCLUSIVO do TeamBlue - sem afetar o Staging
    argocd-image-updater.argoproj.io/image-list: sky-poc-backend=skyacrstagingj3minh.azurecr.io/sky-poc-backend:^sha-.*
    argocd-image-updater.argoproj.io/sky-poc-backend.update-strategy: latest
    argocd-image-updater.argoproj.io/write-back-method: git:secret:argocd/git-creds
    argocd-image-updater.argoproj.io/write-back-target: branch:staging://gitops/charts/common-app/values-teamblue-be-stg.yaml
spec:
  project: default
  source:
    repoURL: "https://github.com/sky-first/sky-poc-infra.git"
    path: gitops/charts/common-app
    targetRevision: staging
    helm:
      valueFiles:
        - values-teamblue-be-stg.yaml
      values: |
        imagePullSecrets:
          - name: regcred
        image:
          repository: skyacrstagingj3minh.azurecr.io/sky-poc-backend
        service:
          port: 80
          targetPort: 8000
        ingress:
          enabled: true
          className: "nginx"
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt-prod
            nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
            nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
            nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
            nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
            nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
            # Fix AI 403 Forbidden: Desabilita regra de SQL Injection para prompts da IA
            nginx.ingress.kubernetes.io/modsecurity-snippet: "SecRuleRemoveById 942100"
          hosts:
            - host: teamblue-api.skyfirstlabs.com
              paths:
                - path: /api(/|$)(.*)
                  pathType: ImplementationSpecific
            - host: teamblue.skyfirstlabs.com
              paths:
                - path: /api(/|$)(.*)
                  pathType: ImplementationSpecific
            - host: plataform.teamblue-stg.skyfirstlabs.com
              paths:
                - path: /api
                  pathType: Prefix

          tls:
            - secretName: sky-be-teamblue-tls
              hosts:
                - teamblue-api.skyfirstlabs.com
                - plataform.teamblue-stg.skyfirstlabs.com
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1024Mi
        probes:
          liveness:
            path: /
            initialDelaySeconds: 45
          readiness:
            path: /
            initialDelaySeconds: 10
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 3000
          fsGroup: 2000
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
            add:
              - NET_BIND_SERVICE
        replicaCount: 2
        # External Secret com o ClusterSecretStore unificado
        externalSecret:
          enabled: true
          secretStoreRef:
            name: azure-keyvault
            kind: ClusterSecretStore
          target:
            creationPolicy: Owner
            template:
              engineVersion: v2
              data:
                jwt_secret_key: "{{ .jwt_secret_key }}"
                encryption_key: "{{ .encryption_key }}"
                openai_api_key: "{{ .openai_api_key }}"
                redis_url: "redis://:{{ .redis_password }}@redis.teamblue.svc.cluster.local:6379/1"
                celery_broker_url: "redis://:{{ .redis_password }}@redis.teamblue.svc.cluster.local:6379/1"
                celery_result_backend: "redis://:{{ .redis_password }}@redis.teamblue.svc.cluster.local:6379/2"
                database_url: "{{ .database_url | replace \"postgresql://\" \"postgresql+asyncpg://\" }}"
                # Auth0 Keys
                auth0_domain: "{{ .auth0_domain }}"
                auth0_client_id: "{{ .auth0_client_id }}"
                auth0_client_secret: "{{ .auth0_client_secret }}"
                auth0_audience: "{{ .auth0_audience }}"
          data:
            - secretKey: jwt_secret_key
              remoteRef:
                key: jwt-secret-key
            - secretKey: encryption_key
              remoteRef:
                key: encryption-key
            - secretKey: openai_api_key
              remoteRef:
                key: openai-api-key
            - secretKey: database_url
              remoteRef:
                key: database-url
            - secretKey: redis_password
              remoteRef:
                key: redis-password
            # Auth0/Okta Integration (DO2025-1043)
            - secretKey: auth0_domain
              remoteRef:
                key: auth0-domain
            - secretKey: auth0_client_id
              remoteRef:
                key: auth0-client-id
            - secretKey: auth0_client_secret
              remoteRef:
                key: auth0-client-secret
            - secretKey: auth0_audience
              remoteRef:
                key: auth0-audience
        envSecrets:
          jwt-secret-key:
            name: sky-be-teamblue-stg-common-app-secrets
            key: jwt_secret_key
          encryption-key:
            name: sky-be-teamblue-stg-common-app-secrets
            key: encryption_key
          openai-api-key:
            name: sky-be-teamblue-stg-common-app-secrets
            key: openai_api_key
          DATABASE_URL:
            name: sky-be-teamblue-stg-common-app-secrets
            key: database_url
          REDIS_URL:
            name: sky-be-teamblue-stg-common-app-secrets
            key: redis_url
          CELERY_BROKER_URL:
            name: sky-be-teamblue-stg-common-app-secrets
            key: celery_broker_url
          CELERY_RESULT_BACKEND:
            name: sky-be-teamblue-stg-common-app-secrets
            key: celery_result_backend
          # Auth0 Identity Integration
          AUTH0_DOMAIN:
            name: sky-be-teamblue-stg-common-app-secrets
            key: auth0_domain
          AUTH0_CLIENT_ID:
            name: sky-be-teamblue-stg-common-app-secrets
            key: auth0_client_id
          AUTH0_CLIENT_SECRET:
            name: sky-be-teamblue-stg-common-app-secrets
            key: auth0_client_secret
          AUTH0_AUDIENCE:
            name: sky-be-teamblue-stg-common-app-secrets
            key: auth0_audience
        extraEnv:
          - name: REDIS_PORT
            value: "6379"
          - name: DEBUG
            value: "true"
          - name: AI_SERVICE_TYPE
            value: "real"
          # AI_SERVICE_URL aponta intencionalmente para o staging (serviço compartilhado)
          # Se o TeamBlue tiver AI própria, altere para: http://sky-ai-teamblue-common-app.teamblue.svc.cluster.local
          - name: AI_SERVICE_URL
            value: "http://sky-ai-stg-common-app.staging.svc.cluster.local"
          # CORS: Origens permitidas para aceitar requisições cross-origin do frontend
          # Sem isso o FastAPI bloqueia PUT/POST/PATCH com 403 Forbidden
          - name: ALLOWED_ORIGINS
            value: "https://plataform.teamblue-stg.skyfirstlabs.com,https://teamblue.skyfirstlabs.com"
          - name: CORS_ALLOW_CREDENTIALS
            value: "true"
          - name: WORKSPACE_ID
            value: "teamblue"
          - name: REFRESH_UI
            value: "2026-03-09-v2"
          - name: DATABASE_POOL_SIZE
            value: "20"
          - name: DATABASE_MAX_OVERFLOW
            value: "20"
        migration:
          enabled: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          command: ["/bin/sh", "-c"]
          args: ["alembic upgrade head || echo 'Migration already applied or failed'"]
  destination:
    server: "https://kubernetes.default.svc"
    namespace: teamblue
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
