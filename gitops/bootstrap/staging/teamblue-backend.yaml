apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sky-be-teamblue-stg
  namespace: argocd
  annotations:
    # Image Updater: Monitora o ACR por imagens com SHA e faz write-back isolado
    # Escreve de volta em arquivo EXCLUSIVO do TeamBlue - sem afetar o Staging
    argocd-image-updater.argoproj.io/image-list: sky-poc-backend=skyacrstagingj3minh.azurecr.io/sky-poc-backend:^sha-.*
    argocd-image-updater.argoproj.io/sky-poc-backend.update-strategy: latest
    argocd-image-updater.argoproj.io/write-back-method: git:secret:argocd/git-creds
    argocd-image-updater.argoproj.io/write-back-target: branch:feature/cicd-automation-teamblue-stabilization-10x://gitops/bootstrap/staging/teamblue-backend.yaml
spec:
  project: default
  source:
    repoURL: "https://github.com/sky-first/sky-poc-infra.git"
    path: gitops/charts/common-app
    targetRevision: staging
    helm:
      valueFiles:
        - values-teamblue-be-stg.yaml
      values: |
        imagePullSecrets:
          - name: regcred
        image:
          repository: skyacrstagingj3minh.azurecr.io/sky-poc-backend
          tag: sha-3b16b86e5c15eec62889da6eca34068f4f1bb671
          pullPolicy: Always
        service:
          port: 80
          targetPort: 8000
        ingress:
          enabled: true
          className: "nginx"
          annotations:
            nginx.ingress.kubernetes.io/whitelist-source-range: "81.84.211.111/32, 20.97.244.91/32, 169.155.237.0/24"
            cert-manager.io/cluster-issuer: letsencrypt-prod
          hosts:
            - host: teamblue-api.skyfirstlabs.com
              paths:
                - path: /
                  pathType: Prefix
          tls:
            - secretName: sky-be-teamblue-tls
              hosts:
                - teamblue-api.skyfirstlabs.com
        probes:
          liveness:
            path: /health
            initialDelaySeconds: 60
          readiness:
            path: /health
            initialDelaySeconds: 20
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 3000
          fsGroup: 2000
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
            add:
              - NET_BIND_SERVICE
        replicaCount: 2
        # External Secret com o ClusterSecretStore unificado
        externalSecret:
          enabled: true
          secretStoreRef:
            name: azure-keyvault
            kind: ClusterSecretStore
          target:
            creationPolicy: Owner
            template:
              engineVersion: v2
              data:
                jwt_secret_key: "{{ .jwt_secret_key }}"
                encryption_key: "{{ .encryption_key }}"
                openai_api_key: "{{ .openai_api_key }}"
                redis_url: "redis://:{{ .redis_password }}@redis.teamblue.svc.cluster.local:6379/1"
                celery_broker_url: "redis://:{{ .redis_password }}@redis.teamblue.svc.cluster.local:6379/1"
                celery_result_backend: "redis://:{{ .redis_password }}@redis.teamblue.svc.cluster.local:6379/2"
                database_url: "{{ .database_url | replace \"postgresql://\" \"postgresql+asyncpg://\" }}"
          data:
            - secretKey: jwt_secret_key
              remoteRef:
                key: jwt-secret-key
            - secretKey: encryption_key
              remoteRef:
                key: encryption-key
            - secretKey: openai_api_key
              remoteRef:
                key: openai-api-key
            - secretKey: database_url
              remoteRef:
                key: database-url
            - secretKey: redis_password
              remoteRef:
                key: redis-password
        envSecrets:
          jwt-secret-key:
            name: sky-be-teamblue-stg-common-app-secrets
            key: jwt_secret_key
          encryption-key:
            name: sky-be-teamblue-stg-common-app-secrets
            key: encryption_key
          openai-api-key:
            name: sky-be-teamblue-stg-common-app-secrets
            key: openai_api_key
          DATABASE_URL:
            name: sky-be-teamblue-stg-common-app-secrets
            key: database_url
          REDIS_URL:
            name: sky-be-teamblue-stg-common-app-secrets
            key: redis_url
          CELERY_BROKER_URL:
            name: sky-be-teamblue-stg-common-app-secrets
            key: celery_broker_url
          CELERY_RESULT_BACKEND:
            name: sky-be-teamblue-stg-common-app-secrets
            key: celery_result_backend
        extraEnv:
          - name: REDIS_PORT
            value: "6379"
          - name: DEBUG
            value: "true"
          - name: AI_SERVICE_TYPE
            value: "real"
          # AI_SERVICE_URL aponta intencionalmente para o staging (serviço compartilhado)
          # Se o TeamBlue tiver AI própria, altere para: http://sky-ai-teamblue-common-app.teamblue.svc.cluster.local
          - name: AI_SERVICE_URL
            value: "http://sky-ai-stg-common-app.staging.svc.cluster.local"
        migration:
          enabled: true
          command: ["/bin/sh", "-c"]
          args: ["alembic upgrade head || echo 'Migration already applied or failed'"]
  destination:
    server: "https://kubernetes.default.svc"
    namespace: teamblue
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
