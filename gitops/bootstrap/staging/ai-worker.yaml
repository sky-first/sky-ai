---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sky-ai-worker-stg
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: sky-poc-backend=skyacrstagingj3minh.azurecr.io/sky-poc-backend:^sha-.*
    argocd-image-updater.argoproj.io/sky-poc-backend.update-strategy: latest
    argocd-image-updater.argoproj.io/sky-poc-backend.pull-secret: secret:argocd/acr-secret-staging-docker-std
    argocd-image-updater.argoproj.io/write-back-method: git:secret:argocd/git-creds
    argocd-image-updater.argoproj.io/write-back-target: branch:staging://gitops/charts/common-app/values-sky-ai-worker-stg.yaml
spec:
  project: default
  source:
    repoURL: "https://github.com/sky-first/sky-poc-infra.git"
    path: gitops/charts/common-app
    targetRevision: staging
    helm:
      valueFiles:
        - values-sky-ai-worker-stg.yaml
      values: |
        nameOverride: "sky-ai-worker-stg"
        podAnnotations:
          rollout-trigger: "2026-01-30T08:42:40Z"
        image:
          repository: skyacrstagingj3minh.azurecr.io/sky-poc-backend
        imagePullSecrets:
          - name: regcred

        # O Worker não precisa de Ingress nem Service
        service:
          enabled: false
        ingress:
          enabled: false
        probes:
          liveness:
            enabled: false
          readiness:
            enabled: false

        command: ["celery"]
        args: ["-A", "src.workers.celery_app", "worker", "--loglevel=info", "--pool=solo"]

        # Reutilizar os segredos da IA
        podAnnotations:
          reloader.stakater.com/auto: "true"

        extraEnvFrom:
          - secretRef:
              name: sky-ai-worker-stg-secrets

        extraEnv:
          - name: REDIS_PORT
            value: "6379"
          - name: DEBUG
            value: "false"

          - name: AI_SERVICE_URL
            value: "http://sky-ai-stg-common-app"
          - name: DATABASE_POOL_SIZE
            value: "10"

  destination:
    server: "https://kubernetes.default.svc"
    namespace: staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
