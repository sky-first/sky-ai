apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sky-ai-worker-stg
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: sky-poc-backend=skyacrstagingj3minh.azurecr.io/sky-poc-backend:^sha-.*
    argocd-image-updater.argoproj.io/sky-poc-backend.update-strategy: latest
    argocd-image-updater.argoproj.io/write-back-method: git:secret:argocd/git-creds
    argocd-image-updater.argoproj.io/write-back-target: branch:staging://gitops/charts/common-app/values-sky-ai-worker-stg.yaml
spec:
  project: default
  source:
    repoURL: "https://github.com/sky-first/sky-poc-infra.git"
    path: gitops/charts/common-app
    targetRevision: staging
    helm:
      valueFiles:
        - values-sky-ai-worker-stg.yaml
      values: |
        nameOverride: "sky-ai-worker-stg"
        podAnnotations:
          rollout-trigger: "2026-02-05T10:42:40Z"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 3000
          fsGroup: 2000
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        image:
          repository: skyacrstagingj3minh.azurecr.io/sky-poc-backend
          tag: sha-6f6c8b54a2098db2aa2128894876fa3b0b98e15e
          pullPolicy: IfNotPresent
        
        # O Worker não precisa de Ingress nem Service
        service:
          enabled: false
        ingress:
          enabled: false
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 2000m
            memory: 2048Mi
        probes:
          liveness:
            enabled: false
          readiness:
            enabled: false

        command: ["celery"]
        args: ["-A", "src.workers.celery_app", "worker", "--loglevel=info", "--pool=solo"]
        
        # Configure External Secret to fetch keys from Azure Key Vault
        externalSecret:
          enabled: true
          secretStoreRef:
            name: azure-keyvault-staging  # REVERT: Uso do store namespaced para evitar bloqueio de firewall
            kind: SecretStore
          target:
            name: sky-ai-worker-stg-secrets
            template:
              engineVersion: v2
              data:
                openai_api_key: "{{ .openai_api_key }}"
                qdrant_url: "{{ .qdrant_url }}"
                redis_url: "{{ .redis_url }}"
                celery_broker_url: "{{ .redis_url | replace \"/0\" \"/1\" }}"
                celery_result_backend: "{{ .redis_url | replace \"/0\" \"/2\" }}"
                database_url: "{{ .database_url | replace \"postgresql://\" \"postgresql+asyncpg://\" }}"
          data:
            - secretKey: openai_api_key
              remoteRef:
                key: openai-api-key
            - secretKey: qdrant_url
              remoteRef:
                key: qdrant-url
            - secretKey: database_url
              remoteRef:
                key: database-url
            - secretKey: redis_url
              remoteRef:
                key: redis-url
                
        envSecrets:
          openai-api-key:
            name: sky-ai-worker-stg-secrets
            key: openai_api_key
          DATABASE_URL:
            name: sky-ai-worker-stg-secrets
            key: database_url
          REDIS_URL:
            name: sky-ai-worker-stg-secrets
            key: redis_url
          CELERY_BROKER_URL:
            name: sky-ai-worker-stg-secrets
            key: celery_broker_url
          CELERY_RESULT_BACKEND:
            name: sky-ai-worker-stg-secrets
            key: celery_result_backend
            
        extraEnv:
          - name: REDIS_PORT
            value: "6379"
          - name: DEBUG
            value: "false"
          - name: OLLAMA_BASE_URL
            value: "http://ollama.ollama.svc.cluster.local:11434"
          - name: AI_SERVICE_URL
            value: "http://sky-ai-stg-common-app"
          - name: DATABASE_POOL_SIZE
            value: "10"

  destination:
    server: "https://kubernetes.default.svc"
    namespace: staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
# Force re-sync: Mon Apr 6 17:00:00 WET 2026
