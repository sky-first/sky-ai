apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sky-external-dns-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/kubernetes-sigs/external-dns.git"
    targetRevision: "master"
    path: "charts/external-dns"
    helm:
      values: |
        logLevel: debug
        image:
          tag: "v0.14.0"
        provider: azure
        extraArgs:
          - --azure-config-file=/etc/kubernetes/azure.json
        extraVolumes:
          - name: azure-config
            configMap:
              name: external-dns-config
        extraVolumeMounts:
          - name: azure-config
            mountPath: /etc/kubernetes
            readOnly: true
        domainFilters:
          - skyfirstlabs.com
        txtOwnerId: "staging-aks"
        serviceAccount:
          create: true
          name: external-dns
          annotations:
            azure.workload.identity/client-id: "1be58ac7-293a-472f-bbdb-a69247f0e2c6"
        podLabels:
          azure.workload.identity/use: "true"
  destination:
    server: "https://kubernetes.default.svc"
    namespace: external-dns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
