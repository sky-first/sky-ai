apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sky-ai-stg
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/sky-first/sky-poc-infra.git"
    path: gitops/charts/common-app
    targetRevision: staging
    helm:
      values: |
        podAnnotations:
          rollout-trigger: "2026-01-31T23:43:39Z"
        imagePullSecrets:
          - name: regcred
        image:
          repository: skyacrstagingj3minh.azurecr.io/sky-poc-ai
          tag: "staging"
        service:
          port: 80
          targetPort: 8001
        ingress:
          enabled: true
          className: "nginx"
          annotations:
            nginx.ingress.kubernetes.io/whitelist-source-range: "81.84.211.111/32, 20.97.244.91/32, 169.155.237.158/32, 169.155.237.143/32"
            cert-manager.io/cluster-issuer: letsencrypt-prod
          hosts:
            - host: workspace-stg-ollama.skyfirstlabs.com
              paths:
                - path: /
                  pathType: Prefix
          tls:
            - secretName: sky-ai-stg-tls
              hosts:
                - workspace-stg-ollama.skyfirstlabs.com
        probes:
          liveness:
            path: /docs
            initialDelaySeconds: 30
          readiness:
            path: /docs
            initialDelaySeconds: 10
        # Configure External Secret to fetch keys from Azure Key Vault
        externalSecret:
          enabled: true
          secretStoreRef:
            name: azure-keyvault
            kind: ClusterSecretStore
          target:
            creationPolicy: Owner
            template:
              engineVersion: v2
              data:
                openai_api_key: "{{ .openai_api_key }}"
                qdrant_url: "{{ .qdrant_url }}"
                redis_url: "{{ .redis_url }}"
                # Derivando URLs do Celery a partir da redis_url do segredo
                celery_broker_url: "{{ .redis_url | replace \"/0\" \"/1\" }}"
                celery_result_backend: "{{ .redis_url | replace \"/0\" \"/2\" }}"
                database_url: "{{ .database_url | replace \"postgresql://\" \"postgresql+asyncpg://\" }}"
          data:
            - secretKey: openai_api_key
              remoteRef:
                key: openai-api-key
            - secretKey: qdrant_url
              remoteRef:
                key: qdrant-url
            - secretKey: database_url
              remoteRef:
                key: database-url
            - secretKey: redis_url
              remoteRef:
                key: redis-url
                
        # Map the synced secrets to Env Vars in the container
        envSecrets:
          openai-api-key:
            name: sky-ai-stg-common-app-secrets
            key: openai_api_key
          qdrant-url:
            name: sky-ai-stg-common-app-secrets
            key: qdrant_url
          database-url:
            name: sky-ai-stg-common-app-secrets
            key: database_url
          redis-url:
            name: sky-ai-stg-common-app-secrets
            key: redis_url
          CELERY_BROKER_URL:
            name: sky-ai-stg-common-app-secrets
            key: celery_broker_url
          CELERY_RESULT_BACKEND:
            name: sky-ai-stg-common-app-secrets
            key: celery_result_backend
            
        migration:
          enabled: true
          command: ["python3", "-c"]
          args: 
            - |
              import os, asyncio, asyncpg, glob
              from sqlalchemy import text
              from db.session import engine
              from db.models import Base

              async def run():
                  url = os.getenv('DATABASE_URL')
                  if not url:
                      print('DATABASE_URL not set')
                      return
                  
                  # 1. Enable pgvector extension
                  pure_url = url.replace('postgresql+asyncpg://', 'postgresql://')
                  pure_url = pure_url.replace('postgresql+psycopg2://', 'postgresql://')
                  if 'psycopg2' in pure_url: pure_url = pure_url.replace('psycopg2', '')
                  
                  try:
                      print('Enabling pgvector extension...')
                      conn_pg = await asyncpg.connect(pure_url)
                      await conn_pg.execute('CREATE EXTENSION IF NOT EXISTS vector;')
                      await conn_pg.close()
                      print('✅ extension vector enabled')
                  except Exception as e:
                      print(f'Warning enabling vector extension: {e}')

                  # 2. Sync SQLAlchemy Models (chat_history, embeddings, etc)
                  try:
                      print('Syncing SQLAlchemy models...')
                      async with engine.begin() as conn:
                          await conn.run_sync(Base.metadata.create_all)
                      print('✅ models synced')
                  except Exception as e:
                      print(f'Warning syncing models: {e}')

                  # 3. Apply raw SQL migrations
                  try:
                      conn_pg = await asyncpg.connect(pure_url)
                      for f in sorted(glob.glob('/app/db/migrations/*.sql')):
                          with open(f) as sq:
                              print(f'Applying {f}...')
                              try:
                                  await conn_pg.execute(sq.read())
                              except Exception as e:
                                  print(f'Notice: {e}')
                      await conn_pg.close()
                  except Exception as e:
                      print(f'Warning applying SQL migrations: {e}')
                  
              asyncio.run(run())
              
        extraEnv:
          - name: REDIS_PORT
            value: "6379"
          - name: DEBUG
            value: "false"
          - name: OLLAMA_BASE_URL
            value: "http://ollama.ollama.svc.cluster.local:11434"
  destination:
    server: "https://kubernetes.default.svc"
    namespace: staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
