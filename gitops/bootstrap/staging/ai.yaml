apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sky-ai-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/sky-first/sky-poc-infra.git"
    path: gitops/charts/common-app
    targetRevision: staging
    helm:
      values: |
        podAnnotations:
          rollout-trigger: "2026-01-21T11:00:02Z"
        imagePullSecrets:
          - name: regcred
        image:
          repository: skyacrstagingj3minh.azurecr.io/sky-poc-ai
          tag: "staging"
        service:
          port: 80
          targetPort: 8001
        ingress:
          enabled: true
          className: "nginx"
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt-prod
          hosts:
            - host: ai.skyfirstlabs.com
              paths:
                - path: /
                  pathType: Prefix
          tls:
            - secretName: sky-ai-tls
              hosts:
                - ai.skyfirstlabs.com
        probes:
          liveness:
            path: /docs
            initialDelaySeconds: 30
          readiness:
            path: /docs
            initialDelaySeconds: 10
        # Configure External Secret to fetch keys from Azure Key Vault
        externalSecret:
          enabled: true
          secretStoreRef:
            name: azure-keyvault
            kind: ClusterSecretStore
          target:
            creationPolicy: Owner
            template:
              engineVersion: v2
              data:
                openai_api_key: "{{ .openai_api_key }}"
                qdrant_url: "{{ .qdrant_url }}"
                redis_url: "{{ .redis_url }}"
                # Derivando URLs do Celery a partir da redis_url do segredo
                celery_broker_url: "{{ .redis_url | replace \"/0\" \"/1\" }}"
                celery_result_backend: "{{ .redis_url | replace \"/0\" \"/2\" }}"
                database_url: "{{ .database_url | replace \"postgresql://\" \"postgresql+asyncpg://\" }}"
          data:
            - secretKey: openai_api_key
              remoteRef:
                key: openai-api-key
            - secretKey: qdrant_url
              remoteRef:
                key: qdrant-url
            - secretKey: database_url
              remoteRef:
                key: database-url
            - secretKey: redis_url
              remoteRef:
                key: redis-url
                
        # Map the synced secrets to Env Vars in the container
        envSecrets:
          openai-api-key:
            name: sky-ai-staging-common-app-secrets
            key: openai_api_key
          qdrant-url:
            name: sky-ai-staging-common-app-secrets
            key: qdrant_url
          database-url:
            name: sky-ai-staging-common-app-secrets
            key: database_url
          redis-url:
            name: sky-ai-staging-common-app-secrets
            key: redis_url
          CELERY_BROKER_URL:
            name: sky-ai-staging-common-app-secrets
            key: celery_broker_url
          CELERY_RESULT_BACKEND:
            name: sky-ai-staging-common-app-secrets
            key: celery_result_backend
            
        extraEnv:
          - name: REDIS_PORT
            value: "6379"
          - name: DEBUG
            value: "false"
  destination:
    server: "https://kubernetes.default.svc"
    namespace: staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
