apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sky-teamblue-ai-worker
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/sky-first/sky-poc-infra.git"
    path: gitops/charts/common-app
    targetRevision: staging
    helm:
      valueFiles:
        - values-teamblue-ai-worker-stg.yaml
      values: |
        # Injeção dinâmica de segredos via ExternalSecret herdado (ou compartilhado)
        externalSecret:
          enabled: true
          secretStoreRef:
            name: azure-keyvault
            kind: ClusterSecretStore
          target:
            name: sky-teamblue-ai-worker-secrets
            template:
              engineVersion: v2
              data:
                openai_api_key: "{{ .openai_api_key }}"
                redis_url: "redis://:{{ .redis_password }}@redis.teamblue.svc.cluster.local:6379/1"
                celery_broker_url: "redis://:{{ .redis_password }}@redis.teamblue.svc.cluster.local:6379/1"
                celery_result_backend: "redis://:{{ .redis_password }}@redis.teamblue.svc.cluster.local:6379/2"
                database_url: "{{ .database_url | replace \"postgresql://\" \"postgresql+asyncpg://\" }}"
          data:
            - secretKey: openai_api_key
              remoteRef:
                key: openai-api-key
            - secretKey: redis_password
              remoteRef:
                key: redis-password
            - secretKey: database_url
              remoteRef:
                key: database-url
        
        envSecrets:
          openai-api-key:
            name: sky-teamblue-ai-worker-secrets
            key: openai_api_key
          REDIS_URL:
            name: sky-teamblue-ai-worker-secrets
            key: redis_url
          CELERY_BROKER_URL:
            name: sky-teamblue-ai-worker-secrets
            key: celery_broker_url
          CELERY_RESULT_BACKEND:
            name: sky-teamblue-ai-worker-secrets
            key: celery_result_backend
          DATABASE_URL:
            name: sky-teamblue-ai-worker-secrets
            key: database_url
  destination:
    server: "https://kubernetes.default.svc"
    namespace: teamblue
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
