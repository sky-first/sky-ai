apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sky-infra-secrets
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: "https://github.com/sky-first/sky-poc-infra.git"
    path: gitops/manifests/security
    targetRevision: fix-infra-multi-env
  destination:
    server: "https://kubernetes.default.svc"
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
