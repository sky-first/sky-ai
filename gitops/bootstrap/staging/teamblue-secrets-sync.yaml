apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: teamblue-keyvault-cluster
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: "https://akv-sky-staging-aa7bc8e6.vault.azure.net"
      serviceAccountRef:
        name: external-secrets
        namespace: external-secrets
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: teamblue-secrets
  namespace: teamblue
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: teamblue-keyvault-cluster
  target:
    name: sky-be-stg-secrets # Matching the expectation in values-teamblue.yaml
    creationPolicy: Owner
  data:
  - secretKey: DATABASE_URL
    remoteRef:
      key: DATABASE-URL
  - secretKey: JWT_SECRET
    remoteRef:
      key: JWT-SECRET
  - secretKey: ENCRYPTION_KEY
    remoteRef:
      key: ENCRYPTION-KEY

