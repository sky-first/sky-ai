apiVersion: v1
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
        <title>Team.Blue - Sky-First Platform</title>
        <style>
            body {
                background-color: #0d1117;
                color: #c9d1d9;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                height: 100vh;
                margin: 0;
            }
            .container {
                text-align: center;
                background: rgba(22, 27, 34, 0.8);
                padding: 3rem;
                border-radius: 12px;
                border: 1px solid #30363d;
                box-shadow: 0 8px 32px rgba(0,0,0,0.5);
                backdrop-filter: blur(10px);
            }
            img {
                max-width: 250px;
                margin-bottom: 2rem;
                filter: drop-shadow(0 0 10px rgba(88, 166, 255, 0.3));
            }
            h1 {
                color: #58a6ff;
                font-size: 2.5rem;
                margin-bottom: 1rem;
            }
            p {
                font-size: 1.2rem;
                opacity: 0.8;
            }
            .status {
                margin-top: 2rem;
                padding: 0.5rem 1rem;
                background: #238636;
                color: white;
                border-radius: 20px;
                display: inline-block;
                font-weight: bold;
                font-size: 0.9rem;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <img src="https://skylokistagingqsfa9s.blob.core.windows.net/branding/teamblue/logo.png" alt="Team.Blue Logo">
            <h1>Welcome to Team.Blue</h1>
            <p>Your Sky-First Managed Environment is Live & Secure.</p>
            <div class="status">● System Operational</div>
        </div>
    </body>
    </html>
kind: ConfigMap
metadata:
  name: teamblue-index
  namespace: teamblue
