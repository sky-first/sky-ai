apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sky-be-stg
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/sky-first/sky-poc-infra.git"
    path: gitops/charts/common-app
    targetRevision: staging
    helm:
      values: |
        podAnnotations:
          rollout-trigger: "2026-01-29T11:32:59Z"
        replicaCount: 2
        imagePullSecrets:
          - name: regcred
        image:
          repository: skyacrstagingj3minh.azurecr.io/sky-poc-backend
          tag: "staging"
          pullPolicy: Always
        service:
          port: 80
          targetPort: 8000
        ingress:
          enabled: true
          className: "nginx"
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt-prod
          hosts:
            - host: workspace-stg-api.skyfirstlabs.com
              paths:
                - path: /
                  pathType: Prefix
            - host: workspace-stg.skyfirstlabs.com
              paths:
                - path: /api
                  pathType: Prefix
          tls:
            - secretName: sky-be-stg-tls
              hosts:
                - workspace-stg-api.skyfirstlabs.com
                - workspace-stg.skyfirstlabs.com
        probes:
          liveness:
            path: /
            initialDelaySeconds: 45
          readiness:
            path: /
            initialDelaySeconds: 10
        # Configure External Secret to fetch keys from Azure Key Vault
        externalSecret:
          enabled: true
          secretStoreRef:
            name: azure-keyvault
            kind: ClusterSecretStore
          target:
            creationPolicy: Owner
            template:
              engineVersion: v2
              data:
                # Transform proper keys for the application check
                jwt_secret_key: "{{ .jwt_secret_key }}"
                encryption_key: "{{ .encryption_key }}"
                openai_api_key: "{{ .openai_api_key }}"
                redis_url: "{{ .redis_url }}"
                # Derivando URLs do Celery a partir da redis_url do segredo
                celery_broker_url: "{{ .redis_url | replace \"/0\" \"/1\" }}"
                celery_result_backend: "{{ .redis_url | replace \"/0\" \"/2\" }}"
                # Crucial Fix: Ensure asyncpg driver is used and keys match Migration Job expectations
                database_url: "{{ .database_url | replace \"postgresql://\" \"postgresql+asyncpg://\" }}"
          data:
            - secretKey: jwt_secret_key
              remoteRef:
                key: jwt-secret-key
            - secretKey: encryption_key
              remoteRef:
                key: encryption-key
            - secretKey: openai_api_key
              remoteRef:
                key: openai-api-key
            - secretKey: database_url
              remoteRef:
                key: database-url
            - secretKey: redis_url
              remoteRef:
                key: redis-url

        # Map the synced secrets to Env Vars in the container
        envSecrets:
          # These keys will be present in the secret created by ExternalSecret
          jwt-secret-key:
            name: sky-be-stg-common-app-secrets
            key: jwt_secret_key
          encryption-key:
            name: sky-be-stg-common-app-secrets
            key: encryption_key
          openai-api-key:
            name: sky-be-stg-common-app-secrets
            key: openai_api_key
          DATABASE_URL:
            name: sky-be-stg-common-app-secrets
            key: database_url
          REDIS_URL:
            name: sky-be-stg-common-app-secrets
            key: redis_url
          CELERY_BROKER_URL:
            name: sky-be-stg-common-app-secrets
            key: celery_broker_url
          CELERY_RESULT_BACKEND:
            name: sky-be-stg-common-app-secrets
            key: celery_result_backend
            
        extraEnv:
          - name: CORS_ORIGINS
            value: "https://workspace-stg.skyfirstlabs.com,https://workspace-stg-ollama.skyfirstlabs.com"
          - name: REDIS_PORT
            value: "6379"
          - name: DEBUG
            value: "true"
          # AI Service Configuration - CRITICAL for AI responses
          - name: AI_SERVICE_TYPE
            value: "real"
          - name: AI_SERVICE_URL
            value: "http://sky-ai-stg-common-app.staging.svc.cluster.local"
        migration:
          enabled: true
          command: ["alembic"]
          args: ["upgrade", "head"]
  destination:
    server: "https://kubernetes.default.svc"
    namespace: staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
