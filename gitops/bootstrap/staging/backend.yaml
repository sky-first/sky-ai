apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sky-be-stg
  namespace: argocd
#   annotations:
#     argocd-image-updater.argoproj.io/image-list: sky-poc-backend=skyacrstagingj3minh.azurecr.io/sky-poc-backend:^sha-.*
#     argocd-image-updater.argoproj.io/sky-poc-backend.update-strategy: latest
#     argocd-image-updater.argoproj.io/write-back-method: git:secret:argocd/git-creds
#     argocd-image-updater.argoproj.io/write-back-target: branch:staging://gitops/charts/common-app/values-sky-be-stg.yaml
spec:
  project: default
  source:
    repoURL: "https://github.com/sky-first/sky-poc-infra.git"
    path: gitops/charts/common-app
    targetRevision: staging
    helm:
      valueFiles:
        - values-sky-be-stg.yaml
      values: |
        podAnnotations:
          rollout-trigger: "2026-02-02T09:26:49Z"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 3000
          fsGroup: 2000
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
            add:
              - NET_BIND_SERVICE
        replicaCount: 2
        autoscaling:
          enabled: false
        imagePullSecrets:
          - name: regcred
        image:
          repository: skyacrstagingj3minh.azurecr.io/sky-poc-backend
          pullPolicy: Always
        service:
          port: 80
          targetPort: 8000
        ingress:
          enabled: true
          className: "nginx"
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt-prod
            nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
            nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
            # TECHNICAL DEBT RESOLVIDO: 942100 (SQLi) reativado globalmente.
            # Bypass URI-específico para /api/dashboards agora gerenciado via
            # ConfigMap modsecurity-exclusions (OWASP CRS REQUEST-900 mechanism).
            nginx.ingress.kubernetes.io/modsecurity-snippet: "SecRuleRemoveById 911100"
          hosts:
            - host: workspace-stg-api.skyfirstlabs.com
              paths:
                - path: /
                  pathType: Prefix
            - host: workspace-stg.skyfirstlabs.com
              paths:
                - path: /api
                  pathType: Prefix
          tls:
            - secretName: sky-fe-stg-tls
              hosts:
                - workspace-stg-api.skyfirstlabs.com
                - workspace-stg.skyfirstlabs.com
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1024Mi
        probes:
          liveness:
            path: /
            initialDelaySeconds: 45
          readiness:
            path: /
            initialDelaySeconds: 10
        podSecurityContext:
          runAsNonRoot: true
          runAsUser: 1000
          fsGroup: 2000
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          runAsUser: 1000
        # Configure External Secret to fetch keys from Azure Key Vault
        externalSecret:
          enabled: true
          secretStoreRef:
            name: azure-keyvault-staging  # REVERT: Uso do store namespaced para evitar bloqueio de firewall
            kind: SecretStore
          target:
            creationPolicy: Owner
            name: sky-be-stg-common-app-secrets
            template:
              engineVersion: v2
              data:
                # Transform proper keys for the application check
                jwt_secret_key: "{{ .jwt_secret_key }}"
                encryption_key: "{{ .encryption_key }}"
                openai_api_key: "{{ .openai_api_key }}"
                redis_url: "{{ .redis_url }}"
                # Derivando URLs do Celery a partir da redis_url do segredo
                celery_broker_url: "{{ .redis_url | replace \"/0\" \"/1\" }}"
                celery_result_backend: "{{ .redis_url | replace \"/0\" \"/2\" }}"
                # Crucial Fix: Ensure asyncpg driver is used and keys match Migration Job expectations
                database_url: "{{ .database_url | replace \"postgresql://\" \"postgresql+asyncpg://\" }}"
                google_client_id: "{{ .google_client_id }}"
                google_client_secret: "{{ .google_client_secret }}"
                google_redirect_uri: "{{ .google_redirect_uri }}"
          data:
            - secretKey: jwt_secret_key
              remoteRef:
                key: jwt-secret-key
            - secretKey: encryption_key
              remoteRef:
                key: encryption-key
            - secretKey: openai_api_key
              remoteRef:
                key: openai-api-key
            - secretKey: database_url
              remoteRef:
                key: database-url
            - secretKey: redis_url
              remoteRef:
                key: redis-url
            # Google SSO
            - secretKey: google_client_id
              remoteRef:
                key: google-client-id
            - secretKey: google_client_secret
              remoteRef:
                key: google-client-secret
            - secretKey: google_redirect_uri
              remoteRef:
                key: google-redirect-uri
            # Auth0/Okta Integration (DO2025-1043)
            - secretKey: auth0_domain
              remoteRef:
                key: auth0-domain
            - secretKey: auth0_client_id
              remoteRef:
                key: auth0-client-id
            - secretKey: auth0_client_secret
              remoteRef:
                key: auth0-client-secret
            - secretKey: auth0_audience
              remoteRef:
                key: auth0-audience
 
        # Map the synced secrets to Env Vars in the container
        envSecrets:
          # These keys will be present in the secret created by ExternalSecret
          jwt_secret_key:
            name: sky-be-stg-common-app-secrets
            key: jwt_secret_key
          encryption_key:
            name: sky-be-stg-common-app-secrets
            key: encryption_key
          openai_api_key:
            name: sky-be-stg-common-app-secrets
            key: openai_api_key
          DATABASE_URL:
            name: sky-be-stg-common-app-secrets
            key: database_url
          REDIS_URL:
            name: sky-be-stg-common-app-secrets
            key: redis_url
          CELERY_BROKER_URL:
            name: sky-be-stg-common-app-secrets
            key: celery_broker_url
          CELERY_RESULT_BACKEND:
            name: sky-be-stg-common-app-secrets
            key: celery_result_backend
          # Google SSO
          GOOGLE_CLIENT_ID:
            name: sky-be-stg-common-app-secrets
            key: google_client_id
          GOOGLE_CLIENT_SECRET:
            name: sky-be-stg-common-app-secrets
            key: google_client_secret
          GOOGLE_REDIRECT_URI:
            name: sky-be-stg-common-app-secrets
            key: google_redirect_uri
          # Auth0 Identity Integration
          AUTH0_DOMAIN:
            name: sky-be-stg-common-app-secrets
            key: auth0_domain
          AUTH0_CLIENT_ID:
            name: sky-be-stg-common-app-secrets
            key: auth0_client_id
          AUTH0_CLIENT_SECRET:
            name: sky-be-stg-common-app-secrets
            key: auth0_client_secret
          AUTH0_AUDIENCE:
            name: sky-be-stg-common-app-secrets
            key: auth0_audience
            
        extraEnv:
          - name: CORS_ORIGINS
            value: "https://workspace-stg.skyfirstlabs.com,https://workspace-stg-ollama.skyfirstlabs.com"
          - name: REDIS_PORT
            value: "6379"
        migration:
          enabled: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
          command: ["/bin/sh", "-c"]
          args: ["alembic upgrade head || echo 'Migration already applied or failed'"]
  destination:
    server: "https://kubernetes.default.svc"
    namespace: staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
# Force refresh: Mon Apr 6 16:50:00 WET 2026
