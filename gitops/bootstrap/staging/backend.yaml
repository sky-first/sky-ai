---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sky-be-stg
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: sky-poc-backend=skyacrstagingj3minh.azurecr.io/sky-poc-backend:^sha-.*
    argocd-image-updater.argoproj.io/sky-poc-backend.update-strategy: latest
    argocd-image-updater.argoproj.io/write-back-method: git:secret:argocd/git-creds
    argocd-image-updater.argoproj.io/write-back-target: branch:staging://gitops/charts/common-app/values-sky-be-stg.yaml
spec:
  project: default
  source:
    repoURL: "https://github.com/sky-first/sky-poc-infra.git"
    path: gitops/charts/common-app
    targetRevision: staging
    helm:
      valueFiles:
        - values-sky-be-stg.yaml
      values: |
        podAnnotations:
          reloader.stakater.com/auto: "true"
        securityContext: {} # Usar configurações do values-sky-be-stg.yaml
        replicaCount: 2
        imagePullSecrets:
          - name: regcred
        image:
          repository: skyacrstagingj3minh.azurecr.io/sky-poc-backend
          pullPolicy: Always
        service:
          port: 80
          targetPort: 8000
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        autoscaling:
          enabled: true
          minReplicas: 2
          maxReplicas: 10
          targetCPUUtilizationPercentage: 70
          targetMemoryUtilizationPercentage: 80
        ingress:
          enabled: false
          className: "nginx"
          annotations:
            nginx.ingress.kubernetes.io/enable-modsecurity: "false"
            nginx.ingress.kubernetes.io/enable-owasp-modsecurity-crs: "false"
            nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
            nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
            cert-manager.io/cluster-issuer: letsencrypt-prod
          hosts:
            - host: workspace-stg-api.skyfirstlabs.com
              paths:
                - path: /
                  pathType: Prefix
          tls:
            - secretName: sky-be-stg-tls
              hosts:
                - workspace-stg-api.skyfirstlabs.com
        # Disable chart-level ExternalSecret as we use standalone manifest
        externalSecret:
          enabled: false

        # Map the synced secrets to Env Vars in the container
        extraEnvFrom:
          - secretRef:
              name: sky-be-stg-secrets

        extraEnv:
          - name: CORS_ORIGINS
            value: "https://workspace-stg.skyfirstlabs.com,https://workspace-stg-ollama.skyfirstlabs.com"
          - name: REDIS_HOST
            value: "redis"
          - name: REDIS_PORT
            value: "6379"
          - name: DEBUG
            value: "true"
          # AI Service Configuration - CRITICAL for AI responses
          - name: AI_SERVICE_TYPE
            value: "real"
          - name: AI_SERVICE_URL
            value: "http://sky-ai-stg-common-app.staging.svc.cluster.local"
        migration:
          enabled: true
          annotations:
            argocd.argoproj.io/hook: PreSync
            argocd.argoproj.io/hook-delete-policy: before-hook-creation
          command: ["/bin/sh", "-c"]
          args: ["alembic upgrade head || echo 'Migration already applied or failed'"]
  destination:
    server: "https://kubernetes.default.svc"
    namespace: staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
