apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sky-fe-stg
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/sky-first/sky-poc-infra.git"
    path: gitops/charts/common-app
    targetRevision: staging
    helm:
      valueFiles:
        - .argocd-source-sky-fe-stg.yaml
      values: |
        podAnnotations:
          rollout-trigger: "2026-02-02T09:32:31Z"

        imagePullSecrets:
          - name: regcred
        image:
          repository: skyacrstagingj3minh.azurecr.io/sky-poc-frontend
          tag: "staging"
        service:
          port: 80
          targetPort: 3000
        ingress:
          enabled: true
          className: "nginx"
          annotations:
            nginx.ingress.kubernetes.io/whitelist-source-range: "81.84.211.111/32, 20.97.244.91/32, 169.155.237.158/32, 169.155.237.143/32"
            cert-manager.io/cluster-issuer: letsencrypt-prod
          hosts:
            - host: workspace-stg.skyfirstlabs.com
              paths:
                - path: /
                  pathType: Prefix
          tls:
            - secretName: sky-fe-stg-tls
              hosts:
                - workspace-stg.skyfirstlabs.com
        probes:
          liveness:
            path: /
            initialDelaySeconds: 15
          readiness:
            path: /
            initialDelaySeconds: 5
        autoscaling:
          enabled: true
          minReplicas: 2
          maxReplicas: 10
        extraEnv:
          - name: NEXT_PUBLIC_API_URL
            value: "https://workspace-stg.skyfirstlabs.com/api"
  destination:
    server: "https://kubernetes.default.svc"
    namespace: staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
