---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sky-fe-stg
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: sky-poc-frontend=skyacrstagingj3minh.azurecr.io/sky-poc-frontend:^sha-.*
    argocd-image-updater.argoproj.io/sky-poc-frontend.update-strategy: latest
    argocd-image-updater.argoproj.io/write-back-method: git:secret:argocd/git-creds
    argocd-image-updater.argoproj.io/write-back-target: branch:staging://gitops/charts/common-app/values-sky-fe-stg.yaml
spec:
  project: default
  source:
    repoURL: "https://github.com/sky-first/sky-poc-infra.git"
    path: gitops/charts/common-app
    targetRevision: staging
    helm:
      valueFiles:
        - values-sky-fe-stg.yaml
      values: |
        podAnnotations:
          rollout-trigger: "2026-02-02T09:32:31Z"
        securityContext: {} # Usar configurações do values-sky-fe-stg.yaml
        imagePullSecrets:
          - name: regcred
        image:
          repository: skyacrstagingj3minh.azurecr.io/sky-poc-frontend
        service:
          port: 80
          targetPort: 3000
        ingress:
          enabled: true
          className: "nginx"
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt-prod
          hosts:
            - host: workspace-stg.skyfirstlabs.com
              paths:
                - path: /
                  pathType: Prefix
          tls:
            - secretName: sky-fe-stg-tls
              hosts:
                - workspace-stg.skyfirstlabs.com
        probes:
          liveness:
            path: /
            initialDelaySeconds: 15
          readiness:
            path: /
            initialDelaySeconds: 5
        autoscaling:
          enabled: true
          minReplicas: 2
          maxReplicas: 10
        extraEnv:
          - name: NEXT_PUBLIC_API_URL
            value: "https://workspace-stg-api.skyfirstlabs.com"
  destination:
    server: "https://kubernetes.default.svc"
    namespace: staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
# Force refresh: Sat Feb 7 16:05:00 WET 2026
