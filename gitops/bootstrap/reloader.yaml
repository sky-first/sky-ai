apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: reloader
  namespace: argocd
  labels:
    argocd.argoproj.io/instance: root-app
spec:
  project: default
  source:
    chart: reloader
    repoURL: https://stakater.github.io/stakater-charts
    targetRevision: v1.2.0
    helm:
      values: |
        reloader:
          watchGlobally: true
          deployment:
            image:
              tag: "v1.2.0"
          autoReloadAll: false
  destination:
    server: https://kubernetes.default.svc
    namespace: reloader-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
