---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://grafana.github.io/helm-charts"
    chart: loki-stack
    targetRevision: 2.9.11
    helm:
      values: |
        # =============================================================
        # LOKI - Log Aggregation System
        # Configuração de Produção
        # =============================================================
        loki:
          enabled: true
          
          # Prioritizing startup speed: only change volume ownership if root mismatch
          podSecurityContext:
            fsGroup: 2000
            fsGroupChangePolicy: "OnRootMismatch"

          # Evitar conflito de Default Datasource com Prometheus
          isDefault: false

          # Persistência habilitada
          persistence:
            enabled: true
            size: 20Gi
            storageClassName: default

          # Configuração do Loki
          config:
            auth_enabled: false

            # Ingester - recebe logs
            ingester:
              chunk_idle_period: 3m
              chunk_block_size: 262144
              chunk_retain_period: 1m
              max_transfer_retries: 0
              lifecycler:
                ring:
                  kvstore:
                    store: inmemory
                  replication_factor: 1

            # Limites de taxa
            limits_config:
              enforce_metric_name: false
              reject_old_samples: true
              reject_old_samples_max_age: 168h  # 7 dias
              ingestion_rate_mb: 10
              ingestion_burst_size_mb: 20
              max_streams_per_user: 10000
              max_query_series: 500
              max_query_parallelism: 32

            # Schema
            schema_config:
              configs:
                - from: 2020-10-24
                  store: boltdb-shipper
                  object_store: filesystem
                  schema: v11
                  index:
                    prefix: index_
                    period: 24h

            # Storage (filesystem por simplicidade, considere Azure Blob para prod real)
            storage_config:
              boltdb_shipper:
                active_index_directory: /data/loki/boltdb-shipper-active
                cache_location: /data/loki/boltdb-shipper-cache
                shared_store: filesystem
              filesystem:
                directory: /data/loki/chunks

            # Compactador
            compactor:
              working_directory: /data/loki/compactor
              shared_store: filesystem
              compaction_interval: 10m
              retention_enabled: true
              retention_delete_delay: 2h
              retention_delete_worker_count: 150

            # Retenção de logs
            table_manager:
              retention_deletes_enabled: true
              retention_period: 168h  # 7 dias

            # Query frontend
            frontend:
              max_outstanding_per_tenant: 200
              compress_responses: true

          # Recursos
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

        # =============================================================
        # PROMTAIL - Log Collector
        # Pipeline com extração de níveis de log
        # =============================================================
        promtail:
          enabled: true

          # Recursos
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi

          # Configuração do Promtail
          config:
            # Posições (onde parou de ler)
            positions:
              filename: /run/promtail/positions.yaml

            # Cliente Loki
            clients:
              - url: http://loki-stack:3100/loki/api/v1/push
                tenant_id: 1
                batchwait: 1s
                batchsize: 1048576  # 1MB
                timeout: 10s

            # Scrape configs
            scrape_configs:
              # Logs de pods do Kubernetes
              - job_name: kubernetes-pods
                kubernetes_sd_configs:
                  - role: pod

                # Relabeling para extrair metadata
                relabel_configs:
                  # Mantém apenas pods com annotation de logging
                  - source_labels: [__meta_kubernetes_pod_annotation_promtail_io_scrape]
                    action: keep
                    regex: true

                  # OU mantém todos os pods (comentar a regra acima se quiser)
                  - action: labelmap
                    regex: __meta_kubernetes_pod_label_(.+)

                  # Labels obrigatórios
                  - source_labels: [__meta_kubernetes_namespace]
                    target_label: namespace

                  - source_labels: [__meta_kubernetes_pod_name]
                    target_label: pod

                  - source_labels: [__meta_kubernetes_pod_container_name]
                    target_label: container

                  - source_labels: [__meta_kubernetes_pod_label_app]
                    target_label: app

                  - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
                    target_label: app_name

                  - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_instance]
                    target_label: app_instance

                # Pipeline stages para processamento de logs
                pipeline_stages:
                  # =========================================
                  # STAGE 1: Tentar parsear como JSON
                  # =========================================
                  - json:
                      expressions:
                        level: level
                        msg: message
                        error: error
                        timestamp: timestamp
                        logger: logger
                        caller: caller

                  # =========================================
                  # STAGE 2: Se não for JSON, usar regex
                  # =========================================
                  - regex:
                      expression: '^(?P<timestamp>\S+)\s+(?P<level>(DEBUG|INFO|WARN|WARNING|ERROR|FATAL|PANIC))\s+(?P<message>.*)$'

                  # =========================================
                  # STAGE 3: Regex para logs Python/FastAPI
                  # =========================================
                  - regex:
                      expression: '(?i)(?P<level>error|warning|critical|exception|traceback)'
                      source: output

                  # =========================================
                  # STAGE 4: Normalizar níveis de log
                  # =========================================
                  - template:
                      source: level
                      template: '{{ ToLower .Value }}'

                  # =========================================
                  # STAGE 5: Criar label 'level'
                  # =========================================
                  - labels:
                      level:

                  # =========================================
                  # STAGE 6: Drop de logs de debug (opcional)
                  # Descomente para filtrar logs de baixo nível
                  # =========================================
                  # - match:
                  #     selector: '{level="debug"}'
                  #     action: drop
                  #     drop_counter_reason: debug_logs_dropped

                  # =========================================
                  # STAGE 7: Output com log formatado
                  # =========================================
                  - output:
                      source: msg

              # Logs específicos do backend (opcional - mais detalhado)
              - job_name: backend-logs
                kubernetes_sd_configs:
                  - role: pod
                    namespaces:
                      names:
                        - staging

                relabel_configs:
                  - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_instance]
                    regex: sky-backend.*
                    action: keep

                  - source_labels: [__meta_kubernetes_namespace]
                    target_label: namespace

                  - source_labels: [__meta_kubernetes_pod_name]
                    target_label: pod

                  - source_labels: [__meta_kubernetes_pod_container_name]
                    target_label: container

                  - action: replace
                    target_label: app
                    replacement: backend

                pipeline_stages:
                  - json:
                      expressions:
                        level: levelname
                        message: message
                        asctime: asctime
                        name: name

                  - labels:
                      level:

                  # Highlight de erros para alertas
                  - match:
                      selector: '{level=~"error|critical|fatal|panic"}'
                      stages:
                        - labels:
                            severity: critical

        # Grafana desabilitado (já temos via kube-prometheus-stack)
        grafana:
          enabled: false

  destination:
    server: "https://kubernetes.default.svc"
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
