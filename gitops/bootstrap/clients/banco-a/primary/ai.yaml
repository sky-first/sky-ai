apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sky-ai-banco-a
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: sky-poc-ai=BANCO_A_ACR.azurecr.io/sky-poc-ai:^sha-.*
    argocd-image-updater.argoproj.io/sky-poc-ai.update-strategy: latest
    argocd-image-updater.argoproj.io/write-back-method: git:secret:argocd/git-creds
    argocd-image-updater.argoproj.io/write-back-target: branch:staging://gitops/charts/common-app/values-banco-a-ai.yaml
spec:
  project: default
  source:
    repoURL: "https://github.com/sky-first/sky-poc-infra.git"
    path: gitops/charts/common-app
    targetRevision: staging
    helm:
      valueFiles:
        - values-banco-a-ai.yaml
      values: |
        nameOverride: "sky-ai-banco-a"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 3000
          fsGroup: 2000
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
            add:
              - NET_BIND_SERVICE
        imagePullSecrets:
          - name: regcred
        service:
          port: 80
          targetPort: 8001
        ingress:
          enabled: true
          className: "nginx"
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt-prod
            nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
            nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
            nginx.ingress.kubernetes.io/modsecurity-snippet: |
              SecRuleRemoveById 941160 941100 942100 942200 920420
          hosts:
            - host: ai.bancoa.com.br
              paths:
                - path: /
                  pathType: Prefix
          tls:
            - secretName: sky-ai-banco-a-tls
              hosts:
                - ai.bancoa.com.br
        resources:
          requests:
            cpu: 300m
            memory: 256Mi
          limits:
            cpu: 2000m
            memory: 2048Mi
        probes:
          liveness:
            path: /docs
            initialDelaySeconds: 30
          readiness:
            path: /docs
            initialDelaySeconds: 10
        externalSecret:
          enabled: true
          secretStoreRef:
            name: azure-keyvault
            kind: ClusterSecretStore
          target:
            creationPolicy: Owner
            name: sky-ai-banco-a-secrets
            template:
              engineVersion: v2
              data:
                openai_api_key: "{{ .openai_api_key }}"
                qdrant_url: "{{ .qdrant_url }}"
                redis_url: "{{ .redis_url }}"
                celery_broker_url: "{{ .redis_url | replace \"/0\" \"/1\" }}"
                celery_result_backend: "{{ .redis_url | replace \"/0\" \"/2\" }}"
                database_url: "{{ .database_url | replace \"postgresql://\" \"postgresql+asyncpg://\" }}"
          data:
            - secretKey: openai_api_key
              remoteRef:
                key: openai-api-key
            - secretKey: qdrant_url
              remoteRef:
                key: qdrant-url
            - secretKey: database_url
              remoteRef:
                key: database-url
            - secretKey: redis_url
              remoteRef:
                key: redis-url
        envSecrets:
          OPENAI_API_KEY:
            name: sky-ai-banco-a-secrets
            key: openai_api_key
          QDRANT_URL:
            name: sky-ai-banco-a-secrets
            key: qdrant_url
          DATABASE_URL:
            name: sky-ai-banco-a-secrets
            key: database_url
          REDIS_URL:
            name: sky-ai-banco-a-secrets
            key: redis_url
          CELERY_BROKER_URL:
            name: sky-ai-banco-a-secrets
            key: celery_broker_url
          CELERY_RESULT_BACKEND:
            name: sky-ai-banco-a-secrets
            key: celery_result_backend
        extraEnv:
          - name: REDIS_PORT
            value: "6379"
          - name: DEBUG
            value: "false"
          - name: OLLAMA_BASE_URL
            value: "http://ollama.ollama.svc.cluster.local:11434"
  destination:
    server: "https://kubernetes.default.svc"
    namespace: banco-a
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    - group: external-secrets.io
      kind: ExternalSecret
      jsonPointers:
        - /metadata/annotations/force-sync
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
