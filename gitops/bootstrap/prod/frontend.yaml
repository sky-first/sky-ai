apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sky-frontend-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/sky-first/sky-poc-infra.git"
    path: gitops/charts/common-app
    targetRevision: fix-infra-multi-env
    helm:
      values: |
        image:
          repository: skyacrstaging.azurecr.io/sky-poc-frontend
          tag: "latest"
        service:
          port: 80
          targetPort: 3000
        ingress:
          enabled: true
          className: "nginx"
          hosts:
            - host: workspace-prd.skyfirstlabs.com
              paths:
                - path: /
                  pathType: Prefix
        autoscaling:
          enabled: true
          minReplicas: 2
          maxReplicas: 10
        extraEnv:
          - name: NEXT_PUBLIC_API_URL
            value: "https://workspace-prd-api.skyfirstlabs.com"
  destination:
    server: "https://kubernetes.default.svc"
    namespace: prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
