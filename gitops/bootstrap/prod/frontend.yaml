apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sky-fe-prd
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/sky-first/sky-poc-infra.git"
    path: gitops/charts/common-app
    targetRevision: main
    helm:
      values: |
        imagePullSecrets:
          - name: regcred
        image:
          repository: skyacrstagingj3minh.azurecr.io/sky-poc-frontend
          tag: "a2dc11f"
        
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 3000
          fsGroup: 2000
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
            add:
              - NET_BIND_SERVICE
        
        service:
          port: 80
          targetPort: 3000
        ingress:
          enabled: false
          className: "nginx"
          hosts:
            - host: workspace-prd.skyfirstlabs.com
              paths:
                - path: /
                  pathType: Prefix
          tls:
            - secretName: sky-fe-prd-tls
              hosts:
                - workspace-prd.skyfirstlabs.com
        autoscaling:
          enabled: true
          minReplicas: 2
          maxReplicas: 10
          targetCPUUtilizationPercentage: 70
          targetMemoryUtilizationPercentage: 80
        
        resources:
          requests:
            cpu: 200m
            memory: 384Mi
          limits:
            cpu: 1000m
            memory: 768Mi
        
        extraEnv:
          - name: NEXT_PUBLIC_API_URL
            value: "https://workspace-prd-api.skyfirstlabs.com"
          - name: ROLLOUT_TRIGGER
            value: "2026-01-26T11:05:00Z"
  destination:
    server: "https://kubernetes.default.svc"
    namespace: prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
