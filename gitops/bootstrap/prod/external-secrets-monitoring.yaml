---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: monitoring-secrets-prod
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault
    kind: ClusterSecretStore

  target:
    name: monitoring-secrets-prod
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        grafana-admin-password: "{{ .grafana_admin_password }}"
        slack-webhook-url: "{{ .slack_webhook_url }}"

  data:
  # Grafana admin password - stored in Key Vault
  - secretKey: grafana_admin_password
    remoteRef:
      key: grafana-admin-password

  # Slack webhook for AlertManager notifications
  - secretKey: slack_webhook_url
    remoteRef:
      key: slack-webhook-url
---
# Patch the monitoring stack helm values to inject secrets
apiVersion: v1
kind: ConfigMap
metadata:
  name: monitoring-helm-values-prod
  namespace: argocd
data:
  # These values override the inline helm values in the Application
  grafana_admin_password: "${GRAFANA_ADMIN_PASSWORD}"
  slack_webhook_url: "${SLACK_WEBHOOK_URL}"
