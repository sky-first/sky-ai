apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sky-ai-prd
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/sky-first/sky-poc-infra.git"
    path: gitops/charts/common-app
    targetRevision: main
    helm:
      values: |
        image:
          repository: skyacrstaging.azurecr.io/sky-poc-ai
          tag: "latest"
        service:
          port: 80
          targetPort: 8000
        ingress:
          enabled: true
          className: "nginx"
          hosts:
            - host: workspace-prd-ollama.skyfirstlabs.com
              paths:
                - path: /
                  pathType: Prefix
        # Configure External Secret to fetch keys from Azure Key Vault
        externalSecret:
          enabled: true
          secretStoreRef:
            name: azure-keyvault
            kind: ClusterSecretStore
          target:
            creationPolicy: Owner
            template:
              engineVersion: v2
              data:
                openai_api_key: "{{ .openai_api_key }}"
                qdrant_url: "{{ .qdrant_url }}"
          data:
            - secretKey: openai_api_key
              remoteRef:
                key: openai-api-key
            - secretKey: qdrant_url
              remoteRef:
                key: qdrant-url
                
        # Map the synced secrets to Env Vars in the container
        envSecrets:
          openai-api-key:
            name: sky-ai-prd-common-app-secrets
            key: openai_api_key
          qdrant-url:
            name: sky-ai-prd-common-app-secrets
            key: qdrant_url
            
        extraEnv:
          - name: DEBUG
            value: "false"
  destination:
    server: "https://kubernetes.default.svc"
    namespace: prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
