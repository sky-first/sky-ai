apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sky-ai-prd
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/sky-first/sky-poc-infra.git"
    path: gitops/charts/common-app
    targetRevision: main
    helm:
      values: |
        imagePullSecrets:
          - name: regcred
        image:
          repository: skyacrstagingj3minh.azurecr.io/sky-poc-ai
          tag: "latest"
        
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 3000
          fsGroup: 2000
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
            add:
              - NET_BIND_SERVICE
        
        service:
          port: 80
          targetPort: 8000
        ingress:
          enabled: false
          className: "nginx"
          hosts:
            - host: workspace-prd-ollama.skyfirstlabs.com
              paths:
                - path: /
                  pathType: Prefix
          tls:
            - secretName: sky-ai-prd-tls
              hosts:
                - workspace-prd-ollama.skyfirstlabs.com
        # Configure External Secret to fetch keys from Azure Key Vault
        externalSecret:
          enabled: true
          secretStoreRef:
            name: azure-keyvault
            kind: ClusterSecretStore
          target:
            creationPolicy: Owner
            template:
              engineVersion: v2
              data:
                openai_api_key: "{{ .openai_api_key }}"
                qdrant_url: "{{ .qdrant_url }}"
          data:
            - secretKey: openai_api_key
              remoteRef:
                key: openai-api-key
            - secretKey: qdrant_url
              remoteRef:
                key: qdrant-url
                
        # Map the synced secrets to Env Vars in the container
        envSecrets:
          openai-api-key:
            name: sky-ai-prd-common-app-secrets
            key: openai_api_key
          qdrant-url:
            name: sky-ai-prd-common-app-secrets
            key: qdrant_url
        
        autoscaling:
          enabled: true
          minReplicas: 2
          maxReplicas: 5
          targetCPUUtilizationPercentage: 75
          targetMemoryUtilizationPercentage: 80
          behavior:
            scaleDown:
              stabilizationWindowSeconds: 300
              policies:
              - type: Percent
                value: 50
                periodSeconds: 60
            scaleUp:
              stabilizationWindowSeconds: 60
              policies:
              - type: Percent
                value: 100
                periodSeconds: 30
        
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 2Gi
            
        extraEnv:
          - name: DEBUG
            value: "false"
          - name: ROLLOUT_TRIGGER
            value: "2026-01-26T11:05:00Z"
  destination:
    server: "https://kubernetes.default.svc"
    namespace: prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
