apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sky-ai-prd
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/sky-first/sky-poc-infra.git"
    path: gitops/charts/common-app
    targetRevision: main
    helm:
      valueFiles:
        - .argocd-source-sky-ai-prd.yaml
      values: |
        imagePullSecrets:
          - name: regcred
        image:
          repository: skyacrprodel5zpw.azurecr.io/sky-poc-ai
          tag: "latest"
        
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 3000
          fsGroup: 2000
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
            add:
              - NET_BIND_SERVICE
        
        service:
          port: 80
          targetPort: 8001
        
        probes:
          liveness:
            path: /docs
          readiness:
            path: /docs
        
        ingress:
          enabled: true
          className: "nginx"
          hosts:
            - host: workspace-prd-ollama.skyfirstlabs.com
              paths:
                - path: /
                  pathType: Prefix
          tls:
            - secretName: sky-ai-prd-tls
              hosts:
                - workspace-prd-ollama.skyfirstlabs.com
        # Configure External Secret to fetch keys from Azure Key Vault
        externalSecret:
          enabled: true
          secretStoreRef:
            name: azure-keyvault
            kind: ClusterSecretStore
          target:
            creationPolicy: Owner
            template:
              engineVersion: v2
              data:
                openai_api_key: "{{ .openai_api_key }}"
                qdrant_url: "{{ .qdrant_url }}"
                redis_url: "{{ .redis_url | replace \"@redis\" \"@redis-master\" }}"
                celery_broker_url: "{{ .redis_url | replace \"@redis\" \"@redis-master\" | replace \"/0\" \"/1\" }}"
                celery_result_backend: "{{ .redis_url | replace \"@redis\" \"@redis-master\" | replace \"/0\" \"/2\" }}"
                database_url: "{{ .database_url | replace \"postgresql://\" \"postgresql+asyncpg://\" | replace \"@postgres\" \"@postgresql\" | replace \"postgres:\" \"sky:\" }}"
          data:
            - secretKey: openai_api_key
              remoteRef:
                key: openai-api-key
            - secretKey: qdrant_url
              remoteRef:
                key: qdrant-url
            - secretKey: database_url
              remoteRef:
                key: database-url
            - secretKey: redis_url
              remoteRef:
                key: redis-url
                
        # Map the synced secrets to Env Vars in the container
        envSecrets:
          openai-api-key:
            name: sky-ai-prd-common-app-secrets
            key: openai_api_key
          qdrant-url:
            name: sky-ai-prd-common-app-secrets
            key: qdrant_url
          DATABASE_URL:
            name: sky-ai-prd-common-app-secrets
            key: database_url
          REDIS_URL:
            name: sky-ai-prd-common-app-secrets
            key: redis_url
          CELERY_BROKER_URL:
            name: sky-ai-prd-common-app-secrets
            key: celery_broker_url
          CELERY_RESULT_BACKEND:
            name: sky-ai-prd-common-app-secrets
            key: celery_result_backend
        
        migration:
          enabled: true
          command: ["python3", "-c"]
          args: 
            - |
              import os, asyncio, asyncpg, glob
              from sqlalchemy import text
              from db.session import engine
              from db.models import Base

              async def run():
                  url = os.getenv('DATABASE_URL')
                  if not url:
                      print('DATABASE_URL not set')
                      return
                  
                  # 1. Enable pgvector extension
                  pure_url = url.replace('postgresql+asyncpg://', 'postgresql://')
                  pure_url = pure_url.replace('postgresql+psycopg2://', 'postgresql://')
                  if 'psycopg2' in pure_url: pure_url = pure_url.replace('psycopg2', '')
                  
                  try:
                      print('Enabling pgvector extension...')
                      conn_pg = await asyncpg.connect(pure_url)
                      await conn_pg.execute('CREATE EXTENSION IF NOT EXISTS vector;')
                      await conn_pg.close()
                      print('✅ extension vector enabled')
                  except Exception as e:
                      print(f'Warning enabling vector extension: {e}')

                  # 2. Sync SQLAlchemy Models (chat_history, embeddings, etc)
                  try:
                      print('Syncing SQLAlchemy models...')
                      async with engine.begin() as conn:
                          await conn.run_sync(Base.metadata.create_all)
                      print('✅ models synced')
                  except Exception as e:
                      print(f'Warning syncing models: {e}')

                  # 3. Apply raw SQL migrations
                  try:
                      conn_pg = await asyncpg.connect(pure_url)
                      for f in sorted(glob.glob('/app/db/migrations/*.sql')):
                          with open(f) as sq:
                              print(f'Applying {f}...')
                              try:
                                  await conn_pg.execute(sq.read())
                              except Exception as e:
                                  print(f'Notice: {e}')
                      await conn_pg.close()
                  except Exception as e:
                      print(f'Warning applying SQL migrations: {e}')
                  
              asyncio.run(run())

        autoscaling:
          enabled: true
          minReplicas: 2
          maxReplicas: 5
          targetCPUUtilizationPercentage: 75
          targetMemoryUtilizationPercentage: 80
          behavior:
            scaleDown:
              stabilizationWindowSeconds: 300
              policies:
              - type: Percent
                value: 50
                periodSeconds: 60
            scaleUp:
              stabilizationWindowSeconds: 60
              policies:
              - type: Percent
                value: 100
                periodSeconds: 30
        
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 2Gi
            
        extraEnv:
          - name: REDIS_PORT
            value: "6379"
          - name: DEBUG
            value: "false"
          - name: AI_PROVIDER
            value: "openai"
          - name: ROLLOUT_TRIGGER
            value: "2026-02-02T10:50:00Z"
          - name: OLLAMA_BASE_URL
            value: "http://ollama-service.prod.svc.cluster.local:11434"
  destination:
    server: "https://kubernetes.default.svc"
    namespace: prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
