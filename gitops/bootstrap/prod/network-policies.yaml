---
# Network Policy para produção - Defense in Depth
# Padrão: Deny-all por padrão, whitelist apenas necessário

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-prod-network-policy
  namespace: prod
spec:
  podSelector:
    matchLabels:
      app: sky-backend
  policyTypes:
    - Ingress
    - Egress

  # INGRESS: Apenas nginx-ingress pode enviar para backend
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000

  # EGRESS: Backend pode sair apenas para:
  # 1. PostgreSQL (10.2.x.x:5432)
  # 2. Redis (10.2.x.x:6379)
  # 3. DNS (53)
  # 4. Loki (monitoring:3100)
  # 5. OpenAI API (external, apenas 443)
  egress:
    # DNS
    - to:
        - namespaceSelector: { }
      ports:
        - protocol: UDP
          port: 53

    # PostgreSQL (internal)
    - to:
        - podSelector:
            matchLabels:
              app: postgresql
      ports:
        - protocol: TCP
          port: 5432

    # Redis (internal)
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379

    # Loki (monitoring)
    - to:
        - namespaceSelector:
            matchLabels:
              name: monitoring
          podSelector:
            matchLabels:
              app: loki
      ports:
        - protocol: TCP
          port: 3100

    # External HTTPS (OpenAI, etc)
    - to:
        - namespaceSelector: { }
      ports:
        - protocol: TCP
          port: 443

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-prod-network-policy
  namespace: prod
spec:
  podSelector:
    matchLabels:
      app: sky-frontend
  policyTypes:
    - Ingress
    - Egress

  # INGRESS: Apenas nginx-ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000

  # EGRESS: Frontend pode sair para:
  # 1. Backend API (10.3.x.x:80 ou 10.2.x.x:8000)
  # 2. DNS (53)
  egress:
    # DNS
    - to:
        - namespaceSelector: { }
      ports:
        - protocol: UDP
          port: 53

    # Backend API
    - to:
        - podSelector:
            matchLabels:
              app: sky-backend
      ports:
        - protocol: TCP
          port: 8000

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ai-prod-network-policy
  namespace: prod
spec:
  podSelector:
    matchLabels:
      app: sky-ai
  policyTypes:
    - Ingress
    - Egress

  # INGRESS: Apenas nginx-ingress + backend (para async tasks)
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8001

    - from:
        - podSelector:
            matchLabels:
              app: sky-backend
      ports:
        - protocol: TCP
          port: 8001

  # EGRESS: AI pode sair para:
  # 1. OpenAI API (external, 443)
  # 2. Redis (celery broker, 10.2.x.x:6379)
  # 3. DNS (53)
  # 4. Loki (monitoring)
  egress:
    # DNS
    - to:
        - namespaceSelector: { }
      ports:
        - protocol: UDP
          port: 53

    # Redis (celery)
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379

    # Loki
    - to:
        - namespaceSelector:
            matchLabels:
              name: monitoring
          podSelector:
            matchLabels:
              app: loki
      ports:
        - protocol: TCP
          port: 3100

    # External HTTPS (OpenAI)
    - to:
        - namespaceSelector: { }
      ports:
        - protocol: TCP
          port: 443

---
# Metadata label para monitoring namespace
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    monitoring: "enabled"  # Usado por Prometheus serviceMonitorNamespaceSelector

---
# Metadata label para prod namespace
apiVersion: v1
kind: Namespace
metadata:
  name: prod
  labels:
    app: "sky-workspace"
