apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sky-frontend-prod
  namespace: prod
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - workspace-prd.skyfirstlabs.com
    secretName: workspace-prd-tls
  rules:
  - host: workspace-prd.skyfirstlabs.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sky-frontend-prod-common-app
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: sky-backend-prod-common-app
            port:
              number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sky-backend-prod
  namespace: prod
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://workspace-prd.skyfirstlabs.com, https://workspace-prd-ai.skyfirstlabs.com"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - workspace-prd-api.skyfirstlabs.com
    secretName: backend-prd-tls
  rules:
  - host: workspace-prd-api.skyfirstlabs.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sky-backend-prod-common-app
            port:
              number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sky-ai-prod
  namespace: prod
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - workspace-prd-ai.skyfirstlabs.com
    secretName: ai-prd-tls
  rules:
  - host: workspace-prd-ai.skyfirstlabs.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sky-ai-prod-common-app
            port:
              number: 80
---
# HTTP redirect (via Nginx - redireciona toda requisição HTTP para HTTPS)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sky-http-redirect
  namespace: prod
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
  - host: workspace-prd.skyfirstlabs.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sky-frontend-prod-common-app
            port:
              number: 80
  - host: workspace-prd-api.skyfirstlabs.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sky-backend-prod-common-app
            port:
              number: 80
  - host: workspace-prd-ai.skyfirstlabs.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sky-ai-prod-common-app
            port:
              number: 80
