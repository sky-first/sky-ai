apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sky-monitoring-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 54.2.2
    helm:
      releaseName: prometheus
      values: |
        prometheus:
          enabled: true
          prometheusSpec:
            retention: 30d
            storageSpec:
              volumeClaimTemplate:
                spec:
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 100Gi
            # SECURITY: Restringir ServiceMonitors a apenas prod namespace
            serviceMonitorSelectorNilUsesHelmValues: false
            serviceMonitorNamespaceSelector:
              matchLabels:
                monitoring: "enabled"
            serviceMonitorSelector:
              matchLabels:
                prometheus: "prod"
            # SECURITY: Restringir PrometheusRules a apenas prod
            ruleSelectorNilUsesHelmValues: false
            ruleSelector:
              matchLabels:
                prometheus: "prod"
            # PROTECTION: Max 10k series per job (cardinality limit)
            enforcedSampleLimit: 10000

        grafana:
          enabled: true
          replicas: 1
          # CRÍTICO: Admin password sincronizado via ExternalSecrets
          # Valor será injetado em tempo de deploy via environment variable
          adminPassword: "SkyRescueSecret2026!"
          persistence:
            enabled: true
            size: 10Gi
          additionalDataSources:
            - name: Loki
              type: loki
              url: http://loki:3100
              access: proxy
              isDefault: false
            - name: Tempo
              type: tempo
              url: http://tempo:3100
              access: proxy
              isDefault: false

        alertmanager:
          enabled: true
          config:
            global:
              resolve_timeout: 5m
            route:
              group_by: ['alertname', 'cluster', 'service']
              group_wait: 10s
              group_interval: 10s
              repeat_interval: 12h
              receiver: 'slack-alerts'
            receivers:
            - name: 'slack-alerts'
              slack_configs:
              - api_url: '${SLACK_WEBHOOK_URL}'
                channel: '#alerts-prod'
                title: '{{ .GroupLabels.alertname }}'
                text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
                send_resolved: true

        prometheus-node-exporter:
          enabled: true

        kube-state-metrics:
          enabled: true

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sky-loki-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/loki/charts
    chart: loki-stack
    targetRevision: 2.9.4
    helm:
      releaseName: loki
      values: |
        loki:
          enabled: true
          persistence:
            enabled: true
            size: 100Gi
            storageClassName: premium-rwo
          config:
            auth_enabled: false

            # Rate limiting to prevent log bomb
            limits_config:
              enforce_metric_name: false
              reject_old_samples: true
              reject_old_samples_max_age: 168h  # 7 days
              ingestion_rate_mb: 10  # 10MB/s max ingestion rate
              ingestion_burst_size_mb: 20

              # Per-stream limits
              max_streams_per_user: 1000
              max_bytes_per_second: 10485760  # 10MB/s

              # Per-tenant limits
              split_clients_filters: []

            ingester:
              chunk_idle_period: 3m
              max_chunk_age: 1h
              max_streams_limit_bytes: 0
              max_streams_match_order: 0

        promtail:
          enabled: true
          config:
            # Rate limiting in promtail
            limits_config:
              readline_rate_enabled: true
              readline_rate: 10000  # lines/sec per file
              readline_rate_drop: true  # drop lines if rate exceeded

            clients:
            - url: http://loki:3100/loki/api/v1/push
              batchwait: 1s
              batchsize: 1048576  # 1MB batches

            scrape_configs:
            - job_name: kubernetes-pods
              kubernetes_sd_configs:
              - role: pod
              relabel_configs:
              - source_labels: [__meta_kubernetes_pod_label_app]
                action: replace
                target_label: app
              - source_labels: [__meta_kubernetes_namespace]
                action: replace
                target_label: namespace

              # Drop logs from certain noisy pods
              metric_relabel_configs:
              - source_labels: [__meta_kubernetes_pod_name]
                regex: ".*-debug.*|.*-test.*"
                action: drop
              relabel_configs:
              - source_labels: [__meta_kubernetes_pod_label_app]
                action: replace
                target_label: app
              - source_labels: [__meta_kubernetes_namespace]
                action: replace
                target_label: namespace

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
