apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sky-be-prd
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/sky-first/sky-poc-infra.git"
    path: gitops/charts/common-app
    targetRevision: main
    helm:
      values: |
        imagePullSecrets:
          - name: regcred
        image:
          repository: skyacrstagingj3minh.azurecr.io/sky-poc-backend
          tag: "latest"
        
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 3000
          fsGroup: 2000
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
            add:
              - NET_BIND_SERVICE
        
        service:
          port: 80
          targetPort: 8000
        ingress:
          enabled: false
          className: "nginx"
          hosts:
            - host: workspace-prd-api.skyfirstlabs.com
              paths:
                - path: /
                  pathType: Prefix
            - host: workspace-prd.skyfirstlabs.com
              paths:
                - path: /api
                  pathType: Prefix
          tls:
            - secretName: backend-tls-prod
              hosts:
                - workspace-prd-api.skyfirstlabs.com
                - workspace-prd.skyfirstlabs.com
        # Configure External Secret to fetch keys from Azure Key Vault
        externalSecret:
          enabled: true
          secretStoreRef:
            name: azure-keyvault
            kind: ClusterSecretStore
          target:
            creationPolicy: Owner
            template:
              engineVersion: v2
              data:
                # Transform proper keys for the application check
                jwt_secret_key: "{{ .jwt_secret_key }}"
                encryption_key: "{{ .encryption_key }}"
                openai_api_key: "{{ .openai_api_key }}"
                redis_url: "{{ .redis_url }}"
                # Derivando URLs do Celery a partir da redis_url do segredo
                celery_broker_url: "{{ .redis_url | replace \"/0\" \"/1\" }}"
                celery_result_backend: "{{ .redis_url | replace \"/0\" \"/2\" }}"
                # Crucial Fix: Ensure asyncpg driver is used and keys match Migration Job expectations
                database_url: "{{ .database_url | replace \"postgresql://\" \"postgresql+asyncpg://\" }}"
          data:
            - secretKey: jwt_secret_key
              remoteRef:
                key: jwt-secret-key
            - secretKey: encryption_key
              remoteRef:
                key: encryption-key
            - secretKey: openai_api_key
              remoteRef:
                key: openai-api-key
            - secretKey: database_url
              remoteRef:
                key: database-url
            - secretKey: redis_url
              remoteRef:
                key: redis-url

        # Map the synced secrets to Env Vars in the container
        envSecrets:
          # These keys will be present in the secret created by ExternalSecret
          jwt-secret-key:
            name: sky-be-prd-common-app-secrets
            key: jwt_secret_key
          encryption-key:
            name: sky-be-prd-common-app-secrets
            key: encryption_key
          openai-api-key:
            name: sky-be-prd-common-app-secrets
            key: openai_api_key
          DATABASE_URL:
            name: sky-be-prd-common-app-secrets
            key: database_url
          REDIS_URL:
            name: sky-be-prd-common-app-secrets
            key: redis_url
          CELERY_BROKER_URL:
            name: sky-be-prd-common-app-secrets
            key: celery_broker_url
          CELERY_RESULT_BACKEND:
            name: sky-be-prd-common-app-secrets
            key: celery_result_backend
            
        autoscaling:
          enabled: true
          minReplicas: 2
          maxReplicas: 10
          targetCPUUtilizationPercentage: 75
          targetMemoryUtilizationPercentage: 80
          behavior:
            scaleDown:
              stabilizationWindowSeconds: 300
              policies:
              - type: Percent
                value: 50
                periodSeconds: 60
            scaleUp:
              stabilizationWindowSeconds: 60
              policies:
              - type: Percent
                value: 100
                periodSeconds: 30
        
        resources:
          requests:
            cpu: 500m
            memory: 768Mi
          limits:
            cpu: 2000m
            memory: 2Gi
        
        extraEnv:
          - name: CORS_ORIGINS
            value: "https://workspace-prd.skyfirstlabs.com,https://workspace-prd-ai.skyfirstlabs.com"
          - name: DEBUG
            value: "false"
          - name: ROLLOUT_TRIGGER
            value: "2026-01-26T11:05:00Z"
        migration:
          enabled: true
          command: ["alembic"]
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          args: ["upgrade", "head"]
  destination:
    server: "https://kubernetes.default.svc"
    namespace: prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
