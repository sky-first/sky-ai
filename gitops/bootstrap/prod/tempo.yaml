apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sky-tempo-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: tempo
    targetRevision: 1.5.1
    helm:
      releaseName: tempo
      values: |
        tempo:
          # Minimal configuration for single-node setup
          auth_enabled: false
          
        ingester:
          trace_idle_period: 10s
          max_block_duration: 10m
        
        metrics_generator:
          enabled: true
        
        storage:
          trace:
            backend: local
            local:
              path: /var/tempo/traces
            wal:
              path: /var/tempo/wal
        
        # PVC for persistence
        persistence:
          enabled: true
          size: 50Gi
        
        # Resource limits
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        
        # Security context
        securityContext:
          runAsNonRoot: true
          runAsUser: 472
          fsGroup: 472  
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

---
# ServiceMonitor for Tempo metrics
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: tempo-metrics-prod
  namespace: monitoring
  labels:
    prometheus: prod
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: tempo
  endpoints:
  - port: metrics
    interval: 30s

---
# Add Tempo as Grafana datasource
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-tempo-datasource
  namespace: monitoring
data:
  tempo-datasource.yaml: |
    apiVersion: 1
    datasources:
    - name: Tempo
      type: tempo
      access: proxy
      orgId: 1
      url: http://tempo:3100
      isDefault: false
      editable: true
