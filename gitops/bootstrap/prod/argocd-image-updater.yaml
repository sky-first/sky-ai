apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-image-updater
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argocd-image-updater
    targetRevision: 0.9.1
    helm:
      values: |
        config:
          registries:
            - name: AzureContainerRegistry
              api_url: "https://skyacrprodel5zpw.azurecr.io"
              prefix: "skyacrprodel5zpw.azurecr.io"
              ping: yes
              credentials: secret:argocd/acr-secret#password
              default: true
            - name: AzureContainerRegistryStaging
              api_url: "https://skyacrstagingj3minh.azurecr.io"
              prefix: "skyacrstagingj3minh.azurecr.io"
              ping: yes
              credentials: secret:argocd/acr-secret-staging
              
          git:
            commitMessage: "chore(gitops): update image tag [skip ci]"
            user: "ArgoCD Image Updater"
            email: "argocd-image-updater@skyfirstlabs.com"

        authScripts:
          enabled: false

        extraEnv:
          - name: ARGOCD_GRPC_WEB
            value: "true"

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
