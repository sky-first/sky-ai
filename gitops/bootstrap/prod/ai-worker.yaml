apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sky-ai-worker-prd
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/sky-first/sky-poc-infra.git"
    path: gitops/charts/common-app
    targetRevision: main
    helm:
      values: |
        imagePullSecrets:
          - name: regcred
        nameOverride: "sky-ai-worker-prd"
        image:
          repository: skyacrprodel5zpw.azurecr.io/sky-poc-backend
          tag: "latest"
        
        service:
          enabled: false
        ingress:
          enabled: false
        probes:
          liveness:
            enabled: false
          readiness:
            enabled: false

        # Recursos maiores para o worker em prod
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 2Gi

        command: ["celery"]
        args: ["-A", "src.workers.celery_app", "worker", "--loglevel=info", "--pool=solo"]
        
        externalSecret:
          enabled: true
          secretStoreRef:
            name: azure-keyvault
            kind: ClusterSecretStore
          target:
            name: sky-ai-worker-prd-secrets
            template:
              engineVersion: v2
              data:
                openai_api_key: "{{ .openai_api_key }}"
                qdrant_url: "{{ .qdrant_url }}"
                redis_url: "{{ .redis_url }}"
                celery_broker_url: "{{ .redis_url | replace \"/0\" \"/1\" }}"
                celery_result_backend: "{{ .redis_url | replace \"/0\" \"/2\" }}"
                database_url: "{{ .database_url | replace \"postgresql://\" \"postgresql+asyncpg://\" | replace \"@postgres\" \"@postgresql\" | replace \"postgres:\" \"sky:\" }}"
          data:
            - secretKey: openai_api_key
              remoteRef:
                key: openai-api-key
            - secretKey: qdrant_url
              remoteRef:
                key: qdrant-url
            - secretKey: database_url
              remoteRef:
                key: database-url
            - secretKey: redis_url
              remoteRef:
                key: redis-url
                
        envSecrets:
          openai-api-key:
            name: sky-ai-worker-prd-secrets
            key: openai_api_key
          DATABASE_URL:
            name: sky-ai-worker-prd-secrets
            key: database_url
          REDIS_URL:
            name: sky-ai-worker-prd-secrets
            key: redis_url
          CELERY_BROKER_URL:
            name: sky-ai-worker-prd-secrets
            key: celery_broker_url
          CELERY_RESULT_BACKEND:
            name: sky-ai-worker-prd-secrets
            key: celery_result_backend
            
        extraEnv:
          - name: AI_SERVICE_URL
            value: "http://sky-ai-prd-common-app"
          - name: DATABASE_POOL_SIZE
            value: "10"
          - name: REDIS_PORT
            value: "6379"
          - name: DEBUG
            value: "false"
          - name: ROLLOUT_TRIGGER
            value: "2026-02-02T09:52:00Z"

  destination:
    server: "https://kubernetes.default.svc"
    namespace: prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
