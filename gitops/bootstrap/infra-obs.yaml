apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://prometheus-community.github.io/helm-charts"
    chart: kube-prometheus-stack
    targetRevision: 55.4.0
    helm:
      # Skip CRDs - installed manually via kubectl apply --server-side
      skipCrds: true
      values: |
        # Prometheus Operator CRDs Management
        # CRDs installed manually to avoid Helm annotation size limits
        crds:
          enabled: false
        
        # Grafana Configuration
        grafana:
          enabled: true
          adminPassword: "admin" # TODO: Change in production!
          persistence:
            enabled: true
            size: 10Gi
            storageClassName: default
          ingress:
            enabled: true
            ingressClassName: nginx
            annotations:
              nginx.ingress.kubernetes.io/whitelist-source-range: "81.84.211.111/32, 20.97.244.91/32, 169.155.237.0/24"
            hosts:
              - grafana.135.18.146.170.nip.io
            path: /
            pathType: Prefix
          # Dashboards automáticos
          sidecar:
            dashboards:
              enabled: true
              defaultFolderName: "General"
            datasources:
              enabled: true
          additionalDataSources:
            - name: Loki
              type: loki
              url: http://loki-stack.monitoring.svc.cluster.local:3100
              access: proxy
              isDefault: false
              jsonData:
                derivedFields:
                  - datasourceUid: prometheus
                    matcherRegex: "traceID=(\\w+)"
                    name: TraceID
                    url: "$${__value.raw}"
        
        # Prometheus Configuration
        prometheus:
          enabled: true
          prometheusSpec:
            retention: 15d
            retentionSize: "10GB"
            resources:
              requests:
                cpu: 200m
                memory: 500Mi
              limits:
                cpu: 1000m
                memory: 2Gi
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: default
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 20Gi
            # Service Monitors - monitorar apps do staging
            serviceMonitorSelectorNilUsesHelmValues: false
            serviceMonitorSelector: {}
            podMonitorSelectorNilUsesHelmValues: false
            podMonitorSelector: {}
          
          # Ingress para Prometheus UI
          ingress:
            enabled: true
            ingressClassName: nginx
            annotations:
              nginx.ingress.kubernetes.io/whitelist-source-range: "81.84.211.111/32, 20.97.244.91/32, 169.155.237.0/24"
            hosts:
              - prometheus.135.18.146.170.nip.io
            paths:
              - /
            pathType: Prefix
        
        # Alertmanager Configuration
        alertmanager:
          enabled: true
          alertmanagerSpec:
            retention: 120h
            resources:
              requests:
                cpu: 10m
                memory: 50Mi
              limits:
                cpu: 100m
                memory: 100Mi
            storage:
              volumeClaimTemplate:
                spec:
                  storageClassName: default
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 5Gi
          
          # Ingress para Alertmanager UI
          ingress:
            enabled: true
            ingressClassName: nginx
            annotations:
              nginx.ingress.kubernetes.io/whitelist-source-range: "81.84.211.111/32, 20.97.244.91/32, 169.155.237.0/24"
            hosts:
              - alertmanager.135.18.146.170.nip.io
            paths:
              - /
            pathType: Prefix
        
        # Node Exporter (métricas de nodes)
        nodeExporter:
          enabled: true
        
        # Kube State Metrics (métricas do cluster)
        kubeStateMetrics:
          enabled: true
        
        # Default Rules (alertas pré-configurados)
        defaultRules:
          create: true
          rules:
            alertmanager: true
            etcd: false  # Não aplicável em AKS managed
            configReloaders: true
            general: true
            k8s: true
            kubeApiserverAvailability: true
            kubeApiserverSlos: true
            kubelet: true
            kubeProxy: false  # Não aplicável em AKS
            kubePrometheusGeneral: true
            kubePrometheusNodeRecording: true
            kubernetesApps: true
            kubernetesResources: true
            kubernetesStorage: true
            kubernetesSystem: true
            kubeScheduler: false  # Não aplicável em AKS managed
            kubeStateMetrics: true
            network: true
            node: true
            nodeExporterAlerting: true
            nodeExporterRecording: true
            prometheus: true
            prometheusOperator: true
  
  destination:
    server: "https://kubernetes.default.svc"
    namespace: monitoring
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true  # Usar server-side apply
