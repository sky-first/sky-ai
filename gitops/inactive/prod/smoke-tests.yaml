apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sky-smoke-tests-prd
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/sky-first/sky-poc-infra.git"
    path: gitops/manifests/smoke-tests
    targetRevision: main # Produção aponta para o main/master
  destination:
    server: "https://kubernetes.default.svc"
    namespace: prod
  syncPolicy:
    # Mantido sem automated sync por estar em /inactive/ (controle manual inicial)
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 2
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
