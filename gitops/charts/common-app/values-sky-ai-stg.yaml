---
image:
  tag: "sha-f05df3e245a5a59aecdeb507222a69ed549d3ef3"
# QoS: Guaranteed (Noisy Neighbor Isolation Cage)
resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 200m
    memory: 512Mi
# P0.1: Security Context - Non-Root Execution
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
      # readOnlyRootFilesystem: true  # P1.5: Ativar após validação
# P0.1: Temporary directory for AI frameworks (TensorFlow, PyTorch, etc)
extraVolumes:
  - name: tmp-volume
    emptyDir:
      sizeLimit: 5Gi # Limite para evitar disk pressure
extraVolumeMounts:
  - name: tmp-volume
    mountPath: /tmp
# AI services start slower due to model loading
probes:
  liveness:
    path: /health
    initialDelaySeconds: 60
    periodSeconds: 15
    timeoutSeconds: 30
    failureThreshold: 5
  readiness:
    path: /health
    initialDelaySeconds: 30
    periodSeconds: 15
    timeoutSeconds: 30
    failureThreshold: 5
