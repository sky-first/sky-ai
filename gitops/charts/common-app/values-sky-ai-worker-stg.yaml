---
image:
  tag: "sha-7dfbf4c"

# P0.1: Security Context - Non-Root Execution
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  # readOnlyRootFilesystem: true  # P1.5: Ativar após validação

# P0.1: Temporary directory for worker processing
extraVolumes:
  - name: tmp-volume
    emptyDir:
      sizeLimit: 2Gi  # Workers processam arquivos temporários

extraVolumeMounts:
  - name: tmp-volume
    mountPath: /tmp
