---
image:
  tag: "sha-8d9317ed349e54b58fbfa6f41cfb82f0eed0c743"

# P0.1: Security Context - Non-Root Execution
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  # readOnlyRootFilesystem: true  # P1.5: Ativar após validação

# P0.1: Nginx cache directory (non-root nginx needs writable cache)
extraVolumes:
  - name: nginx-cache
    emptyDir:
      sizeLimit: 1Gi

extraVolumeMounts:
  - name: nginx-cache
    mountPath: /var/cache/nginx
