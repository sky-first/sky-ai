image:
  repository: "skyacrstagingj3minh.azurecr.io/sky-poc-frontend"
  tag: "sha-65fb2f25663c17a43287b6eef4861d15d522c193"
  pullPolicy: Always

imagePullSecrets:
  - name: regcred

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/modsecurity-snippet: "SecRuleRemoveById 942100"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
  hosts:
    - host: workspace-stg.skyfirstlabs.com
      paths:
        - path: /()(.*)
          pathType: ImplementationSpecific
        - path: /api(/|$)(.*)
          pathType: ImplementationSpecific
          serviceName: sky-be-stg-common-app
          servicePort: 80
  tls:
    - secretName: sky-fe-stg-tls
      hosts:
        - workspace-stg.skyfirstlabs.com

service:
  port: 80
  targetPort: 3000

replicaCount: 1

extraEnv:
  - name: NEXT_PUBLIC_API_URL
    value: "/api"
  - name: NEXTAUTH_URL
    value: "https://workspace-stg.skyfirstlabs.com"
