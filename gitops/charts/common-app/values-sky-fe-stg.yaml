image:
  repository: "skyacrstagingj3minh.azurecr.io/sky-poc-frontend"
  tag: "sha-65fb2f25663c17a43287b6eef4861d15d522c193"

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/modsecurity-snippet: "SecRuleRemoveById 942100"
  hosts:
    - host: workspace-stg.skyfirstlabs.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: sky-fe-stg-tls
      hosts:
        - workspace-stg.skyfirstlabs.com

service:
  port: 80
  targetPort: 3000

replicaCount: 1
resources:
  requests:
    cpu: 20m
    memory: 128Mi
  limits:
    memory: 128Mi

extraEnv:
  - name: NEXT_PUBLIC_API_URL
    value: "https://api-stg.skyfirstlabs.com"
