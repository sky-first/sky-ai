---
image:
  tag: "sha-d5710b2102ba56baceb93f2e542b356d4e92abe2"
replicaCount: 2
# QoS: Burstable (Low Latency / CPU Bursting)
resources:
  requests:
    cpu: 20m
    memory: 128Mi
  limits:
    memory: 128Mi
pdb:
  enabled: true
  minAvailable: 1
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/instance
                operator: In
                values:
                  - sky-fe-stg
          topologyKey: kubernetes.io/hostname
# P0.1: Security Context - Non-Root Execution
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
      # readOnlyRootFilesystem: true  # P1.5: Ativar após validação
# P0.1: Nginx cache directory (non-root nginx needs writable cache)
extraVolumes:
  - name: nginx-cache
    emptyDir:
      sizeLimit: 1Gi
extraVolumeMounts:
  - name: nginx-cache
    mountPath: /var/cache/nginx
