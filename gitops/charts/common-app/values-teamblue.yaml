global:
  client_slug: "teamblue"
  domain: "plataform.teamblue-stg.skyfirstlabs.com"

frontend:
  branding:
    logo_url: "https://skylokistagingqsfa9s.blob.core.windows.net/branding/teamblue/logo.png"

monitoring:
  grafana_host: "grafana.plataform.teamblue-stg.skyfirstlabs.com"
  retention_days: 7

image:
  repository: nginx
  tag: latest

service:
  targetPort: 80

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: "plataform.teamblue-stg.skyfirstlabs.com"
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: teamblue-plat-tls
      hosts:
        - "plataform.teamblue-stg.skyfirstlabs.com"

externalSecret:
  enabled: true
  refreshInterval: 1h
  secretStoreRef:
    name: teamblue-keyvault-cluster
    kind: ClusterSecretStore
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: DATABASE-URL
    - secretKey: JWT_SECRET
      remoteRef:
        key: JWT-SECRET
