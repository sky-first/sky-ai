---
image:
  repository: skyacrstagingj3minh.azurecr.io/sky-poc-backend
  tag: "sha-9ebc449"

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1024Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

probes:
  liveness:
    path: /health
    initialDelaySeconds: 60
    periodSeconds: 10
    failureThreshold: 5
  readiness:
    path: /health
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 3

extraVolumes:
  - name: tmp-volume
    emptyDir:
      sizeLimit: 1Gi
extraVolumeMounts:
  - name: tmp-volume
    mountPath: /tmp

# AI workers connect to the tenant's AI orquestrator if needed,
# but usually they are triggered via Redis/Celery
extraEnvFrom:
  - secretRef:
      name: sky-be-stg-secrets
  - secretRef:
      name: teamblue-infra-secrets

extraEnv:
  - name: AI_PROVIDER
    value: "openai"
  - name: OLLAMA_BASE_URL
    value: "http://localhost:11434" # Dummy for Pydantic validation
  - name: REDIS_HOST
    value: "redis"
  - name: REDIS_PORT
    value: "6379"
  - name: DEBUG
    value: "false"
