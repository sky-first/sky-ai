---
{{- if .Values.migration.enabled -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "common-app.fullname" . }}-migrate
  labels:
    {{- include "common-app.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  template:
    metadata:
      name: {{ include "common-app.fullname" . }}-migrate
      labels:
        {{- include "common-app.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: {{ .Values.migration.command | toJson }}
          args: {{ .Values.migration.args | toJson }}
          env:
            {{- range $key, $val := .Values.envSecrets }}
            - name: {{ $key | replace "-" "_" | upper }}
              valueFrom:
                secretKeyRef:
                  {{- if kindIs "map" $val }}
                  name: {{ $val.name }}
                  key: {{ $val.key }}
                  {{- else }}
                  name: {{ include "common-app.fullname" $ }}-secrets
                  key: {{ $key }}
                  {{- end }}
                  optional: true
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
{{- end }}
