---
{{- if .Values.externalSecret.enabled -}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "common-app.fullname" . }}-es
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    {{- include "common-app.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind | default "ClusterSecretStore" }}
  target:
    name: {{ include "common-app.fullname" . }}-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        {{- if and .Values.externalSecret.target (and .Values.externalSecret.target.template .Values.externalSecret.target.template.data) }}
        {{- range $key, $val := .Values.externalSecret.target.template.data }}
        {{ $key }}: {{ $val | quote }}
        {{- end }}
        {{- else }}
        {{- range $key, $val := .Values.envSecrets }}
        {{- if kindIs "string" $val }}
        {{ $key }}: {{ $val | quote }}
        {{- end }}
        {{- end }}
        {{- range $item := .Values.externalSecret.data }}
        {{- $targetKey := $item.secretKey | replace "-" "_" }}
        {{- if or (eq $item.secretKey "database-url") (eq $item.secretKey "database_url") }}
        {{ $targetKey }}: {{ print "{{ ." $targetKey " | replace \"postgresql://\" \"postgresql+asyncpg://\" }}" | quote }}
        {{- else }}
        {{ $targetKey }}: {{ print "{{ ." $targetKey " }}" | quote }}
        {{- end }}
        {{- end }}
        {{- end }}
  data:
    {{- range $item := .Values.externalSecret.data }}
    - secretKey: {{ $item.secretKey | replace "-" "_" }}
      remoteRef:
        key: {{ $item.remoteRef.key }}
        property: {{ $item.remoteRef.property | default "" }}
    {{- end }}
{{- end }}
