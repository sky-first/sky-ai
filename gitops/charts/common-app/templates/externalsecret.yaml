{{- if .Values.externalSecret.enabled -}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "common-app.fullname" . }}-es
  labels:
    {{- include "common-app.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind | default "ClusterSecretStore" }}
  target:
    name: {{ include "common-app.fullname" . }}-secrets # Targets the same secret deployment mounts
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Merge locally managed secrets (from values.yaml stringData) with fetched secrets
        {{- range $key, $val := .Values.envSecrets }}
        {{- if kindIs "string" $val }}
        {{ $key }}: "{{ $val }}"
        {{- end }}
        {{- end }}
        {{- range $item := .Values.externalSecret.data }}
        {{- if or (eq $item.secretKey "database-url") (eq $item.secretKey "database_url") }}
        {{ $item.secretKey }}: "{{ printf "{{ .%s | replace \"postgresql://\" \"postgresql+asyncpg://\" }}" ( $item.secretKey | replace "-" "_" ) }}"
        {{- else }}
        {{ $item.secretKey }}: "{{ printf "{{ .%s }}" ( $item.secretKey | replace "-" "_" ) }}"
        {{- end }}
        {{- end }}
  data:
    {{- range $item := .Values.externalSecret.data }}
    - secretKey: {{ $item.secretKey }}
      remoteRef:
        key: {{ $item.remoteRef.key }}
        property: {{ $item.remoteRef.property | default "" }}
    {{- end }}
{{- end }}
