image:
  repository: "skyacrstagingj3minh.azurecr.io/sky-poc-frontend"
  tag: "sha-9c99d0a"
  pullPolicy: Always

imagePullSecrets:
  - name: regcred

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/modsecurity-snippet: "SecRuleRemoveById 942100"
  hosts:
    - host: plataform.teamblue-stg.skyfirstlabs.com
      paths:
        - path: /
          pathType: Prefix
        - path: /api
          pathType: Prefix
          serviceName: sky-be-teamblue-stg-common-app
          servicePort: 80
  tls:
    - secretName: teamblue-fe-stg-tls
      hosts:
        - teamblue.skyfirstlabs.com
        - plataform.teamblue-stg.skyfirstlabs.com

service:
  port: 80
  targetPort: 3000

replicaCount: 1

extraEnv:
  - name: NEXT_PUBLIC_API_URL
    value: "/api"
  - name: NEXTAUTH_URL
    value: "https://plataform.teamblue-stg.skyfirstlabs.com"
