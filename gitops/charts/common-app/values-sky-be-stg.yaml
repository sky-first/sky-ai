---
image:
  tag: "sha-9ebc449"

replicaCount: 2

# QoS: Burstable (Low Latency / CPU Bursting)
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 600Mi

pdb:
  enabled: true
  minAvailable: 1

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/instance
                operator: In
                values:
                  - sky-be-stg
          topologyKey: kubernetes.io/hostname

# P0.1: Security Context - Non-Root Execution
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# SRE Tuning: Probes pointing to public path to bypass Auth Middleware
probes:
  liveness:
    path: /health
    initialDelaySeconds: 15
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /health # MUDANÇA ESSENCIAL: Garante que o Ingress libere o tráfego
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 3

# P0.1: Local temporary storage for Read-Only Root FS
extraVolumes:
  - name: tmp-volume
    emptyDir: {}

extraVolumeMounts:
  - name: tmp-volume
    mountPath: /tmp
    
migration:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
