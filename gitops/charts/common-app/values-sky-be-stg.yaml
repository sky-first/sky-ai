image:
  repository: "skyacrstagingj3minh.azurecr.io/sky-poc-backend"
  tag: "sha-6990364094b46accd9740991ac513cc807332c3a"
  pullPolicy: Always

imagePullSecrets:
  - name: regcred

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rewrite-target: /api$uri
    nginx.ingress.kubernetes.io/configuration-snippet: |
      set $cors_origin "";
      if ($http_origin ~* "^https?://(workspace-stg|plataform\.teamblue-stg)\.skyfirstlabs\.com$") {
          set $cors_origin $http_origin;
      }
      
      if ($request_method = 'OPTIONS') {
          add_header 'Access-Control-Allow-Origin' "$cors_origin" always;
          add_header 'Access-Control-Allow-Credentials' 'true' always;
          add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
          add_header 'Access-Control-Allow-Headers' 'DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Correlation-Id' always;
          add_header 'Access-Control-Max-Age' 1728000;
          add_header 'Content-Type' 'text/plain charset=UTF-8';
          add_header 'Content-Length' 0;
          return 204;
      }
      
      add_header 'Access-Control-Allow-Origin' "$cors_origin" always;
      add_header 'Access-Control-Allow-Credentials' 'true' always;
      add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
      add_header 'Access-Control-Allow-Headers' 'DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Correlation-Id' always;
    nginx.ingress.kubernetes.io/modsecurity-snippet: "SecRuleRemoveById 942100"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
  hosts:
    - host: api-stg.skyfirstlabs.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: sky-be-stg-tls
      hosts:
        - api-stg.skyfirstlabs.com

replicaCount: 1
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 1024Mi
