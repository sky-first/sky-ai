---
image:
  tag: "sha-9ebc449"

# P0.1: Security Context - Non-Root Execution
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  # readOnlyRootFilesystem: true  # P1.5: Ativar após validação

ingress:
  annotations:
    nginx.ingress.kubernetes.io/enable-modsecurity: "false"
    nginx.ingress.kubernetes.io/enable-owasp-modsecurity-crs: "false"
    cert-manager.io/cluster-issuer: letsencrypt-prod

# SRE Tuning: Probes pointing to public path to bypass Auth Middleware
probes:
  liveness:
    path: /health
    initialDelaySeconds: 45
    timeoutSeconds: 5
    failureThreshold: 5
  readiness:
    path: /health        # MUDANÇA ESSENCIAL: Garante que o Ingress libere o tráfego
    initialDelaySeconds: 20
    timeoutSeconds: 5
    failureThreshold: 5
