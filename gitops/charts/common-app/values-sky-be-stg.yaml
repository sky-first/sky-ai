---
image:
  tag: "sha-9ebc449"

# P0.1: Security Context - Non-Root Execution
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  # readOnlyRootFilesystem: true  # P1.5: Ativar após validação

ingress:
  annotations:
    nginx.ingress.kubernetes.io/enable-modsecurity: "false"
    nginx.ingress.kubernetes.io/enable-owasp-modsecurity-crs: "false"
    cert-manager.io/cluster-issuer: letsencrypt-prod
