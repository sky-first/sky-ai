image:
  repository: "skyacrstagingj3minh.azurecr.io/sky-poc-backend"
  tag: "sha-6990364094b46accd9740991ac513cc807332c3a"
  pullPolicy: Always

imagePullSecrets:
  - name: regcred

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://workspace-stg.skyfirstlabs.com, https://plataform.teamblue-stg.skyfirstlabs.com"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "PUT, GET, POST, OPTIONS, DELETE"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Correlation-Id,X-Correlation-ID"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($http_origin ~* "plataform.teamblue-stg.skyfirstlabs.com") {
          proxy_set_header Host teamblue-api.skyfirstlabs.com;
          proxy_pass http://10.0.152.105:80;
      }
      rewrite ^/api/(.*)$ /api/$1 break;
      rewrite ^/(?!api)(.*)$ /api/$1 break;
    nginx.ingress.kubernetes.io/modsecurity-snippet: "SecRuleRemoveById 942100"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
  hosts:
    - host: api-stg.skyfirstlabs.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: sky-be-stg-tls
      hosts:
        - api-stg.skyfirstlabs.com

envSecrets:
  DATABASE_URL: "postgresql+asyncpg://postgres:mDul04QjKzrSO72B@postgres:5432/ai_saas_db"
  REDIS_URL: "redis://:hGuSngF6G6jOPv8ddSYHxbiQ@redis:6379/0"
  CELERY_BROKER_URL: "redis://:hGuSngF6G6jOPv8ddSYHxbiQ@redis:6379/1"
  AUTH0_DOMAIN: "sky-first.auth0.com"
  AUTH0_AUDIENCE: "https://api.skyfirst.com"
  AI_SERVICE_TYPE: "real"
  AI_SERVICE_URL: "http://sky-ai-stg-common-app.staging.svc.cluster.local"
  DEBUG: "true"

replicaCount: 1
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 1024Mi
