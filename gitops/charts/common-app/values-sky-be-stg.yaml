image:
  repository: "skyacrstagingj3minh.azurecr.io/sky-poc-backend"
  tag: "sha-4e7dc518f8f4720270eb18842201edce3398811c"
  pullPolicy: Always

# Override the Dockerfile CMD so uvicorn trusts X-Forwarded-Proto from
# nginx-ingress. Without --proxy-headers, request.base_url returns http://
# even though the user came in over HTTPS, which produces an http://
# redirect_uri in the Google OAuth flow and triggers redirect_uri_mismatch.
command: ["uvicorn"]
args:
  - "src.main:app"
  - "--host=0.0.0.0"
  - "--port=8000"
  - "--workers=4"
  - "--proxy-headers"
  - "--forwarded-allow-ips=*"

imagePullSecrets:
  - name: regcred

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://workspace-stg.skyfirstlabs.com"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "PUT, GET, POST, OPTIONS, DELETE"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Correlation-Id,X-Correlation-ID"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      # Map legacy /api/auth/sso/* to /api/v1/auth/sso/* — the BE auth middleware
      # only exempts the v1 path from the JWT check, but the frontend (and the
      # routes the same router exposes under both prefixes via main.py) target
      # the legacy path. Without this rewrite the SSO login attempt is rejected
      # with 401 "Missing authorization header" before it ever reaches the
      # handler. Long-term fix: add /api/auth/sso/ to public_paths in the BE
      # middleware (sky-poc-backend src/api/middleware/auth.py).
      rewrite ^/api/auth/sso/(.*)$ /api/v1/auth/sso/$1 break;
      rewrite ^/api/(.*)$ /api/$1 break;
      rewrite ^/(?!api)(.*)$ /api/$1 break;
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
  hosts:
    - host: api-stg.skyfirstlabs.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: sky-be-stg-tls
      hosts:
        - api-stg.skyfirstlabs.com

envSecrets:
  DATABASE_URL: "postgresql+asyncpg://postgres:mDul04QjKzrSO72B@postgres:5432/ai_saas_db"
  REDIS_URL: "redis://:hGuSngF6G6jOPv8ddSYHxbiQ@redis:6379/0"
  CELERY_BROKER_URL: "redis://:hGuSngF6G6jOPv8ddSYHxbiQ@redis:6379/1"
  AUTH0_DOMAIN: "sky-first.auth0.com"
  AUTH0_AUDIENCE: "https://api.skyfirst.com"
  AI_SERVICE_TYPE: "real"
  AI_SERVICE_URL: "http://sky-ai-stg-common-app.staging.svc.cluster.local"
  DEBUG: "true"

  # Mapped from ExternalSecret keys (synced from Azure Key Vault).
  # Required by the Universe Intelligence backend (PR #139).
  JWT_SECRET_KEY:
    name: sky-be-stg-common-app-secrets
    key: jwt_secret_key
  ENCRYPTION_KEY:
    name: sky-be-stg-common-app-secrets
    key: encryption_key
  OPENAI_API_KEY:
    name: sky-be-stg-common-app-secrets
    key: openai_api_key
  CELERY_RESULT_BACKEND:
    name: sky-be-stg-common-app-secrets
    key: celery_result_backend

  # Google SSO (the only login method going forward)
  GOOGLE_CLIENT_ID:
    name: sky-be-stg-common-app-secrets
    key: google_client_id
  GOOGLE_CLIENT_SECRET:
    name: sky-be-stg-common-app-secrets
    key: google_client_secret
  GOOGLE_REDIRECT_URI:
    name: sky-be-stg-common-app-secrets
    key: google_redirect_uri

replicaCount: 1

# Security hardening: run as non-root user
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsReadOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 2Gi
