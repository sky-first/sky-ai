name: Deploy AI to AKS (Production)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ai-prod
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: skyacrprodel5zpw
  IMAGE_NAME: sky-poc-ai

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and Push
        run: |
          az acr login --name $ACR_NAME

          # Gera tags compativeis com o ArgoCD Image Updater (^sha-.*)
          docker build \
            -t $ACR_NAME.azurecr.io/$IMAGE_NAME:sha-${{ github.sha }} \
            -t $ACR_NAME.azurecr.io/$IMAGE_NAME:latest .

          docker push $ACR_NAME.azurecr.io/$IMAGE_NAME:sha-${{ github.sha }}
          docker push $ACR_NAME.azurecr.io/$IMAGE_NAME:latest