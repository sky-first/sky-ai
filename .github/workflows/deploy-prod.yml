name: Deploy AI Service to AKS (Production)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: skyacrprodel5zpw
  IMAGE_NAME: sky-poc-ai

jobs:
  deploy:
    name: Build & Push (Production)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (Federated Identity)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger GitOps Deploy (Infrastructure Repo)
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.GITOPS_PUSH_TOKEN }}
          repository: sky-first/sky-poc-infra
          event-type: deploy-trigger
          client-payload: |
            {
              "app_name": "ai",
              "env": "prod",
              "image_tag": "sha-${{ github.sha }}"
            }