name: Build & Push to ECR (AWS staging)

# Runs in parallel with the Azure ACR workflow during the migration window.
# Once AWS staging is validated, the Azure workflow will be removed.

on:
  push:
    branches: [staging, main]
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC to AWS
  contents: read

env:
  AWS_REGION: eu-west-1
  ECR_REGISTRY: 741375879811.dkr.ecr.eu-west-1.amazonaws.com
  IMAGE_NAME: sky-ai
  ROLE_TO_ASSUME: arn:aws:iam::741375879811:role/sky-gha-sky-ai

jobs:
  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC, no keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push (AMD64)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
