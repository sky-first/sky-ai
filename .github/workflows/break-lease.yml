name: Emergency Break Lease

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: true
        default: 'prod'
        type: choice
        options:
          - prod
          - staging

permissions:
  id-token: write
  contents: read

jobs:
  break-lease:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Break Leases (Robust)
        env:
          STORAGE_ACCOUNT: ${{ secrets.TF_BACKEND_STORAGE_ACCOUNT }}
          CONTAINER: ${{ secrets.TF_BACKEND_CONTAINER }}
          ENV: ${{ inputs.environment }}
        run: |
          echo "🔍 Searching for state blobs for environment: $ENV..."
          
          # List all blobs and try to find matches
          BLOBS=$(az storage blob list \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$CONTAINER" \
            --auth-mode login \
            --query "[].name" -o tsv)
            
          echo "Found blobs:"
          echo "$BLOBS"
          
          # Match patterns:
          # 1. env:/staging/poc-deploy-staging.tfstate
          # 2. env:staging/poc-deploy-staging.tfstate
          # 3. poc-deploy-staging.tfstate
          
          for blob in $BLOBS; do
            if [[ "$blob" == *"$ENV"* ]] && [[ "$blob" == *".tfstate"* ]]; then
              echo "🔓 Breaking lease for: $blob"
              az storage blob lease break \
                --blob-name "$blob" \
                --container-name "$CONTAINER" \
                --account-name "$STORAGE_ACCOUNT" \
                --auth-mode login || echo "Failed to break lease for $blob"
            fi
          done

          # Also try the specific lock info blob if it exists anywhere
          for blob in $BLOBS; do
            if [[ "$blob" == *".lock.info"* ]]; then
              echo "🗑️ Deleting lock blob: $blob"
              az storage blob delete \
                --name "$blob" \
                --container-name "$CONTAINER" \
                --account-name "$STORAGE_ACCOUNT" \
                --auth-mode login || echo "Failed to delete $blob"
            fi
          done
          
          echo "✅ Lease break process complete!"
