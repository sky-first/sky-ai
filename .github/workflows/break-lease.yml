name: Emergency Break Lease

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: true
        default: 'prod'
        type: choice
        options:
          - prod
          - staging

permissions:
  id-token: write
  contents: read

jobs:
  break-lease:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Break Lease
        env:
          STORAGE_ACCOUNT: ${{ secrets.TF_BACKEND_STORAGE_ACCOUNT }}
          CONTAINER: ${{ secrets.TF_BACKEND_CONTAINER }}
          KEY: "poc-deploy-prod.tfstate" # Assuming prod based on inputs
        run: |
          echo "Breaking lease for state blob..."
          az storage blob lease break \
            --blob-name "$KEY" \
            --container-name "$CONTAINER" \
            --account-name "$STORAGE_ACCOUNT" \
            --auth-mode login || echo "Failed to break state blob lease (maybe none exists)"

          echo "Breaking lease for lock blob..."
          az storage blob lease break \
            --blob-name ".terraform.tfstate.lock.info" \
            --container-name "$CONTAINER" \
            --account-name "$STORAGE_ACCOUNT" \
            --auth-mode login || echo "Failed to break lock blob lease (maybe none exists)"
            
          echo "Deleting lock blob..."
          az storage blob delete \
            --name ".terraform.tfstate.lock.info" \
            --container-name "$CONTAINER" \
            --account-name "$STORAGE_ACCOUNT" \
            --auth-mode login || echo "Failed to delete lock blob"
