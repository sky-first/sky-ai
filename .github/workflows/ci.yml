---
name: CI - Terraform Validation & Security

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
  security-events: write

on:
  workflow_dispatch: { }
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "infra/**"
      - "docker/**"
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/linters/**"
      - "scripts/**"
      - "docs/**"
      - "README.md"
      - "gitops/**"
      - ".env.example"
      - "env.example"
  push:
    branches: [staging, main]
    paths:
      - "infra/**"
      - "docker/**"
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/linters/**"
      - "scripts/**"
      - "docs/**"
      - "README.md"
      - "gitops/**"
      - ".env.example"
      - "env.example"


# Concurrency control: Ensure we don't have multiple Terraform operations for the same environment
concurrency:
  group: terraform-${{ github.ref_name }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: "1.9.0"
  TF_WORKING_DIR: "infra/aks"

jobs:
  yaml-lint:
    name: YAML Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check YAML syntax
        run: |
          set -euo pipefail
          python3 -c "
          import yaml
          import sys
          import glob

          errors = []
          for file in glob.glob('.github/**/*.yml', recursive=True) + glob.glob('.github/**/*.yaml', recursive=True):
              try:
                  with open(file, 'r') as f:
                      yaml.safe_load(f)
              except yaml.YAMLError as e:
                  errors.append(f'{file}: {e}')
                  print(f'{file}: {e}')

          if errors:
              sys.exit(1)
          "

  workflow-lint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lint GitHub Actions Workflows
        uses: github/super-linter@v5
        env:
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISABLE_ALL: true
          VALIDATE_YAML: true
          # Skip Helm templates which cause syntax errors in standard YAML linters
          FILTER_REGEX_EXCLUDE: ".*gitops/charts/.*"
          # Super-linter will auto-detect .github/linters/yamllint.yml

  security-scan:
    name: Security Scan (IaC & Secrets)
    runs-on: ubuntu-latest
    needs: [yaml-lint, workflow-lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner in IaC mode
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scanners: 'config'
          hide-progress: true
          format: 'sarif'
          output: 'trivy-iac-results.sarif'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy vulnerability scanner for Secrets
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scanners: 'secret'
          hide-progress: true
          format: 'sarif'
          output: 'trivy-secrets-results.sarif'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy IaC scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true # Prevents failure if GAS is not enabled
        with:
          sarif_file: 'trivy-iac-results.sarif'
          category: 'trivy-iac'

      - name: Upload Trivy Secrets scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true # Prevents failure if GAS is not enabled
        with:
          sarif_file: 'trivy-secrets-results.sarif'
          category: 'trivy-secrets'

  terraform-validation:
    name: Terraform Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [yaml-lint, workflow-lint, security-scan]
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    env:
      HAS_AZURE_CREDS: ${{ secrets.AZURE_SUBSCRIPTION_ID != '' && secrets.AZURE_TENANT_ID != '' && secrets.AZURE_CLIENT_ID != '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Terraform
        uses: ./.github/actions/terraform-setup
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          working_directory: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Format Check
        id: fmt-check
        run: |
          set -euo pipefail
          terraform fmt -check -recursive -diff
          FMT_EXIT_CODE=$?
          if [ $FMT_EXIT_CODE -ne 0 ]; then
            echo "Terraform files are not properly formatted"
            echo "Run: terraform fmt -recursive"
            exit 1
          fi

      - name: Azure Login (OIDC) for Terraform Validation
        # Em PR de fork, secrets não existem; nesses casos, pulamos login e também pulamos init/validate.
        if: env.HAS_AZURE_CREDS == 'true'
        uses: ./.github/actions/azure-auth
        with:
          subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          client_id: ${{ secrets.AZURE_CLIENT_ID }}

      - name: Terraform Init
        if: env.HAS_AZURE_CREDS == 'true'
        env:
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_USE_OIDC: true
        run: |
          set -euo pipefail

          # Limpar cache do Terraform para evitar tentar usar backend configurado
          echo "Limpando cache do Terraform..."
          rm -rf .terraform .terraform.lock.hcl terraform.tfstate terraform.tfstate.backup

          # Inicializar SEM backend (apenas para validação)
          echo "Inicializando Terraform sem backend..."
          terraform init -backend=false -input=false -reconfigure 2>&1 | tee init-output.txt || {
            echo "❌ Terraform init falhou"
            cat init-output.txt
            exit 1
          }

          echo "✅ Terraform init concluído (sem backend)"

      - name: Terraform Validate
        id: validate
        if: env.HAS_AZURE_CREDS == 'true'
        env:
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_USE_OIDC: true
        run: |
          set -euo pipefail
          terraform validate -no-color
          VALIDATE_EXIT_CODE=$?
          if [ $VALIDATE_EXIT_CODE -ne 0 ]; then
            echo "Terraform validation failed"
            exit 1
          fi

      - name: Skip Terraform init/validate (no Azure credentials in this context)
        if: env.HAS_AZURE_CREDS != 'true'
        run: |
          set -euo pipefail
          echo "INFO: Secrets do Azure não disponíveis (ex: PR de fork)."
          echo "Pulando terraform init/validate para evitar dependência de 'az login'."

      - name: Terraform Security Scan with tfsec
        id: security-tfsec
        run: |
          set -euo pipefail
          # Remover arquivo anterior se existir
          rm -f tfsec-results.json

          # Criar arquivo vazio com permissões corretas antes de executar tfsec
          touch tfsec-results.json
          chmod 666 tfsec-results.json

          # Executar tfsec usando usuário do host para garantir permissões
          docker run --rm -v "$PWD:/src" -w /src \
            --user "$(id -u):$(id -g)" \
            aquasec/tfsec:latest /src \
            --format json --out /src/tfsec-results.json --no-colour || true

          # Se arquivo não foi criado ou está vazio, criar estrutura JSON válida
          if [ ! -f tfsec-results.json ] || [ ! -s tfsec-results.json ]; then
            echo '{"results":[]}' > tfsec-results.json
          fi

          if [ -f tfsec-results.json ]; then
            echo "tfsec_results=$(cat tfsec-results.json | jq -c .)" >> $GITHUB_OUTPUT

            # Verificar se há vulnerabilidades críticas
            CRITICAL_COUNT=$(cat tfsec-results.json | jq -r '[.results[]? | select(.severity == "CRITICAL" or .severity == "HIGH")] | length' || echo "0")

            if [ "$CRITICAL_COUNT" -gt 0 ]; then
              echo "❌ ERRO: Encontradas $CRITICAL_COUNT vulnerabilidade(s) CRÍTICA(S) ou ALTA(S)"
              cat tfsec-results.json | jq -r '.results[]? | select(.severity == "CRITICAL" or .severity == "HIGH") | "\(.severity | ascii_upcase): \(.description) - \(.location.filename):\(.location.start_line)"'
              exit 1
            fi

            cat tfsec-results.json | jq -r '.results[]? | "\(.severity | ascii_upcase): \(.description) - \(.location.filename):\(.location.start_line)"' || true
          fi

      - name: Terraform Lint with tflint
        id: lint-tflint
        continue-on-error: true
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/data" \
            ghcr.io/terraform-linters/tflint:latest \
            --format json --filter . > tflint-results.json || true

          if [ -f tflint-results.json ]; then
            cat tflint-results.json | jq -r '.issues[]? | "\(.severity | ascii_upcase): \(.message) - \(.range.filename):\(.range.start.line)"' || true
          fi

      - name: Legacy Security Scan (grep-based)
        id: security-grep
        continue-on-error: true
        run: |
          set -euo pipefail
          if grep -r -E "(password|secret|key|token)\s*=\s*[\"'][^\"']{8,}" --include="*.tf" --include="*.tfvars" .; then
            echo "Warning: Potential hardcoded secrets found"
            echo "Review the files above for security issues"
          fi

      - name: Validate Terraform Variables Files
        id: validate-vars
        run: |
          set -euo pipefail
          for env in staging prod; do
            if [ ! -f "terraform.tfvars.${env}" ]; then
              echo "ERROR: terraform.tfvars.${env} not found"
              exit 1
            fi

            echo "Checking terraform.tfvars.${env} exists and is readable..."
            # Verificar que o arquivo existe, não está vazio e é legível
            if [ ! -s "terraform.tfvars.${env}" ]; then
              echo "ERROR: terraform.tfvars.${env} is empty"
              exit 1
            fi

            # Tentar fazer parse básico do HCL usando hclfmt (se disponível) ou pelo menos verificar estrutura básica
            # Validar que não há erros de sintaxe óbvios (chaves não fechadas, etc)
            if ! grep -q "=" "terraform.tfvars.${env}"; then
              echo "WARNING: terraform.tfvars.${env} might not contain valid key-value pairs"
            fi

            echo "terraform.tfvars.${env} exists and appears valid"
          done

      - name: Comment PR with Validation Results
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
        uses: actions/github-script@v7
        with:
          script: |
            const fmtStatus = '${{ steps.fmt-check.outcome }}' === 'success' ? '✅ Passed' : '❌ Failed';
            const validateStatus = '${{ steps.validate.outcome }}' === 'success' ? '✅ Passed' : '❌ Failed';
            const varsStatus = '${{ steps.validate-vars.outcome }}' === 'success' ? '✅ Passed' : '❌ Failed';
            const securityTfsecStatus = '${{ steps.security-tfsec.outcome }}' === 'success' ? '✅ Passed' : '⚠️ Completed with warnings';
            const lintTflintStatus = '${{ steps.lint-tflint.outcome }}' === 'success' ? '✅ Passed' : '⚠️ Completed with warnings';

            const allCriticalPassed = '${{ steps.fmt-check.outcome }}' === 'success' &&
                                      '${{ steps.validate.outcome }}' === 'success' &&
                                      '${{ steps.validate-vars.outcome }}' === 'success';

            const output = `## Terraform Validation Results

            - **Format Check**: ${fmtStatus}
            - **Validation**: ${validateStatus}
            - **Variables Validation**: ${varsStatus}
            - **Security Scan (tfsec)**: ${securityTfsecStatus}
            - **Lint (tflint)**: ${lintTflintStatus}

            ${allCriticalPassed ? '✅ All critical Terraform checks passed successfully.' : '❌ Some critical checks failed. Please review the errors above.'}`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });


  terraform-plan-preview:
    name: Terraform Plan Preview
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [terraform-validation]
    # Habilitado para PRs não-fork e pushes
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || github.event_name == 'push'
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    env:
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_USE_OIDC: true
      TF_BACKEND_RESOURCE_GROUP: ${{ secrets.TF_BACKEND_RESOURCE_GROUP }}
      TF_BACKEND_STORAGE_ACCOUNT: ${{ secrets.TF_BACKEND_STORAGE_ACCOUNT }}
      TF_BACKEND_CONTAINER: ${{ secrets.TF_BACKEND_CONTAINER }}
      TF_BACKEND_KEY_PREFIX: ${{ secrets.TF_BACKEND_KEY_PREFIX }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      # Guard for Bastion deletion
      BASTION_KEY_PROV: ${{ secrets.SSH_PUBLIC_KEY != '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Check for Infra Changes
        uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            infra:
              - 'infra/**'


      - name: Setup Terraform
        if: steps.changes.outputs.infra == 'true'
        uses: ./.github/actions/terraform-setup
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          working_directory: ${{ env.TF_WORKING_DIR }}

      - name: Azure Login
        if: steps.changes.outputs.infra == 'true'
        uses: ./.github/actions/azure-auth
        with:
          subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          client_id: ${{ secrets.AZURE_CLIENT_ID }}

      - name: Get Runner IP
        id: ip
        if: steps.changes.outputs.infra == 'true'
        run: |
          set -euo pipefail
          RUNNER_IP=$(curl -s --max-time 10 https://api.ipify.org || curl -s --max-time 10 https://checkip.amazonaws.com || echo "")
          if [ -z "$RUNNER_IP" ]; then
            echo "ERRO: Não foi possível obter IP do runner"
            exit 1
          fi
          echo "RUNNER_IP=$RUNNER_IP" >> $GITHUB_ENV
          echo "TF_VAR_runner_ip=$RUNNER_IP/32" >> $GITHUB_ENV
          echo "runner_ip=$RUNNER_IP" >> $GITHUB_OUTPUT
          echo "✅ Runner IP obtido: $RUNNER_IP (formatado como $RUNNER_IP/32 para o Terraform)"

      - name: Detect Target Environment
        id: detect-env
        if: steps.changes.outputs.infra == 'true'
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_REF="${{ github.event.pull_request.base.ref }}"
          else
            BASE_REF="${{ github.ref_name }}"
          fi

          if [[ "${BASE_REF}" == "staging" ]]; then
            ENV="staging"
          elif [[ "${BASE_REF}" == "main" ]]; then
            ENV="prod"
          else
            ENV="staging"
          fi
          echo "env=${ENV}" >> $GITHUB_OUTPUT
          echo "tfvars=terraform.tfvars.${ENV}" >> $GITHUB_OUTPUT
          echo "workspace=${ENV}" >> $GITHUB_OUTPUT

      - name: Validate Terraform Backend Secrets
        if: steps.changes.outputs.infra == 'true'
        run: |
          set -euo pipefail
          echo "Validando secrets obrigatórios do backend Terraform..."
          REQUIRED_VARS=(
            "TF_BACKEND_RESOURCE_GROUP"
            "TF_BACKEND_STORAGE_ACCOUNT"
            "TF_BACKEND_CONTAINER"
            "TF_BACKEND_KEY_PREFIX"
          )
          MISSING=()
          for v in "${REQUIRED_VARS[@]}"; do
            if [ -z "${!v:-}" ]; then
              MISSING+=("$v")
            fi
          done
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "ERRO: Secrets obrigatórios do backend não configurados no GitHub:"
            printf '  - %s\n' "${MISSING[@]}"
            echo ""
            echo "Configure em: Settings > Secrets and variables > Actions"
            exit 1
          fi
          echo "OK: Secrets do backend presentes"

      - name: Write backend config
        if: steps.changes.outputs.infra == 'true'
        run: |
          ENV="${{ steps.detect-env.outputs.env }}"
          cat > backend.hcl <<EOF
          resource_group_name  = "${TF_BACKEND_RESOURCE_GROUP}"
          storage_account_name = "${TF_BACKEND_STORAGE_ACCOUNT}"
          container_name       = "${TF_BACKEND_CONTAINER}"
          key                  = "${TF_BACKEND_KEY_PREFIX:-poc-deploy}-${ENV}.tfstate"
          use_azuread_auth     = true
          EOF

      - name: Terraform Init
        if: steps.changes.outputs.infra == 'true'
        run: |
          set -euo pipefail
          terraform init -input=false -backend-config=backend.hcl

      - name: Select Workspace
        if: steps.changes.outputs.infra == 'true'
        run: |
          set -euo pipefail
          terraform workspace select ${{ steps.detect-env.outputs.workspace }} || \
          terraform workspace new ${{ steps.detect-env.outputs.workspace }}

      - name: Terraform Plan
        id: plan
        if: steps.changes.outputs.infra == 'true'
        run: |
          set -euo pipefail

          # Inicializar outputs com valores padrão
          echo "plan_generated=false" >> $GITHUB_OUTPUT
          echo "plan_exit_code=1" >> $GITHUB_OUTPUT

          # Executar terraform plan com tratamento de lock
          set +e
          terraform plan \
            -var-file=${{ steps.detect-env.outputs.tfvars }} \
            -var="subscription_id=${ARM_SUBSCRIPTION_ID}" \
            -var="runner_ip=${{ steps.ip.outputs.runner_ip }}" \
            -no-color \
            -out=tfplan-preview 2>&1 | tee plan-output.txt

          PLAN_EXIT_CODE=${PIPESTATUS[0]}
          PLAN_OUTPUT=$(cat plan-output.txt)

          # Verificar se o arquivo do plan foi gerado
          if [ -f "tfplan-preview" ]; then
            echo "plan_generated=true" >> $GITHUB_OUTPUT
            echo "plan_exit_code=${PLAN_EXIT_CODE}" >> $GITHUB_OUTPUT
            echo "✅ Terraform plan file generated successfully"
          else
            echo "plan_generated=false" >> $GITHUB_OUTPUT
            echo "plan_exit_code=${PLAN_EXIT_CODE}" >> $GITHUB_OUTPUT
            echo "❌ ERRO: Terraform plan file was not generated (exit code: ${PLAN_EXIT_CODE})"
            exit 1
          fi

      - name: Validate Plan
        id: validate-plan
        if: steps.plan.outputs.plan_generated == 'true'
        uses: ./.github/actions/terraform-plan-validation
        with:
          plan_file: tfplan-preview
          environment: ${{ steps.detect-env.outputs.env }}
          allow_destroy: false

      - name: Comment PR with Plan
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false && steps.changes.outputs.infra == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            let planOutput = '';
            const planFilePath = path.join('${{ env.TF_WORKING_DIR }}', 'plan-output.txt');
            try {
              planOutput = fs.readFileSync(planFilePath, 'utf8');
            } catch (error) {
              planOutput = 'Plan output not available';
            }

            // Verificar se o plan foi gerado
            const planGenerated = '${{ steps.plan.outputs.plan_generated }}' === 'true';
            const planStatus = '${{ steps.plan.outcome }}';

            // Se o plan foi gerado, buscar outputs da validação
            let hasDestroy = false;
            let resourceCount = 'N/A';

            if (planGenerated && '${{ steps.validate-plan.outcome }}' === 'success') {
              hasDestroy = '${{ steps.validate-plan.outputs.has_destroy }}' === 'true';
              resourceCount = '${{ steps.validate-plan.outputs.resource_count }}' || 'N/A';
            }

            let status = 'SUCCESS';
            let statusText = 'Plan generated successfully';
            let statusIcon = '✅';

            if (!planGenerated || planStatus !== 'success') {
              status = 'FAILED';
              statusText = 'Plan generation failed';
              statusIcon = '❌';
            } else if (hasDestroy) {
              status = 'WARNING';
              statusText = 'Plan contains destructive changes - Review carefully!';
              statusIcon = '⚠️';
            }

            const output = `## ${statusIcon} ${status} Terraform Plan Preview

            **Environment**: ${{ steps.detect-env.outputs.env }}
            **Resources to change**: ${resourceCount}
            **Status**: ${statusText}

            <details>
            <summary>Plan Output</summary>

            \`\`\`
            ${planOutput.substring(0, 60000)}${planOutput.length > 60000 ? '\n... (truncated)' : ''}
            \`\`\`

            </details>

            ${hasDestroy ? '⚠️ **Warning**: This plan contains destructive changes. Please review carefully before merging.' : ''}
            ${planStatus !== 'success' ? '❌ **Error**: Failed to generate plan. Check the logs for details.' : ''}`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });
