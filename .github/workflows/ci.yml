name: CI - Terraform Validation & Security

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'infra/**'
      - '.github/workflows/**'
      - '.github/actions/**'
  push:
    branches: [staging, main]
    paths:
      - 'infra/**'
      - '.github/workflows/**'

env:
  TERRAFORM_VERSION: '1.9.0'
  TF_WORKING_DIR: 'infra/azure'

jobs:
  terraform-validation:
    name: Terraform Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Terraform
        uses: ./.github/actions/terraform-setup
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          working_directory: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Format Check
        id: fmt-check
        run: |
          terraform fmt -check -recursive -diff
          FMT_EXIT_CODE=$?
          if [ $FMT_EXIT_CODE -ne 0 ]; then
            echo "Terraform files are not properly formatted"
            echo "Run: terraform fmt -recursive"
            exit 1
          fi

      - name: Terraform Init
        run: terraform init -backend=false -input=false

      - name: Terraform Validate
        id: validate
        run: |
          terraform validate -no-color
          VALIDATE_EXIT_CODE=$?
          if [ $VALIDATE_EXIT_CODE -ne 0 ]; then
            echo "Terraform validation failed"
            exit 1
          fi

      - name: Terraform Security Scan
        continue-on-error: true
        run: |
          if grep -r -E "(password|secret|key|token)\s*=\s*[\"'][^\"']{8,}" --include="*.tf" --include="*.tfvars" .; then
            echo "Warning: Potential hardcoded secrets found"
            echo "Review the files above for security issues"
          fi

      - name: Validate Terraform Variables
        continue-on-error: true
        run: |
          for env in staging prod; do
            if [ -f "terraform.tfvars.${env}" ]; then
              echo "terraform.tfvars.${env} exists"
            else
              echo "terraform.tfvars.${env} not found"
            fi
          done

      - name: Comment PR with Validation Results
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
        uses: actions/github-script@v7
        with:
          script: |
            const output = `## Terraform Validation Results
            
            - **Format Check**: Passed
            - **Validation**: Passed
            - **Security Scan**: Completed
            
            All Terraform checks passed successfully.`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

  terraform-plan-preview:
    name: Terraform Plan Preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # OIDC falha em PRs enquanto a credencial federada não existe; pular em PR.
    if: github.event_name != 'pull_request'
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    env:
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_USE_OIDC: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Terraform
        uses: ./.github/actions/terraform-setup
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          working_directory: ${{ env.TF_WORKING_DIR }}

      - name: Azure Login
        uses: ./.github/actions/azure-auth
        with:
          subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          client_id: ${{ secrets.AZURE_CLIENT_ID }}

      - name: Detect Target Environment
        id: detect-env
        run: |
          BASE_REF="${{ github.event.pull_request.base.ref }}"
          if [[ "${BASE_REF}" == "staging" ]]; then
            ENV="staging"
          elif [[ "${BASE_REF}" == "main" ]]; then
            ENV="prod"
          else
            ENV="staging"
          fi
          echo "env=${ENV}" >> $GITHUB_OUTPUT
          echo "tfvars=terraform.tfvars.${ENV}" >> $GITHUB_OUTPUT
          echo "workspace=${ENV}" >> $GITHUB_OUTPUT

      - name: Terraform Init
        run: terraform init -input=false

      - name: Select Workspace
        run: |
          terraform workspace select ${{ steps.detect-env.outputs.workspace }} || \
          terraform workspace new ${{ steps.detect-env.outputs.workspace }}

      - name: Terraform Plan
        id: plan
        continue-on-error: true
        run: |
          terraform plan \
            -var-file=${{ steps.detect-env.outputs.tfvars }} \
            -var="subscription_id=${ARM_SUBSCRIPTION_ID}" \
            -no-color \
            -out=tfplan-preview 2>&1 | tee plan-output.txt

      - name: Validate Plan
        uses: ./.github/actions/terraform-plan-validation
        with:
          plan_file: tfplan-preview
          environment: ${{ steps.detect-env.outputs.env }}
          allow_destroy: false

      - name: Comment PR with Plan
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let planOutput = '';
            try {
              planOutput = fs.readFileSync('${{ env.TF_WORKING_DIR }}/plan-output.txt', 'utf8');
            } catch (error) {
              planOutput = 'Plan output not available';
            }
            
            const hasDestroy = '${{ steps.validate.outputs.has_destroy }}' === 'true';
            const resourceCount = '${{ steps.validate.outputs.resource_count }}';
            
            let status = 'SUCCESS';
            let statusText = 'Plan generated successfully';
            if (hasDestroy) {
              status = 'WARNING';
              statusText = 'Plan contains destructive changes - Review carefully!';
            }
            
            const output = `## ${status} Terraform Plan Preview
            
            **Environment**: ${{ steps.detect-env.outputs.env }}
            **Resources to change**: ${resourceCount}
            **Status**: ${statusText}
            
            <details>
            <summary>Plan Output</summary>
            
            \`\`\`
            ${planOutput.substring(0, 60000)}  ${planOutput.length > 60000 ? '\n... (truncated)' : ''}
            \`\`\`
            
            </details>
            
            ${hasDestroy ? '**Warning**: This plan contains destructive changes. Please review carefully before merging.' : ''}`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

  yaml-lint:
    name: YAML Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check YAML syntax
        run: |
          python3 -c "
          import yaml
          import sys
          import glob
          
          errors = []
          for file in glob.glob('.github/**/*.yml', recursive=True) + glob.glob('.github/**/*.yaml', recursive=True):
              try:
                  with open(file, 'r') as f:
                      yaml.safe_load(f)
              except yaml.YAMLError as e:
                  errors.append(f'{file}: {e}')
                  print(f'{file}: {e}')
          
          if errors:
              sys.exit(1)
          "

  workflow-lint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lint GitHub Actions Workflows
        uses: github/super-linter@v5
        env:
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISABLE_ALL: true
          VALIDATE_YAML: true
