---
name: Fix Terraform State

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to fix"
        required: true
        type: choice
        options:
          - staging
          - prod
          - poc-sky
      lock_id:
        description: "Lock ID to force unlock (optional)"
        required: false

permissions:
  contents: read
  id-token: write

env:
  TERRAFORM_VERSION: "1.9.0"
  TF_WORKING_DIR: "infra/aks"

jobs:
  fix-state:
    name: Fix State for ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment == 'prod' && 'production' || inputs.environment == 'poc-sky' && 'poc-sky' || 'staging' }}

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    env:
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_USE_OIDC: true
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Authentication
        uses: ./.github/actions/azure-auth
        with:
          subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          client_id: ${{ secrets.AZURE_CLIENT_ID }}

      - name: Break Blob Leases (Emergency - Nuclear Option)
        env:
          STORAGE_ACCOUNT: ${{ secrets.TF_BACKEND_STORAGE_ACCOUNT }}
          CONTAINER: ${{ secrets.TF_BACKEND_CONTAINER }}
          ENV_SUFFIX: "${{ inputs.environment }}.tfstate"
        run: |
           echo "☢️ NUCLEAR OPTION: Breaking leases for ALL blobs in container '$CONTAINER'..."
           # List ALL blobs. No filters. We need to unblock production.
           BLOBS=$(az storage blob list \
             --container-name "$CONTAINER" \
             --account-name "$STORAGE_ACCOUNT" \
             --auth-mode login \
             --query "[].name" -o tsv)

           if [ -z "$BLOBS" ]; then
             echo "⚠️ No blobs found in container '$CONTAINER'"
           fi

           for BLOB in $BLOBS; do
             echo "🔨 Breaking lease for blob: $BLOB"
             az storage blob lease break \
               --blob-name "$BLOB" \
               --container-name "$CONTAINER" \
               --account-name "$STORAGE_ACCOUNT" \
               --auth-mode login || echo "⚠️ Failed to break lease for $BLOB (maybe none) - continuing..."

             # Check for lock.info associated with this blob (just in case)
             LOCK_BLOB="$BLOB.lock.info"
             # No harm in trying to break it blindly
             az storage blob lease break \
               --blob-name "$LOCK_BLOB" \
               --container-name "$CONTAINER" \
               --account-name "$STORAGE_ACCOUNT" \
               --auth-mode login 2>/dev/null || true
           done

           # Also break the generic .terraform.tfstate.lock.info
           echo "🔨 Breaking generic lock info"
           az storage blob lease break \
             --blob-name ".terraform.tfstate.lock.info" \
             --container-name "$CONTAINER" \
             --account-name "$STORAGE_ACCOUNT" \
             --auth-mode login || true

      - name: Verify Permission (User Access Administrator)
        run: |
          set -euo pipefail
          echo "Verifying RBAC permissions for Runner Identity..."
          CLIENT_ID=$(az account show --query user.name -o tsv)
          RG_NAME="sky-aks-${{ github.event.inputs.environment }}-rg"
          ROLES=$(az role assignment list --assignee "$CLIENT_ID" --resource-group "$RG_NAME" --query "[].roleDefinitionName" -o tsv 2>/dev/null || echo "")

          if echo "$ROLES" | grep -qE "Owner|User Access Administrator"; then
            echo "✅ Permission Verified."
          else
            echo "⚠️  WARNING: 'Owner' or 'User Access Administrator' role NOT found."
            SUB_ROLES=$(az role assignment list --assignee "$CLIENT_ID" --scope "/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}" --query "[].roleDefinitionName" -o tsv 2>/dev/null || echo "")
            if echo "$SUB_ROLES" | grep -qE "Owner|User Access Administrator"; then
               echo "✅ Permission Verified (Inherited)."
            else
               echo "❌ CRITICAL ERROR: Pipeline Identity lacks management permissions."
            fi
          fi

      - name: Setup Terraform
        uses: ./.github/actions/terraform-setup
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          working_directory: ${{ env.TF_WORKING_DIR }}

      - name: Generate Backend Config
        run: |
          ENV="${{ inputs.environment }}"
          KEY_PREFIX="${{ secrets.TF_BACKEND_KEY_PREFIX || 'poc-deploy' }}"
          cat > backend.hcl <<EOF
          resource_group_name  = "${{ secrets.TF_BACKEND_RESOURCE_GROUP }}"
          storage_account_name = "${{ secrets.TF_BACKEND_STORAGE_ACCOUNT }}"
          container_name       = "${{ secrets.TF_BACKEND_CONTAINER }}"
          key                  = "${KEY_PREFIX}-${ENV}.tfstate"
          use_azuread_auth     = true
          EOF
          echo "Backend Config generated for $ENV"
          cat backend.hcl

      - name: Terraform Init
        run: |
          terraform init -reconfigure -backend-config=backend.hcl

      - name: Force Unlock
        if: ${{ inputs.lock_id != '' }}
        run: |
          echo "Forcing unlock for ID: ${{ inputs.lock_id }}"
          terraform force-unlock -force ${{ inputs.lock_id }}

      - name: Select Workspace
        run: |
          ENV="${{ inputs.environment }}"
          echo "Selecting workspace: $ENV"
          terraform workspace select "$ENV" || terraform workspace new "$ENV"

      - name: Import Existing Resources
        run: |
          set -e
          ENV="${{ inputs.environment }}"
          TFVARS="terraform.tfvars.${ENV}"
          RG_NAME=$(grep "^resource_group_name" "$TFVARS" | cut -d'"' -f2)
          AKS_NAME=$(grep "^aks_cluster_name" "$TFVARS" | cut -d'"' -f2)

          # Function to import if resource exists in Azure but not in state
          import_if_needed() {
            local TF_ADDRESS="$1"
            local AZURE_ID="$2"
            local RESOURCE_NAME="$3"
            if terraform state show "$TF_ADDRESS" >/dev/null 2>&1; then
              echo "  ✅ Already in state"
              return 0
            fi
            if terraform import -var-file="$TFVARS" "$TF_ADDRESS" "$AZURE_ID" 2>&1 | tee import-temp.log; then
              echo "  ✅ Import successful"
              return 0
            else
              if grep -q "Cannot import non-existent" import-temp.log || grep -q "does not exist" import-temp.log || grep -q "was not found" import-temp.log; then
                echo "  ℹ️  Resource doesn't exist in Azure"
                return 0
              else
                echo "  ❌ Import failed"
                cat import-temp.log
                return 1
              fi
            fi
          }

          # Minimal set of critical imports
          import_if_needed "azurerm_resource_group.aks" "/subscriptions/$ARM_SUBSCRIPTION_ID/resourceGroups/$RG_NAME" "Resource Group"

          if az group show -n "$RG_NAME" >/dev/null 2>&1; then
            if az aks show -g "$RG_NAME" -n "$AKS_NAME" >/dev/null 2>&1; then
               import_if_needed "azurerm_kubernetes_cluster.aks" "/subscriptions/$ARM_SUBSCRIPTION_ID/resourceGroups/$RG_NAME/providers/Microsoft.ContainerService/managedClusters/$AKS_NAME" "AKS Cluster"

               NODE_POOL_NAME="userapps"
               import_if_needed "azurerm_kubernetes_cluster_node_pool.user_pool" "/subscriptions/$ARM_SUBSCRIPTION_ID/resourceGroups/$RG_NAME/providers/Microsoft.ContainerService/managedClusters/$AKS_NAME/agentPools/$NODE_POOL_NAME" "AKS User Node Pool"

               AI_NODE_POOL_NAME="aicpu16"
               import_if_needed "azurerm_kubernetes_cluster_node_pool.ai_turbo" "/subscriptions/$ARM_SUBSCRIPTION_ID/resourceGroups/$RG_NAME/providers/Microsoft.ContainerService/managedClusters/$AKS_NAME/agentPools/$AI_NODE_POOL_NAME" "AKS AI Node Pool"
            fi

            # CRITICAL: Import Role Assignment Conflict
            SP_ID="ac642806-ae70-4e1d-a800-c8ed0f43ecd0"
            SCOPE="/subscriptions/$ARM_SUBSCRIPTION_ID/resourceGroups/$RG_NAME"
            RA_ID=$(az role assignment list --assignee "$SP_ID" --scope "$SCOPE" --role "Contributor" --query "[0].id" -o tsv || echo "")
            if [ -n "$RA_ID" ]; then
                import_if_needed "azurerm_role_assignment.gh_actions_contributor" "$RA_ID" "GH Actions Contributor Role"
            fi

            # Bastion networking imports
             PIP_NAME="bastion-pip-${ENV}"
             if az network public-ip show -g "$RG_NAME" -n "$PIP_NAME" >/dev/null 2>&1; then
               import_if_needed "azurerm_public_ip.bastion" "/subscriptions/$ARM_SUBSCRIPTION_ID/resourceGroups/$RG_NAME/providers/Microsoft.Network/publicIPAddresses/$PIP_NAME" "Bastion Public IP"
             fi

             VNET_NAME="sky-aks-vnet-${ENV}"
             if az network vnet show -g "$RG_NAME" -n "$VNET_NAME" >/dev/null 2>&1; then
               import_if_needed "azurerm_virtual_network.aks" "/subscriptions/$ARM_SUBSCRIPTION_ID/resourceGroups/$RG_NAME/providers/Microsoft.Network/virtualNetworks/$VNET_NAME" "AKS VNet"
             fi
          fi

      - name: Refresh State
        run: |
          ENV="${{ inputs.environment }}"
          TFVARS="terraform.tfvars.${ENV}"
          echo "Refreshing Terraform state to sync with Azure..."
          terraform refresh -var-file="$TFVARS"
          echo "✅ State refreshed successfully"

      - name: Show State List
        run: |
          echo "Current resources in Terraform state:"
          terraform state list
