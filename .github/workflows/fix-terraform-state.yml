name: Fix Terraform State

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to fix"
        required: true
        type: choice
        options:
          - staging
          - prod
          - poc-sky

permissions:
  contents: read
  id-token: write

env:
  TERRAFORM_VERSION: "1.9.0"
  TF_WORKING_DIR: "infra/aks"

jobs:
  fix-state:
    name: Fix State for ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment == 'prod' && 'production' || inputs.environment == 'poc-sky' && 'poc-sky' || 'staging' }}

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    env:
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_USE_OIDC: true
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Authentication
        uses: ./.github/actions/azure-auth
        with:
          subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          client_id: ${{ secrets.AZURE_CLIENT_ID }}

      - name: Verify Permission (User Access Administrator)
        run: |
          set -euo pipefail
          echo "Verifying RBAC permissions for Runner Identity..."

          # Get current client ID (Identity)
          CLIENT_ID=$(az account show --query user.name -o tsv)
          echo "Current Client ID: $CLIENT_ID"

          RG_NAME="sky-aks-${{ github.event.inputs.environment }}-rg"
          echo "Checking permissions on Resource Group: $RG_NAME"

          # Check if identity has Owner or User Access Administrator
          # Note: We use 'grep' because the caller might have inherited permissions
          ROLES=$(az role assignment list --assignee "$CLIENT_ID" --resource-group "$RG_NAME" --query "[].roleDefinitionName" -o tsv 2>/dev/null || echo "")

          echo "Assigned Roles found: $ROLES"

          if echo "$ROLES" | grep -qE "Owner|User Access Administrator"; then
            echo "✅ Permission Verified: Identity has sufficient privileges to manage Role Assignments."
          else
            echo "⚠️  WARNING: 'Owner' or 'User Access Administrator' role NOT found on Resource Group '$RG_NAME'."
            echo "⚠️  Checking Subscription level permissions..."
            SUB_ROLES=$(az role assignment list --assignee "$CLIENT_ID" --scope "/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}" --query "[].roleDefinitionName" -o tsv 2>/dev/null || echo "")
            echo "Subscription Roles: $SUB_ROLES"
            
            if echo "$SUB_ROLES" | grep -qE "Owner|User Access Administrator"; then
               echo "✅ Permission Verified (Inherited from Subscription)."
            else
               echo "❌ CRITICAL ERROR: Identidade do Pipeline NÃO tem permissão para gerenciar acessos."
               echo "❌ O Terraform falhará ao tentar criar 'Role Assignments' (Erro 403)."
               echo ""
               echo "AÇÃO MANUAL NECESSÁRIA:"
               echo "1. Vá no Azure Portal > Resource Group ($RG_NAME)"
               echo "2. IAM > Add Role Assignment"
               echo "3. Role: 'User Access Administrator'"
               echo "4. Assignee: Managed Identity ($CLIENT_ID)"
               echo ""
               echo "⚠️  BYPASS ATIVADO: O workflow continuará, mas permissões não serão criadas."
               echo "⚠️  Isso pode causar problemas de acesso ao ACR no futuro."
               # exit 1  <-- Disabled to allow 'Plan B' (Bypass)
            fi
          fi

      - name: Setup Terraform
        uses: ./.github/actions/terraform-setup
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          working_directory: ${{ env.TF_WORKING_DIR }}

      - name: Generate Backend Config
        run: |
          ENV="${{ inputs.environment }}"

          # Use same key format as deploy.yml
          KEY_PREFIX="${{ secrets.TF_BACKEND_KEY_PREFIX || 'poc-deploy' }}"

          cat > backend.hcl <<EOF
          resource_group_name  = "${{ secrets.TF_BACKEND_RESOURCE_GROUP }}"
          storage_account_name = "${{ secrets.TF_BACKEND_STORAGE_ACCOUNT }}"
          container_name       = "${{ secrets.TF_BACKEND_CONTAINER }}"
          key                  = "${KEY_PREFIX}-${ENV}.tfstate"
          use_azuread_auth     = true
          EOF

          echo "Backend Config generated for $ENV"
          cat backend.hcl

      - name: Terraform Init
        run: |
          terraform init -backend-config=backend.hcl

      - name: Select Workspace
        run: |
          ENV="${{ inputs.environment }}"
          echo "Selecting workspace: $ENV"
          terraform workspace select "$ENV" || terraform workspace new "$ENV"

      - name: Import Existing Resources
        run: |
          set -e
          ENV="${{ inputs.environment }}"
          TFVARS="terraform.tfvars.${ENV}"

          echo "=========================================="
          echo "Importing existing Azure resources to Terraform state"
          echo "Environment: $ENV"
          echo "=========================================="
          echo ""

          # Extract values from tfvars
          RG_NAME=$(grep "^resource_group_name" "$TFVARS" | cut -d'"' -f2)
          AKS_NAME=$(grep "^aks_cluster_name" "$TFVARS" | cut -d'"' -f2)

          echo "Target Resources:"
          echo "  Resource Group: $RG_NAME"
          echo "  AKS Cluster: $AKS_NAME"
          echo ""

          # Function to import if resource exists in Azure but not in state
          import_if_needed() {
            local TF_ADDRESS="$1"
            local AZURE_ID="$2"
            local RESOURCE_NAME="$3"
            
            echo "Checking $RESOURCE_NAME..."
            
            if terraform state show "$TF_ADDRESS" >/dev/null 2>&1; then
              echo "  ✅ Already in state"
              return 0
            fi
            
            echo "  ⚠️  Not in state, attempting import..."
            if terraform import -var-file="$TFVARS" "$TF_ADDRESS" "$AZURE_ID" 2>&1 | tee import-temp.log; then
              echo "  ✅ Import successful"
              return 0
            else
              # Check if error is because resource doesn't exist in Azure
              if grep -q "Cannot import non-existent" import-temp.log || \
                 grep -q "does not exist" import-temp.log || \
                 grep -q "was not found" import-temp.log; then
                echo "  ℹ️  Resource doesn't exist in Azure (will be created by Terraform)"
                return 0
              else
                echo "  ❌ Import failed"
                cat import-temp.log
                return 1
              fi
            fi
          }

          # Import Resource Group
          import_if_needed \
            "azurerm_resource_group.aks" \
            "/subscriptions/$ARM_SUBSCRIPTION_ID/resourceGroups/$RG_NAME" \
            "Resource Group"

          # Import AKS Cluster (only if RG exists)
          if az group show -n "$RG_NAME" >/dev/null 2>&1; then
            # Import AKS
            if az aks show -g "$RG_NAME" -n "$AKS_NAME" >/dev/null 2>&1; then
              import_if_needed \
                "azurerm_kubernetes_cluster.aks" \
                "/subscriptions/$ARM_SUBSCRIPTION_ID/resourceGroups/$RG_NAME/providers/Microsoft.ContainerService/managedClusters/$AKS_NAME" \
                "AKS Cluster"
            else
              echo "AKS Cluster doesn't exist in Azure yet"
            fi

            # Import Public IP (Bastion)
            PIP_NAME="bastion-pip-${ENV}"
            if az network public-ip show -g "$RG_NAME" -n "$PIP_NAME" >/dev/null 2>&1; then
              import_if_needed \
                "azurerm_public_ip.bastion" \
                "/subscriptions/$ARM_SUBSCRIPTION_ID/resourceGroups/$RG_NAME/providers/Microsoft.Network/publicIPAddresses/$PIP_NAME" \
                "Bastion Public IP"
            fi

            # Import VNET
            VNET_NAME="sky-aks-vnet-${ENV}"
            if az network vnet show -g "$RG_NAME" -n "$VNET_NAME" >/dev/null 2>&1; then
              import_if_needed \
                "azurerm_virtual_network.aks" \
                "/subscriptions/$ARM_SUBSCRIPTION_ID/resourceGroups/$RG_NAME/providers/Microsoft.Network/virtualNetworks/$VNET_NAME" \
                "AKS VNet"
            fi

            # Import NSG
            NSG_NAME="bastion-nsg-${ENV}"
            if az network nsg show -g "$RG_NAME" -n "$NSG_NAME" >/dev/null 2>&1; then
              import_if_needed \
                "azurerm_network_security_group.bastion" \
                "/subscriptions/$ARM_SUBSCRIPTION_ID/resourceGroups/$RG_NAME/providers/Microsoft.Network/networkSecurityGroups/$NSG_NAME" \
                "Bastion NSG"
            fi

            # Import Subnets (AKS & Bastion)
            if az network vnet subnet show -g "$RG_NAME" --vnet-name "$VNET_NAME" -n "aks-subnet" >/dev/null 2>&1; then
              import_if_needed \
                "azurerm_subnet.aks" \
                "/subscriptions/$ARM_SUBSCRIPTION_ID/resourceGroups/$RG_NAME/providers/Microsoft.Network/virtualNetworks/$VNET_NAME/subnets/aks-subnet" \
                "AKS Subnet"
            fi

            if az network vnet subnet show -g "$RG_NAME" --vnet-name "$VNET_NAME" -n "bastion-subnet" >/dev/null 2>&1; then
              # Bastion subnet import
              import_if_needed \
                "azurerm_subnet.bastion" \
                "/subscriptions/$ARM_SUBSCRIPTION_ID/resourceGroups/$RG_NAME/providers/Microsoft.Network/virtualNetworks/$VNET_NAME/subnets/bastion-subnet" \
                "Bastion Subnet"
              
              # Import Subnet-NSG Association (Import ID is the Subnet ID)
              # Only if NSG also exists
              if az network nsg show -g "$RG_NAME" -n "$NSG_NAME" >/dev/null 2>&1; then
                 # Check if subnet actually has the NSG associated
                 CURRENT_NSG=$(az network vnet subnet show -g "$RG_NAME" --vnet-name "$VNET_NAME" -n "bastion-subnet" --query networkSecurityGroup.id -o tsv || echo "")
                 if [ -n "$CURRENT_NSG" ]; then
                   import_if_needed \
                     "azurerm_subnet_network_security_group_association.bastion" \
                     "/subscriptions/$ARM_SUBSCRIPTION_ID/resourceGroups/$RG_NAME/providers/Microsoft.Network/virtualNetworks/$VNET_NAME/subnets/bastion-subnet" \
                     "Bastion Subnet-NSG Assoc"
                 fi
              fi
            fi

            # Import Network Interface (Bastion)
            NIC_NAME="bastion-nic-${ENV}"
            if az network nic show -g "$RG_NAME" -n "$NIC_NAME" >/dev/null 2>&1; then
              import_if_needed \
                "azurerm_network_interface.bastion" \
                "/subscriptions/$ARM_SUBSCRIPTION_ID/resourceGroups/$RG_NAME/providers/Microsoft.Network/networkInterfaces/$NIC_NAME" \
                "Bastion NIC"
            fi

            # Import Bastion VM
            VM_NAME="bastion-vm-${ENV}"
            if az vm show -g "$RG_NAME" -n "$VM_NAME" >/dev/null 2>&1; then
              import_if_needed \
                "azurerm_linux_virtual_machine.bastion" \
                "/subscriptions/$ARM_SUBSCRIPTION_ID/resourceGroups/$RG_NAME/providers/Microsoft.Compute/virtualMachines/$VM_NAME" \
                "Bastion VM"
            fi

            # Identity Imports (already present above) -> Moving cleanup logic after them
            
            # CLEANUP: Delete Federated Credentials causing conflicts
            # It is easier to delete them and let Terraform recreate than to import dynamic for_each resources
            echo ""
            echo "Cleaning up conflicting Federated Credentials..."
            ID_GH_NAME="id-gh-actions-${ENV}"
            # List all federated credentials and delete if name starts with gh-actions-
            if az identity show -g "$RG_NAME" -n "$ID_GH_NAME" >/dev/null 2>&1; then
               CREDS=$(az identity federated-credential list -g "$RG_NAME" --identity-name "$ID_GH_NAME" --query "[?starts_with(name, 'gh-actions-')].name" -o tsv)
               for CRED in $CREDS; do
                 echo "  🗑️ Deleting Federated Credential: $CRED (will be recreated by Terraform)"
                 az identity federated-credential delete -g "$RG_NAME" --identity-name "$ID_GH_NAME" -n "$CRED" -y
               done
            fi
            echo "✅ Cleanup completed"

            # Import User Assigned Identity (GH Actions)
            ID_GH_NAME="id-gh-actions-${ENV}"
            if az identity show -g "$RG_NAME" -n "$ID_GH_NAME" >/dev/null 2>&1; then
              import_if_needed \
                "azurerm_user_assigned_identity.gh_actions" \
                "/subscriptions/$ARM_SUBSCRIPTION_ID/resourceGroups/$RG_NAME/providers/Microsoft.ManagedIdentity/userAssignedIdentities/$ID_GH_NAME" \
                "GH Actions Identity"
            fi

            # Import User Assigned Identity (ESO)
            ID_ESO_NAME="id-eso-${ENV}"
            if az identity show -g "$RG_NAME" -n "$ID_ESO_NAME" >/dev/null 2>&1; then
              import_if_needed \
                "azurerm_user_assigned_identity.eso" \
                "/subscriptions/$ARM_SUBSCRIPTION_ID/resourceGroups/$RG_NAME/providers/Microsoft.ManagedIdentity/userAssignedIdentities/$ID_ESO_NAME" \
                "ESO Identity"
            fi
          fi

          echo ""
          echo "=========================================="
          echo "Import phase completed"
          echo "=========================================="

      - name: Refresh State
        run: |
          ENV="${{ inputs.environment }}"
          TFVARS="terraform.tfvars.${ENV}"

          echo "Refreshing Terraform state to sync with Azure..."
          # Use refresh to update state without planning changes
          # This avoids "Cannot apply non-applyable plan" errors
          terraform refresh -var-file="$TFVARS"
          echo "✅ State refreshed successfully"

      - name: Show State List
        run: |
          echo "Current resources in Terraform state:"
          terraform state list

      - name: Verify State
        run: |
          echo ""
          echo "=========================================="
          echo "State Verification"
          echo "=========================================="

          # Check if we have any resources
          RESOURCE_COUNT=$(terraform state list | wc -l)
          echo "Total resources in state: $RESOURCE_COUNT"

          if [ "$RESOURCE_COUNT" -eq 0 ]; then
            echo "⚠️  WARNING: State is empty. This might be expected for a new environment."
          else
            echo "✅ State contains resources"
          fi

          # Try to get outputs (will fail if infrastructure doesn't exist yet)
          echo ""
          echo "Attempting to retrieve outputs..."
          if terraform output >/dev/null 2>&1; then
            terraform output
          else
            echo "ℹ️  No outputs available yet (infrastructure may not be fully deployed)"
          fi
