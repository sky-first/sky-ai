---
name: Reusable Build & Deploy to AKS

on:
  workflow_call:
    inputs:
      app_name:
        required: true
        type: string
      dockerfile_path:
        required: false
        type: string
        default: "./Dockerfile"
      acr_name:
        required: true
        type: string
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true

permissions:
  id-token: write
  contents: read
  security-events: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Azure Login (OIDC)
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name ${{ inputs.acr_name }}

      - name: Scan Filesystem (Shift-Left)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ${{ inputs.dockerfile_path }}
          push: true
          tags: |
            ${{ inputs.acr_name }}.azurecr.io/${{ inputs.app_name }}:${{ github.sha }}
            ${{ inputs.acr_name }}.azurecr.io/${{ inputs.app_name }}:latest

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.1.1

      - name: Sign Image
        run: |
          cosign sign --yes --key azurekms://... \
            ${{ env.ACR_LOGIN_SERVER }}/${{ inputs.app_name }}:${{ github.sha }}
        # Note: Setting up Key Vault for Cosign KMS is an extra step.
        # For now, we will skip the actual signing command or use ephemeral keys (OIDC mode)
        # but keep the structure.
        if: false

      - name: Cache Trivy DB
        uses: actions/cache@v3
        with:
          path: .trivy
          key: ${{ runner.os }}-trivy-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-trivy-

      - name: Scan Image (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ inputs.acr_name }}.azurecr.io/${{ inputs.app_name }}:${{ github.sha }}"
          format: "sarif"
          output: "trivy-results.sarif"
          cache-dir: .trivy
          exit-code: "1" # Fail build if vulnerabilities are found
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        if: always() # Ensure report is uploaded even if scan fails
        with:
          sarif_file: "trivy-results.sarif"
