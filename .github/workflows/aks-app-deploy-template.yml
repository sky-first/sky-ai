---
name: Reusable Build & Deploy to AKS

on:
  workflow_call:
    inputs:
      app_name:
        required: true
        type: string
      dockerfile_path:
        required: false
        type: string
        default: "./Dockerfile"
      acr_name:
        required: true
        type: string
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Azure Login (OIDC)
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name ${{ inputs.acr_name }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ${{ inputs.dockerfile_path }}
          push: true
          tags: |
            ${{ inputs.acr_name }}.azurecr.io/${{ inputs.app_name }}:${{ github.sha }}
            ${{ inputs.acr_name }}.azurecr.io/${{ inputs.app_name }}:latest

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.1.1

      - name: Sign Image
        run: |
          cosign sign --yes --key azurekms://... \
            ${{ env.ACR_LOGIN_SERVER }}/${{ inputs.app_name }}:${{ github.sha }}
        # Note: Setting up Key Vault for Cosign KMS is an extra step.
        # For now, we will skip the actual signing command or use ephemeral keys (OIDC mode)
        # but keep the structure.
        if: false

      - name: Scan Image (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.ACR_LOGIN_SERVER }}/${{ inputs.app_name }}:${{ github.sha }}"
          format: "table"
          exit-code: "0" # Don't fail build yet, just report
          ignore-unfixed: true
