---
name: SonarQube Analysis

on:
  push:
    branches: [ staging, main ]
    paths-ignore:
      # Ignora commits automáticos do app-release.yml (update de image tag)
      # O ArgoCD cuida do rollout - SonarQube não precisa rodar para isso
      - "gitops/charts/**/values-*.yaml"
      - "gitops/bootstrap/**"
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarqube:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.fork == false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

      - name: SonarScan
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        continue-on-error: true # Prevents failure if SONAR_TOKEN is invalid or project not created
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
