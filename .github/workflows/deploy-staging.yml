name: Deploy AI Service to AKS (Staging)

on:
  push:
    branches:
      - staging
  workflow_dispatch:

concurrency:
  group: deploy-ai-staging
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: skyacrstagingj3minh
  IMAGE_NAME: sky-poc-ai
  CLUSTER_NAME: sky-aks-staging
  RESOURCE_GROUP: sky-aks-staging-rg

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and Push
        run: |
          az acr login --name $ACR_NAME

          # Gera tags compativeis com o ArgoCD Image Updater (^sha-.*)
          docker build \
            -t $ACR_NAME.azurecr.io/$IMAGE_NAME:sha-${{ github.sha }} \
            -t $ACR_NAME.azurecr.io/$IMAGE_NAME:staging .

          docker push $ACR_NAME.azurecr.io/$IMAGE_NAME:sha-${{ github.sha }}
          docker push $ACR_NAME.azurecr.io/$IMAGE_NAME:staging