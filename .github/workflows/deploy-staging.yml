name: Deploy AI Service to AKS (Staging)

on:
  push:
    branches:
      - staging
  workflow_dispatch:
    inputs:
      reason:
        description: "Motivo do deploy manual"
        required: false
        default: "Manutenção/Correção"

# Evita conflitos de deploys simultâneos
concurrency:
  group: deploy-ai-staging
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: skyacrstagingj3minh
  IMAGE_NAME: sky-poc-ai
  CLUSTER_NAME: sky-aks-staging
  RESOURCE_GROUP: sky-aks-staging-rg

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Secrets
        run: |
          echo "🔐 Verificando credenciais OIDC..."
          if [ -z "${{ secrets.AZURE_CLIENT_ID }}" ] || [ -z "${{ secrets.AZURE_TENANT_ID }}" ] || [ -z "${{ secrets.AZURE_SUBSCRIPTION_ID }}" ]; then
            echo "❌ ERRO: Secrets de autenticação Azure (OIDC) não encontrados no repositório de AI!"
            exit 1
          fi

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and Push to ACR
        run: |
          az acr login --name $ACR_NAME
          docker build \
            --cache-from $ACR_NAME.azurecr.io/$IMAGE_NAME:staging \
            -t $ACR_NAME.azurecr.io/$IMAGE_NAME:staging .
          docker push $ACR_NAME.azurecr.io/$IMAGE_NAME:staging

