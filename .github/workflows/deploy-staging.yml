name: Deploy AI Service to AKS (Staging)

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: skyacrstagingj3minh
  IMAGE_NAME: sky-poc-ai

jobs:
  deploy:
    name: Build & Push (Staging)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (Federated Identity)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:staging
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger GitOps Deploy (Infrastructure Repo)
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.GITOPS_PUSH_TOKEN }}
          repository: sky-first/sky-poc-infra
          event-type: deploy-trigger
          client-payload: |
            {
              "app_name": "ai",
              "env": "staging",
              "image_tag": "sha-${{ github.sha }}"
            }

      - name: Open Issue on Deploy Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha.slice(0, 7);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `[deploy-staging] AI staging build failed at ${sha}`;
            const body = [
              `Workflow **Deploy AI Service to AKS (Staging)** failed on commit \`${context.sha}\`.`,
              ``,
              `- Run: ${runUrl}`,
              `- Branch: \`${context.ref}\``,
              `- Author: @${context.actor}`,
              ``,
              `Until this is fixed, **no new image will reach the staging cluster** — the pod keeps serving the last successful build. Treat as priority.`,
            ].join("\n");
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ["deploy-failure", "staging"],
            });