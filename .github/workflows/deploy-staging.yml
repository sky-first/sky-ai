name: Deploy AI Service to AKS (Staging)

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  issues: write   # required for the Open Issue on Deploy Failure step

env:
  ACR_NAME: skyacrstagingj3minh
  IMAGE_NAME: sky-poc-ai
  # AWS staging ECR — pushed alongside ACR during the Azure→AWS
  # transition. argocd-image-updater on the AWS cluster watches the
  # ECR `^sha-.*` tag and bumps values-sky-ai-stg-aws.yaml on commit.
  # Once Azure is decommissioned, drop the ACR steps.
  ECR_REGISTRY: 741375879811.dkr.ecr.eu-west-1.amazonaws.com
  ECR_REPO: sky-ai
  AWS_REGION: eu-west-1

jobs:
  deploy:
    name: Build & Push (Staging)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (Federated Identity)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      # AWS auth via GitHub OIDC. The role sky-gha-sky-ai is defined in
      # sky-poc-infra/infra/aws/_registry/github-oidc.tf — its trust
      # policy admits any branch in sky-first/sky-ai (StringLike on
      # `repo:sky-first/sky-ai:*`) and grants ECR push scoped to the
      # sky-ai repository.
      - name: AWS Login (GitHub OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::741375879811:role/sky-gha-sky-ai
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Single build, four tags. Both registries get the mutable
      # `staging` (sanity reference for humans) and the immutable
      # `sha-<commit>` tag. argocd-image-updater on AWS only matches
      # `^sha-.*`, so it ignores the `staging` digest churn.
      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:staging
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:staging
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Open Issue on Deploy Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha.slice(0, 7);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `[deploy-staging] AI staging build failed at ${sha}`;
            const body = [
              `Workflow **Deploy AI Service to AKS (Staging)** failed on commit \`${context.sha}\`.`,
              ``,
              `- Run: ${runUrl}`,
              `- Branch: \`${context.ref}\``,
              `- Author: @${context.actor}`,
              ``,
              `Until this is fixed, **no new image will reach the staging cluster** — the pod keeps serving the last successful build. Treat as priority.`,
            ].join("\n");
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ["deploy-failure", "staging"],
            });