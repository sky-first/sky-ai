name: Deploy Infrastructure

permissions:
  contents: read
  id-token: write

on:
  push:
    branches: [staging, main]
  repository_dispatch:
    types: [deploy-trigger]
  workflow_dispatch:
    inputs:
      environment:
        description: "Ambiente para deploy"
        required: true
        type: choice
        options:
          - staging
          - prod
          - poc-sky
      allow_destroy:
        description: "Permitir mudanças destrutivas"
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-${{ github.ref_name }}-${{ github.event.inputs.environment || 'auto' }}
  cancel-in-progress: false

env:
  TERRAFORM_VERSION: "1.9.0"
  TF_WORKING_DIR: "infra/azure"

jobs:
  detect-environment:
    name: Detect Environment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      environment: ${{ steps.detect.outputs.env }}
      tfvars_file: ${{ steps.detect.outputs.tfvars_file }}
      workspace: ${{ steps.detect.outputs.workspace }}
      branch: ${{ steps.detect.outputs.branch }}
      allow_destroy: ${{ steps.detect.outputs.allow_destroy }}
    steps:
      - name: Validate Required Secrets
        id: validate-secrets
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          TF_BACKEND_RESOURCE_GROUP: ${{ secrets.TF_BACKEND_RESOURCE_GROUP }}
          TF_BACKEND_STORAGE_ACCOUNT: ${{ secrets.TF_BACKEND_STORAGE_ACCOUNT }}
          TF_BACKEND_CONTAINER: ${{ secrets.TF_BACKEND_CONTAINER }}
          TF_BACKEND_KEY_PREFIX: ${{ secrets.TF_BACKEND_KEY_PREFIX }}
          KEYVAULT_NAME: ${{ secrets.KEYVAULT_NAME }}
        run: |
          set -euo pipefail
          echo "Validando secrets obrigatórios do GitHub..."

          REQUIRED_SECRETS=(
            "AZURE_SUBSCRIPTION_ID"
            "AZURE_TENANT_ID"
            "AZURE_CLIENT_ID"
            "TF_BACKEND_RESOURCE_GROUP"
            "TF_BACKEND_STORAGE_ACCOUNT"
            "TF_BACKEND_CONTAINER"
            "TF_BACKEND_KEY_PREFIX"
          )

          MISSING_SECRETS=()
          for secret in "${REQUIRED_SECRETS[@]}"; do
            # Verificar se secret está definido (usando variável de ambiente)
            if [ -z "${!secret:-}" ]; then
              MISSING_SECRETS+=("$secret")
            fi
          done

          if [ ${#MISSING_SECRETS[@]} -gt 0 ]; then
            echo "ERRO: Secrets obrigatórios não configurados no GitHub:"
            printf '  - %s\n' "${MISSING_SECRETS[@]}"
            echo ""
            echo "Configure os secrets no GitHub:"
            echo "  Settings > Secrets and variables > Actions > New repository secret"
            echo ""
            echo "Secrets obrigatórios:"
            echo "  - AZURE_SUBSCRIPTION_ID: ID da subscription Azure"
            echo "  - AZURE_TENANT_ID: ID do tenant Azure AD"
            echo "  - AZURE_CLIENT_ID: Client ID da App Registration (OIDC)"
            echo "  - TF_BACKEND_RESOURCE_GROUP: Resource Group do Storage Account"
            echo "  - TF_BACKEND_STORAGE_ACCOUNT: Nome do Storage Account"
            echo "  - TF_BACKEND_CONTAINER: Nome do container (ex: tfstate)"
            echo "  - TF_BACKEND_KEY_PREFIX: Prefixo da chave do state (ex: poc-deploy)"
            exit 1
          fi

          echo "OK: Todos os secrets obrigatórios estão configurados"
          echo ""
          echo "Secrets opcionais (Key Vault):"
          if [ -n "${KEYVAULT_NAME:-}" ]; then
            echo "  OK: KEYVAULT_NAME configurado"
          else
            echo "  WARNING: KEYVAULT_NAME não configurado (opcional)"
          fi

      - name: Detect Environment from Branch
        id: detect
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENV="${{ github.event.inputs.environment }}"
            ALLOW_DESTROY="${{ github.event.inputs.allow_destroy }}"
            BRANCH="manual"
          elif [[ "${{ github.event_name }}" == "repository_dispatch" ]]; then
            echo "Trigger via repository_dispatch detected"
            ENV="${{ github.event.client_payload.environment }}"
            BRANCH="${{ github.event.client_payload.branch }}"
            ALLOW_DESTROY="false"
            
            # Set default branch if not provided
            if [[ -z "$BRANCH" ]] || [[ "$BRANCH" == "null" ]]; then
              if [[ "$ENV" == "prod" ]]; then
                BRANCH="main"
              else
                BRANCH="staging"
              fi
            fi
            
            echo "Payload Environment: $ENV"
            echo "Payload Branch: $BRANCH"
            
            if [[ -z "$ENV" ]] || [[ "$ENV" == "null" ]]; then
              echo "ERRO: environment não fornecido no payload"
              exit 1
            fi
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            # Push direto na branch staging ou main
            BRANCH_REF="${{ github.ref_name }}"
            if [[ "${BRANCH_REF}" == "staging" ]]; then
              ENV="staging"
            elif [[ "${BRANCH_REF}" == "main" ]]; then
              ENV="prod"
            else
              echo "Branch não mapeada para deploy: ${BRANCH_REF}"
              exit 1
            fi
            ALLOW_DESTROY="false"
            BRANCH="${BRANCH_REF}"
          else
            echo "Evento não suportado: ${{ github.event_name }}"
            exit 1
          fi

          echo "env=${ENV}" >> $GITHUB_OUTPUT
          echo "tfvars_file=terraform.tfvars.${ENV}" >> $GITHUB_OUTPUT
          echo "workspace=${ENV}" >> $GITHUB_OUTPUT
          echo "branch=${BRANCH}" >> $GITHUB_OUTPUT
          echo "allow_destroy=${ALLOW_DESTROY}" >> $GITHUB_OUTPUT

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: detect-environment
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    env:
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_USE_OIDC: true
      TF_BACKEND_RESOURCE_GROUP: ${{ secrets.TF_BACKEND_RESOURCE_GROUP }}
      TF_BACKEND_STORAGE_ACCOUNT: ${{ secrets.TF_BACKEND_STORAGE_ACCOUNT }}
      TF_BACKEND_CONTAINER: ${{ secrets.TF_BACKEND_CONTAINER }}
      TF_BACKEND_KEY_PREFIX: ${{ secrets.TF_BACKEND_KEY_PREFIX }}
      SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup Terraform
        uses: ./.github/actions/terraform-setup
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          working_directory: ${{ env.TF_WORKING_DIR }}

      - name: Azure Authentication
        uses: ./.github/actions/azure-auth
        with:
          subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          client_id: ${{ secrets.AZURE_CLIENT_ID }}

      - name: Write backend config
        run: |
          ENV="${{ needs.detect-environment.outputs.environment }}"
          cat > backend.hcl <<EOF
          resource_group_name  = "${TF_BACKEND_RESOURCE_GROUP}"
          storage_account_name = "${TF_BACKEND_STORAGE_ACCOUNT}"
          container_name       = "${TF_BACKEND_CONTAINER}"
          key                  = "${TF_BACKEND_KEY_PREFIX:-poc-deploy}-${ENV}.tfstate"
          use_azuread_auth     = true
          EOF

      - name: Validate Terraform Backend
        run: |
          set -euo pipefail
          echo "Validando configuração do backend Terraform..."

          # Verificar se Storage Account existe
          echo "Verificando Storage Account: ${TF_BACKEND_STORAGE_ACCOUNT}"
          if ! az storage account show \
            --name "${TF_BACKEND_STORAGE_ACCOUNT}" \
            --resource-group "${TF_BACKEND_RESOURCE_GROUP}" \
            --query id -o tsv > /dev/null 2>&1; then
            echo "ERRO: Storage Account não encontrado: ${TF_BACKEND_STORAGE_ACCOUNT}"
            echo "Resource Group: ${TF_BACKEND_RESOURCE_GROUP}"
            echo ""
            echo "Crie o Storage Account ou verifique o nome:"
            echo "  az storage account create \\"
            echo "    --name ${TF_BACKEND_STORAGE_ACCOUNT} \\"
            echo "    --resource-group ${TF_BACKEND_RESOURCE_GROUP} \\"
            echo "    --location eastus \\"
            echo "    --sku Standard_LRS"
            exit 1
          fi
          echo "OK: Storage Account encontrado"

          # Verificar se Container existe
          echo "Verificando Container: ${TF_BACKEND_CONTAINER}"
          if ! az storage container show \
            --name "${TF_BACKEND_CONTAINER}" \
            --account-name "${TF_BACKEND_STORAGE_ACCOUNT}" \
            --auth-mode login \
            --query name -o tsv > /dev/null 2>&1; then
            echo "WARNING: Container não encontrado, criando..."
            if ! az storage container create \
              --name "${TF_BACKEND_CONTAINER}" \
              --account-name "${TF_BACKEND_STORAGE_ACCOUNT}" \
              --auth-mode login \
              --public-access off > /dev/null 2>&1; then
              echo "ERRO: Falha ao criar container"
              echo "Verifique permissões da App Registration no Storage Account"
              exit 1
            fi
            echo "OK: Container criado com sucesso"
          else
            echo "OK: Container encontrado"
          fi

          # Verificar permissões de escrita
          echo "Verificando permissões de escrita..."
          TEST_BLOB="terraform-test-$(date +%s).txt"
          if ! echo "test" | az storage blob upload \
            --account-name "${TF_BACKEND_STORAGE_ACCOUNT}" \
            --container-name "${TF_BACKEND_CONTAINER}" \
            --name "$TEST_BLOB" \
            --auth-mode login \
            --content-type text/plain \
            --data @- > /dev/null 2>&1; then
            echo "ERRO: Sem permissão para escrever no container"
            echo "Conceda permissão 'Storage Blob Data Contributor' para a App Registration"
            exit 1
          fi

          # Limpar blob de teste
          az storage blob delete \
            --account-name "${TF_BACKEND_STORAGE_ACCOUNT}" \
            --container-name "${TF_BACKEND_CONTAINER}" \
            --name "$TEST_BLOB" \
            --auth-mode login > /dev/null 2>&1 || true

          echo "OK: Backend Terraform validado com sucesso"

      - name: Check Terraform State Lock
        run: |
          set -euo pipefail
          echo "Verificando lock do Terraform state..."

          # Verificar se há lock preso no backend
          LOCK_INFO=$(az storage blob show \
            --account-name "${TF_BACKEND_STORAGE_ACCOUNT}" \
            --container-name "${TF_BACKEND_CONTAINER}" \
            --name ".terraform.tfstate.lock.info" \
            --auth-mode login \
            --query "properties.lastModified" -o tsv 2>/dev/null || echo "")

          if [ -n "$LOCK_INFO" ]; then
            # Tentar calcular idade do lock (pode falhar em alguns sistemas)
            LOCK_AGE=$(($(date +%s) - $(date -d "$LOCK_INFO" +%s 2>/dev/null || echo 0)))
            # Se lock tem mais de 10 minutos, considerar preso (reduzido de 1 hora)
            # Locks de workflows que falharam geralmente ficam presos
            if [ "$LOCK_AGE" -gt 600 ] 2>/dev/null; then
              echo "WARNING: Lock preso detectado (idade: ${LOCK_AGE}s, mais de 10 minutos)"
              echo "Removendo lock preso..."
              az storage blob delete \
                --account-name "${TF_BACKEND_STORAGE_ACCOUNT}" \
                --container-name "${TF_BACKEND_CONTAINER}" \
                --name ".terraform.tfstate.lock.info" \
                --auth-mode login \
                --output none 2>/dev/null || echo "Não foi possível remover lock"
              echo "✅ Lock removido"
            else
              echo "INFO: Lock ativo detectado (idade: ${LOCK_AGE}s) - pode ser de outro workflow em execução"
              echo "Se o lock persistir e bloquear este workflow, ele será removido antes do plan"
            fi
          else
            echo "OK: Nenhum lock detectado"
          fi

      - name: Terraform Init
        run: |
          set -euo pipefail

          # Tentar init normal primeiro
          if terraform init -input=false -upgrade -backend-config=backend.hcl 2>&1; then
            echo "✅ Terraform init concluído com sucesso"
          else
            # Se falhou por mudança de backend, tentar migrar estado com resposta automática
            echo "⚠️  Mudança no backend detectada, tentando migrar estado..."
            # Usar echo "yes" para responder automaticamente à pergunta de migração
            if echo "yes" | terraform init -input=false -upgrade -migrate-state -backend-config=backend.hcl 2>&1; then
              echo "✅ Estado migrado com sucesso"
            else
              # Se migração falhar, criar workspace primeiro (se necessário) e depois reconfigurar
              echo "⚠️  Migração falhou, criando workspace se necessário e forçando reconfiguração..."
              WORKSPACE="${{ needs.detect-environment.outputs.workspace }}"
              # Criar workspace antes do reconfigure (se não existir)
              terraform workspace select "$WORKSPACE" 2>/dev/null || terraform workspace new "$WORKSPACE" 2>/dev/null || true
              # Forçar reconfiguração do backend
              terraform init -input=false -upgrade -reconfigure -backend-config=backend.hcl
              echo "✅ Backend reconfigurado"
            fi
          fi

      - name: Validate Terraform Workspace
        run: |
          set -euo pipefail
          WORKSPACE="${{ needs.detect-environment.outputs.workspace }}"

          echo "Validando workspace Terraform: $WORKSPACE"

          # Listar workspaces disponíveis
          WORKSPACES=$(terraform workspace list 2>/dev/null || echo "")

          # Verificar se há workspaces corrompidos
          if echo "$WORKSPACES" | grep -q "error\|corrupt\|fatal"; then
            echo "ERRO: Workspace em estado inválido detectado"
            echo "Workspaces:"
            echo "$WORKSPACES"
            echo ""
            echo "Execute manualmente:"
            echo "  terraform workspace select $WORKSPACE"
            echo "  terraform workspace delete <workspace-corrompido>"
            exit 1
          fi

          # Verificar se workspace existe
          if echo "$WORKSPACES" | grep -qE "^\s*\*\s+${WORKSPACE}$|^\s+${WORKSPACE}$"; then
            echo "OK: Workspace $WORKSPACE existe"
          else
            echo "INFO: Workspace $WORKSPACE não existe, será criado no próximo step"
          fi

      - name: Select/Create Workspace
        run: |
          terraform workspace select ${{ needs.detect-environment.outputs.workspace }} || \
          terraform workspace new ${{ needs.detect-environment.outputs.workspace }}

      - name: Sync Existing Resources with Terraform State
        run: |
          set -euo pipefail
          echo "=== Sincronizando recursos existentes com estado do Terraform ==="

          # Verificar se jq está disponível (necessário para parsing JSON)
          if ! command -v jq >/dev/null 2>&1; then
            echo "Instalando jq..."
            sudo apt-get update -qq && sudo apt-get install -y jq > /dev/null 2>&1 || {
              echo "WARNING: Não foi possível instalar jq, continuando sem refresh automático"
            }
          fi

          TFVARS_FILE="${{ needs.detect-environment.outputs.tfvars_file }}"
          SUBSCRIPTION_ID="${ARM_SUBSCRIPTION_ID}"

          # Validar se arquivo tfvars existe
          if [ ! -f "$TFVARS_FILE" ]; then
            echo "WARNING: Arquivo tfvars não encontrado: $TFVARS_FILE"
            echo "Pulando sincronização de recursos existentes"
            exit 0
          fi

          # Função helper para extrair variáveis do tfvars de forma robusta
          extract_var() {
            local var_name="$1"
            local value=$(grep "^${var_name}" "$TFVARS_FILE" | head -1 | \
              sed 's/.*= *"\([^"]*\)".*/\1/' | \
              sed "s/.*= *'\([^']*\)'.*/\1/" | \
              sed 's/^[[:space:]]*//;s/[[:space:]]*$//' || echo "")
            echo "$value"
          }

          # Extrair variáveis obrigatórias do arquivo tfvars
          ENVIRONMENT=$(extract_var "environment")
          RESOURCE_GROUP_NAME=$(extract_var "resource_group_name")
          VM_NAME=$(extract_var "vm_name")
          ENABLE_BASTION_RAW=$(extract_var "enable_bastion")
          NIC_NAME_OVERRIDE=$(extract_var "nic_name_override")

          # Normalizar bool (true/false) - default true se vazio
          ENABLE_BASTION="true"
          if [ -n "$ENABLE_BASTION_RAW" ]; then
            case "$(echo "$ENABLE_BASTION_RAW" | tr '[:upper:]' '[:lower:]')" in
              true|1|yes) ENABLE_BASTION="true" ;;
              false|0|no) ENABLE_BASTION="false" ;;
              *) ENABLE_BASTION="true" ;;
            esac
          fi

          # Validar variáveis obrigatórias
          if [ -z "$RESOURCE_GROUP_NAME" ]; then
            echo "WARNING: Não foi possível obter resource_group_name do tfvars"
            echo "Pulando sincronização de recursos existentes"
            exit 0
          fi

          echo "Variáveis extraídas do tfvars:"
          echo "  - environment: ${ENVIRONMENT:-<não definido>}"
          echo "  - resource_group_name: ${RESOURCE_GROUP_NAME}"
          echo "  - vm_name: ${VM_NAME:-<não definido>}"
          echo "  - enable_bastion: ${ENABLE_BASTION}"
          echo "  - nic_name_override: ${NIC_NAME_OVERRIDE:-<vazio>}"
          echo ""

          RESOURCE_ID="/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${RESOURCE_GROUP_NAME}"

          # Verificar se Resource Group existe no Azure
          if ! az group show --name "$RESOURCE_GROUP_NAME" --query id -o tsv > /dev/null 2>&1; then
            echo "Resource Group não existe no Azure, será criado pelo Terraform"
            exit 0
          fi

          echo "Resource Group existe no Azure: $RESOURCE_GROUP_NAME"

          # Verificar se já está no estado do Terraform
          if terraform state show azurerm_resource_group.main > /dev/null 2>&1; then
            echo "✅ Resource Group já está no estado do Terraform"
            echo "Executando refresh para sincronizar estado com Azure..."
            
            # Refresh-only: atualiza estado sem fazer mudanças
            set +e
            terraform plan \
              -var-file="$TFVARS_FILE" \
              -var="subscription_id=${SUBSCRIPTION_ID}" \
              -refresh-only \
              -no-color \
              -out=tfplan-refresh 2>&1 | tee refresh-output.txt
            REFRESH_EXIT_CODE=$?
            set -e
            
            if [ $REFRESH_EXIT_CODE -eq 0 ]; then
              # Verificar se há mudanças no estado para aplicar
              if command -v jq >/dev/null 2>&1; then
                if terraform show -json tfplan-refresh 2>/dev/null | \
                  jq -e '.resource_changes[]? | select(.change.actions[]? == "update")' > /dev/null 2>&1; then
                  echo "Aplicando refresh do estado..."
                  terraform apply -refresh-only -auto-approve tfplan-refresh || true
                  echo "✅ Estado sincronizado com Azure"
                else
                  echo "✅ Estado já está sincronizado"
                fi
              else
                # Se jq não estiver disponível, aplicar refresh de qualquer forma (seguro)
                echo "Aplicando refresh do estado (jq não disponível, aplicando preventivamente)..."
                terraform apply -refresh-only -auto-approve tfplan-refresh || true
                echo "✅ Estado sincronizado com Azure"
              fi
              rm -f tfplan-refresh refresh-output.txt || true
            else
              echo "WARNING: Refresh falhou, mas continuando..."
            fi
          else
            echo "Resource Group não está no estado do Terraform, importando..."
            
            # Verificar workspace atual antes de importar
            CURRENT_WORKSPACE=$(terraform workspace show)
            EXPECTED_WORKSPACE="${{ needs.detect-environment.outputs.workspace }}"
            echo "Workspace atual: $CURRENT_WORKSPACE"
            echo "Workspace esperado: $EXPECTED_WORKSPACE"
            
            if [ "$CURRENT_WORKSPACE" != "$EXPECTED_WORKSPACE" ]; then
              echo "ERRO: Workspace incorreto! Esperado: $EXPECTED_WORKSPACE, Atual: $CURRENT_WORKSPACE"
              echo "Selecionando workspace correto..."
              terraform workspace select "$EXPECTED_WORKSPACE" || terraform workspace new "$EXPECTED_WORKSPACE"
              CURRENT_WORKSPACE=$(terraform workspace show)
              if [ "$CURRENT_WORKSPACE" != "$EXPECTED_WORKSPACE" ]; then
                echo "ERRO: Falha ao selecionar workspace correto"
                exit 1
              fi
              echo "✅ Workspace correto selecionado: $CURRENT_WORKSPACE"
            fi
            
            # Construir lista de argumentos -var dinamicamente
            # Usar array bash para garantir que todas as variáveis sejam passadas corretamente
            VAR_ARGS=(-var-file="$TFVARS_FILE" -var="subscription_id=${SUBSCRIPTION_ID}")
            
            if [ -n "$ENVIRONMENT" ]; then
              VAR_ARGS+=(-var="environment=${ENVIRONMENT}")
            fi
            if [ -n "$RESOURCE_GROUP_NAME" ]; then
              VAR_ARGS+=(-var="resource_group_name=${RESOURCE_GROUP_NAME}")
            fi
            if [ -n "$VM_NAME" ]; then
              VAR_ARGS+=(-var="vm_name=${VM_NAME}")
            fi
            # Garantir consistência do enable_bastion (evita count mismatch na importação)
            if [ -n "$ENABLE_BASTION" ]; then
              VAR_ARGS+=(-var="enable_bastion=${ENABLE_BASTION}")
            fi
            
            echo "Executando terraform import com variáveis explícitas..."
            echo "Variáveis: ${VAR_ARGS[*]}"
            echo "Comando: terraform import ${VAR_ARGS[*]} azurerm_resource_group.main \"$RESOURCE_ID\""
            
            # Tentar importar - CRÍTICO: se falhar, o workflow deve falhar
            terraform import \
              "${VAR_ARGS[@]}" \
              azurerm_resource_group.main "$RESOURCE_ID" 2>&1 | tee import-output.txt
            IMPORT_EXIT_CODE=${PIPESTATUS[0]}
            
            if [ $IMPORT_EXIT_CODE -eq 0 ]; then
              echo "✅ Resource Group importado com sucesso"
              
              # Verificar se realmente está no estado após import (local)
              if terraform state show azurerm_resource_group.main > /dev/null 2>&1; then
                echo "✅ Confirmado: Resource Group está no estado local do Terraform"
              else
                echo "ERRO: Import reportou sucesso, mas Resource Group não está no estado"
                echo "Isso indica um problema crítico com o estado do Terraform"
                exit 1
              fi
              
              # CRÍTICO: O Terraform salva automaticamente no backend remoto após import
              # Mas vamos garantir que o estado foi salvo fazendo uma operação que force
              # o Terraform a interagir com o backend
              echo "Garantindo que estado foi salvo no backend remoto..."
              
              # Fazer um state list para forçar Terraform a ler do backend
              # Isso garante que estamos verificando o estado remoto, não local
              echo "Listando recursos no estado (força leitura do backend)..."
              terraform state list > /dev/null 2>&1 || {
                echo "WARNING: Não foi possível listar estado (pode ser normal)"
              }
              
              # Verificar novamente - agora deve estar sincronizado com backend
              echo "Verificando estado após garantir sincronização..."
              STATE_CHECK_COUNT=0
              MAX_CHECKS=3
              
              while [ $STATE_CHECK_COUNT -lt $MAX_CHECKS ]; do
                if terraform state show azurerm_resource_group.main > /dev/null 2>&1; then
                  echo "✅ Resource Group confirmado no estado (tentativa $((STATE_CHECK_COUNT + 1)))"
                  break
                else
                  STATE_CHECK_COUNT=$((STATE_CHECK_COUNT + 1))
                  if [ $STATE_CHECK_COUNT -lt $MAX_CHECKS ]; then
                    echo "Aguardando sincronização do backend... (tentativa $STATE_CHECK_COUNT/$MAX_CHECKS)"
                    sleep 2
                    # Forçar nova leitura do backend
                    terraform state list > /dev/null 2>&1 || true
                  fi
                fi
              done
              
              # Verificação final
              if terraform state show azurerm_resource_group.main > /dev/null 2>&1; then
                echo "✅ Resource Group confirmado no estado após sincronização"
                
                # Listar recursos no estado para debug
                echo "Recursos no estado:"
                terraform state list | head -10 || echo "  (não foi possível listar)"
              else
                echo "ERRO: Resource Group não está no estado após $MAX_CHECKS tentativas"
                echo "Isso indica problema com backend remoto ou sincronização"
                echo ""
                echo "Debug:"
                echo "  Workspace: $(terraform workspace show)"
                echo "  Estado completo:"
                terraform state list || echo "  (não foi possível listar)"
                exit 1
              fi
              
              # Após import bem-sucedido, fazer refresh para garantir sincronização completa
              echo "Executando refresh após importação..."
              terraform plan \
                -var-file="$TFVARS_FILE" \
                -var="subscription_id=${SUBSCRIPTION_ID}" \
                -refresh-only \
                -no-color \
                -out=tfplan-refresh 2>&1 | tee refresh-output.txt || true
              
              if command -v jq >/dev/null 2>&1; then
                if terraform show -json tfplan-refresh 2>/dev/null | \
                  jq -e '.resource_changes[]? | select(.change.actions[]? == "update")' > /dev/null 2>&1; then
                  terraform apply -refresh-only -auto-approve tfplan-refresh || true
                fi
              else
                # Se jq não estiver disponível, aplicar refresh de qualquer forma (seguro)
                terraform apply -refresh-only -auto-approve tfplan-refresh || true
              fi
              
              # Verificação final: confirmar que Resource Group está no estado após refresh
              echo "Verificação final após import e refresh..."
              if terraform state show azurerm_resource_group.main > /dev/null 2>&1; then
                echo "✅ CONFIRMADO: Resource Group está no estado após import e refresh"
                echo "Estado foi salvo no backend remoto"
                echo "O plan será gerado corretamente no próximo step"
              else
                echo "ERRO CRÍTICO: Resource Group não está no estado após import e refresh"
                echo "Isso indica um problema grave com o backend do Terraform"
                echo "Verificando estado atual..."
                terraform state list | grep resource_group || echo "Nenhum resource_group encontrado no estado"
                echo ""
                echo "Workspace atual: $(terraform workspace show)"
                echo "Backend configurado:"
                terraform version -json | jq -r '.terraform_backend' 2>/dev/null || echo "  (não foi possível verificar)"
                exit 1
              fi
              
              rm -f tfplan-refresh refresh-output.txt import-output.txt || true
            else
              echo "ERRO: Import falhou (exit code: $IMPORT_EXIT_CODE)"
              echo ""
              echo "Detalhes do erro:"
              cat import-output.txt 2>/dev/null || echo "  (logs não disponíveis)"
              echo ""
              echo "O Resource Group existe no Azure mas não pôde ser importado."
              echo "Isso causará falha no terraform apply quando tentar criar um recurso existente."
              echo ""
              echo "Solução manual:"
              echo "  terraform import -var-file=\"$TFVARS_FILE\" -var=\"subscription_id=${SUBSCRIPTION_ID}\" \\"
              if [ -n "$ENVIRONMENT" ]; then
                echo "    -var=\"environment=${ENVIRONMENT}\" \\"
              fi
              if [ -n "$RESOURCE_GROUP_NAME" ]; then
                echo "    -var=\"resource_group_name=${RESOURCE_GROUP_NAME}\" \\"
              fi
              if [ -n "$VM_NAME" ]; then
                echo "    -var=\"vm_name=${VM_NAME}\" \\"
              fi
              echo "    azurerm_resource_group.main \"$RESOURCE_ID\""
              echo ""
              echo "FALHANDO workflow para evitar erro no terraform apply"
              rm -f import-output.txt || true
              exit 1
            fi
          fi

          # ============================================================
          # Importação adicional: recursos que já existem no Azure mas
          # não estão no state (evita "already exists" no apply)
          # ============================================================
          echo ""
          echo "=== Importando recursos adicionais existentes (network/compute) ==="

          # Helper: checar se address está no state
          state_has() {
            local addr="$1"
            terraform state show "$addr" > /dev/null 2>&1
          }

          # Helper: importar com validação
          import_if_missing() {
            local addr="$1"
            local rid="$2"
            local label="$3"
            if state_has "$addr"; then
              echo "✅ Já no state: $label ($addr)"
              return 0
            fi
            echo "➡️  Importando: $label ($addr)"
            echo "    ID: $rid"
            terraform import "${VAR_ARGS[@]}" "$addr" "$rid" 2>&1 | tee "import-${label// /-}.txt"
            local ec=${PIPESTATUS[0]}
            if [ $ec -ne 0 ]; then
              echo "❌ ERRO: Falha ao importar $label (exit code: $ec)"
              exit 1
            fi
            if state_has "$addr"; then
              echo "✅ Import OK: $label"
            else
              echo "❌ ERRO: Import reportou sucesso mas $addr não está no state"
              exit 1
            fi
          }

          # Garantir VAR_ARGS existe também no caminho onde RG já estava no state
          if [ -z "${VAR_ARGS+x}" ]; then
            VAR_ARGS=(-var-file="$TFVARS_FILE" -var="subscription_id=${SUBSCRIPTION_ID}")
            if [ -n "$ENVIRONMENT" ]; then VAR_ARGS+=(-var="environment=${ENVIRONMENT}"); fi
            if [ -n "$RESOURCE_GROUP_NAME" ]; then VAR_ARGS+=(-var="resource_group_name=${RESOURCE_GROUP_NAME}"); fi
            if [ -n "$VM_NAME" ]; then VAR_ARGS+=(-var="vm_name=${VM_NAME}"); fi
            if [ -n "$ENABLE_BASTION" ]; then VAR_ARGS+=(-var="enable_bastion=${ENABLE_BASTION}"); fi
          fi

          # Nomes padronizados (baseado no Terraform)
          ENV_NAME="${ENVIRONMENT:-${{ needs.detect-environment.outputs.environment }}}"
          VNET_NAME="ai-saas-vnet-${ENV_NAME}"
          SUBNET_NAME="ai-saas-subnet-${ENV_NAME}"
          NSG_NAME="ai-saas-nsg-${ENV_NAME}"
          # Pode ser "legado" via nic_name_override (ex.: staging com NIC criada como ai-saas-nic)
          NIC_NAME="${NIC_NAME_OVERRIDE:-ai-saas-nic-${ENV_NAME}}"
          PIP_NAME="ai-saas-public-ip-${ENV_NAME}"
          BASTION_PIP_NAME="ai-saas-bastion-ip-${ENV_NAME}"
          BASTION_HOST_NAME="ai-saas-bastion-${ENV_NAME}"

          # IDs ARM
          VNET_ID="/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${RESOURCE_GROUP_NAME}/providers/Microsoft.Network/virtualNetworks/${VNET_NAME}"
          SUBNET_ID="/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${RESOURCE_GROUP_NAME}/providers/Microsoft.Network/virtualNetworks/${VNET_NAME}/subnets/${SUBNET_NAME}"
          BASTION_SUBNET_ID="/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${RESOURCE_GROUP_NAME}/providers/Microsoft.Network/virtualNetworks/${VNET_NAME}/subnets/AzureBastionSubnet"
          NSG_ID="/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${RESOURCE_GROUP_NAME}/providers/Microsoft.Network/networkSecurityGroups/${NSG_NAME}"
          NIC_ID="/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${RESOURCE_GROUP_NAME}/providers/Microsoft.Network/networkInterfaces/${NIC_NAME}"
          PIP_ID="/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${RESOURCE_GROUP_NAME}/providers/Microsoft.Network/publicIPAddresses/${PIP_NAME}"
          BASTION_PIP_ID="/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${RESOURCE_GROUP_NAME}/providers/Microsoft.Network/publicIPAddresses/${BASTION_PIP_NAME}"
          BASTION_HOST_ID="/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${RESOURCE_GROUP_NAME}/providers/Microsoft.Network/bastionHosts/${BASTION_HOST_NAME}"
          VM_ID="/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${RESOURCE_GROUP_NAME}/providers/Microsoft.Compute/virtualMachines/${VM_NAME}"
          ACTION_GROUP_NAME="ai-saas-alerts-${ENV_NAME}"
          ACTION_GROUP_ID="/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${RESOURCE_GROUP_NAME}/providers/Microsoft.Insights/actionGroups/${ACTION_GROUP_NAME}"

          # Importar VNet se existir
          if az network vnet show --resource-group "$RESOURCE_GROUP_NAME" --name "$VNET_NAME" --query id -o tsv > /dev/null 2>&1; then
            import_if_missing "azurerm_virtual_network.main" "$VNET_ID" "vnet"
          else
            echo "ℹ️  VNet não existe no Azure: $VNET_NAME"
          fi

          # Importar Subnet principal se existir (depende da VNet)
          if az network vnet subnet show --resource-group "$RESOURCE_GROUP_NAME" --vnet-name "$VNET_NAME" --name "$SUBNET_NAME" --query id -o tsv > /dev/null 2>&1; then
            import_if_missing "azurerm_subnet.main" "$SUBNET_ID" "subnet-main"
          else
            echo "ℹ️  Subnet principal não existe no Azure: $SUBNET_NAME"
          fi

          # Importar NSG se existir
          if az network nsg show --resource-group "$RESOURCE_GROUP_NAME" --name "$NSG_NAME" --query id -o tsv > /dev/null 2>&1; then
            import_if_missing "azurerm_network_security_group.main" "$NSG_ID" "nsg"
          else
            echo "ℹ️  NSG não existe no Azure: $NSG_NAME"
          fi

          # Importar Public IP principal se existir
          if az network public-ip show --resource-group "$RESOURCE_GROUP_NAME" --name "$PIP_NAME" --query id -o tsv > /dev/null 2>&1; then
            import_if_missing "azurerm_public_ip.main" "$PIP_ID" "public-ip-main"
            
            # Verificar se o IP público está associado a uma NIC diferente da esperada
            # Isso resolve conflitos quando há NICs antigas usando o mesmo IP
            IP_CONFIG_ID=$(az network public-ip show --resource-group "$RESOURCE_GROUP_NAME" --name "$PIP_NAME" --query "ipConfiguration.id" -o tsv 2>/dev/null || echo "")
            if [ -n "$IP_CONFIG_ID" ]; then
              # Extrair nome da NIC do ID (formato: /subscriptions/.../networkInterfaces/NIC_NAME/ipConfigurations/...)
              CURRENT_NIC_NAME=$(echo "$IP_CONFIG_ID" | sed -n 's|.*/networkInterfaces/\([^/]*\)/ipConfigurations/.*|\1|p')
              if [ -n "$CURRENT_NIC_NAME" ] && [ "$CURRENT_NIC_NAME" != "$NIC_NAME" ]; then
                echo "⚠️  IP público $PIP_NAME está associado à NIC antiga: $CURRENT_NIC_NAME (esperado: $NIC_NAME)"
                echo "➡️  Desanexando IP público da NIC antiga..."
                
                # Tentar desanexar o IP público da NIC antiga
                set +e  # Desabilitar exit on error temporariamente
                az network nic ip-config update \
                  --resource-group "$RESOURCE_GROUP_NAME" \
                  --nic-name "$CURRENT_NIC_NAME" \
                  --name "internal" \
                  --remove public-ip-address 2>&1
                DETACH_EXIT_CODE=$?
                set -e  # Reabilitar exit on error
                
                if [ $DETACH_EXIT_CODE -eq 0 ]; then
                  echo "✅ IP público desanexado da NIC antiga: $CURRENT_NIC_NAME"
                else
                  echo "⚠️  Aviso: Não foi possível desanexar IP público da NIC antiga (exit code: $DETACH_EXIT_CODE)"
                  echo "   Isso pode ser normal se a NIC não existe mais ou se o IP já está desanexado"
                fi
              else
                echo "✅ IP público está associado à NIC correta ou não está associado"
              fi
            fi
          else
            echo "ℹ️  Public IP principal não existe no Azure: $PIP_NAME"
          fi

          # Importar NIC se existir
          if az network nic show --resource-group "$RESOURCE_GROUP_NAME" --name "$NIC_NAME" --query id -o tsv > /dev/null 2>&1; then
            import_if_missing "azurerm_network_interface.main" "$NIC_ID" "nic"
          else
            echo "ℹ️  NIC não existe no Azure: $NIC_NAME"
          fi

          # Importar VM se existir (opcional: só importa se existir)
          if [ -n "$VM_NAME" ] && az vm show --resource-group "$RESOURCE_GROUP_NAME" --name "$VM_NAME" --query id -o tsv > /dev/null 2>&1; then
            import_if_missing "azurerm_linux_virtual_machine.main" "$VM_ID" "vm"
          else
            echo "ℹ️  VM não existe no Azure ou vm_name vazio: ${VM_NAME:-<vazio>}"
          fi

          # Recursos Bastion (apenas se enable_bastion=true)
          if [ "$ENABLE_BASTION" = "true" ]; then
            if az network public-ip show --resource-group "$RESOURCE_GROUP_NAME" --name "$BASTION_PIP_NAME" --query id -o tsv > /dev/null 2>&1; then
              import_if_missing "azurerm_public_ip.bastion[0]" "$BASTION_PIP_ID" "public-ip-bastion"
            else
              echo "ℹ️  Public IP Bastion não existe no Azure: $BASTION_PIP_NAME"
            fi

            if az network vnet subnet show --resource-group "$RESOURCE_GROUP_NAME" --vnet-name "$VNET_NAME" --name "AzureBastionSubnet" --query id -o tsv > /dev/null 2>&1; then
              import_if_missing "azurerm_subnet.bastion[0]" "$BASTION_SUBNET_ID" "subnet-bastion"
            else
              echo "ℹ️  Subnet Bastion não existe no Azure: AzureBastionSubnet"
            fi

            # Bastion host pode falhar se o comando não existir; usar az resource show como fallback
            if az resource show --resource-group "$RESOURCE_GROUP_NAME" --name "$BASTION_HOST_NAME" --resource-type "Microsoft.Network/bastionHosts" --query id -o tsv > /dev/null 2>&1; then
              import_if_missing "azurerm_bastion_host.main[0]" "$BASTION_HOST_ID" "bastion-host"
            else
              echo "ℹ️  Bastion Host não existe no Azure: $BASTION_HOST_NAME"
            fi
          else
            echo "ℹ️  enable_bastion=false — pulando imports de Bastion"
          fi

          # Importar Action Group para monitoramento (se existir)
          if az monitor action-group show --resource-group "$RESOURCE_GROUP_NAME" --name "$ACTION_GROUP_NAME" --query id -o tsv > /dev/null 2>&1; then
            import_if_missing "azurerm_monitor_action_group.main" "$ACTION_GROUP_ID" "action-group"
          else
            echo "ℹ️  Action Group não existe no Azure: $ACTION_GROUP_NAME"
          fi

          echo "✅ Importação adicional concluída"

          echo ""
          echo "✅ Sincronização de recursos concluída"

      - name: Setup SSH Key from Secret
        run: |
          set -euo pipefail
          echo "Configurando chave SSH a partir do GitHub Secret..."

          # Criar diretório para chaves SSH (relativo ao workspace root)
          mkdir -p "${GITHUB_WORKSPACE}/keys/azure"

          # Se o secret SSH_PUBLIC_KEY estiver definido, usar ele
          if [ -n "${SSH_PUBLIC_KEY:-}" ]; then
            echo "Usando chave SSH do GitHub Secret..."
            echo "$SSH_PUBLIC_KEY" > "${GITHUB_WORKSPACE}/keys/azure/id_rsa.pub"
            chmod 644 "${GITHUB_WORKSPACE}/keys/azure/id_rsa.pub"
            echo "OK: Chave SSH criada a partir do secret em ${GITHUB_WORKSPACE}/keys/azure/id_rsa.pub"
          else
            echo "WARNING: SSH_PUBLIC_KEY secret não configurado"
            echo "O workflow tentará usar o caminho especificado no terraform.tfvars"
          fi

      - name: Validate SSH Key (if required)
        run: |
          set -euo pipefail
          echo "Validando chave SSH..."

          # Verificar se ssh_public_key está definido no tfvars
          if grep -q "ssh_public_key" "${{ needs.detect-environment.outputs.tfvars_file }}"; then
            SSH_KEY_PATH=$(grep "ssh_public_key" "${{ needs.detect-environment.outputs.tfvars_file }}" | cut -d'"' -f2 || cut -d"'" -f2 || echo "")
            if [ -n "$SSH_KEY_PATH" ]; then
              # Resolver caminho relativo
              if [[ "$SSH_KEY_PATH" == ../../* ]]; then
                # Remover ../.. do início e construir caminho absoluto
                SSH_KEY_PATH="${GITHUB_WORKSPACE}/${SSH_KEY_PATH#../../}"
              elif [[ "$SSH_KEY_PATH" == ../* ]]; then
                SSH_KEY_PATH="${GITHUB_WORKSPACE}/infra/azure/${SSH_KEY_PATH#../}"
              elif [[ "$SSH_KEY_PATH" != /* ]]; then
                SSH_KEY_PATH="${GITHUB_WORKSPACE}/infra/azure/${SSH_KEY_PATH}"
              fi
              
              if [ ! -f "$SSH_KEY_PATH" ]; then
                echo "ERRO: SSH key não encontrada: $SSH_KEY_PATH"
                echo ""
                echo "Caminho especificado em terraform.tfvars: $(grep 'ssh_public_key' "${{ needs.detect-environment.outputs.tfvars_file }}" | head -1)"
                echo ""
                echo "Solução:"
                echo "  1. Configure o GitHub Secret 'SSH_PUBLIC_KEY' com o conteúdo da chave SSH pública"
                echo "     (Settings > Secrets and variables > Actions > New repository secret)"
                echo "  2. Ou crie a chave SSH no repositório: ssh-keygen -t rsa -b 4096 -f keys/azure/id_rsa"
                echo "  3. Ou atualize o caminho em terraform.tfvars para usar o secret via variável"
                exit 1
              else
                echo "OK: SSH key encontrada: $SSH_KEY_PATH"
                # Validar formato da chave
                if ! grep -q "ssh-rsa\|ssh-ed25519\|ecdsa-sha2" "$SSH_KEY_PATH" 2>/dev/null; then
                  echo "WARNING: Formato da chave SSH pode estar incorreto"
                fi
              fi
            else
              echo "WARNING: ssh_public_key definido mas caminho vazio"
            fi
          else
            echo "INFO: SSH key não especificada em tfvars (pode usar default ou variável)"
          fi

      - name: Validate Subscription ID
        run: |
          set -euo pipefail
          if [ -z "${ARM_SUBSCRIPTION_ID:-}" ]; then
            echo "ERRO: ARM_SUBSCRIPTION_ID não está definido"
            exit 1
          fi
          echo "OK: Subscription ID validado: ${ARM_SUBSCRIPTION_ID}"

      - name: Validate tfvars File
        run: |
          set -euo pipefail
          TFVARS_FILE="${{ needs.detect-environment.outputs.tfvars_file }}"
          ENV="${{ needs.detect-environment.outputs.environment }}"

          echo "=== Validação do arquivo tfvars ==="
          echo "Environment detectado: ${ENV}"
          echo "Arquivo esperado: ${TFVARS_FILE}"
          echo "Diretório de trabalho: $(pwd)"
          echo ""

          # Verificar se o nome do arquivo está definido
          if [ -z "$TFVARS_FILE" ]; then
            echo "ERRO: Nome do arquivo tfvars está vazio"
            echo "Environment output: ${ENV}"
            exit 1
          fi

          # Listar arquivos tfvars disponíveis para debug
          echo "Arquivos tfvars disponíveis:"
          ls -la terraform.tfvars.* 2>/dev/null || echo "  Nenhum arquivo encontrado"
          echo ""

          # Verificar se o arquivo existe
          if [ ! -f "$TFVARS_FILE" ]; then
            echo "ERRO: Arquivo não encontrado: $TFVARS_FILE"
            echo ""
            echo "Arquivos disponíveis no diretório:"
            ls -la *.tfvars* 2>/dev/null || echo "  Nenhum arquivo .tfvars encontrado"
            echo ""
            echo "Solução:"
            echo "  1. Verifique se o arquivo terraform.tfvars.${ENV} existe em infra/azure/"
            echo "  2. Verifique se o environment foi detectado corretamente"
            exit 1
          fi

          # Verificar se o arquivo não está vazio
          if [ ! -s "$TFVARS_FILE" ]; then
            echo "ERRO: Arquivo está vazio: $TFVARS_FILE"
            exit 1
          fi

          echo "OK: Arquivo validado: $TFVARS_FILE"
          echo "Tamanho: $(wc -l < "$TFVARS_FILE") linhas"

      - name: Cleanup Bastion from State (if disabled)
        run: |
          set -euo pipefail
          TFVARS_FILE="${{ needs.detect-environment.outputs.tfvars_file }}"
          ENV="${{ needs.detect-environment.outputs.environment }}"

          echo "=== Limpeza de Bastion Host do Estado ==="
          echo "Verificando se enable_bastion está desabilitado..."

          # Extrair valor de enable_bastion do tfvars
          ENABLE_BASTION=$(grep "^enable_bastion" "$TFVARS_FILE" 2>/dev/null | head -1 | \
            sed 's/.*= *\([^#]*\).*/\1/' | \
            sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | \
            tr -d '"' | tr -d "'" || echo "true")

          echo "enable_bastion no tfvars: '$ENABLE_BASTION'"

          # Normalizar para true/false (case insensitive)
          if echo "$ENABLE_BASTION" | grep -qiE "^(false|0|no|off)$"; then
            ENABLE_BASTION="false"
          else
            ENABLE_BASTION="true"
          fi

          echo "enable_bastion normalizado: $ENABLE_BASTION"

          # Se enable_bastion = false, verificar se Bastion existe no estado e remover
          if [ "$ENABLE_BASTION" = "false" ]; then
            echo ""
            echo "⚠️  Bastion está DESABILITADO no tfvars (enable_bastion = false)"
            echo "Verificando se Bastion existe no estado do Terraform..."
            
            # Verificar se Bastion existe no estado (pode estar como [0] ou sem índice)
            BASTION_IN_STATE=false
            if terraform state list 2>/dev/null | grep -q "azurerm_bastion_host.main"; then
              BASTION_IN_STATE=true
              BASTION_ADDRESS=$(terraform state list 2>/dev/null | grep "azurerm_bastion_host.main" | head -1 || echo "")
            fi
            
            if [ "$BASTION_IN_STATE" = "true" ] && [ -n "$BASTION_ADDRESS" ]; then
              echo "❌ Bastion Host encontrado no estado: $BASTION_ADDRESS"
              echo "   Isso causará erro no plan (Terraform tentará destruir o recurso)"
              echo ""
              echo "🔧 Removendo Bastion Host do estado do Terraform..."
              echo "   (O recurso permanecerá no Azure, mas não será mais gerenciado pelo Terraform)"
              
              set +e  # Desabilitar exit on error temporariamente
              terraform state rm "$BASTION_ADDRESS" 2>&1
              REMOVE_EXIT_CODE=$?
              set -e  # Reabilitar exit on error
              
              if [ $REMOVE_EXIT_CODE -eq 0 ]; then
                echo "✅ Bastion Host removido do estado com sucesso"
                echo "   O recurso 'ai-saas-bastion-${ENV}' permanece no Azure (não gerenciado)"
                echo "   Para removê-lo completamente, delete manualmente no Portal Azure se necessário"
              else
                echo "⚠️  Aviso: Falha ao remover Bastion do estado (exit code: $REMOVE_EXIT_CODE)"
                echo "   Isso pode acontecer se o recurso já foi removido ou não existe"
                echo "   Continuando mesmo assim..."
              fi
            else
              echo "✅ Bastion Host NÃO está no estado do Terraform (OK)"
              echo "   Nenhuma ação necessária"
            fi
            
            # Também verificar e remover recursos relacionados (subnet e public IP do Bastion)
            echo ""
            echo "Verificando recursos relacionados do Bastion (subnet e public IP)..."
            
            # Subnet do Bastion
            if terraform state list 2>/dev/null | grep -q "azurerm_subnet.bastion"; then
              BASTION_SUBNET=$(terraform state list 2>/dev/null | grep "azurerm_subnet.bastion" | head -1 || echo "")
              if [ -n "$BASTION_SUBNET" ]; then
                echo "⚠️  Subnet do Bastion encontrada no estado: $BASTION_SUBNET"
                echo "🔧 Removendo do estado..."
                set +e
                terraform state rm "$BASTION_SUBNET" 2>&1 || true
                set -e
                echo "✅ Subnet do Bastion removida do estado"
              fi
            fi
            
            # Public IP do Bastion
            if terraform state list 2>/dev/null | grep -q "azurerm_public_ip.bastion"; then
              BASTION_IP=$(terraform state list 2>/dev/null | grep "azurerm_public_ip.bastion" | head -1 || echo "")
              if [ -n "$BASTION_IP" ]; then
                echo "⚠️  Public IP do Bastion encontrada no estado: $BASTION_IP"
                echo "🔧 Removendo do estado..."
                set +e
                terraform state rm "$BASTION_IP" 2>&1 || true
                set -e
                echo "✅ Public IP do Bastion removida do estado"
              fi
            fi
            
            echo ""
            echo "✅ Limpeza de Bastion concluída"
          else
            echo "✅ Bastion está HABILITADO no tfvars (enable_bastion = true)"
            echo "   Nenhuma ação necessária"
          fi

      - name: Terraform Plan
        id: plan
        run: |
          set -euo pipefail
          TFVARS_FILE="${{ needs.detect-environment.outputs.tfvars_file }}"

          # Verificar novamente antes de executar (fail-fast)
          if [ ! -f "$TFVARS_FILE" ]; then
            echo "ERRO: Arquivo tfvars não encontrado: $TFVARS_FILE"
            exit 1
          fi

          # Verificação crítica: se Resource Group existe no Azure, deve estar no estado
          # Extrair nome do Resource Group do tfvars
          RESOURCE_GROUP_NAME=$(grep "^resource_group_name" "$TFVARS_FILE" | head -1 | \
            sed 's/.*= *"\([^"]*\)".*/\1/' | \
            sed "s/.*= *'\([^']*\)'.*/\1/" | \
            sed 's/^[[:space:]]*//;s/[[:space:]]*$//' || echo "")

          if [ -n "$RESOURCE_GROUP_NAME" ]; then
            echo "Verificando sincronização do Resource Group antes de gerar plan..."
            echo "Resource Group: $RESOURCE_GROUP_NAME"
            
            # Verificar se Resource Group existe no Azure
            if az group show --name "$RESOURCE_GROUP_NAME" --query id -o tsv > /dev/null 2>&1; then
              echo "✅ Resource Group existe no Azure: $RESOURCE_GROUP_NAME"
              
              # Verificar se está no estado do Terraform
              echo "Verificando se Resource Group está no estado do Terraform..."
              if terraform state show azurerm_resource_group.main > /dev/null 2>&1; then
                echo "✅ Resource Group está no estado do Terraform"
                echo "Listando recursos no estado para debug:"
                terraform state list | grep -E "resource_group|azurerm_resource_group" || echo "  (nenhum resource_group encontrado na listagem)"
              else
                echo "❌ ERRO CRÍTICO: Resource Group existe no Azure mas NÃO está no estado do Terraform"
                echo ""
                echo "Estado atual do Terraform:"
                echo "Recursos no estado:"
                terraform state list | head -20 || echo "  (não foi possível listar estado)"
                echo ""
                echo "Isso causará erro no terraform apply quando tentar criar um recurso existente."
                echo ""
                echo "O step 'Sync Existing Resources' deveria ter importado este recurso."
                echo "Verifique os logs do step anterior para identificar o problema."
                echo ""
                echo "Possíveis causas:"
                echo "  1. Import falhou silenciosamente (verifique logs do step 'Sync Existing Resources')"
                echo "  2. Workspace diferente entre steps"
                echo "  3. Backend do Terraform não está sincronizado"
                echo ""
                echo "Solução manual:"
                SUBSCRIPTION_ID="${ARM_SUBSCRIPTION_ID}"
                RESOURCE_ID="/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${RESOURCE_GROUP_NAME}"
                echo "  terraform import -var-file=\"$TFVARS_FILE\" -var=\"subscription_id=${SUBSCRIPTION_ID}\" \\"
                ENVIRONMENT=$(grep "^environment" "$TFVARS_FILE" | head -1 | sed 's/.*= *"\([^"]*\)".*/\1/' | sed "s/.*= *'\([^']*\)'.*/\1/" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' || echo "")
                VM_NAME=$(grep "^vm_name" "$TFVARS_FILE" | head -1 | sed 's/.*= *"\([^"]*\)".*/\1/' | sed "s/.*= *'\([^']*\)'.*/\1/" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' || echo "")
                if [ -n "$ENVIRONMENT" ]; then
                  echo "    -var=\"environment=${ENVIRONMENT}\" \\"
                fi
                if [ -n "$RESOURCE_GROUP_NAME" ]; then
                  echo "    -var=\"resource_group_name=${RESOURCE_GROUP_NAME}\" \\"
                fi
                if [ -n "$VM_NAME" ]; then
                  echo "    -var=\"vm_name=${VM_NAME}\" \\"
                fi
                echo "    azurerm_resource_group.main \"$RESOURCE_ID\""
                echo ""
                echo "FALHANDO workflow para evitar erro no terraform apply"
                exit 1
              fi
            else
              echo "✅ Resource Group não existe no Azure - será criado pelo Terraform"
            fi
          fi

          # Verificar e remover lock antes do plan (se necessário)
          echo "Verificando lock antes de executar terraform plan..."
          LOCK_BLOB=".terraform.tfstate.lock.info"
          if az storage blob exists \
            --account-name "${TF_BACKEND_STORAGE_ACCOUNT}" \
            --container-name "${TF_BACKEND_CONTAINER}" \
            --name "$LOCK_BLOB" \
            --auth-mode login \
            --query "exists" -o tsv 2>/dev/null | grep -q "true"; then
            echo "⚠️  Lock detectado antes do plan. Verificando idade..."
            LOCK_MODIFIED=$(az storage blob show \
              --account-name "${TF_BACKEND_STORAGE_ACCOUNT}" \
              --container-name "${TF_BACKEND_CONTAINER}" \
              --name "$LOCK_BLOB" \
              --auth-mode login \
              --query "properties.lastModified" -o tsv 2>/dev/null || echo "")
            
            if [ -n "$LOCK_MODIFIED" ]; then
              LOCK_AGE=$(($(date +%s) - $(date -d "$LOCK_MODIFIED" +%s 2>/dev/null || echo 0)))
              # Se lock tem mais de 5 minutos, remover (pode ser de workflow anterior que falhou)
              if [ "$LOCK_AGE" -gt 300 ] 2>/dev/null; then
                echo "⚠️  Removendo lock preso (idade: ${LOCK_AGE}s, mais de 5 minutos)..."
                az storage blob delete \
                  --account-name "${TF_BACKEND_STORAGE_ACCOUNT}" \
                  --container-name "${TF_BACKEND_CONTAINER}" \
                  --name "$LOCK_BLOB" \
                  --auth-mode login \
                  --output none 2>/dev/null && echo "✅ Lock removido" || echo "⚠️  Não foi possível remover lock"
              else
                echo "INFO: Lock recente (idade: ${LOCK_AGE}s) - pode ser de outro workflow ativo"
                echo "Tentando executar plan mesmo assim (pode falhar se lock estiver ativo)..."
              fi
            fi
          else
            echo "✅ Nenhum lock detectado"
          fi

          # Executar terraform plan com detailed-exitcode
          # Exit codes: 0 = sem mudanças, 1 = erro, 2 = há mudanças (esperado)
          set +e  # Desabilitar exit on error temporariamente
          terraform plan \
            -var-file="$TFVARS_FILE" \
            -var="subscription_id=${ARM_SUBSCRIPTION_ID}" \
            -out=tfplan \
            -no-color \
            -detailed-exitcode 2>&1 | tee plan-output.txt

          PLAN_EXIT_CODE=${PIPESTATUS[0]}
          PLAN_OUTPUT=$(cat plan-output.txt || echo "")
          set -e  # Reabilitar exit on error

          # Verificar se o erro foi devido a lock
          if [ $PLAN_EXIT_CODE -eq 1 ] && echo "$PLAN_OUTPUT" | grep -qi "state lock\|already locked"; then
            echo "⚠️  ERRO: Terraform plan falhou devido a lock do estado"
            echo "Tentando remover lock e executar novamente..."
            
            # Remover lock forçadamente
            az storage blob delete \
              --account-name "${TF_BACKEND_STORAGE_ACCOUNT}" \
              --container-name "${TF_BACKEND_CONTAINER}" \
              --name ".terraform.tfstate.lock.info" \
              --auth-mode login \
              --output none 2>/dev/null && echo "✅ Lock removido" || echo "⚠️  Não foi possível remover lock"
            
            # Aguardar um pouco antes de tentar novamente
            sleep 5
            
            # Tentar plan novamente
            echo "Tentando terraform plan novamente após remover lock..."
            set +e
            terraform plan \
              -var-file="$TFVARS_FILE" \
              -var="subscription_id=${ARM_SUBSCRIPTION_ID}" \
              -out=tfplan \
              -no-color \
              -detailed-exitcode 2>&1 | tee plan-output.txt
            PLAN_EXIT_CODE=${PIPESTATUS[0]}
            set -e
          fi

          # Tratar exit codes
          if [ $PLAN_EXIT_CODE -eq 1 ]; then
            echo "ERRO: Terraform plan failed"
            echo "Últimas linhas do output:"
            tail -50 plan-output.txt || echo "(não foi possível ler output)"
            exit 1
          elif [ $PLAN_EXIT_CODE -eq 2 ]; then
            echo "OK: Terraform plan gerado com sucesso (há mudanças planejadas)"
            echo "plan_has_changes=true" >> $GITHUB_OUTPUT
          elif [ $PLAN_EXIT_CODE -eq 0 ]; then
            echo "OK: Terraform plan gerado com sucesso (sem mudanças)"
            echo "plan_has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "ERRO: Exit code inesperado do terraform plan: $PLAN_EXIT_CODE"
            exit 1
          fi

          # Verificação crítica APÓS gerar plan: se plan tenta criar Resource Group que já existe
          # Extrair Resource Group do tfvars novamente (não depender de variável anterior)
          PLAN_RG_NAME=$(grep "^resource_group_name" "$TFVARS_FILE" | head -1 | \
            sed 's/.*= *"\([^"]*\)".*/\1/' | \
            sed "s/.*= *'\([^']*\)'.*/\1/" | \
            sed 's/^[[:space:]]*//;s/[[:space:]]*$//' || echo "")

          if [ -n "$PLAN_RG_NAME" ]; then
            echo "=== Verificação crítica do plan gerado ==="
            echo "Resource Group do tfvars: $PLAN_RG_NAME"
            
            # Verificar se plan tenta criar Resource Group
            PLAN_TRIES_TO_CREATE_RG=false
            
            # Verificar ações do Resource Group no plan
            PLAN_RG_ACTIONS=""
            PLAN_RG_REPLACEMENT=false
            PLAN_RG_CREATE=false
            
            if command -v jq >/dev/null 2>&1; then
              # CRÍTICO: se terraform show falhar, não assumir "false" (isso gera falso negativo)
              if ! terraform show -json tfplan > tfplan.json; then
                echo "ERRO: Falha ao executar 'terraform show -json tfplan' (plan pode estar corrompido ou incompatível)"
                echo "Tentando mostrar plan em formato texto para debug:"
                terraform show tfplan | tail -200 || true
                exit 1
              fi
              
              # Verificar ações do Resource Group
              PLAN_RG_ACTIONS=$(jq -r '.resource_changes[]? | select(.address == "azurerm_resource_group.main") | .change.actions[]?' tfplan.json 2>/dev/null | sort -u | tr '\n' ',' | sed 's/,$//' || echo "")
              
              if echo "$PLAN_RG_ACTIONS" | grep -q "create" && ! echo "$PLAN_RG_ACTIONS" | grep -q "delete"; then
                PLAN_RG_CREATE=true
              elif echo "$PLAN_RG_ACTIONS" | grep -qE "(create|delete)"; then
                PLAN_RG_REPLACEMENT=true
              fi
            else
              # Fallback: verificar via terraform show (texto)
              if terraform show tfplan 2>/dev/null | grep -q "azurerm_resource_group.main.*will be created"; then
                PLAN_RG_CREATE=true
              elif terraform show tfplan 2>/dev/null | grep -qE "azurerm_resource_group.main.*must be replaced|azurerm_resource_group.main.*destroy and then create"; then
                PLAN_RG_REPLACEMENT=true
              fi
            fi
            
            # Verificar se Resource Group existe no Azure
            RG_EXISTS_IN_AZURE=false
            if az group show --name "$PLAN_RG_NAME" --query id -o tsv > /dev/null 2>&1; then
              RG_EXISTS_IN_AZURE=true
            fi
            
            if [ "$PLAN_RG_CREATE" = "true" ]; then
              echo "⚠️  WARNING: Plan tenta criar Resource Group: $PLAN_RG_NAME"
              
              if [ "$RG_EXISTS_IN_AZURE" = "true" ]; then
                echo "❌ ERRO CRÍTICO: Plan gerado tenta criar Resource Group que JÁ EXISTE no Azure!"
                echo "Resource Group: $PLAN_RG_NAME"
                echo ""
                echo "Isso causará erro: 'A resource with the ID already exists' no terraform apply"
                echo ""
                echo "O step 'Sync Existing Resources' deveria ter importado este recurso."
                echo "Verifique os logs do step 'Sync Existing Resources' acima."
                echo ""
                echo "FALHANDO workflow para evitar erro no terraform apply"
                exit 1
              else
                echo "✅ Resource Group não existe no Azure - será criado (correto)"
              fi
            elif [ "$PLAN_RG_REPLACEMENT" = "true" ]; then
              echo "⚠️  WARNING: Plan tenta fazer REPLACEMENT do Resource Group: $PLAN_RG_NAME"
              
              if [ "$RG_EXISTS_IN_AZURE" = "true" ]; then
                echo "⚠️  Resource Group existe no Azure. Verificando se replacement é apenas por diferença de nome/tags..."
                
                # Verificar se Resource Group está no estado
                if terraform state show azurerm_resource_group.main > /dev/null 2>&1; then
                  CURRENT_RG_NAME=$(terraform state show azurerm_resource_group.main 2>/dev/null | grep -E "^ +name +=" | head -1 | sed 's/.*= *"\([^"]*\)".*/\1/' | sed "s/.*= *'\([^']*\)'.*/\1/" || echo "")
                  
                  if [ -n "$CURRENT_RG_NAME" ] && [ "$CURRENT_RG_NAME" != "$PLAN_RG_NAME" ]; then
                    echo "⚠️  Diferença de nome detectada: Estado='$CURRENT_RG_NAME', Tfvars='$PLAN_RG_NAME'"
                    echo "⚠️  Azure Resource Groups são case-insensitive, mas Terraform é case-sensitive."
                    echo ""
                    echo "🔧 Tentando corrigir via refresh-only (sincroniza estado com Azure)..."
                    # Tentar refresh-only para sincronizar nome com Azure
                    terraform apply -refresh-only -auto-approve > /dev/null 2>&1 || true
                    
                    # Verificar novamente após refresh
                    CURRENT_RG_NAME_AFTER=$(terraform state show azurerm_resource_group.main 2>/dev/null | grep -E "^ +name +=" | head -1 | sed 's/.*= *"\([^"]*\)".*/\1/' | sed "s/.*= *'\([^']*\)'.*/\1/" || echo "")
                    
                    if [ "$CURRENT_RG_NAME_AFTER" = "$PLAN_RG_NAME" ]; then
                      echo "✅ Nome corrigido após refresh! Regenerando plan..."
                      # Regenerar plan com estado corrigido
                      terraform plan -out=tfplan -no-color > /dev/null 2>&1 || terraform plan -out=tfplan -no-color
                      echo "✅ Plan regenerado com estado corrigido"
                    else
                      echo "⚠️  Refresh não corrigiu o nome (Estado='$CURRENT_RG_NAME_AFTER', Esperado='$PLAN_RG_NAME')"
                      echo "⚠️  O Azure aceita diferença de case, então o replacement pode ser apenas atualização de nome."
                      echo "⚠️  Continuando... (Azure não vai realmente destruir/recrear, apenas atualizar)"
                    fi
                  else
                    echo "⚠️  Resource Group no estado tem o mesmo nome, mas plan quer replacement."
                    echo "⚠️  Isso pode ser por mudança de tags ou outras propriedades."
                    echo "⚠️  Continuando... (replacement pode ser aceitável para tags - Azure não destrói realmente)"
                  fi
                else
                  echo "⚠️  Resource Group não está no estado. Replacement pode ser necessário."
                fi
              else
                echo "⚠️  Resource Group não existe no Azure - replacement será necessário"
              fi
            else
              echo "✅ Plan não tenta criar ou substituir Resource Group (correto)"
            fi
          else
            echo "WARNING: Não foi possível extrair resource_group_name do tfvars para verificação"
          fi

      - name: Validate Plan
        uses: ./.github/actions/terraform-plan-validation
        with:
          plan_file: tfplan
          environment: ${{ needs.detect-environment.outputs.environment }}
          allow_destroy: ${{ needs.detect-environment.outputs.allow_destroy }}

      - name: Check for Destructive Changes
        if: steps.validate.outputs.has_destroy == 'true' && needs.detect-environment.outputs.allow_destroy != 'true'
        run: |
          echo "WARNING: Plan contains destructive changes!"
          echo "Environment: ${{ needs.detect-environment.outputs.environment }}"
          echo "This deployment will destroy resources."
          echo ""
          echo "If this is intentional, re-run the workflow with allow_destroy=true"
          exit 1

      - name: Validate Plan Artifact Size
        run: |
          set -euo pipefail
          PLAN_FILE="tfplan"
          if [ -f "$PLAN_FILE" ]; then
            PLAN_SIZE=$(du -m "$PLAN_FILE" | cut -f1)
            MAX_SIZE=100  # 100MB
            if [ "$PLAN_SIZE" -gt "$MAX_SIZE" ]; then
              echo "ERRO: Plan file muito grande: ${PLAN_SIZE}MB (máximo: ${MAX_SIZE}MB)"
              exit 1
            fi
            echo "OK: Plan file validado: ${PLAN_SIZE}MB"
          else
            echo "ERRO: Plan file não encontrado"
            exit 1
          fi

      # CRÍTICO: garantir que o artifact do plan tenha um path estável (sem duplicar infra/azure no download)
      - name: Prepare Plan Artifact (stable paths)
        run: |
          set -euo pipefail
          ARTIFACT_DIR="${GITHUB_WORKSPACE}/_tfplan_artifact"
          mkdir -p "$ARTIFACT_DIR"
          cp -f tfplan "$ARTIFACT_DIR/tfplan"
          cp -f plan-output.txt "$ARTIFACT_DIR/plan-output.txt"
          echo "Artifact preparado em: $ARTIFACT_DIR"
          ls -la "$ARTIFACT_DIR"

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ needs.detect-environment.outputs.environment }}-${{ github.run_id }}
          path: |
            _tfplan_artifact/tfplan
            _tfplan_artifact/plan-output.txt
          retention-days: 30

      - name: Save Plan Summary
        run: |
          echo "Plan Summary:" >> $GITHUB_STEP_SUMMARY
          echo "```" >> $GITHUB_STEP_SUMMARY
          tail -100 plan-output.txt >> $GITHUB_STEP_SUMMARY
          echo "```" >> $GITHUB_STEP_SUMMARY

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [detect-environment, terraform-plan]
    environment:
      name: ${{ needs.detect-environment.outputs.environment == 'prod' && 'production' || needs.detect-environment.outputs.environment == 'poc-sky' && 'poc-sky' || 'staging' }}
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    env:
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_USE_OIDC: true
      TF_BACKEND_RESOURCE_GROUP: ${{ secrets.TF_BACKEND_RESOURCE_GROUP }}
      TF_BACKEND_STORAGE_ACCOUNT: ${{ secrets.TF_BACKEND_STORAGE_ACCOUNT }}
      TF_BACKEND_CONTAINER: ${{ secrets.TF_BACKEND_CONTAINER }}
      TF_BACKEND_KEY_PREFIX: ${{ secrets.TF_BACKEND_KEY_PREFIX }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Validate Git Repositories
        run: |
          set -euo pipefail
          BRANCH="${{ needs.detect-environment.outputs.branch }}"
          ENV="${{ needs.detect-environment.outputs.environment }}"
          REPO="${{ github.repository }}"
          REPO_OWNER=$(echo "$REPO" | cut -d'/' -f1)
          REPO_NAME=$(echo "$REPO" | cut -d'/' -f2)

          echo "Validando repositórios Git e branches..."
          echo "Branch alvo: $BRANCH"
          echo "Environment: $ENV"
          echo ""

          # Se branch for "manual", usar branch do environment para validação
          VALIDATION_BRANCH="$BRANCH"
          if [[ "$BRANCH" == "manual" ]]; then
            # Mapear environment para branch
            case "$ENV" in
              "staging")
                VALIDATION_BRANCH="staging"
                ;;
              "prod")
                VALIDATION_BRANCH="main"
                ;;
              "poc-sky")
                VALIDATION_BRANCH="staging"  # ou main, ajuste conforme necessário
                ;;
              *)
                VALIDATION_BRANCH="main"  # fallback
                ;;
            esac
            echo "Branch 'manual' detectado - usando branch '$VALIDATION_BRANCH' para validação (baseado no environment $ENV)"
            echo ""
          fi

          # Configurar autenticação para repositórios privados
          # Priorizar GH_PAT (Personal Access Token) se disponível
          # GH_PAT tem acesso completo a repositórios privados
          GH_PAT="${{ secrets.GH_PAT }}"
          GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}"

          # Função para URL-encode o token (necessário para caracteres especiais)
          urlencode() {
            local string="${1}"
            local strlen=${#string}
            local encoded=""
            local pos c o
            for (( pos=0 ; pos<strlen ; pos++ )); do
              c=${string:$pos:1}
              case "$c" in
                [-_.~a-zA-Z0-9] ) o="${c}" ;;
                * ) printf -v o '%%%02x' "'$c" ;;
              esac
              encoded+="${o}"
            done
            echo "${encoded}"
          }

          if [ -n "$GH_PAT" ]; then
            echo "Usando GH_PAT para autenticação (acesso completo a repositórios privados)"
            # URL-encode o token para evitar problemas com caracteres especiais
            ENCODED_PAT=$(urlencode "${GH_PAT}")
            # Usar formato x-access-token com token URL-encoded
            GITHUB_URL_PREFIX="https://x-access-token:${ENCODED_PAT}@github.com/"
            AUTH_TYPE="PAT"
            # Configurar git para usar autenticação via config (mais robusto)
            git config --global url."https://x-access-token:${GH_PAT}@github.com/".insteadOf "https://github.com/"
            echo "OK: Autenticação configurada (PAT com URL-encoding)"
          elif [ -n "$GITHUB_TOKEN" ]; then
            echo "Usando GITHUB_TOKEN para autenticação (acesso limitado ao repositório atual)"
            echo "WARNING: GITHUB_TOKEN não tem acesso a repositórios privados de outras organizações"
            echo "Configure GH_PAT secret no GitHub com permissão 'repo' para acesso completo"
            ENCODED_TOKEN=$(urlencode "${GITHUB_TOKEN}")
            GITHUB_URL_PREFIX="https://x-access-token:${ENCODED_TOKEN}@github.com/"
            AUTH_TYPE="TOKEN"
            git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
          else
            echo "WARNING: Nenhum token disponível - apenas repositórios públicos serão acessíveis"
            GITHUB_URL_PREFIX="https://github.com/"
            AUTH_TYPE="NONE"
          fi

          # Lista de repositórios a validar
          declare -A REPOS=(
            ["infra"]="${REPO}"
            ["backend"]="${REPO_OWNER}/${REPO_NAME/poc-deploy/backend}"
            ["frontend"]="${REPO_OWNER}/${REPO_NAME/poc-deploy/frontend}"
            ["ia"]="${REPO_OWNER}/${REPO_NAME/poc-deploy/ia}"
          )

          # Ajustar nomes se necessário (poc-deploy vs sky-poc-infra)
          if [[ "$REPO_NAME" == *"poc-deploy"* ]]; then
            REPOS["backend"]="${REPO_OWNER}/backend"
            REPOS["frontend"]="${REPO_OWNER}/frontend"
            REPOS["ia"]="${REPO_OWNER}/ia"
          elif [[ "$REPO_NAME" == *"sky-poc-infra"* ]]; then
            REPOS["backend"]="${REPO_OWNER}/sky-poc-backend"
            REPOS["frontend"]="${REPO_OWNER}/sky-poc-frontend"
            REPOS["ia"]="${REPO_OWNER}/sky-poc-ai"
          fi

          # Debug: mostrar repositórios que serão validados
          echo "=== Repositórios a validar ==="
          for repo_type in "${!REPOS[@]}"; do
            echo "  $repo_type: ${REPOS[$repo_type]}"
          done
          echo ""

          # Testar autenticação do PAT primeiro
          if [ "$AUTH_TYPE" = "PAT" ]; then
            echo "=== Testando autenticação PAT ==="
            TEST_REPO="${REPO_OWNER}/${REPO_NAME}"
            # Tentar primeiro com git config (mais robusto)
            TEST_URL="https://github.com/${TEST_REPO}.git"
            if git ls-remote "$TEST_URL" > /dev/null 2>&1; then
              echo "OK: PAT autenticado com sucesso via git config (consegue acessar repositório atual)"
            else
              # Fallback: tentar com URL direta
              TEST_URL_DIRECT="${GITHUB_URL_PREFIX}${TEST_REPO}.git"
              if git ls-remote "$TEST_URL_DIRECT" > /dev/null 2>&1; then
                echo "OK: PAT autenticado com sucesso via URL direta (consegue acessar repositório atual)"
              else
                echo "WARNING: PAT pode não ter acesso ao repositório atual"
              fi
            fi
            echo ""
          fi

          for repo_type in "${!REPOS[@]}"; do
            repo="${REPOS[$repo_type]}"
            echo "Validando repositório $repo_type: $repo"
            
            # Usar URL padrão se git config estiver configurado, senão usar URL com token
            if [ "$AUTH_TYPE" != "NONE" ]; then
              # Tentar primeiro com git config (mais robusto)
              REPO_URL="https://github.com/${repo}.git"
              echo "  Autenticação: $AUTH_TYPE (via git config)"
            else
              REPO_URL="${GITHUB_URL_PREFIX}${repo}.git"
            fi
            
            # Verificar se repositório existe (com autenticação se necessário)
            REPO_FOUND=false
            API_ACCESS=false
            
            # Primeiro, verificar via API se temos acesso (mais confiável)
            if [ "$AUTH_TYPE" = "PAT" ]; then
              echo "  Verificando acesso via GitHub API..."
              API_RESPONSE=$(curl -s -w "\nHTTP_CODE:%{http_code}" \
                -H "Authorization: token ${GH_PAT}" \
                -H "Accept: application/vnd.github.v3+json" \
                "https://api.github.com/repos/${repo}" 2>&1)
              
              HTTP_CODE=$(echo "$API_RESPONSE" | grep "HTTP_CODE:" | cut -d: -f2)
              API_BODY=$(echo "$API_RESPONSE" | sed '/HTTP_CODE:/d')
              
              if [ "$HTTP_CODE" = "200" ]; then
                API_ACCESS=true
                REPO_NAME_API=$(echo "$API_BODY" | grep '"name":' | head -1 | sed 's/.*"name": *"\([^"]*\)".*/\1/' || echo "N/A")
                REPO_PRIVATE=$(echo "$API_BODY" | grep '"private":' | head -1 | sed 's/.*"private": *\([^,}]*\).*/\1/' || echo "N/A")
                echo "  API: Repositório encontrado! (HTTP 200)"
                echo "  API: Nome: $REPO_NAME_API"
                echo "  API: Privado: $REPO_PRIVATE"
                echo "  API: PAT tem acesso confirmado via API"
              fi
            fi
            
            # Tentar git ls-remote (preferencial, mas não crítico se API confirmar acesso)
            if git ls-remote "$REPO_URL" > /dev/null 2>&1; then
              REPO_FOUND=true
              echo "  OK: git ls-remote funcionou"
            else
              # Se falhou com git config, tentar com URL direta como fallback
              if [ "$AUTH_TYPE" != "NONE" ]; then
                echo "  Tentando fallback com URL direta..."
                REPO_URL_FALLBACK="${GITHUB_URL_PREFIX}${repo}.git"
                if git ls-remote "$REPO_URL_FALLBACK" > /dev/null 2>&1; then
                  echo "  OK: Fallback funcionou!"
                  REPO_URL="$REPO_URL_FALLBACK"
                  REPO_FOUND=true
                else
                  echo "  WARNING: git ls-remote falhou (mas continuando se API confirmar acesso)"
                fi
              fi
            fi
            
            # Se API confirmou acesso, aceitar mesmo se git ls-remote falhou
            if [ "$API_ACCESS" = "true" ] && [ "$REPO_FOUND" = "false" ]; then
              echo "  INFO: git ls-remote falhou, mas API confirmou acesso - continuando..."
              echo "  NOTA: O PAT pode não ter permissão Git aprovada na organização"
              echo "  NOTA: Mas o acesso via API está funcionando, então o deploy pode continuar"
              REPO_FOUND=true
              # Usar URL padrão para validação de branch (será validado via API se necessário)
            fi
            
            # Se não encontrou e API não confirmou, mostrar erro
            if [ "$REPO_FOUND" = "false" ]; then
              echo "ERRO: Repositório não encontrado: $repo"
              echo ""
              echo "Detalhes:"
              echo "  - Tipo de autenticação: $AUTH_TYPE"
              echo "  - Repositório: $repo"
              echo ""
              
              if [ "$AUTH_TYPE" = "PAT" ] && [ "$API_ACCESS" = "false" ]; then
                echo "  API: Acesso negado ou repositório não encontrado"
                echo "  SOLUÇÃO: Verifique se o PAT tem acesso à organização 'sky-first'"
                echo "  SOLUÇÃO: Verifique se o PAT foi aprovado na organização"
                echo "  SOLUÇÃO: Acesse: https://github.com/organizations/sky-first/settings/personal_access_tokens"
              fi
              
              if [ "$AUTH_TYPE" = "TOKEN" ] || [ "$AUTH_TYPE" = "NONE" ]; then
                echo "SOLUÇÃO: Configure GH_PAT secret no GitHub:"
                echo "  1. Crie um Personal Access Token (PAT) com escopo 'repo'"
                echo "  2. Adicione como secret 'GH_PAT' no repositório"
                echo "  3. O PAT terá acesso completo a repositórios privados"
                echo ""
              fi
              
              echo "Tentando sem autenticação para debug..."
              if git ls-remote "https://github.com/${repo}.git" > /dev/null 2>&1; then
                echo "INFO: Repositório é público e acessível sem autenticação"
              else
                echo "INFO: Repositório não encontrado mesmo sem autenticação"
                echo "Verifique se o repositório existe: https://github.com/${repo}"
              fi
              
              exit 1
            fi
            
            # Verificar se branch existe (usar VALIDATION_BRANCH ao invés de BRANCH)
            BRANCH_FOUND=false
            
            # Tentar validar branch via git ls-remote
            if git ls-remote --heads "$REPO_URL" "$VALIDATION_BRANCH" 2>/dev/null | grep -q "$VALIDATION_BRANCH"; then
              BRANCH_FOUND=true
              echo "  OK: Branch $VALIDATION_BRANCH encontrada via git ls-remote"
            else
              # Se git ls-remote falhou, tentar via API
              if [ "$AUTH_TYPE" = "PAT" ]; then
                echo "  Validando branch via GitHub API..."
                BRANCH_API_RESPONSE=$(curl -s -w "\nHTTP_CODE:%{http_code}" \
                  -H "Authorization: token ${GH_PAT}" \
                  -H "Accept: application/vnd.github.v3+json" \
                  "https://api.github.com/repos/${repo}/branches/${VALIDATION_BRANCH}" 2>&1)
                
                BRANCH_HTTP_CODE=$(echo "$BRANCH_API_RESPONSE" | grep "HTTP_CODE:" | cut -d: -f2)
                if [ "$BRANCH_HTTP_CODE" = "200" ]; then
                  BRANCH_FOUND=true
                  echo "  OK: Branch $VALIDATION_BRANCH encontrada via API"
                else
                  echo "  ERRO: Branch $VALIDATION_BRANCH não encontrada no repositório $repo"
                  echo ""
                  echo "Branches disponíveis (via API):"
                  BRANCHES_API=$(curl -s \
                    -H "Authorization: token ${GH_PAT}" \
                    -H "Accept: application/vnd.github.v3+json" \
                    "https://api.github.com/repos/${repo}/branches" 2>/dev/null | \
                    grep '"name":' | sed 's/.*"name": *"\([^"]*\)".*/\1/' | head -10 || echo "  (não foi possível listar)")
                  echo "$BRANCHES_API"
                  echo ""
                  echo "Crie a branch $VALIDATION_BRANCH no repositório $repo antes de fazer o deploy"
                  exit 1
                fi
              else
                echo "ERRO: Branch $VALIDATION_BRANCH não encontrada no repositório $repo"
                echo ""
                echo "Branches disponíveis:"
                git ls-remote --heads "$REPO_URL" 2>/dev/null | sed 's/.*refs\/heads\///' | head -10 || echo "  (não foi possível listar)"
                echo ""
                echo "Crie a branch $VALIDATION_BRANCH no repositório $repo antes de fazer o deploy"
                exit 1
              fi
            fi
            
            echo "  OK: Repositório $repo_type validado (branch $VALIDATION_BRANCH existe)"
            echo ""
          done

          echo ""
          echo "OK: Todos os repositórios e branches validados com sucesso"

      - name: Validate Dependencies
        run: |
          set -euo pipefail
          echo "Validando dependências necessárias..."

          # Verificar jq
          if ! command -v jq >/dev/null 2>&1; then
            echo "ERRO: jq não encontrado. Instalando..."
            sudo apt-get update && sudo apt-get install -y jq || {
              echo "ERRO: Falha ao instalar jq"
              exit 1
            }
          fi
          echo "OK: jq encontrado: $(jq --version)"

          # Verificar terraform (será instalado pelo setup, mas validar)
          if ! command -v terraform >/dev/null 2>&1; then
            echo "WARNING: Terraform não encontrado (será instalado no próximo step)"
          else
            echo "OK: Terraform encontrado: $(terraform version | head -1)"
          fi

      - name: Setup Terraform
        uses: ./.github/actions/terraform-setup
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          working_directory: ${{ env.TF_WORKING_DIR }}

      - name: Validate Terraform Version
        run: |
          set -euo pipefail
          REQUIRED_VERSION="1.2.0"
          CURRENT_VERSION=$(terraform version -json | jq -r '.terraform_version' 2>/dev/null || terraform version | head -1 | sed 's/Terraform v//')

          echo "Verificando versão do Terraform..."
          echo "Versão atual: $CURRENT_VERSION"
          echo "Versão mínima requerida: $REQUIRED_VERSION"

          # Comparar versões (requer versão >= 1.2.0)
          if [ "$(printf '%s\n' "$REQUIRED_VERSION" "$CURRENT_VERSION" | sort -V | head -1)" != "$REQUIRED_VERSION" ]; then
            echo "ERRO: Versão do Terraform incompatível"
            echo "Requerida: >= $REQUIRED_VERSION"
            echo "Atual: $CURRENT_VERSION"
            echo ""
            echo "Atualize o Terraform ou ajuste TERRAFORM_VERSION no workflow"
            exit 1
          fi

          echo "OK: Versão do Terraform compatível: $CURRENT_VERSION"

      - name: Azure Authentication
        uses: ./.github/actions/azure-auth
        with:
          subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          client_id: ${{ secrets.AZURE_CLIENT_ID }}

      - name: Verify OIDC Configuration
        run: |
          set -euo pipefail
          echo "Verificando configuração OIDC..."

          # Tentar obter token (se OIDC estiver configurado, funcionará)
          TOKEN=$(az account get-access-token --query accessToken -o tsv 2>&1 || echo "")

          if [ -z "$TOKEN" ] || [[ "$TOKEN" == *"error"* ]] || [[ "$TOKEN" == *"AADSTS"* ]]; then
            echo "ERRO: Falha na autenticação OIDC"
            echo ""
            echo "Possíveis causas:"
            echo "  1. Federated Identity Credential não está configurado no Azure AD"
            echo "  2. Subject claim não corresponde ao repositório/branch"
            echo "  3. Client ID incorreto"
            echo "  4. App Registration não tem permissões necessárias"
            echo ""
            echo "Como corrigir:"
            echo "  1. Configure Federated Identity Credential no Azure AD"
            echo "  2. Verifique se o subject claim está correto"
            echo "  3. Verifique permissões da App Registration"
            exit 1
          fi

          # Verificar subscription
          CURRENT_SUB=$(az account show --query id -o tsv 2>/dev/null || echo "")
          EXPECTED_SUB="${ARM_SUBSCRIPTION_ID}"

          if [ "$CURRENT_SUB" != "$EXPECTED_SUB" ]; then
            echo "ERRO: Subscription incorreta"
            echo "Esperado: $EXPECTED_SUB"
            echo "Atual: $CURRENT_SUB"
            exit 1
          fi

          echo "OK: Autenticação OIDC funcionando corretamente"
          echo "OK: Subscription configurada: $CURRENT_SUB"

      - name: Validate Azure RBAC Permissions
        run: |
          set -euo pipefail
          echo "Validando permissões Azure RBAC..."

          SUBSCRIPTION_ID="${ARM_SUBSCRIPTION_ID}"

          # Verificar se pode listar resource groups
          echo "Verificando permissões de leitura..."
          if ! az group list --query "[?name=='${TF_BACKEND_RESOURCE_GROUP}'].name" -o tsv > /dev/null 2>&1; then
            echo "WARNING: WARNING: Sem permissão para listar resource groups"
            echo "Isso pode indicar permissões insuficientes"
          else
            echo "OK: Permissão de leitura de resource groups OK"
          fi

          # Verificar permissões básicas via role assignments
          echo "Verificando role assignments..."
          CLIENT_ID="${ARM_CLIENT_ID}"
          if ! az role assignment list \
            --assignee "$CLIENT_ID" \
            --scope "/subscriptions/${SUBSCRIPTION_ID}" \
            --query "[].roleDefinitionName" -o tsv > /dev/null 2>&1; then
            echo "WARNING: WARNING: Não foi possível verificar role assignments"
            echo "Isso pode indicar permissões insuficientes ou App Registration sem roles"
          else
            ROLES=$(az role assignment list \
              --assignee "$CLIENT_ID" \
              --scope "/subscriptions/${SUBSCRIPTION_ID}" \
              --query "[].roleDefinitionName" -o tsv 2>/dev/null || echo "")
            
            if [ -n "$ROLES" ]; then
              echo "OK: Roles encontradas para App Registration:"
              echo "$ROLES" | while read -r role; do
                echo "  - $role"
              done
            else
              echo "WARNING: WARNING: Nenhuma role encontrada para App Registration"
              echo "Recomendado: Contributor ou Owner no nível de subscription"
            fi
          fi

          echo "OK: Validação de permissões RBAC concluída"

      - name: Write backend config
        run: |
          ENV="${{ needs.detect-environment.outputs.environment }}"
          cat > backend.hcl <<EOF
          resource_group_name  = "${TF_BACKEND_RESOURCE_GROUP}"
          storage_account_name = "${TF_BACKEND_STORAGE_ACCOUNT}"
          container_name       = "${TF_BACKEND_CONTAINER}"
          key                  = "${TF_BACKEND_KEY_PREFIX:-poc-deploy}-${ENV}.tfstate"
          use_azuread_auth     = true
          EOF

      - name: Validate Terraform Backend
        run: |
          set -euo pipefail
          echo "Validando configuração do backend Terraform..."

          # Verificar se Storage Account existe
          echo "Verificando Storage Account: ${TF_BACKEND_STORAGE_ACCOUNT}"
          if ! az storage account show \
            --name "${TF_BACKEND_STORAGE_ACCOUNT}" \
            --resource-group "${TF_BACKEND_RESOURCE_GROUP}" \
            --query id -o tsv > /dev/null 2>&1; then
            echo "ERRO: Storage Account não encontrado: ${TF_BACKEND_STORAGE_ACCOUNT}"
            echo "Resource Group: ${TF_BACKEND_RESOURCE_GROUP}"
            exit 1
          fi
          echo "OK: Storage Account encontrado"

          # Verificar se Container existe
          echo "Verificando Container: ${TF_BACKEND_CONTAINER}"
          if ! az storage container show \
            --name "${TF_BACKEND_CONTAINER}" \
            --account-name "${TF_BACKEND_STORAGE_ACCOUNT}" \
            --auth-mode login \
            --query name -o tsv > /dev/null 2>&1; then
            echo "WARNING: Container não encontrado, criando..."
            if ! az storage container create \
              --name "${TF_BACKEND_CONTAINER}" \
              --account-name "${TF_BACKEND_STORAGE_ACCOUNT}" \
              --auth-mode login \
              --public-access off > /dev/null 2>&1; then
              echo "ERRO: Falha ao criar container"
              exit 1
            fi
            echo "OK: Container criado com sucesso"
          else
            echo "OK: Container encontrado"
          fi

          echo "OK: Backend Terraform validado com sucesso"

      - name: Download Plan Artifact
        id: download-artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ needs.detect-environment.outputs.environment }}-${{ github.run_id }}
          path: _tfplan_artifact

      - name: Verify Plan Artifact Downloaded
        if: steps.download-artifact.outcome != 'success'
        run: |
          echo "ERRO: Falha ao baixar artifact do plan"
          echo "O job 'terraform-plan' pode ter falhado ou o artifact não foi gerado."
          echo "Verifique os logs do job 'terraform-plan' para mais detalhes."
          exit 1

      - name: Stage Downloaded Plan into Working Directory
        run: |
          set -euo pipefail
          echo "Staging tfplan para o diretório de trabalho: $(pwd)"
          echo "Conteúdo de _tfplan_artifact:"
          ls -la "${GITHUB_WORKSPACE}/_tfplan_artifact" || true
          if [ ! -f "${GITHUB_WORKSPACE}/_tfplan_artifact/tfplan" ]; then
            echo "ERRO: tfplan não encontrado em _tfplan_artifact"
            echo "Arquivos encontrados:"
            find "${GITHUB_WORKSPACE}/_tfplan_artifact" -maxdepth 3 -type f -print || true
            exit 1
          fi
          cp -f "${GITHUB_WORKSPACE}/_tfplan_artifact/tfplan" "./tfplan"
          cp -f "${GITHUB_WORKSPACE}/_tfplan_artifact/plan-output.txt" "./plan-output.txt" || true
          echo "OK: tfplan copiado para $(pwd)/tfplan"
          ls -la ./tfplan

      - name: Verify Plan File Exists
        run: |
          set -euo pipefail
          PLAN_FILE="tfplan"
          if [ ! -f "$PLAN_FILE" ]; then
            echo "ERRO: Plan file não encontrado: $PLAN_FILE"
            echo "Diretório atual: $(pwd)"
            echo "Arquivos no diretório:"
            ls -la || true
            echo ""
            echo "Arquivos tfplan* encontrados:"
            find . -name "tfplan*" -type f 2>/dev/null || echo "Nenhum arquivo tfplan encontrado"
            exit 1
          fi
          echo "OK: Plan file encontrado: $PLAN_FILE"
          echo "Tamanho do arquivo: $(du -h $PLAN_FILE | cut -f1)"

      - name: Verify Plan Artifact Integrity
        run: |
          set -euo pipefail
          PLAN_FILE="tfplan"
          if [ ! -f "$PLAN_FILE" ]; then
            echo "ERRO: Plan file não encontrado após download"
            exit 1
          fi

          # Calcular checksum
          PLAN_CHECKSUM=$(sha256sum "$PLAN_FILE" | cut -d' ' -f1)
          echo "OK: Plan file checksum: ${PLAN_CHECKSUM}"
          echo "plan_checksum=${PLAN_CHECKSUM}" >> $GITHUB_OUTPUT

          # Validar tamanho
          PLAN_SIZE=$(stat -f%z "$PLAN_FILE" 2>/dev/null || stat -c%s "$PLAN_FILE" 2>/dev/null || echo "0")
          if [ "$PLAN_SIZE" -eq 0 ]; then
            echo "ERRO: Plan file está vazio ou corrompido"
            exit 1
          fi
          echo "OK: Plan file tamanho: ${PLAN_SIZE} bytes"

      - name: Terraform Init
        run: |
          set -euo pipefail

          # Tentar init normal primeiro
          if terraform init -input=false -upgrade -backend-config=backend.hcl 2>&1; then
            echo "✅ Terraform init concluído com sucesso"
          else
            # Se falhou por mudança de backend, tentar migrar estado com resposta automática
            echo "⚠️  Mudança no backend detectada, tentando migrar estado..."
            # Usar echo "yes" para responder automaticamente à pergunta de migração
            if echo "yes" | terraform init -input=false -upgrade -migrate-state -backend-config=backend.hcl 2>&1; then
              echo "✅ Estado migrado com sucesso"
            else
              # Se migração falhar, criar workspace primeiro (se necessário) e depois reconfigurar
              echo "⚠️  Migração falhou, criando workspace se necessário e forçando reconfiguração..."
              WORKSPACE="${{ needs.detect-environment.outputs.workspace }}"
              # Criar workspace antes do reconfigure (se não existir)
              terraform workspace select "$WORKSPACE" 2>/dev/null || terraform workspace new "$WORKSPACE" 2>/dev/null || true
              # Forçar reconfiguração do backend
              terraform init -input=false -upgrade -reconfigure -backend-config=backend.hcl
              echo "✅ Backend reconfigurado"
            fi
          fi

      - name: Validate Terraform Workspace
        run: |
          set -euo pipefail
          WORKSPACE="${{ needs.detect-environment.outputs.workspace }}"

          echo "Validando workspace Terraform: $WORKSPACE"

          # Listar workspaces disponíveis
          WORKSPACES=$(terraform workspace list 2>/dev/null || echo "")

          # Verificar se há workspaces corrompidos
          if echo "$WORKSPACES" | grep -q "error\|corrupt\|fatal"; then
            echo "ERRO: Workspace em estado inválido detectado"
            exit 1
          fi

          echo "OK: Workspaces válidos"

      - name: Select Workspace
        run: |
          set -euo pipefail
          WORKSPACE="${{ needs.detect-environment.outputs.workspace }}"

          if terraform workspace select "$WORKSPACE" 2>/dev/null; then
            echo "OK: Workspace $WORKSPACE selecionado"
          else
            echo "Criando workspace $WORKSPACE..."
            if ! terraform workspace new "$WORKSPACE"; then
              echo "ERRO: Falha ao criar workspace $WORKSPACE"
              exit 1
            fi
            echo "OK: Workspace $WORKSPACE criado"
          fi

          # Verificar workspace atual
          CURRENT_WS=$(terraform workspace show)
          if [ "$CURRENT_WS" != "$WORKSPACE" ]; then
            echo "ERRO: Workspace incorreto. Esperado: $WORKSPACE, Atual: $CURRENT_WS"
            exit 1
          fi

      - name: Validate terraform.tfvars File
        run: |
          set -euo pipefail
          TFVARS_FILE="${{ needs.detect-environment.outputs.tfvars_file }}"
          ENV="${{ needs.detect-environment.outputs.environment }}"

          echo "=== Validação do arquivo tfvars (terraform-apply) ==="
          echo "Environment: ${ENV}"
          echo "Arquivo esperado: ${TFVARS_FILE}"
          echo "Diretório de trabalho: $(pwd)"
          echo ""

          # Verificar se o nome do arquivo está definido
          if [ -z "$TFVARS_FILE" ]; then
            echo "ERRO: Nome do arquivo tfvars está vazio"
            echo "Environment output: ${ENV}"
            exit 1
          fi

          # Listar arquivos tfvars disponíveis para debug
          echo "Arquivos tfvars disponíveis:"
          ls -la terraform.tfvars.* 2>/dev/null || echo "  Nenhum arquivo encontrado"
          echo ""

          if [ ! -f "$TFVARS_FILE" ]; then
            echo "ERRO: Arquivo não encontrado: $TFVARS_FILE"
            echo ""
            echo "Arquivos disponíveis no diretório:"
            ls -la *.tfvars* 2>/dev/null || echo "  Nenhum arquivo .tfvars encontrado"
            exit 1
          fi

          if [ ! -s "$TFVARS_FILE" ]; then
            echo "ERRO: Arquivo vazio: $TFVARS_FILE"
            exit 1
          fi

          # Validar sintaxe básica HCL
          if ! grep -q "=" "$TFVARS_FILE"; then
            echo "WARNING: Arquivo pode não conter variáveis válidas"
          fi

          echo "OK: Arquivo $TFVARS_FILE validado"
          echo "Tamanho: $(wc -l < "$TFVARS_FILE") linhas"

      - name: Pre-Apply Validation
        run: |
          set -euo pipefail
          CURRENT_WORKSPACE=$(terraform workspace show)
          EXPECTED_WORKSPACE="${{ needs.detect-environment.outputs.workspace }}"

          if [ "$CURRENT_WORKSPACE" != "$EXPECTED_WORKSPACE" ]; then
            echo "ERRO: Workspace mismatch"
            echo "Esperado: $EXPECTED_WORKSPACE"
            echo "Atual: $CURRENT_WORKSPACE"
            exit 1
          fi

          echo "OK: Workspace correto: $CURRENT_WORKSPACE"

      - name: Validate Plan for Destructive Changes
        id: validate-plan
        run: |
          set -euo pipefail
          echo "Validando plan para mudanças destrutivas..."

          # CRÍTICO: Definir todas as variáveis ANTES de usar (evita erro "unbound variable" com set -euo pipefail)
          ENV="${{ needs.detect-environment.outputs.environment }}"
          TFVARS_FILE="${{ needs.detect-environment.outputs.tfvars_file }}"
          ALLOW_DESTROY="${{ needs.detect-environment.outputs.allow_destroy }}"

          # Extrair valores do tfvars ANTES de qualquer uso
          if [ -f "$TFVARS_FILE" ]; then
            RG_NAME_NEW=$(grep "^resource_group_name" "$TFVARS_FILE" 2>/dev/null | head -1 | sed 's/.*= *"\([^"]*\)".*/\1/' | sed "s/.*= *'\([^']*\)'.*/\1/" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' || echo "")
            VM_NAME_NEW=$(grep "^vm_name" "$TFVARS_FILE" 2>/dev/null | head -1 | sed 's/.*= *"\([^"]*\)".*/\1/' | sed "s/.*= *'\([^']*\)'.*/\1/" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' || echo "")
          else
            RG_NAME_NEW=""
            VM_NAME_NEW=""
          fi

          # Tentar obter do terraform state/output
          RG_NAME_FROM_STATE=$(terraform output -raw resource_group_name 2>/dev/null || echo "")
          VM_NAME_FROM_STATE=$(terraform output -raw vm_name 2>/dev/null || echo "")

          # Usar valores do tfvars (novos) ou do state (atuais)
          RG_NAME_CURRENT="${RG_NAME_FROM_STATE:-${RG_NAME_NEW}}"
          VM_NAME_CURRENT="${VM_NAME_FROM_STATE:-${VM_NAME_NEW}}"

          # Fallback final baseado no ambiente
          if [ -z "$VM_NAME_CURRENT" ]; then
            case "$ENV" in
              staging) VM_NAME_CURRENT="skyfirstlabs-staging" ;;
              prod) VM_NAME_CURRENT="skyfirstlabs-prod" ;;
              poc-sky) VM_NAME_CURRENT="poc-sky" ;;
              *) VM_NAME_CURRENT="poc-sky" ;;
            esac
          fi

          echo "Valores detectados:"
          echo "  Environment: $ENV"
          echo "  Resource Group (novo): ${RG_NAME_NEW:-<não definido>}"
          echo "  Resource Group (atual no state): ${RG_NAME_FROM_STATE:-<não encontrado>}"
          echo "  VM Name (novo): ${VM_NAME_NEW:-<não definido>}"
          echo "  VM Name (atual no state): ${VM_NAME_FROM_STATE:-<não encontrado>}"
          echo ""

          # Verificar se o plan contém mudanças destrutivas (delete)
          # Ignorar null_resource pois são recursos efêmeros que são recriados frequentemente
          DESTROY_COUNT=$(terraform show -json tfplan | jq -r '[.resource_changes[]? | select(.change.actions[]? == "delete" and .type != "null_resource")] | length' || echo "0")

          if [ "$DESTROY_COUNT" -gt 0 ]; then
            echo "⚠️  WARNING: Plan contém $DESTROY_COUNT mudança(s) destrutiva(s)!"
            echo ""
            echo "Recursos que serão destruídos:"
            DESTROYED_RESOURCES=$(terraform show -json tfplan | jq -r '.resource_changes[]? | select(.change.actions[]? == "delete" and .type != "null_resource") | "\(.address) (\(.type))"' || echo "")
            echo "$DESTROYED_RESOURCES" | while read -r resource; do
              echo "  - $resource"
            done
            echo ""
            
            # Verificar se é migração de Resource Group (não destruição real)
            IS_MIGRATION=false
            if [ -n "$RG_NAME_FROM_STATE" ] && [ -n "$RG_NAME_NEW" ] && [ "$RG_NAME_FROM_STATE" != "$RG_NAME_NEW" ]; then
              echo "🔍 DETECÇÃO: Migração de Resource Group detectada!"
              echo "   Resource Group atual (no state): $RG_NAME_FROM_STATE"
              echo "   Resource Group novo (no tfvars): $RG_NAME_NEW"
              echo "   Isso é uma MIGRAÇÃO, não destruição real"
              IS_MIGRATION=true
            fi
            
            # Verificar se os recursos que serão destruídos já existem no Azure
            # Se existirem, pode ser apenas replacement (não é realmente destrutivo)
            echo "Verificando se recursos já existem no Azure..."
            RESOURCES_EXIST_IN_AZURE=true
            
            # Verificar no Resource Group atual (se é migração) ou novo
            RG_TO_CHECK="${RG_NAME_FROM_STATE:-${RG_NAME_NEW}}"
            
            if [ -n "$RG_TO_CHECK" ]; then
              echo "Verificando recursos no Resource Group: $RG_TO_CHECK"
              
              # Verificar VM
              if echo "$DESTROYED_RESOURCES" | grep -q "azurerm_linux_virtual_machine"; then
                # Verificar se VM existe no RG atual (migração) ou novo
                VM_TO_CHECK="${VM_NAME_FROM_STATE:-${VM_NAME_NEW:-$VM_NAME_CURRENT}}"
                
                # Se é migração, verificar também no RG novo
                if [ "$IS_MIGRATION" = "true" ] && [ -n "$RG_NAME_NEW" ]; then
                  if az vm show -g "$RG_NAME_NEW" -n "$VM_TO_CHECK" --query id -o tsv > /dev/null 2>&1; then
                    echo "  ✅ VM '$VM_TO_CHECK' já existe no Resource Group destino '$RG_NAME_NEW'"
                    echo "  ℹ️  Isso é uma migração - recursos já estão no destino"
                    RESOURCES_EXIST_IN_AZURE=true
                  elif az vm show -g "$RG_NAME_FROM_STATE" -n "$VM_TO_CHECK" --query id -o tsv > /dev/null 2>&1; then
                    echo "  ✅ VM '$VM_TO_CHECK' existe no Resource Group origem '$RG_NAME_FROM_STATE'"
                    echo "  ℹ️  Será migrada para '$RG_NAME_NEW' (não destruída)"
                    RESOURCES_EXIST_IN_AZURE=true
                  else
                    echo "  ⚠️  VM '$VM_TO_CHECK' NÃO existe em nenhum Resource Group"
                    RESOURCES_EXIST_IN_AZURE=false
                  fi
                else
                  # Não é migração, verificar normalmente
                  if az vm show -g "$RG_TO_CHECK" -n "$VM_TO_CHECK" --query id -o tsv > /dev/null 2>&1; then
                    echo "  ✅ VM '$VM_TO_CHECK' existe no Azure (replacement será apenas atualização)"
                  else
                    echo "  ⚠️  VM '$VM_TO_CHECK' NÃO existe no Azure"
                    RESOURCES_EXIST_IN_AZURE=false
                  fi
                fi
              fi
              
              # Verificar Bastion
              if echo "$DESTROYED_RESOURCES" | grep -q "azurerm_bastion_host"; then
                BASTION_NAME="ai-saas-bastion-${ENV}"
                
                # Se é migração, verificar em ambos os RGs
                if [ "$IS_MIGRATION" = "true" ] && [ -n "$RG_NAME_NEW" ] && [ -n "$RG_NAME_FROM_STATE" ]; then
                  if az network bastion show -g "$RG_NAME_NEW" -n "$BASTION_NAME" --query id -o tsv > /dev/null 2>&1; then
                    echo "  ✅ Bastion '$BASTION_NAME' já existe no Resource Group destino '$RG_NAME_NEW'"
                  elif az network bastion show -g "$RG_NAME_FROM_STATE" -n "$BASTION_NAME" --query id -o tsv > /dev/null 2>&1; then
                    echo "  ✅ Bastion '$BASTION_NAME' existe no Resource Group origem '$RG_NAME_FROM_STATE'"
                    echo "  ℹ️  Será migrado para '$RG_NAME_NEW' (não destruído)"
                  else
                    echo "  ⚠️  Bastion '$BASTION_NAME' NÃO existe em nenhum Resource Group"
                  fi
                else
                  # Verificar normalmente
                  if az network bastion show -g "$RG_TO_CHECK" -n "$BASTION_NAME" --query id -o tsv > /dev/null 2>&1; then
                    echo "  ✅ Bastion '$BASTION_NAME' existe no Azure (replacement será apenas atualização)"
                  else
                    echo "  ⚠️  Bastion '$BASTION_NAME' NÃO existe no Azure"
                  fi
                fi
              fi
              
              # Verificar Resource Group
              if echo "$DESTROYED_RESOURCES" | grep -q "azurerm_resource_group"; then
                # Se é migração, verificar ambos os RGs
                if [ "$IS_MIGRATION" = "true" ]; then
                  if [ -n "$RG_NAME_FROM_STATE" ] && az group show -n "$RG_NAME_FROM_STATE" --query id -o tsv > /dev/null 2>&1; then
                    echo "  ✅ Resource Group origem '$RG_NAME_FROM_STATE' existe no Azure"
                  fi
                  if [ -n "$RG_NAME_NEW" ] && az group show -n "$RG_NAME_NEW" --query id -o tsv > /dev/null 2>&1; then
                    echo "  ✅ Resource Group destino '$RG_NAME_NEW' existe no Azure"
                    echo "  ℹ️  Migração: recursos serão movidos para este RG"
                  elif [ -n "$RG_NAME_NEW" ]; then
                    echo "  ℹ️  Resource Group destino '$RG_NAME_NEW' será criado (migração)"
                  fi
                else
                  # Verificação normal
                  if az group show -n "$RG_TO_CHECK" --query id -o tsv > /dev/null 2>&1; then
                    echo "  ✅ Resource Group '$RG_TO_CHECK' existe no Azure"
                    echo "  ⚠️  Replacement do RG geralmente é apenas atualização de tags/nome (Azure não destrói realmente)"
                  else
                    echo "  ❌ Resource Group '$RG_TO_CHECK' NÃO existe no Azure"
                    RESOURCES_EXIST_IN_AZURE=false
                  fi
                fi
              fi
              
              echo ""
              
              # Se é migração de Resource Group, permitir sempre
              if [ "$IS_MIGRATION" = "true" ]; then
                echo "✅ MIGRAÇÃO DE RESOURCE GROUP DETECTADA"
                echo "   Resource Group origem: $RG_NAME_FROM_STATE"
                echo "   Resource Group destino: $RG_NAME_NEW"
                echo ""
                echo "ℹ️  Isso é uma MIGRAÇÃO, não destruição real."
                echo "ℹ️  Recursos serão movidos para o novo Resource Group."
                echo "ℹ️  Continuando com apply... (migração é permitida)"
              elif [ "$RESOURCES_EXIST_IN_AZURE" = "true" ]; then
                echo "✅ Todos os recursos que serão 'destruídos' já existem no Azure."
                echo "⚠️  Isso indica que são replacements (atualizações), não destruições reais."
                echo "⚠️  O Azure geralmente atualiza recursos sem realmente destruí-los em replacements."
                echo ""
                echo "⚠️  Continuando com apply... (replacement não é realmente destrutivo quando recursos existem)"
              else
                echo "❌ Alguns recursos não existem no Azure - isso pode ser realmente destrutivo!"
                echo ""
                # Se allow_destroy for false, falhar
                if [ "$ALLOW_DESTROY" != "true" ]; then
                  echo "ERRO: Mudanças destrutivas não permitidas (allow_destroy=false)"
                  echo "Se você realmente quer destruir recursos, defina allow_destroy=true no workflow_dispatch"
                  exit 1
                else
                  echo "WARNING: AVISO: Mudanças destrutivas permitidas (allow_destroy=true)"
                  echo "Continuando com apply..."
                fi
              fi
            else
              echo "⚠️  Não foi possível verificar se recursos existem (RG não encontrado)"
              echo "   Tentou obter de: terraform output e $TFVARS_FILE"
              echo ""
              
              # Tentar verificar se pelo menos o tfvars tem valores válidos
              if [ -f "$TFVARS_FILE" ]; then
                echo "   Tentando extrair informações do tfvars para diagnóstico..."
                RG_FROM_TFVARS=$(grep "^resource_group_name" "$TFVARS_FILE" 2>/dev/null | head -1 | sed 's/.*= *"\([^"]*\)".*/\1/' | sed "s/.*= *'\([^']*\)'.*/\1/" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' || echo "")
                if [ -n "$RG_FROM_TFVARS" ]; then
                  echo "   Resource Group no tfvars: $RG_FROM_TFVARS"
                  echo "   ⚠️  Pode ser que o Resource Group não exista ainda (será criado)"
                fi
              fi
              echo ""
              
              # Verificar se é migração mesmo sem RG no state
              if [ -n "$RG_NAME_NEW" ] && [ -n "$RG_NAME_FROM_STATE" ] && [ "$RG_NAME_FROM_STATE" != "$RG_NAME_NEW" ]; then
                echo "✅ MIGRAÇÃO DE RESOURCE GROUP DETECTADA (mesmo sem RG no state)"
                echo "   Resource Group destino: $RG_NAME_NEW"
                echo "ℹ️  Continuando com apply... (migração é permitida)"
              elif [ "$ALLOW_DESTROY" != "true" ]; then
                echo "ERRO: Mudanças destrutivas não permitidas (allow_destroy=false)"
                echo "Se você realmente quer destruir recursos, defina allow_destroy=true no workflow_dispatch"
                exit 1
              else
                echo "WARNING: AVISO: Mudanças destrutivas permitidas (allow_destroy=true)"
                echo "Continuando com apply..."
              fi
            fi
          else
            echo "✅ Nenhuma mudança destrutiva detectada"
          fi

          # Mostrar null_resources que serão recriados (apenas informativo)
          NULL_RECREATE_COUNT=$(terraform show -json tfplan | jq -r '[.resource_changes[]? | select(.type == "null_resource" and (.change.actions | contains(["delete", "create"])))] | length' || echo "0")
          if [ "$NULL_RECREATE_COUNT" -gt 0 ]; then
            echo "INFO: $NULL_RECREATE_COUNT null_resource(s) serão recriados (comportamento esperado devido a triggers):"
            terraform show -json tfplan | jq -r '.resource_changes[]? | select(.type == "null_resource" and (.change.actions | contains(["delete", "create"]))) | "  - \(.address)"' || true
          fi

          # Verificar se há mudanças que requerem recriação (destroy + create)
          # Ignorar null_resource na contagem de recriações críticas
          RECREATE_COUNT=$(terraform show -json tfplan | jq -r '[.resource_changes[]? | select(.type != "null_resource" and (.change.actions | contains(["delete", "create"])))] | length' || echo "0")

          if [ "$RECREATE_COUNT" -gt 0 ]; then
            echo "WARNING: AVISO: Plan contém $RECREATE_COUNT recurso(s) que serão recriados (destroy + create)"
            terraform show -json tfplan | jq -r '.resource_changes[]? | select(.type != "null_resource" and (.change.actions | contains(["delete", "create"]))) | "  - \(.address) (\(.type))"' || true
          fi

          # Contar total de mudanças
          TOTAL_CHANGES=$(terraform show -json tfplan | jq -r '[.resource_changes[]? | select(.change.actions[]? != "no-op")] | length' || echo "0")
          echo "Total de recursos com mudanças: $TOTAL_CHANGES"

          echo "destroy_count=$DESTROY_COUNT" >> $GITHUB_OUTPUT
          echo "recreate_count=$RECREATE_COUNT" >> $GITHUB_OUTPUT
          echo "total_changes=$TOTAL_CHANGES" >> $GITHUB_OUTPUT

      - name: Import Existing Resources (if needed)
        run: |
          set -euo pipefail
          echo "Verificando se há recursos existentes que precisam ser importados..."

          # Obter nome do Resource Group do terraform.tfvars
          TFVARS_FILE="${{ needs.detect-environment.outputs.tfvars_file }}"
          RESOURCE_GROUP_NAME=$(grep "resource_group_name" "$TFVARS_FILE" | head -1 | sed 's/.*= *"\([^"]*\)".*/\1/' | sed "s/.*= *'\([^']*\)'.*/\1/" | tr -d ' ' || echo "")

          if [ -z "$RESOURCE_GROUP_NAME" ]; then
            echo "WARNING: Não foi possível obter resource_group_name do tfvars"
            echo "Pulando importação de recursos existentes"
            exit 0
          fi

          echo "Resource Group: $RESOURCE_GROUP_NAME"
          SUBSCRIPTION_ID="${ARM_SUBSCRIPTION_ID}"
          RESOURCE_ID="/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${RESOURCE_GROUP_NAME}"
          NEEDS_IMPORT=false
          PLAN_REGENERATED=false

          # Verificar se Resource Group existe no Azure
          if az group show --name "$RESOURCE_GROUP_NAME" --query id -o tsv > /dev/null 2>&1; then
            echo "Resource Group existe no Azure: $RESOURCE_GROUP_NAME"
            
            # Verificar se já está no estado do Terraform
            if terraform state show azurerm_resource_group.main > /dev/null 2>&1; then
              echo "OK: Resource Group já está no estado do Terraform"
            else
              echo "Importando Resource Group existente para o estado do Terraform..."
              NEEDS_IMPORT=true
              
              # Tentar importar (não falhar se já estiver importado)
              set +e  # Desabilitar exit on error temporariamente
              terraform import azurerm_resource_group.main "$RESOURCE_ID" 2>&1
              IMPORT_EXIT_CODE=$?
              set -e  # Reabilitar exit on error
              
              if [ $IMPORT_EXIT_CODE -eq 0 ]; then
                echo "✅ Resource Group importado com sucesso"
              else
                echo "WARNING: Import falhou (exit code: $IMPORT_EXIT_CODE)"
                echo "Pode já estar importado ou haver outro problema"
                # Verificar novamente se está no estado
                if terraform state show azurerm_resource_group.main > /dev/null 2>&1; then
                  echo "OK: Resource Group está no estado (import pode ter sido feito anteriormente)"
                fi
              fi
            fi
            
            # SEMPRE regenerar plan se Resource Group existe (pode ter sido importado agora)
            echo "Regenerando plan após verificação/importação..."
            terraform plan \
              -var-file="$TFVARS_FILE" \
              -var="subscription_id=${ARM_SUBSCRIPTION_ID}" \
              -out=tfplan \
              -no-color \
              -detailed-exitcode 2>&1 | tee plan-output.txt || true
            PLAN_REGENERATED=true
            echo "✅ Plan regenerado após verificação/importação"
          else
            echo "Resource Group não existe no Azure, será criado pelo Terraform"
            echo "Usando plan original (sem regeneração)"
          fi

      - name: Terraform Apply
        id: apply
        run: |
          set -euo pipefail
          echo "Aplicando mudanças do Terraform..."

          # CRÍTICO: Definir ALLOW_DESTROY no início do step
          ALLOW_DESTROY="${{ needs.detect-environment.outputs.allow_destroy }}"

          # Verificar se plan file existe
          if [ ! -f "tfplan" ]; then
            echo "ERRO: Plan file não encontrado"
            echo "Diretório atual: $(pwd)"
            echo "Arquivos no diretório:"
            ls -la || true
            exit 1
          fi

          echo "Plan file encontrado, tamanho: $(du -h tfplan | cut -f1)"

          # Verificação crítica: se plan tenta criar Resource Group, verificar se já existe no Azure
          TFVARS_FILE="${{ needs.detect-environment.outputs.tfvars_file }}"

          if [ -f "$TFVARS_FILE" ]; then
            # Extrair nome do Resource Group do tfvars
            RESOURCE_GROUP_NAME=$(grep "^resource_group_name" "$TFVARS_FILE" | head -1 | \
              sed 's/.*= *"\([^"]*\)".*/\1/' | \
              sed "s/.*= *'\([^']*\)'.*/\1/" | \
              sed 's/^[[:space:]]*//;s/[[:space:]]*$//' || echo "")
            
            if [ -n "$RESOURCE_GROUP_NAME" ]; then
              # Verificar se o plan tenta criar o Resource Group
              # Usar jq se disponível, senão usar grep como fallback
              PLAN_TRIES_TO_CREATE_RG=false
              
              if command -v jq >/dev/null 2>&1; then
                if terraform show -json tfplan | \
                  jq -e '.resource_changes[]? | select(.address == "azurerm_resource_group.main" and (.change.actions[]? == "create"))' > /dev/null 2>&1; then
                  PLAN_TRIES_TO_CREATE_RG=true
                fi
              else
                # Fallback: verificar via terraform show (texto)
                if terraform show tfplan 2>/dev/null | grep -q "azurerm_resource_group.main.*will be created"; then
                  PLAN_TRIES_TO_CREATE_RG=true
                fi
              fi
              
              if [ "$PLAN_TRIES_TO_CREATE_RG" = "true" ]; then
                echo "WARNING: Plan tenta criar Resource Group: $RESOURCE_GROUP_NAME"
                
                # Verificar se Resource Group já existe no Azure
                if az group show --name "$RESOURCE_GROUP_NAME" --query id -o tsv > /dev/null 2>&1; then
                  echo "⚠️  RG existe no Azure, mas o plan quer criar."
                  
                  # CRÍTICO: Verificar se já está no estado do Terraform antes de tentar importar
                  if terraform state show azurerm_resource_group.main > /dev/null 2>&1; then
                    echo "✅ Resource Group já está no estado do Terraform."
                    echo "⚠️  O plan quer criar porque há diferença entre estado e configuração."
                    echo "⚠️  Fazendo refresh-only para sincronizar estado com Azure..."
                    
                    # Fazer refresh-only para sincronizar estado
                    terraform apply -refresh-only \
                      -var-file="$TFVARS_FILE" \
                      -var="subscription_id=${ARM_SUBSCRIPTION_ID}" \
                      -auto-approve \
                      -input=false 2>&1 | tee refresh-output.txt || {
                      echo "⚠️  Refresh-only falhou, mas continuando..."
                    }
                    
                    echo "Regerando plan após refresh-only..."
                    terraform plan \
                      -var-file="$TFVARS_FILE" \
                      -var="subscription_id=${ARM_SUBSCRIPTION_ID}" \
                      -out=tfplan \
                      -no-color
                    
                    echo "Verificando se plan ainda tenta criar RG após refresh..."
                    PLAN_STILL_CREATES_RG=false
                    if command -v jq >/dev/null 2>&1; then
                      if terraform show -json tfplan | \
                        jq -e '.resource_changes[]? | select(.address == "azurerm_resource_group.main" and (.change.actions[]? == "create"))' > /dev/null 2>&1; then
                        PLAN_STILL_CREATES_RG=true
                      fi
                    else
                      if terraform show tfplan 2>/dev/null | grep -q "azurerm_resource_group.main.*will be created"; then
                        PLAN_STILL_CREATES_RG=true
                      fi
                    fi
                    
                    if [ "$PLAN_STILL_CREATES_RG" = "true" ]; then
                      echo "⚠️  Plan ainda tenta criar RG após refresh-only."
                      echo "⚠️  Isso pode ser por diferença de nome/tags (Azure é case-insensitive, Terraform não)."
                      
                      # CRÍTICO: Verificar se plan vai destruir recursos dependentes (VM, Bastion, etc.)
                      echo ""
                      echo "🔍 Verificando se plan vai destruir recursos críticos (VM, Bastion)..."
                      
                      # Detectar se é migração de Resource Group
                      RG_NAME_FROM_STATE=$(terraform output -raw resource_group_name 2>/dev/null || echo "")
                      RG_NAME_NEW="$RESOURCE_GROUP_NAME"
                      IS_MIGRATION=false
                      if [ -n "$RG_NAME_FROM_STATE" ] && [ -n "$RG_NAME_NEW" ] && [ "$RG_NAME_FROM_STATE" != "$RG_NAME_NEW" ]; then
                        echo "✅ MIGRAÇÃO DE RESOURCE GROUP DETECTADA"
                        echo "   Resource Group atual (no state): $RG_NAME_FROM_STATE"
                        echo "   Resource Group novo (no tfvars): $RG_NAME_NEW"
                        IS_MIGRATION=true
                      fi
                      
                      CRITICAL_RESOURCES_DESTROYED=false
                      if command -v jq >/dev/null 2>&1; then
                        DESTROYED_VM=$(terraform show -json tfplan | jq -r '[.resource_changes[]? | select((.address == "azurerm_linux_virtual_machine.main" or .address == "azurerm_bastion_host.main[0]") and (.change.actions[]? == "delete" or .change.actions[]? == "replace"))] | length' || echo "0")
                        if [ "$DESTROYED_VM" != "0" ] && [ "$DESTROYED_VM" != "" ]; then
                          CRITICAL_RESOURCES_DESTROYED=true
                        fi
                      else
                        if terraform show tfplan 2>/dev/null | grep -qE "(azurerm_linux_virtual_machine.main|azurerm_bastion_host.main).*(will be destroyed|must be replaced)"; then
                          CRITICAL_RESOURCES_DESTROYED=true
                        fi
                      fi
                      
                      if [ "$CRITICAL_RESOURCES_DESTROYED" = "true" ]; then
                        if [ "$IS_MIGRATION" = "true" ]; then
                          echo "✅ É uma MIGRAÇÃO de Resource Group - permitindo destruição de recursos críticos"
                          echo "ℹ️  Recursos serão movidos de '$RG_NAME_FROM_STATE' para '$RG_NAME_NEW'"
                          echo "ℹ️  Continuando com apply..."
                        else
                          echo "❌ ERRO CRÍTICO: Plan vai destruir recursos críticos (VM ou Bastion)!"
                          echo "❌ Isso é DESTRUTIVO e NÃO é permitido sem allow_destroy=true"
                          echo ""
                          echo "Recursos que serão destruídos:"
                          terraform show -json tfplan | jq -r '.resource_changes[]? | select((.address == "azurerm_linux_virtual_machine.main" or .address == "azurerm_bastion_host.main[0]") and (.change.actions[]? == "delete" or .change.actions[]? == "replace")) | "  - \(.address) (\(.type))"' || terraform show tfplan 2>/dev/null | grep -E "(azurerm_linux_virtual_machine.main|azurerm_bastion_host.main).*(will be destroyed|must be replaced)" || true
                          echo ""
                          echo "❌ FALHANDO WORKFLOW para proteger recursos críticos."
                          echo "❌ Se realmente precisa fazer isso, execute o workflow com allow_destroy=true"
                          exit 1
                        fi
                      else
                        echo "✅ Nenhum recurso crítico será destruído"
                        echo "⚠️  Continuando com apply (Azure não destrói realmente em replacements de RG)"
                      fi
                    else
                      echo "✅ Auto-correção OK: plan não tenta criar RG após refresh-only"
                    fi
                  else
                    echo "⚠️  RG NÃO está no estado do Terraform. Tentando importar..."
                    SUBSCRIPTION_ID="${ARM_SUBSCRIPTION_ID}"
                    RESOURCE_ID="/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${RESOURCE_GROUP_NAME}"
                    
                    echo "Importando RG no state..."
                    set +e  # Desabilitar exit on error temporariamente
                    terraform import \
                      -var-file="$TFVARS_FILE" \
                      -var="subscription_id=${SUBSCRIPTION_ID}" \
                      azurerm_resource_group.main "$RESOURCE_ID" 2>&1 | tee import-output.txt
                    IMPORT_EXIT_CODE=${PIPESTATUS[0]}
                    set -e  # Reabilitar exit on error
                    
                    if [ $IMPORT_EXIT_CODE -eq 0 ]; then
                      echo "✅ Resource Group importado com sucesso"
                    else
                      # Verificar se o erro é "already managed"
                      if grep -q "Resource already managed" import-output.txt 2>/dev/null || grep -q "already managed" import-output.txt 2>/dev/null; then
                        echo "⚠️  Resource Group já está no estado (import falhou porque já estava gerenciado)"
                        # Verificar se realmente está no estado
                        if terraform state show azurerm_resource_group.main > /dev/null 2>&1; then
                          echo "✅ Confirmado: Resource Group está no estado"
                        else
                          echo "❌ ERRO: Import falhou e Resource Group não está no estado"
                          exit 1
                        fi
                      else
                        echo "❌ ERRO: Falha ao importar Resource Group (exit code: $IMPORT_EXIT_CODE)"
                        cat import-output.txt
                        exit 1
                      fi
                    fi
                    
                    echo "Verificando state do RG após import..."
                    terraform state show azurerm_resource_group.main || true
                    
                    echo "Regerando plan após import..."
                    terraform plan \
                      -var-file="$TFVARS_FILE" \
                      -var="subscription_id=${SUBSCRIPTION_ID}" \
                      -out=tfplan \
                      -no-color
                    
                    echo "Revalidando se plan ainda tenta criar RG e se vai destruir recursos críticos..."
                    
                    # Verificar se ainda tenta criar RG
                    PLAN_STILL_CREATES_RG_AFTER_IMPORT=false
                    if command -v jq >/dev/null 2>&1; then
                      if terraform show -json tfplan | \
                        jq -e '.resource_changes[]? | select(.address == "azurerm_resource_group.main" and (.change.actions[]? == "create"))' > /dev/null 2>&1; then
                        PLAN_STILL_CREATES_RG_AFTER_IMPORT=true
                      fi
                    else
                      if terraform show tfplan 2>/dev/null | grep -q "azurerm_resource_group.main.*will be created"; then
                        PLAN_STILL_CREATES_RG_AFTER_IMPORT=true
                      fi
                    fi
                    
                    # CRÍTICO: Verificar se plan vai destruir recursos críticos
                    # Detectar se é migração de Resource Group
                    RG_NAME_FROM_STATE=$(terraform output -raw resource_group_name 2>/dev/null || echo "")
                    RG_NAME_NEW="$RESOURCE_GROUP_NAME"
                    IS_MIGRATION=false
                    if [ -n "$RG_NAME_FROM_STATE" ] && [ -n "$RG_NAME_NEW" ] && [ "$RG_NAME_FROM_STATE" != "$RG_NAME_NEW" ]; then
                      echo "✅ MIGRAÇÃO DE RESOURCE GROUP DETECTADA"
                      echo "   Resource Group atual (no state): $RG_NAME_FROM_STATE"
                      echo "   Resource Group novo (no tfvars): $RG_NAME_NEW"
                      IS_MIGRATION=true
                    fi
                    
                    CRITICAL_RESOURCES_DESTROYED=false
                    if command -v jq >/dev/null 2>&1; then
                      DESTROYED_VM=$(terraform show -json tfplan | jq -r '[.resource_changes[]? | select((.address == "azurerm_linux_virtual_machine.main" or .address == "azurerm_bastion_host.main[0]") and (.change.actions[]? == "delete" or .change.actions[]? == "replace"))] | length' || echo "0")
                      if [ "$DESTROYED_VM" != "0" ] && [ "$DESTROYED_VM" != "" ]; then
                        CRITICAL_RESOURCES_DESTROYED=true
                      fi
                    else
                      if terraform show tfplan 2>/dev/null | grep -qE "(azurerm_linux_virtual_machine.main|azurerm_bastion_host.main).*(will be destroyed|must be replaced)"; then
                        CRITICAL_RESOURCES_DESTROYED=true
                      fi
                    fi
                    
                    if [ "$CRITICAL_RESOURCES_DESTROYED" = "true" ]; then
                      if [ "$IS_MIGRATION" = "true" ]; then
                        echo "✅ É uma MIGRAÇÃO de Resource Group - permitindo destruição de recursos críticos"
                        echo "ℹ️  Recursos serão movidos de '$RG_NAME_FROM_STATE' para '$RG_NAME_NEW'"
                        echo "ℹ️  Continuando com apply..."
                      else
                        echo "❌ ERRO CRÍTICO: Plan vai destruir recursos críticos (VM ou Bastion) mesmo após import!"
                        echo "❌ Isso é DESTRUTIVO e NÃO é permitido sem allow_destroy=true"
                        echo ""
                        echo "Recursos que serão destruídos:"
                        terraform show -json tfplan | jq -r '.resource_changes[]? | select((.address == "azurerm_linux_virtual_machine.main" or .address == "azurerm_bastion_host.main[0]") and (.change.actions[]? == "delete" or .change.actions[]? == "replace")) | "  - \(.address) (\(.type))"' || terraform show tfplan 2>/dev/null | grep -E "(azurerm_linux_virtual_machine.main|azurerm_bastion_host.main).*(will be destroyed|must be replaced)" || true
                        echo ""
                        echo "❌ FALHANDO WORKFLOW para proteger recursos críticos."
                        echo "❌ Possível causa: diferença de nome/case do Resource Group no estado vs Azure"
                        echo "❌ Solução: Corrigir o estado do Terraform para usar o nome correto do RG"
                        exit 1
                      fi
                    elif [ "$PLAN_STILL_CREATES_RG_AFTER_IMPORT" = "true" ]; then
                      echo "⚠️  Ainda tenta criar RG mesmo após import (pode ser diferença de nome/tags)."
                      echo "⚠️  Mas nenhum recurso crítico será destruído - continuando..."
                    else
                      echo "✅ Plan corrigido após import - nenhum problema detectado"
                    fi
                    
                    echo "✅ Processo de import/replan concluído"
                  fi
                else
                  echo "OK: Resource Group não existe no Azure, será criado"
                fi
              else
                echo "OK: Plan não tenta criar Resource Group (já existe no estado ou não será criado)"
              fi
            fi
          fi

          # CRÍTICO: Última verificação antes do apply - garantir que não vai destruir recursos críticos
          echo ""
          echo "🔍 Verificação final: recursos críticos que serão destruídos..."

          # Re-detectar se é migração de Resource Group (mesma lógica da etapa de validação)
          ENV="${{ needs.detect-environment.outputs.environment }}"
          TFVARS_FILE="${{ needs.detect-environment.outputs.tfvars_file }}"

          # Extrair valores do tfvars
          RG_NAME_NEW=""
          if [ -f "$TFVARS_FILE" ]; then
            RG_NAME_NEW=$(grep "^resource_group_name" "$TFVARS_FILE" 2>/dev/null | head -1 | sed 's/.*= *"\([^"]*\)".*/\1/' | sed "s/.*= *'\([^']*\)'.*/\1/" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' || echo "")
          fi

          # Tentar obter do terraform state/output
          RG_NAME_FROM_STATE=$(terraform output -raw resource_group_name 2>/dev/null || echo "")

          # Detectar se é migração
          IS_MIGRATION=false
          if [ -n "$RG_NAME_FROM_STATE" ] && [ -n "$RG_NAME_NEW" ] && [ "$RG_NAME_FROM_STATE" != "$RG_NAME_NEW" ]; then
            echo "✅ MIGRAÇÃO DE RESOURCE GROUP DETECTADA NA VERIFICAÇÃO FINAL"
            echo "   Resource Group atual (no state): $RG_NAME_FROM_STATE"
            echo "   Resource Group novo (no tfvars): $RG_NAME_NEW"
            IS_MIGRATION=true
          fi

          CRITICAL_DESTROYED=$(terraform show -json tfplan | jq -r '[.resource_changes[]? | select((.address == "azurerm_linux_virtual_machine.main" or .address == "azurerm_bastion_host.main[0]") and (.change.actions[]? == "delete" or .change.actions[]? == "replace"))] | length' 2>/dev/null || echo "0")

          if [ "$CRITICAL_DESTROYED" != "0" ] && [ "$CRITICAL_DESTROYED" != "" ]; then
            echo "⚠️  Plan final vai destruir $CRITICAL_DESTROYED recurso(s) crítico(s)!"
            echo ""
            echo "Recursos que serão destruídos:"
            terraform show -json tfplan | jq -r '.resource_changes[]? | select((.address == "azurerm_linux_virtual_machine.main" or .address == "azurerm_bastion_host.main[0]") and (.change.actions[]? == "delete" or .change.actions[]? == "replace")) | "  - \(.address) (\(.type))"' || true
            echo ""
            
            # Se é migração, permitir (recursos serão movidos, não realmente destruídos)
            if [ "$IS_MIGRATION" = "true" ]; then
              echo "✅ É uma MIGRAÇÃO de Resource Group - permitindo destruição de recursos críticos"
              echo "ℹ️  Recursos serão movidos de '$RG_NAME_FROM_STATE' para '$RG_NAME_NEW'"
              echo "ℹ️  Isso é uma operação de MIGRAÇÃO, não destruição real"
              echo "ℹ️  Continuando com apply..."
            elif [ "$ALLOW_DESTROY" = "true" ]; then
              echo "⚠️  AVISO: allow_destroy=true - recursos críticos serão destruídos!"
              echo "⚠️  Continuando com apply..."
            else
              echo "❌ FALHANDO WORKFLOW para proteger recursos críticos."
              echo "❌ Se realmente precisa fazer isso, execute o workflow com allow_destroy=true"
              exit 1
            fi
          else
            echo "✅ Nenhum recurso crítico será destruído - seguro para aplicar"
          fi

          # Aplicar usando o plan file (mais seguro que -auto-approve)
          terraform apply tfplan 2>&1 | tee apply-output.txt
          APPLY_EXIT_CODE=${PIPESTATUS[0]}

          if [ $APPLY_EXIT_CODE -ne 0 ]; then
            echo "ERRO: Terraform apply failed"
            echo ""
            echo "Se o erro for sobre recurso já existente, o import pode não ter funcionado."
            echo "Verifique os logs do step 'Import Existing Resources' acima."
            exit 1
          fi

          echo "OK: Terraform apply concluído com sucesso"

      - name: Get Terraform Outputs
        id: outputs
        run: |
          set -euo pipefail
          echo "Obtendo outputs do Terraform..."

          terraform output -json > outputs.json || {
            echo "ERRO: Falha ao obter outputs do Terraform"
            terraform output
            exit 1
          }

          VM_IP=$(terraform output -raw vm_public_ip 2>/dev/null || echo "")
          VM_NAME=$(terraform output -raw vm_name 2>/dev/null || echo "")
          RESOURCE_GROUP=$(terraform output -raw resource_group_name 2>/dev/null || echo "")

          if [ -z "$VM_IP" ]; then
            echo "ERRO: vm_public_ip não encontrado nos outputs"
            echo "Outputs disponíveis:"
            terraform output
            exit 1
          fi

          if [ -z "$VM_NAME" ]; then
            echo "WARNING: WARNING: vm_name não encontrado nos outputs"
          fi

          if [ -z "$RESOURCE_GROUP" ]; then
            echo "WARNING: WARNING: resource_group_name não encontrado nos outputs"
          fi

          echo "vm_ip=${VM_IP}" >> $GITHUB_OUTPUT
          echo "vm_name=${VM_NAME}" >> $GITHUB_OUTPUT
          echo "resource_group=${RESOURCE_GROUP}" >> $GITHUB_OUTPUT
          echo "OK: Terraform outputs obtidos com sucesso"
          echo "  VM IP: $VM_IP"
          echo "  VM Name: $VM_NAME"
          echo "  Resource Group: $RESOURCE_GROUP"

      - name: Post-Deploy Health Check
        id: health-check
        uses: ./.github/actions/post-deploy-health-check
        with:
          environment: ${{ needs.detect-environment.outputs.environment }}
          vm_ip: ${{ steps.outputs.vm_ip }}
          timeout_minutes: "10"

      - name: Verify Health Check Status
        if: steps.health-check.outcome != 'success'
        run: |
          echo "ERRO: Health check falhou após o deploy"
          echo "O deploy foi concluído, mas a VM não está respondendo corretamente."
          echo "Verifique os logs da VM e os containers Docker."
          exit 1

      - name: Show Terraform Outputs
        run: |
          echo "Terraform Outputs:" >> $GITHUB_STEP_SUMMARY
          echo "```" >> $GITHUB_STEP_SUMMARY
          terraform output -no-color >> $GITHUB_STEP_SUMMARY
          echo "```" >> $GITHUB_STEP_SUMMARY

      - name: Get VM Public IP
        id: vm-ip
        run: |
          # Função para validar se IP é público (não RFC1918)
          is_public_ip() {
            local ip="$1"
            # Valida formato básico de IP
            if ! echo "$ip" | grep -qE '^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$'; then
              return 1
            fi
            # Extrai os octetos para validação numérica
            local octet1 octet2
            octet1=$(echo "$ip" | cut -d. -f1)
            octet2=$(echo "$ip" | cut -d. -f2)
            
            # Rejeita IPs privados (RFC1918):
            # - 10.0.0.0/8 (10.0.0.0 - 10.255.255.255)
            # - 172.16.0.0/12 (172.16.0.0 - 172.31.255.255)
            # - 192.168.0.0/16 (192.168.0.0 - 192.168.255.255)
            if [ "$octet1" -eq 10 ]; then
              return 1  # 10.x.x.x é privado
            fi
            if [ "$octet1" -eq 172 ] && [ "$octet2" -ge 16 ] && [ "$octet2" -le 31 ]; then
              return 1  # 172.16.x.x - 172.31.x.x é privado
            fi
            if [ "$octet1" -eq 192 ] && [ "$octet2" -eq 168 ]; then
              return 1  # 192.168.x.x é privado
            fi
            
            # Rejeita IPs de loopback e multicast
            if [ "$octet1" -eq 127 ] || [ "$octet1" -ge 224 ]; then
              return 1
            fi
            
            return 0
          }

          VM_IP=""

          # Tentar via Terraform output primeiro
          TF_IP=$(terraform output -raw vm_public_ip 2>/dev/null || echo "")
          if [ -n "$TF_IP" ] && is_public_ip "$TF_IP"; then
            VM_IP="$TF_IP"
            echo "✅ IP obtido via Terraform output: $VM_IP"
          else
            if [ -n "$TF_IP" ]; then
              echo "⚠️  Terraform retornou IP inválido/privado: $TF_IP"
              echo "   Tentando obter IP público via Azure CLI..."
            else
              echo "⚠️  VM IP não encontrado no output do Terraform"
              echo "   Tentando obter via Azure CLI..."
            fi
            
            AZ_IP=$(az vm show -d \
              -g "${{ needs.detect-environment.outputs.resource_group }}" \
              -n "${{ needs.detect-environment.outputs.vm_name }}" \
              --query publicIps -o tsv 2>/dev/null || echo "")
            
            if [ -n "$AZ_IP" ] && is_public_ip "$AZ_IP"; then
              VM_IP="$AZ_IP"
              echo "✅ IP obtido via Azure CLI: $VM_IP"
            elif [ -n "$AZ_IP" ]; then
              echo "⚠️  Azure CLI retornou IP inválido/privado: $AZ_IP"
              echo "   Tentando obter IP público da interface de rede..."
              
              # Tentar obter IP público da interface de rede diretamente
              NIC_ID=$(az vm show -g "${{ needs.detect-environment.outputs.resource_group }}" -n "${{ needs.detect-environment.outputs.vm_name }}" --query "networkProfile.networkInterfaces[0].id" -o tsv 2>/dev/null || echo "")
              if [ -n "$NIC_ID" ]; then
                PUBLIC_IP_ID=$(az network nic show --ids "$NIC_ID" --query "ipConfigurations[0].publicIpAddress.id" -o tsv 2>/dev/null || echo "")
                if [ -n "$PUBLIC_IP_ID" ]; then
                  PUBLIC_IP=$(az network public-ip show --ids "$PUBLIC_IP_ID" --query "ipAddress" -o tsv 2>/dev/null || echo "")
                  if [ -n "$PUBLIC_IP" ] && is_public_ip "$PUBLIC_IP"; then
                    VM_IP="$PUBLIC_IP"
                    echo "✅ IP obtido via Public IP resource: $VM_IP"
                  fi
                fi
              fi
            fi
          fi

          if [ -z "$VM_IP" ]; then
            echo "❌ ERRO: Não foi possível obter um IP público válido da VM"
            echo "Terraform output: ${TF_IP:-vazio}"
            echo "Azure CLI (vm show): ${AZ_IP:-vazio}"
            echo ""
            echo "Verificando outputs do Terraform:"
            terraform output || true
            exit 1
          fi

          echo "vm_public_ip=$VM_IP" >> $GITHUB_OUTPUT
          echo "✅ VM Public IP validado: $VM_IP"
          echo "vm_public_ip=$VM_IP" >> $GITHUB_ENV

      - name: Save State Backup
        run: |
          set -euo pipefail
          BACKUP_FILE="terraform-state-backup-$(date +%Y%m%d-%H%M%S).json"
          terraform state pull > "$BACKUP_FILE"

          if [ ! -s "$BACKUP_FILE" ]; then
            echo "ERRO: Falha ao criar backup do state"
            exit 1
          fi

          BACKUP_SIZE=$(stat -f%z "$BACKUP_FILE" 2>/dev/null || stat -c%s "$BACKUP_FILE" 2>/dev/null || echo "0")
          echo "OK: Backup criado: $BACKUP_FILE (${BACKUP_SIZE} bytes)"

      - name: Upload State Backup
        uses: actions/upload-artifact@v4
        with:
          name: terraform-state-backup-${{ needs.detect-environment.outputs.environment }}-${{ github.run_id }}
          path: |
            terraform-state-backup-*.json
          retention-days: 90

  smoke-tests:
    name: Smoke Tests - Validação Pós-Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [detect-environment, terraform-apply, update-vm-code]
    if: success() && needs.update-vm-code.result == 'success'
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    env:
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_USE_OIDC: true
      TF_BACKEND_RESOURCE_GROUP: ${{ secrets.TF_BACKEND_RESOURCE_GROUP }}
      TF_BACKEND_STORAGE_ACCOUNT: ${{ secrets.TF_BACKEND_STORAGE_ACCOUNT }}
      TF_BACKEND_CONTAINER: ${{ secrets.TF_BACKEND_CONTAINER }}
      TF_BACKEND_KEY_PREFIX: ${{ secrets.TF_BACKEND_KEY_PREFIX }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: ./.github/actions/terraform-setup
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          working_directory: ${{ env.TF_WORKING_DIR }}

      - name: Azure Authentication
        uses: ./.github/actions/azure-auth
        with:
          subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          client_id: ${{ secrets.AZURE_CLIENT_ID }}

      - name: Write backend config
        run: |
          ENV="${{ needs.detect-environment.outputs.environment }}"
          cat > backend.hcl <<EOF
          resource_group_name  = "${TF_BACKEND_RESOURCE_GROUP}"
          storage_account_name = "${TF_BACKEND_STORAGE_ACCOUNT}"
          container_name       = "${TF_BACKEND_CONTAINER}"
          key                  = "${TF_BACKEND_KEY_PREFIX:-poc-deploy}-${ENV}.tfstate"
          use_azuread_auth     = true
          EOF

      - name: Terraform Init
        run: |
          set -euo pipefail

          # Tentar init normal primeiro
          if terraform init -input=false -upgrade -backend-config=backend.hcl 2>&1; then
            echo "✅ Terraform init concluído com sucesso"
          else
            # Se falhou por mudança de backend, tentar migrar estado com resposta automática
            echo "⚠️  Mudança no backend detectada, tentando migrar estado..."
            # Usar echo "yes" para responder automaticamente à pergunta de migração
            if echo "yes" | terraform init -input=false -upgrade -migrate-state -backend-config=backend.hcl 2>&1; then
              echo "✅ Estado migrado com sucesso"
            else
              # Se migração falhar, criar workspace primeiro (se necessário) e depois reconfigurar
              echo "⚠️  Migração falhou, criando workspace se necessário e forçando reconfiguração..."
              WORKSPACE="${{ needs.detect-environment.outputs.workspace }}"
              # Criar workspace antes do reconfigure (se não existir)
              terraform workspace select "$WORKSPACE" 2>/dev/null || terraform workspace new "$WORKSPACE" 2>/dev/null || true
              # Forçar reconfiguração do backend
              terraform init -input=false -upgrade -reconfigure -backend-config=backend.hcl
              echo "✅ Backend reconfigurado"
            fi
          fi

      - name: Select Workspace
        run: |
          terraform workspace select ${{ needs.detect-environment.outputs.workspace }} || \
          terraform workspace new ${{ needs.detect-environment.outputs.workspace }}

      - name: Get VM Public IP
        id: vm-ip
        run: |
          # Função para validar se IP é público (não RFC1918)
          is_public_ip() {
            local ip="$1"
            # Valida formato básico de IP
            if ! echo "$ip" | grep -qE '^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$'; then
              return 1
            fi
            # Extrai os octetos para validação numérica
            local octet1 octet2
            octet1=$(echo "$ip" | cut -d. -f1)
            octet2=$(echo "$ip" | cut -d. -f2)
            
            # Rejeita IPs privados (RFC1918):
            # - 10.0.0.0/8 (10.0.0.0 - 10.255.255.255)
            # - 172.16.0.0/12 (172.16.0.0 - 172.31.255.255)
            # - 192.168.0.0/16 (192.168.0.0 - 192.168.255.255)
            if [ "$octet1" -eq 10 ]; then
              return 1  # 10.x.x.x é privado
            fi
            if [ "$octet1" -eq 172 ] && [ "$octet2" -ge 16 ] && [ "$octet2" -le 31 ]; then
              return 1  # 172.16.x.x - 172.31.x.x é privado
            fi
            if [ "$octet1" -eq 192 ] && [ "$octet2" -eq 168 ]; then
              return 1  # 192.168.x.x é privado
            fi
            
            # Rejeita IPs de loopback e multicast
            if [ "$octet1" -eq 127 ] || [ "$octet1" -ge 224 ]; then
              return 1
            fi
            
            return 0
          }

          VM_IP=""

          # Tentar via Terraform output primeiro
          TF_IP=$(terraform output -raw vm_public_ip 2>/dev/null || echo "")
          if [ -n "$TF_IP" ] && is_public_ip "$TF_IP"; then
            VM_IP="$TF_IP"
            echo "✅ IP obtido via Terraform output: $VM_IP"
          else
            if [ -n "$TF_IP" ]; then
              echo "⚠️  Terraform retornou IP inválido/privado: $TF_IP"
              echo "   Tentando obter IP público via Azure CLI..."
            else
              echo "⚠️  VM IP não encontrado no output do Terraform"
              echo "   Tentando obter via Azure CLI..."
            fi
            
            RESOURCE_GROUP=$(terraform output -raw resource_group_name 2>/dev/null || echo "")
            VM_NAME=$(terraform output -raw vm_name 2>/dev/null || echo "")
            
            if [ -n "$RESOURCE_GROUP" ] && [ -n "$VM_NAME" ]; then
              AZ_IP=$(az vm show -d \
                -g "$RESOURCE_GROUP" \
                -n "$VM_NAME" \
                --query publicIps -o tsv 2>/dev/null || echo "")
              
              if [ -n "$AZ_IP" ] && is_public_ip "$AZ_IP"; then
                VM_IP="$AZ_IP"
                echo "✅ IP obtido via Azure CLI: $VM_IP"
              elif [ -n "$AZ_IP" ]; then
                echo "⚠️  Azure CLI retornou IP inválido/privado: $AZ_IP"
                echo "   Tentando obter IP público da interface de rede..."
                
                # Tentar obter IP público da interface de rede diretamente
                NIC_ID=$(az vm show -g "$RESOURCE_GROUP" -n "$VM_NAME" --query "networkProfile.networkInterfaces[0].id" -o tsv 2>/dev/null || echo "")
                if [ -n "$NIC_ID" ]; then
                  PUBLIC_IP_ID=$(az network nic show --ids "$NIC_ID" --query "ipConfigurations[0].publicIpAddress.id" -o tsv 2>/dev/null || echo "")
                  if [ -n "$PUBLIC_IP_ID" ]; then
                    PUBLIC_IP=$(az network public-ip show --ids "$PUBLIC_IP_ID" --query "ipAddress" -o tsv 2>/dev/null || echo "")
                    if [ -n "$PUBLIC_IP" ] && is_public_ip "$PUBLIC_IP"; then
                      VM_IP="$PUBLIC_IP"
                      echo "✅ IP obtido via Public IP resource: $VM_IP"
                    fi
                  fi
                fi
              fi
            else
              echo "⚠️  Resource Group ou VM Name não encontrados no Terraform output"
            fi
          fi

          if [ -z "$VM_IP" ]; then
            echo "❌ ERRO: Não foi possível obter um IP público válido da VM"
            echo "Terraform output: ${TF_IP:-vazio}"
            echo "Azure CLI (vm show): ${AZ_IP:-vazio}"
            echo ""
            echo "Verificando outputs do Terraform:"
            terraform output || true
            exit 1
          fi

          echo "vm_public_ip=$VM_IP" >> $GITHUB_OUTPUT
          echo "✅ VM Public IP validado: $VM_IP"
          echo "vm_public_ip=$VM_IP" >> $GITHUB_ENV

      - name: Get VM Information for Diagnostics
        id: vm-info-diagnostics
        run: |
          RESOURCE_GROUP=$(terraform output -raw resource_group_name 2>/dev/null || echo "")
          VM_NAME=$(terraform output -raw vm_name 2>/dev/null || echo "")

          echo "resource_group=${RESOURCE_GROUP}" >> $GITHUB_OUTPUT
          echo "vm_name=${VM_NAME}" >> $GITHUB_OUTPUT

          echo "✅ Informações da VM obtidas:"
          echo "  Resource Group: ${RESOURCE_GROUP:-não disponível}"
          echo "  VM Name: ${VM_NAME:-não disponível}"

      - name: Get VM Information
        id: vm-info
        run: |
          RESOURCE_GROUP=$(terraform output -raw resource_group_name 2>/dev/null || echo "")
          VM_NAME=$(terraform output -raw vm_name 2>/dev/null || echo "")
          VM_IP=$(terraform output -raw vm_public_ip 2>/dev/null || echo "")

          echo "vm_name=${VM_NAME}" >> $GITHUB_OUTPUT
          echo "resource_group=${RESOURCE_GROUP}" >> $GITHUB_OUTPUT
          echo "vm_public_ip=${VM_IP}" >> $GITHUB_OUTPUT

          echo "✅ Informações da VM obtidas para smoke tests:"
          echo "  Resource Group: ${RESOURCE_GROUP:-não disponível}"
          echo "  VM Name: ${VM_NAME:-não disponível}"
          echo "  VM IP: ${VM_IP:-não disponível}"

      - name: Wait for Services to Start
        run: |
          echo "Aguardando serviços iniciarem completamente..."
          sleep 30
          echo "✅ Aguardado 30s para serviços iniciarem"

      - name: Run Smoke Tests
        run: |
          set -eo pipefail  # Removido -u para evitar problemas com variáveis opcionais
          SCRIPT_PATH="${GITHUB_WORKSPACE}/scripts/smoke-tests.sh"
          chmod +x "$SCRIPT_PATH"

          echo "=========================================="
          echo "🧪 Executando Smoke Tests"
          echo "=========================================="
          echo "IP da VM: ${{ steps.vm-ip.outputs.vm_public_ip }}"
          echo "Resource Group: ${{ steps.vm-info.outputs.resource_group }}"
          echo "VM Name: ${{ steps.vm-info.outputs.vm_name }}"
          echo "Script: $SCRIPT_PATH"
          echo ""

          # Passa parâmetros adicionais para diagnóstico automático
          # Timeout aumentado para 120s (conforme recomendação)
          if bash "$SCRIPT_PATH" \
            "${{ steps.vm-ip.outputs.vm_public_ip }}" \
            120 \
            "${{ steps.vm-info.outputs.resource_group }}" \
            "${{ steps.vm-info.outputs.vm_name }}"; then
            echo ""
            echo "✅ Todos os smoke tests passaram!"
          else
            echo ""
            echo "❌ Smoke tests falharam!"
            echo ""
            echo "Verifique:"
            echo "  - Logs dos containers na VM"
            echo "  - Status do nginx/proxy"
            echo "  - Regras do NSG (porta 80)"
            exit 1
          fi

      - name: Smoke Tests Summary
        if: always()
        run: |
          echo "## 🧪 Smoke Tests - Resultado" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ **Todos os testes passaram!**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "VM IP: \`${{ steps.vm-ip.outputs.vm_public_ip }}\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Alguns testes falharam**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Verifique os logs acima para detalhes." >> $GITHUB_STEP_SUMMARY
          fi

  update-vm-code:
    name: Update VM Code
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [detect-environment, terraform-apply]
    if: success()
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    env:
      TF_BACKEND_RESOURCE_GROUP: ${{ secrets.TF_BACKEND_RESOURCE_GROUP }}
      TF_BACKEND_STORAGE_ACCOUNT: ${{ secrets.TF_BACKEND_STORAGE_ACCOUNT }}
      TF_BACKEND_CONTAINER: ${{ secrets.TF_BACKEND_CONTAINER }}
      TF_BACKEND_KEY_PREFIX: ${{ secrets.TF_BACKEND_KEY_PREFIX }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_USE_OIDC: true
      KEYVAULT_NAME: ${{ secrets.KEYVAULT_NAME }}
      KV_POSTGRES_PASSWORD_SECRET: ${{ secrets.KV_POSTGRES_PASSWORD_SECRET }}
      KV_REDIS_PASSWORD_SECRET: ${{ secrets.KV_REDIS_PASSWORD_SECRET }}
      KV_JWT_SECRET_SECRET: ${{ secrets.KV_JWT_SECRET_SECRET }}
      KV_ENCRYPTION_KEY_SECRET: ${{ secrets.KV_ENCRYPTION_KEY_SECRET }}
      KV_SENTRY_DSN_SECRET: ${{ secrets.KV_SENTRY_DSN_SECRET }}
      KV_OPENAI_API_KEY_SECRET: ${{ secrets.KV_OPENAI_API_KEY_SECRET }}
      # One-time bootstrap (opcional): permite gravar OPENAI_API_KEY no Key Vault via deploy (sem rodar az localmente).
      # Recomendado remover/deixar vazio depois que o KV estiver populado.
      OPENAI_API_KEY_BOOTSTRAP: ${{ secrets.OPENAI_API_KEY_BOOTSTRAP }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Terraform
        uses: ./.github/actions/terraform-setup
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          working_directory: ${{ env.TF_WORKING_DIR }}

      - name: Azure Authentication
        uses: ./.github/actions/azure-auth
        with:
          subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          client_id: ${{ secrets.AZURE_CLIENT_ID }}

      - name: Write backend config
        run: |
          ENV="${{ needs.detect-environment.outputs.environment }}"
          cat > backend.hcl <<EOF
          resource_group_name  = "${TF_BACKEND_RESOURCE_GROUP}"
          storage_account_name = "${TF_BACKEND_STORAGE_ACCOUNT}"
          container_name       = "${TF_BACKEND_CONTAINER}"
          key                  = "${TF_BACKEND_KEY_PREFIX:-poc-deploy}-${ENV}.tfstate"
          use_azuread_auth     = true
          EOF

      - name: Terraform Init
        run: |
          set -euo pipefail

          # Tentar init normal primeiro
          if terraform init -input=false -upgrade -backend-config=backend.hcl 2>&1; then
            echo "✅ Terraform init concluído com sucesso"
          else
            # Se falhou por mudança de backend, tentar migrar estado com resposta automática
            echo "⚠️  Mudança no backend detectada, tentando migrar estado..."
            # Usar echo "yes" para responder automaticamente à pergunta de migração
            if echo "yes" | terraform init -input=false -upgrade -migrate-state -backend-config=backend.hcl 2>&1; then
              echo "✅ Estado migrado com sucesso"
            else
              # Se migração falhar, criar workspace primeiro (se necessário) e depois reconfigurar
              echo "⚠️  Migração falhou, criando workspace se necessário e forçando reconfiguração..."
              WORKSPACE="${{ needs.detect-environment.outputs.workspace }}"
              # Criar workspace antes do reconfigure (se não existir)
              terraform workspace select "$WORKSPACE" 2>/dev/null || terraform workspace new "$WORKSPACE" 2>/dev/null || true
              # Forçar reconfiguração do backend
              terraform init -input=false -upgrade -reconfigure -backend-config=backend.hcl
              echo "✅ Backend reconfigurado"
            fi
          fi

      - name: Select/Create Workspace
        run: |
          terraform workspace select ${{ needs.detect-environment.outputs.workspace }} || \
          terraform workspace new ${{ needs.detect-environment.outputs.workspace }}

      - name: Get VM Information
        id: vm-info
        run: |
          VM_NAME=$(terraform output -raw vm_name 2>/dev/null || echo "")
          RESOURCE_GROUP=$(terraform output -raw resource_group_name 2>/dev/null || echo "")
          VM_IP=$(terraform output -raw vm_public_ip 2>/dev/null || echo "")

          ENV="${{ needs.detect-environment.outputs.environment }}"
          BRANCH_INPUT="${{ needs.detect-environment.outputs.branch }}"

          if [[ "$BRANCH_INPUT" == "manual" ]]; then
            # Para poc-sky e staging, usar staging; para prod, usar main
            if [[ "$ENV" == "poc-sky" ]] || [[ "$ENV" == "staging" ]]; then
              GIT_BRANCH="staging"
            else
              GIT_BRANCH="main"
            fi
          else
            GIT_BRANCH="$BRANCH_INPUT"
          fi

          GITHUB_REPO="${{ github.repository }}"

          echo "vm_name=${VM_NAME}" >> $GITHUB_OUTPUT
          echo "resource_group=${RESOURCE_GROUP}" >> $GITHUB_OUTPUT
          echo "vm_ip=${VM_IP}" >> $GITHUB_OUTPUT
          echo "git_branch=${GIT_BRANCH}" >> $GITHUB_OUTPUT
          echo "github_repo=${GITHUB_REPO}" >> $GITHUB_OUTPUT

      - name: Validate Key Vault (if configured)
        if: env.KEYVAULT_NAME != ''
        run: |
          set -euo pipefail
          KV_NAME="${KEYVAULT_NAME}"

          echo "Validando Key Vault: $KV_NAME"

          # Verificar se Key Vault existe
          if ! az keyvault show --name "$KV_NAME" --query id -o tsv > /dev/null 2>&1; then
            echo "ERRO: Key Vault não encontrado: $KV_NAME"
            echo ""
            echo "Possíveis causas:"
            echo "  1. Key Vault não foi criado"
            echo "  2. Nome do Key Vault está incorreto"
            echo "  3. Key Vault está em outro subscription/resource group"
            echo ""
            echo "Ações corretivas:"
            echo "  1. Crie o Key Vault:"
            echo "     az keyvault create \\"
            echo "       --name $KV_NAME \\"
            echo "       --resource-group <resource-group> \\"
            echo "       --location eastus"
            echo ""
            echo "  2. Ou remova KEYVAULT_NAME dos secrets do GitHub se não usar Key Vault"
            exit 1
          fi

          echo "OK: Key Vault encontrado"

          # Verificar permissões de leitura
          echo "Verificando permissões de leitura..."
          if ! az keyvault secret list --vault-name "$KV_NAME" --query "[].name" -o tsv > /dev/null 2>&1; then
            echo "ERRO: Sem permissão para ler secrets do Key Vault"
            echo ""
            echo "Conceda permissão 'Key Vault Secrets User' para a App Registration:"
            echo "  az keyvault set-policy \\"
            echo "    --name $KV_NAME \\"
            echo "    --spn <client-id> \\"
            echo "    --secret-permissions get list"
            exit 1
          fi

          echo "OK: Permissões de leitura validadas"

          # Verificar se secrets esperados existem (se nomes estiverem configurados)
          if [ -n "${KV_POSTGRES_PASSWORD_SECRET:-}" ]; then
            if ! az keyvault secret show --vault-name "$KV_NAME" --name "${KV_POSTGRES_PASSWORD_SECRET}" --query id -o tsv > /dev/null 2>&1; then
              echo "WARNING: WARNING: Secret não encontrado no Key Vault: ${KV_POSTGRES_PASSWORD_SECRET}"
            else
              echo "OK: Secret encontrado: ${KV_POSTGRES_PASSWORD_SECRET}"
            fi
          fi

          if [ -n "${KV_OPENAI_API_KEY_SECRET:-}" ]; then
            if ! az keyvault secret show --vault-name "$KV_NAME" --name "${KV_OPENAI_API_KEY_SECRET}" --query id -o tsv > /dev/null 2>&1; then
              echo "WARNING: WARNING: Secret não encontrado no Key Vault: ${KV_OPENAI_API_KEY_SECRET}"
            else
              echo "OK: Secret encontrado: ${KV_OPENAI_API_KEY_SECRET}"
            fi
          fi

          echo "OK: Key Vault $KV_NAME validado com sucesso"

      - name: Bootstrap OPENAI_API_KEY to Key Vault (optional)
        if: env.KEYVAULT_NAME != '' && env.OPENAI_API_KEY_BOOTSTRAP != '' && env.KV_OPENAI_API_KEY_SECRET != ''
        run: |
          set -euo pipefail
          KV_NAME="${KEYVAULT_NAME}"
          SECRET_NAME="${KV_OPENAI_API_KEY_SECRET}"
          echo "Bootstrapping OPENAI_API_KEY to Key Vault '$KV_NAME' (secret name: '$SECRET_NAME')"
          # Não exibe o valor da chave (o comando retorna metadados)
          az keyvault secret set \
            --vault-name "$KV_NAME" \
            --name "$SECRET_NAME" \
            --value "$OPENAI_API_KEY_BOOTSTRAP" \
            --query id -o tsv > /dev/null
          echo "OK: OPENAI_API_KEY gravada/atualizada no Key Vault"

      - name: Fetch secrets from Key Vault (optional)
        if: env.KEYVAULT_NAME != ''
        id: kv-secrets
        run: |
          set -euo pipefail
          KV_NAME="${KEYVAULT_NAME}"
          fetch_secret() {
            local name="$1"
            if [ -z "$name" ]; then 
              echo "WARNING: WARNING: Nome do secret vazio, ignorando"
              return
            fi
            SECRET_VALUE=$(az keyvault secret show \
              --vault-name "$KV_NAME" \
              --name "$name" \
              --query value -o tsv 2>&1)
            
            if [ $? -ne 0 ]; then
              echo "ERRO: Falha ao buscar secret '$name' do Key Vault '$KV_NAME'"
              echo "Erro: $SECRET_VALUE"
              exit 1
            fi
            
            if [ -z "$SECRET_VALUE" ]; then
              echo "WARNING: WARNING: Secret '$name' está vazio no Key Vault"
              return
            fi
            
            echo "$SECRET_VALUE"
          }

          echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD" >> $GITHUB_ENV
          echo "REDIS_PASSWORD=$REDIS_PASSWORD" >> $GITHUB_ENV
          echo "JWT_SECRET_KEY=$JWT_SECRET_KEY" >> $GITHUB_ENV
          echo "ENCRYPTION_KEY=$ENCRYPTION_KEY" >> $GITHUB_ENV
          echo "SENTRY_DSN=$SENTRY_DSN" >> $GITHUB_ENV
          echo "OPENAI_API_KEY_KV=$OPENAI_API_KEY" >> $GITHUB_ENV

          if $wrote; then
            echo "has_secrets=true" >> $GITHUB_OUTPUT
          else
            echo "has_secrets=false" >> $GITHUB_OUTPUT
          fi

      # Removidos steps redundantes de Write .env e Validate .env
      # Agora tudo é tratado de forma robusta pelo standalone script setup-vm-runtime.sh

      - name: Update Code on VM
        run: |
          set -eo pipefail  # Removido -u para evitar problemas com variáveis não inicializadas

          # Preparar token robusto (usar GH_PAT se disponível para cross-repo access)
          TOKEN_VAL="${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}"
          BRANCH_VAL="${{ steps.vm-info.outputs.git_branch }}"
          REPO_VAL="${{ steps.vm-info.outputs.github_repo }}"

          # Criar script temporário com variáveis exportadas no topo
          echo "#!/bin/bash" > /tmp/vm-update-script.sh
          # Re-exportar como GITHUB_TOKEN para compatibilidade com o script .sh
          echo "export GITHUB_TOKEN='$TOKEN_VAL'" >> /tmp/vm-update-script.sh
          echo "export BRANCH='$BRANCH_VAL'" >> /tmp/vm-update-script.sh
          echo "export REPO='$REPO_VAL'" >> /tmp/vm-update-script.sh
          echo "" >> /tmp/vm-update-script.sh
          cat "${{ github.workspace }}/scripts/update-vm-code.sh" | grep -v "^#!/bin/bash" >> /tmp/vm-update-script.sh

          echo "🔐 Executando script de atualização na VM..."

          # Executar script na VM usando @file syntax
          # CRÍTICO: Desabilitar exit on error (set +e) para capturar output e exit code
          set +e
          UPDATE_OUTPUT=$(az vm run-command invoke \
            --resource-group ${{ steps.vm-info.outputs.resource_group }} \
            --name ${{ steps.vm-info.outputs.vm_name }} \
            --command-id RunShellScript \
            --scripts "@/tmp/vm-update-script.sh" \
            --output json 2>&1)

          # Capturar exit code imediatamente
          UPDATE_EXIT_CODE=$?
          set -e  # Reabilitar exit on error

          # Salvar output para debug
          echo "$UPDATE_OUTPUT" > update-code-output.txt
          cat update-code-output.txt

          # Verificar se o comando foi bem-sucedido
          if [ "$UPDATE_EXIT_CODE" -ne 0 ]; then
            echo "❌ ERRO: Falha ao atualizar código na VM (exit code: $UPDATE_EXIT_CODE)"
            echo ""
            echo "Logs completos:"
            echo "$UPDATE_OUTPUT"
            exit 1
          fi

          # CRÍTICO: Verificar se há erros na resposta da VM (mesmo que o comando tenha retornado sucesso)
          # O az vm run-command pode retornar sucesso mesmo quando o script interno falha
          if command -v jq >/dev/null 2>&1; then
            if echo "$UPDATE_OUTPUT" | jq -e '.value[0].message' > /dev/null 2>&1; then
              VM_MESSAGE=$(echo "$UPDATE_OUTPUT" | jq -r '.value[0].message' 2>/dev/null || echo "")
              
              # 1. Priorizar Marcador de Sucesso
              if echo "$VM_MESSAGE" | grep -q "✅ Código atualizado com sucesso!"; then
                echo "✅ Marcador de sucesso encontrado. Validando stderr isoladamente..."
                
                # Mesmo com sucesso, verificar se há erros reais no stderr (ignorando avisos comuns do git)
                STDERR_CONTENT=$(echo "$VM_MESSAGE" | sed -n '/\[stderr\]/,$p' | tail -n +2 | grep -v "^$" | head -20 || true)
                if [ -n "$STDERR_CONTENT" ]; then
                  REAIS_ERROS=$(echo "$STDERR_CONTENT" | grep -viE "(Already on|up to date|Your branch is up to date)" | grep -iE "(fatal|error|ERRO|falhou|failed)" || true)
                  if [ -n "$REAIS_ERROS" ]; then
                    echo "❌ ERRO detectado no stderr (mesmo com marcador de sucesso):"
                    echo "$REAIS_ERROS"
                    exit 1
                  fi
                fi
              else
                # 2. Se não houver marcador de sucesso, realizar verificação rigorosa
                if echo "$VM_MESSAGE" | grep -qiE "(ERRO|ERROR|❌|falhou|failed|exit code.*[1-9]|Illegal option)"; then
                  echo "❌ ERRO detectado na resposta da VM (sem marcador de sucesso):"
                  echo ""
                  echo "Mensagem parcial:"
                  echo "$VM_MESSAGE" | head -50
                  echo ""
                  echo "❌ Falhando workflow devido a erros detectados"
                  exit 1
                fi
              fi
            fi
          else
            # Se jq não estiver disponível, verificar marcador ou falhar se houver erro óbvio
            if ! echo "$UPDATE_OUTPUT" | grep -q "✅ Código atualizado com sucesso!"; then
              if echo "$UPDATE_OUTPUT" | grep -qiE '(ERRO|ERROR|❌|falhou|failed|exit code.*[1-9]|Illegal option)'; then
                echo "❌ ERRO detectado na resposta (sem jq e sem marcador de sucesso):"
                echo "$UPDATE_OUTPUT" | grep -iE "(ERRO|ERROR|❌|falhou|failed)" | head -20
                exit 1
              fi
            fi
          fi

          echo "✅ Código atualizado na VM com sucesso"

      - name: Setup Runtime and Restart Containers
        run: |
          set -eo pipefail

          # Preparar variáveis para o script
          TOKEN_VAL="${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}"
          BRANCH_VAL="${{ steps.vm-info.outputs.git_branch }}"
          REPO_VAL="${{ steps.vm-info.outputs.github_repo }}"
          OPENAI_KEY="${{ secrets.OPENAI_API_KEY_BOOTSTRAP }}"

          # Criar script temporário com variáveis exportadas no topo
          echo "#!/bin/bash" > /tmp/vm-runtime-script.sh
          echo "export GITHUB_TOKEN='$TOKEN_VAL'" >> /tmp/vm-runtime-script.sh
          echo "export BRANCH='$BRANCH_VAL'" >> /tmp/vm-runtime-script.sh
          echo "export REPO='$REPO_VAL'" >> /tmp/vm-runtime-script.sh
          echo "export OPENAI_API_KEY_BOOTSTRAP='${OPENAI_API_KEY_KV:-$OPENAI_KEY}'" >> /tmp/vm-runtime-script.sh
          echo "export POSTGRES_PASSWORD='${POSTGRES_PASSWORD:-}'" >> /tmp/vm-runtime-script.sh
          echo "export REDIS_PASSWORD='${REDIS_PASSWORD:-}'" >> /tmp/vm-runtime-script.sh
          echo "export JWT_SECRET_KEY='${JWT_SECRET_KEY:-}'" >> /tmp/vm-runtime-script.sh
          echo "export ENCRYPTION_KEY='${ENCRYPTION_KEY:-}'" >> /tmp/vm-runtime-script.sh
          echo "export SENTRY_DSN='${SENTRY_DSN:-}'" >> /tmp/vm-runtime-script.sh
          echo "export VM_IP='${{ steps.vm-info.outputs.vm_public_ip }}'" >> /tmp/vm-runtime-script.sh
          echo "" >> /tmp/vm-runtime-script.sh

          # Anexar o conteúdo do script
          cat "${{ github.workspace }}/scripts/setup-vm-runtime.sh" >> /tmp/vm-runtime-script.sh

          echo "🚀 Executando Setup de Runtime e Restart na VM..."

          # CRÍTICO: Capturar output e validar
          RUNTIME_OUTPUT=$(az vm run-command invoke \
            --resource-group ${{ steps.vm-info.outputs.resource_group }} \
            --name ${{ steps.vm-info.outputs.vm_name }} \
            --command-id RunShellScript \
            --scripts @/tmp/vm-runtime-script.sh \
            --output json 2>&1)

          # Capturar exit code
          RUNTIME_EXIT_CODE=$?
          set -e  # Reabilitar exit on error

          # Salvar output para debug
          echo "$RUNTIME_OUTPUT" > runtime-output.txt
          cat runtime-output.txt

          # Verificar se o comando foi bem-sucedido
          if [ "$RUNTIME_EXIT_CODE" -ne 0 ]; then
            echo ""
            echo "❌ ERRO: Falha ao executar setup-vm-runtime.sh (exit code: $RUNTIME_EXIT_CODE)"
            echo ""
            echo "Logs completos:"
            echo "$RUNTIME_OUTPUT"
            exit 1
          fi

          # CRÍTICO: Verificar se há erros na resposta da VM (mesmo que o comando tenha retornado sucesso)
          if command -v jq >/dev/null 2>&1; then
            if echo "$RUNTIME_OUTPUT" | jq -e '.value[0].message' > /dev/null 2>&1; then
              VM_MESSAGE=$(echo "$RUNTIME_OUTPUT" | jq -r '.value[0].message' 2>/dev/null || echo "")
              
              # 1. Priorizar Marcador de Sucesso
              if echo "$VM_MESSAGE" | grep -q "✅ OPERAÇÃO CONCLUÍDA COM SUCESSO!"; then
                echo "✅ Marcador de sucesso final encontrado. Validando integridade básica..."
                
                # Verificar se há erros fatais no stderr (mas sem falhar workflow se o marcador final existir, a menos que seja muito grave)
                STDERR_CONTENT=$(echo "$VM_MESSAGE" | sed -n '/\[stderr\]/,$p' | tail -n +2 | grep -v "^$" | head -10)
                if [ -n "$STDERR_CONTENT" ] && echo "$STDERR_CONTENT" | grep -qiE "(fatal: |CRITICAL ERROR|FAILED TO START)"; then
                   echo "❌ ERRO CRÍTICO detectado no stderr (mesmo com marcador de sucesso):"
                   echo "$STDERR_CONTENT"
                   exit 1
                fi
              else
                # 2. Se não houver marcador de sucesso, realizar verificação rigorosa
                if echo "$VM_MESSAGE" | grep -qiE "(ERRO|ERROR|❌|falhou|failed|exit code.*[1-9]|Illegal option)"; then
                  echo "❌ ERRO detectado na resposta da VM (sem marcador de sucesso):"
                  echo ""
                  echo "Mensagem parcial:"
                  echo "$VM_MESSAGE" | head -50
                  echo ""
                  echo "❌ Falhando workflow devido a erros detectados"
                  exit 1
                fi
              fi
              
              # Verificar se containers foram iniciados (apenas aviso se não encontrar)
              if ! echo "$VM_MESSAGE" | grep -qiE "(✅ Containers iniciados|✅.*containers|containers.*started|docker compose.*up.*success)"; then
                echo "⚠️  AVISO: Não foi possível confirmar via logs que containers foram iniciados"
              fi
            fi
          else
            # Se jq não estiver disponível, verificar manual básico
            if ! echo "$RUNTIME_OUTPUT" | grep -q "✅ OPERAÇÃO CONCLUÍDA COM SUCESSO!"; then
              if echo "$RUNTIME_OUTPUT" | grep -qiE '(ERRO|ERROR|❌|falhou|failed|exit code.*[1-9]|Illegal option)'; then
                echo "❌ ERRO detectado na resposta (sem jq e sem marcador de sucesso):"
                echo "$RUNTIME_OUTPUT" | grep -iE "(ERRO|ERROR|❌|falhou|failed)" | head -20
                exit 1
              fi
            fi
          fi

          echo "✅ Setup de Runtime executado na VM"

  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [detect-environment, terraform-apply]
    if: failure() && (needs.detect-environment.outputs.environment == 'prod' || needs.detect-environment.outputs.environment == 'staging' || needs.detect-environment.outputs.environment == 'poc-sky')
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    env:
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_USE_OIDC: true
      TF_BACKEND_RESOURCE_GROUP: ${{ secrets.TF_BACKEND_RESOURCE_GROUP }}
      TF_BACKEND_STORAGE_ACCOUNT: ${{ secrets.TF_BACKEND_STORAGE_ACCOUNT }}
      TF_BACKEND_CONTAINER: ${{ secrets.TF_BACKEND_CONTAINER }}
      TF_BACKEND_KEY_PREFIX: ${{ secrets.TF_BACKEND_KEY_PREFIX }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: ./.github/actions/terraform-setup
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          working_directory: ${{ env.TF_WORKING_DIR }}

      - name: Azure Authentication
        uses: ./.github/actions/azure-auth
        with:
          subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          client_id: ${{ secrets.AZURE_CLIENT_ID }}

      - name: Write backend config
        run: |
          ENV="${{ needs.detect-environment.outputs.environment }}"
          cat > backend.hcl <<EOF
          resource_group_name  = "${TF_BACKEND_RESOURCE_GROUP}"
          storage_account_name = "${TF_BACKEND_STORAGE_ACCOUNT}"
          container_name       = "${TF_BACKEND_CONTAINER}"
          key                  = "${TF_BACKEND_KEY_PREFIX:-poc-deploy}-${ENV}.tfstate"
          use_azuread_auth     = true
          EOF

      - name: Terraform Init
        run: |
          set -euo pipefail

          # Tentar init normal primeiro
          if terraform init -input=false -upgrade -backend-config=backend.hcl 2>&1; then
            echo "✅ Terraform init concluído com sucesso"
          else
            # Se falhou por mudança de backend, tentar migrar estado com resposta automática
            echo "⚠️  Mudança no backend detectada, tentando migrar estado..."
            # Usar echo "yes" para responder automaticamente à pergunta de migração
            if echo "yes" | terraform init -input=false -upgrade -migrate-state -backend-config=backend.hcl 2>&1; then
              echo "✅ Estado migrado com sucesso"
            else
              # Se migração falhar, criar workspace primeiro (se necessário) e depois reconfigurar
              echo "⚠️  Migração falhou, criando workspace se necessário e forçando reconfiguração..."
              WORKSPACE="${{ needs.detect-environment.outputs.workspace }}"
              # Criar workspace antes do reconfigure (se não existir)
              terraform workspace select "$WORKSPACE" 2>/dev/null || terraform workspace new "$WORKSPACE" 2>/dev/null || true
              # Forçar reconfiguração do backend
              terraform init -input=false -upgrade -reconfigure -backend-config=backend.hcl
              echo "✅ Backend reconfigurado"
            fi
          fi

      - name: Select/Create Workspace
        run: |
          terraform workspace select ${{ needs.detect-environment.outputs.workspace }} || \
          terraform workspace new ${{ needs.detect-environment.outputs.workspace }}

      - name: Check for Previous State Backup
        id: check-backup
        continue-on-error: true
        run: |
          echo "backup_found=false" >> $GITHUB_OUTPUT
