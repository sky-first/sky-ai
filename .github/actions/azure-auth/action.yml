---
name: 'Azure Authentication'
description: 'Authenticate to Azure via OIDC and set subscription'
inputs:
  subscription_id:
    description: 'Azure Subscription ID'
    required: true
  tenant_id:
    description: 'Azure Tenant ID'
    required: true
  client_id:
    description: 'Azure AD Application (client) ID used for OIDC'
    required: true
outputs:
  subscription_id:
    description: 'Azure Subscription ID used'
    value: ${{ inputs.subscription_id }}
runs:
  using: 'composite'
  steps:
    - name: Azure Login (OIDC)
      uses: azure/login@v2
      with:
        client-id: ${{ inputs.client_id }}
        tenant-id: ${{ inputs.tenant_id }}
        subscription-id: ${{ inputs.subscription_id }}

    - name: Verify Azure Authentication
      shell: bash
      run: |
        SUBSCRIPTION=$(az account show --query id -o tsv)
        if [ "$SUBSCRIPTION" != "${{ inputs.subscription_id }}" ]; then
          echo "Failed to set subscription"
          exit 1
        fi
