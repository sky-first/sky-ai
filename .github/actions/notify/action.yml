name: 'Deployment Notification'
description: 'Send deployment notifications to Slack/Email'
inputs:
  status:
    description: 'Deployment status (success/failure/cancelled)'
    required: true
  environment:
    description: 'Target environment'
    required: true
  workflow_url:
    description: 'GitHub Actions workflow URL'
    required: false
    default: ''
  message:
    description: 'Additional message'
    required: false
    default: ''
outputs:
  notification_sent:
    description: 'Whether notification was sent'
    value: ${{ steps.notify.outputs.sent }}
runs:
  using: 'composite'
  steps:
    - name: Send Notification
      id: notify
      shell: bash
      continue-on-error: true
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      run: |
        if [ -z "$SLACK_WEBHOOK_URL" ]; then
          echo "Slack webhook not configured, skipping notification"
          echo "sent=false" >> $GITHUB_OUTPUT
          exit 0
        fi
        
        WORKFLOW_URL="${{ inputs.workflow_url }}"
        if [ -z "$WORKFLOW_URL" ]; then
          WORKFLOW_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
        fi
        
        STATUS_EMOJI="SUCCESS"
        STATUS_COLOR="good"
        if [ "${{ inputs.status }}" == "failure" ]; then
          STATUS_EMOJI="FAILURE"
          STATUS_COLOR="danger"
        elif [ "${{ inputs.status }}" == "cancelled" ]; then
          STATUS_EMOJI="CANCELLED"
          STATUS_COLOR="warning"
        fi
        
        PAYLOAD=$(cat <<EOF
        {
          "text": "${STATUS_EMOJI} Deployment ${{ inputs.status }}",
          "blocks": [
            {
              "type": "header",
              "text": {
                "type": "plain_text",
                "text": "${STATUS_EMOJI} Deployment ${{ inputs.status }}"
              }
            },
            {
              "type": "section",
              "fields": [
                {
                  "type": "mrkdwn",
                  "text": "*Environment:*\n${{ inputs.environment }}"
                },
                {
                  "type": "mrkdwn",
                  "text": "*Repository:*\n${GITHUB_REPOSITORY}"
                },
                {
                  "type": "mrkdwn",
                  "text": "*Branch:*\n${GITHUB_REF#refs/heads/}"
                },
                {
                  "type": "mrkdwn",
                  "text": "*Commit:*\n${GITHUB_SHA:0:7}"
                }
              ]
            },
            {
              "type": "section",
              "text": {
                "type": "mrkdwn",
                "text": "${{ inputs.message }}"
              }
            },
            {
              "type": "actions",
              "elements": [
                {
                  "type": "button",
                  "text": {
                    "type": "plain_text",
                    "text": "View Workflow"
                  },
                  "url": "${WORKFLOW_URL}"
                }
              ]
            }
          ]
        }
        EOF
        )
        
        curl -X POST -H 'Content-type: application/json' \
          --data "$PAYLOAD" \
          "$SLACK_WEBHOOK_URL" || echo "Failed to send notification"
        
        echo "sent=true" >> $GITHUB_OUTPUT
