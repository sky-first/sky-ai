---
name: Backend Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: Deploy target environment
        required: true
        default: staging
        options:
          - staging
          - production
      blue_green:
        type: boolean
        description: Enable blue-green deployment
        default: false
      ref:
        type: string
        description: Commit/branch/tag to deploy (defaults to current)
        required: false

concurrency:
  group: backend-deploy-${{ inputs.environment }}
  cancel-in-progress: false

env:
  PYTHON_DEFAULT: '3.11'

jobs:
  prepare:
    name: Prepare & validate
    runs-on: ubuntu-latest
    outputs:
      target_ref: ${{ steps.ref.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Set target ref
        id: ref
        run: echo "value=${GITHUB_SHA}" >> $GITHUB_OUTPUT
      - name: Validate configuration
        run: |
          test -f requirements.txt || test -f pyproject.toml

  pre_deploy_tests:
    name: Final smoke tests
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.target_ref }}
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Run smoke tests
        run: |
          pytest -m "smoke or not slow" --maxfail=1 --disable-warnings -q

  deploy:
    name: Deploy backend
    needs: pre_deploy_tests
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.deploy.outputs.app_url || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.target_ref }}
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
      - name: Install deploy requirements
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Blue-Green deploy (optional)
        if: ${{ inputs.blue_green }}
        run: |
          echo "Running blue-green strategy for ${{ inputs.environment }}"
          ./scripts/azure/deploy_to_vm.sh --blue-green --env ${{ inputs.environment }}
      - name: Standard deploy
        if: ${{ not inputs.blue_green }}
        run: ./scripts/azure/deploy_to_vm.sh --env ${{ inputs.environment }}
      - name: Publish app URL
        id: deploy
        run: echo "app_url=https://example.${{ inputs.environment }}.yourdomain.com" >> $GITHUB_OUTPUT

  health_check:
    name: Post-deploy health check
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run health checks
        run: ./scripts/health_check.sh ${{ inputs.environment }}

  rollback:
    name: Rollback on failure
    needs: [deploy, health_check]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trigger rollback
        run: ./scripts/rollback_optimization.sh ${{ inputs.environment }}

  notify:
    name: Notify
    needs: [deploy, health_check, rollback]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send summary (email/console)
        env:
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL || '' }}
        run: |
          STATUS="${{ job.status }}"
          echo "Deploy $STATUS for ${{ inputs.environment }}" > deploy-summary.txt
          if [ -n "$NOTIFY_EMAIL" ]; then echo "Deploy $STATUS" | mail -s "Backend deploy $STATUS" "$NOTIFY_EMAIL"; else cat deploy-summary.txt; fi
