---
name: CD - Frontend Azure

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Login Azure via OIDC
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login ACR
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build & Push Docker Image
        run: |
          docker build -t ${{ secrets.ACR_NAME }}.azurecr.io/frontend:${{ github.sha }} .
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/frontend:${{ github.sha }}

      - name: Deploy to Azure App Service
        run: |
          az webapp config container set \
            --name frontend-app \
            --resource-group rg-frontend \
            --docker-custom-image-name ${{ secrets.ACR_NAME }}.azurecr.io/frontend:${{ github.sha }}

