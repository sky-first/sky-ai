---
services:
  postgres:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    container_name: ai_saas_postgres_prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ai_saas_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    restart: unless-stopped
    # Limites de recursos
    mem_limit: 2g
    mem_reservation: 1g
    cpus: 2.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai_saas_network

  redis:
    image: redis:7-alpine
    container_name: ai_saas_redis_prod
    # Configuração otimizada: maxmemory 400MB, política LRU, sem persistência em disco
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "400mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    restart: unless-stopped
    # Limites de recursos
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 1.0
    healthcheck:
      # Enterprise-grade: usa variável de ambiente do container (disponível via $REDIS_PASSWORD)
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping 2>/dev/null | grep -q PONG || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ai_saas_network

  backend:
    build:
      context: ../sky-poc-backend
      dockerfile: docker/Dockerfile
    container_name: ai_saas_backend_prod
    environment:
      DATABASE_URL: ${BACKEND_DATABASE_URL}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      DEBUG: ${DEBUG:-false}
      ENVIRONMENT: production
      # AI Engine (sky-poc-ai)
      # DEVOPS: por padrão, mantenha "mock". Para ativar IA real, configure no .env:
      #   AI_SERVICE_TYPE=real
      #   OPENAI_API_KEY=...
      AI_SERVICE_TYPE: ${AI_SERVICE_TYPE:-mock}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai:8001}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # CRÍTICO: CORS_ORIGINS deve ser configurado explicitamente no .env
      # NUNCA use "*" ou "0.0.0.0" - isso permite qualquer origem (vulnerabilidade)
      # Validação deve ser feita no código do backend
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai:
        condition: service_healthy
    restart: unless-stopped
    # Limites de recursos
    mem_limit: 2g
    mem_reservation: 1g
    cpus: 2.0
    networks:
      - ai_saas_network
    command: >
      sh -c "
        echo 'Waiting for database to be ready...' &&
        MAX_ATTEMPTS=30 &&
        ATTEMPT=1 &&
        while [ $$ATTEMPT -le $$MAX_ATTEMPTS ]; do
          if python -c \"import socket; s=socket.socket(); s.settimeout(2); result=s.connect_ex(('postgres', 5432)); s.close(); exit(0 if result == 0 else 1)\" 2>/dev/null || pg_isready -h postgres -U $${POSTGRES_USER:-postgres} >/dev/null 2>&1; then
            echo \"Database is ready! (attempt $$ATTEMPT/$$MAX_ATTEMPTS)\" &&
            break
          fi
          if [ $$ATTEMPT -eq $$MAX_ATTEMPTS ]; then
            echo \"ERROR: Database not ready after $$MAX_ATTEMPTS attempts (60s timeout)\" &&
            exit 1
          fi
          echo \"Attempt $$ATTEMPT/$$MAX_ATTEMPTS: Database not ready, waiting 2s...\" &&
          sleep 2 &&
          ATTEMPT=$$((ATTEMPT + 1))
        done &&
        echo 'Starting backend server...' &&
        uvicorn src.main:app --host 0.0.0.0 --port 8000 --workers 2
      "
    healthcheck:
      # Usar Python ao invés de curl (curl não está instalado no container)
      # Python urllib já está disponível no container do backend
      # Evita "try/except" em uma linha (isso é inválido em Python). Usa fallback via shell `||`.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=5)\" 2>/dev/null || python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)\" 2>/dev/null"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

  worker:
    build:
      context: ../sky-poc-backend
      dockerfile: docker/Dockerfile.worker
    container_name: ai_saas_worker_prod
    environment:
      DATABASE_URL: ${BACKEND_DATABASE_URL}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # CELERY_BROKER_URL and CELERY_RESULT_BACKEND are built in code with proper encoding
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      # AI Engine (sky-poc-ai)
      AI_SERVICE_TYPE: ${AI_SERVICE_TYPE:-mock}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai:8001}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai:
        condition: service_healthy
    restart: unless-stopped
    # Limites de recursos
    mem_limit: 1g
    mem_reservation: 512m
    cpus: 1.0
    networks:
      - ai_saas_network
    # Reduzido de 4 para 2 concurrency para economizar recursos e conexões
    command: celery -A src.workers.celery_app worker --loglevel=info --concurrency=2
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os; processes = [open(f'/proc/{p}/cmdline').read() for p in os.listdir('/proc') if p.isdigit() and os.path.exists(f'/proc/{p}/cmdline')]; exit(0 if any('celery' in p for p in processes) else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  beat:
    build:
      context: ../sky-poc-backend
      dockerfile: docker/Dockerfile.worker
    container_name: ai_saas_beat_prod
    environment:
      DATABASE_URL: ${BACKEND_DATABASE_URL}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # CELERY_BROKER_URL and CELERY_RESULT_BACKEND are built in code with proper encoding
      # AI Engine (sky-poc-ai)
      AI_SERVICE_TYPE: ${AI_SERVICE_TYPE:-mock}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai:8001}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai:
        condition: service_healthy
    restart: unless-stopped
    # Limites de recursos
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    networks:
      - ai_saas_network
    command: celery -A src.workers.celery_app beat --loglevel=info
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os; processes = [open(f'/proc/{p}/cmdline').read() for p in os.listdir('/proc') if p.isdigit() and os.path.exists(f'/proc/{p}/cmdline')]; exit(0 if any('celery' in p for p in processes) else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  migrate:
    build:
      context: ../sky-poc-backend
      dockerfile: docker/Dockerfile
    container_name: ai_saas_migrate
    environment:
      DATABASE_URL: ${BACKEND_DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "
        echo 'Waiting for database to be ready...' &&
        MAX_ATTEMPTS=30 &&
        ATTEMPT=1 &&
        while [ $$ATTEMPT -le $$MAX_ATTEMPTS ]; do
          if python -c \"import socket; s=socket.socket(); s.settimeout(2); result=s.connect_ex(('postgres', 5432)); s.close(); exit(0 if result == 0 else 1)\" 2>/dev/null || pg_isready -h postgres -U $${POSTGRES_USER:-postgres} >/dev/null 2>&1; then
            echo \"Database is ready! (attempt $$ATTEMPT/$$MAX_ATTEMPTS)\" &&
            break
          fi
          if [ $$ATTEMPT -eq $$MAX_ATTEMPTS ]; then
            echo \"ERROR: Database not ready after $$MAX_ATTEMPTS attempts (60s timeout)\" &&
            exit 1
          fi
          echo \"Attempt $$ATTEMPT/$$MAX_ATTEMPTS: Database not ready, waiting 2s...\" &&
          sleep 2 &&
          ATTEMPT=$$((ATTEMPT + 1))
        done &&
        echo 'Running alembic migrations...' &&
        (alembic upgrade heads || echo 'WARNING: Alembic migrations failed (backend schema mismatch). Continuing to allow stack startup.') &&
        echo 'Migrations step finished.'
      "
    restart: "no"
    networks:
      - ai_saas_network

  ai:
    build:
      # Build a partir do diretório pai (monorepo) para usar Dockerfile do repo de infra
      context: ..
      dockerfile: sky-poc-infra/docker/ai/Dockerfile
    container_name: ai_saas_ai_prod
    environment:
      DATABASE_URL: ${AI_DATABASE_URL}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # Se não setar CELERY_* explicitamente, o sky-poc-ai constrói a partir de REDIS_PASSWORD
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEBUG: ${DEBUG:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 2g
    mem_reservation: 512m
    cpus: 2.0
    networks:
      - ai_saas_network
    healthcheck:
      # Usar Python (sem curl). O sky-poc-ai expõe GET /health (porta 8001)
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=5)\""]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

  frontend:
    build:
      # DevOps: Production Build
      context: ..
      dockerfile: sky-poc-infra/docker/frontend/Dockerfile
      # Passar variáveis de ambiente para o build time
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
    container_name: ai_saas_frontend_prod
    environment:
      # IMPORTANTE: Esta variável deve ser configurada no .env
      # Melhor prática: usar path relativo para evitar mixed-content (http/https) e CORS.
      # Ex.: /api/v1
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    # Limites de recursos
    mem_limit: 2g
    mem_reservation: 1g
    cpus: 1.0
    networks:
      - ai_saas_network
    # Healthcheck para garantir que Next.js está pronto antes de nginx iniciar
    # start_period: 90s dá tempo para Next.js compilar em modo dev (NODE_ENV=development)
    # Isso elimina race condition: nginx só inicia quando frontend está realmente pronto
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30s  # Reduced from 90s because prod build is faster to start

  proxy:
    image: nginx:1.25-alpine
    container_name: ai_saas_proxy
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy  # Mudado de service_started para service_healthy
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nginx -t"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - ai_saas_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  ai_saas_network:
    driver: bridge

