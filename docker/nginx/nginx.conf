# Rate limiting zones
# CRÍTICO: Proteção contra DDoS e abuse
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

# HTTP server - Redireciona para HTTPS
server {
  listen 80;
  server_name _;
  
  # Redirecionar todo tráfego HTTP para HTTPS
  # NOTA: Se certificados SSL não estiverem configurados, comente as linhas abaixo
  # e descomente apenas o bloco de proxy HTTP
  return 301 https://$host$request_uri;
  
  # Se HTTPS não estiver disponível, descomente abaixo e comente o return acima:
  # include /etc/nginx/conf.d/http-only.conf;
}

# HTTPS server - Configuração segura
server {
  listen 443 ssl http2;
  server_name _;
  
  # SSL/TLS Configuration
  # CRÍTICO: Certificados SSL são obrigatórios para produção
  # Configure certificados via Let's Encrypt, Azure Key Vault, ou outro provedor
  # Certificados devem estar em: /etc/nginx/certs/
  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  
  # SSL/TLS Security Settings
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;
  ssl_session_tickets off;
  
  # Security Headers - CRÍTICO: Proteção contra ataques comuns
  # HSTS - Force HTTPS por 1 ano (incluindo subdomínios)
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  
  # X-Frame-Options - Previne clickjacking
  add_header X-Frame-Options "SAMEORIGIN" always;
  
  # X-Content-Type-Options - Previne MIME type sniffing
  add_header X-Content-Type-Options "nosniff" always;
  
  # X-XSS-Protection - Proteção básica contra XSS (legado, mas ainda útil)
  add_header X-XSS-Protection "1; mode=block" always;
  
  # Content Security Policy - CRÍTICO: Proteção contra XSS e injection
  # Ajuste conforme necessário para sua aplicação
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'self';" always;
  
  # Referrer Policy
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  
  # Permissions Policy (antigo Feature-Policy)
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  
  # Remove server version from headers
  server_tokens off;
  
  # Proxy para frontend (Next.js)
  location / {
    # Rate limiting
    limit_req zone=general_limit burst=50 nodelay;
    limit_req_status 429;
    
    proxy_pass http://frontend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    
    # WebSocket support
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  # Proxy para backend (FastAPI) - CRÍTICO: Rate limiting aplicado
  location /api/ {
    # Rate limiting - Proteção contra DDoS e abuse
    limit_req zone=api_limit burst=20 nodelay;
    limit_req_status 429;
    
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    
    # Timeouts para APIs longas
    proxy_read_timeout 300s;
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
  }
  
  # Health check endpoint (sem rate limiting)
  location /health {
    proxy_pass http://backend:8000/health;
    access_log off;
  }
  
  # Ajustes globais de buffer/timeout
  proxy_read_timeout 300s;
  proxy_connect_timeout 60s;
  proxy_send_timeout 300s;
  proxy_buffering on;
  proxy_buffer_size 4k;
  proxy_buffers 8 4k;
  proxy_busy_buffers_size 8k;
}

