# Configuração Nginx com Observabilidade (Prometheus + Grafana)
# DEVOPS: Usamos roteamento por path (/grafana, /prometheus) para evitar abertura de portas no firewall.

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

map $http_origin $cors_origin {
    default "";
    "~^http://localhost(:[0-9]+)?$" $http_origin;
    "~^http://127.0.0.1(:[0-9]+)?$" $http_origin;
    "~^http://20.185.60.67(:[0-9]+)?$" $http_origin;
}

server {
  listen 80;
  server_name _;

  # Gzip Compression
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

  resolver 127.0.0.11 ipv6=off valid=10s;
  set $frontend_upstream frontend:3000;
  set $backend_upstream backend:8000;
  set $prometheus_upstream prometheus:9090;
  set $grafana_upstream grafana:3000;
  
  # Security Headers
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  server_tokens off;
  
  # 1. Prometheus Proxy (Subpath /prometheus/)
  location /prometheus/ {
    proxy_pass http://$prometheus_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # WebSocket support para console interativo
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  location = /prometheus {
    return 301 $scheme://$http_host/prometheus/;
  }

  # 2. Grafana Proxy (Subpath /grafana/)
  location /grafana/ {
    proxy_pass http://$grafana_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # WebSocket support para painéis em tempo real
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  location = /grafana {
    return 301 $scheme://$http_host/grafana/;
  }

  # 3. Backend API v1
  location /api/v1/ {
    limit_req zone=api_limit burst=20 nodelay;
    
    # CORS logic simplificada para este exemplo
    add_header Access-Control-Allow-Origin "$cors_origin" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    
    if ($request_method = 'OPTIONS') {
      return 204;
    }
    
    proxy_pass http://$backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    proxy_read_timeout 300s;
  }

  # 4. Frontend (Catch-all)
  location / {
    limit_req zone=general_limit burst=50 nodelay;
    
    proxy_pass http://$frontend_upstream;
    
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    
    proxy_read_timeout 300s;
  }
  
  location /health {
    proxy_pass http://$backend_upstream/health;
    access_log off;
  }

  location /stub_status {
    stub_status on;
    access_log off;
    allow 127.0.0.1;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    allow 10.0.0.0/8;
    deny all;
  }
}
