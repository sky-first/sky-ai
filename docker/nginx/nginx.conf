server {
  listen 80;
  listen 443 ssl;

  # Certificados devem ser montados em /etc/nginx/certs
  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;

  # Ajuste se quiser forçar HTTPS; para agora apenas redirecionamos quando chegar via 80
  if ($scheme = http) {
    return 301 https://$host$request_uri;
  }

  # Proxy para frontend (Next.js)
  location / {
    proxy_pass http://frontend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Proxy para backend (FastAPI)
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  # Ajustes de buffer/timeout (opcional)
  proxy_read_timeout 300s;
  proxy_connect_timeout 60s;
  proxy_send_timeout 300s;
}


