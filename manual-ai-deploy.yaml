apiVersion: batch/v1
kind: Job
metadata:
  name: sky-ai-stg-common-app-migrate
  labels:
    helm.sh/chart: common-app-0.1.3
    app.kubernetes.io/name: common-app
    app.kubernetes.io/instance: sky-ai-stg
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  template:
    metadata:
      name: sky-ai-stg-common-app-migrate
      labels:
        app.kubernetes.io/name: common-app
        app.kubernetes.io/instance: sky-ai-stg
    spec:
      restartPolicy: Never
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      imagePullSecrets:
        - name: regcred
      containers:
        - name: migrate
          image: "skyacrstagingj3minh.azurecr.io/sky-poc-ai:sha-3baaa8aa774de6e622ec3591da40b9e3f7dcadc9"
          imagePullPolicy: Always
          command: ["python3","-c"]
          args: ["import os, asyncio, asyncpg, glob\nfrom sqlalchemy import text\nfrom db.session import engine\nfrom db.models import Base\n\nasync def run():\n    url = os.getenv('DATABASE_URL')\n    if not url:\n        print('DATABASE_URL not set')\n        return\n    \n    # 1. Enable pgvector extension\n    pure_url = url.replace('postgresql+asyncpg://', 'postgresql://')\n    pure_url = pure_url.replace('postgresql+psycopg2://', 'postgresql://')\n    if 'psycopg2' in pure_url: pure_url = pure_url.replace('psycopg2', '')\n    \n    try:\n        print('Enabling pgvector extension...')\n        conn_pg = await asyncpg.connect(pure_url)\n        await conn_pg.execute('CREATE EXTENSION IF NOT EXISTS vector;')\n        await conn_pg.close()\n        print('✅ extension vector enabled')\n    except Exception as e:\n        print(f'Warning enabling vector extension: {e}')\n\n    # 2. Sync SQLAlchemy Models (chat_history, embeddings, etc)\n    try:\n        print('Syncing SQLAlchemy models...')\n        async with engine.begin() as conn:\n            await conn.run_sync(Base.metadata.create_all)\n        print('✅ models synced')\n    except Exception as e:\n        print(f'Warning syncing models: {e}')\n\n    # 3. Apply raw SQL migrations\n    try:\n        conn_pg = await asyncpg.connect(pure_url)\n        for f in sorted(glob.glob('/app/db/migrations/*.sql')):\n            with open(f) as sq:\n                print(f'Applying {f}...')\n                try:\n                    await conn_pg.execute(sq.read())\n                except Exception as e:\n                    print(f'Notice: {e}')\n        await conn_pg.close()\n    except Exception as e:\n        print(f'Warning applying SQL migrations: {e}')\n    \nasyncio.run(run())\n"]
          env:
            - name: CELERY_BROKER_URL
              valueFrom:
                secretKeyRef:
                  name: sky-ai-stg-common-app-secrets
                  key: celery_broker_url
                  optional: true
            - name: CELERY_RESULT_BACKEND
              valueFrom:
                secretKeyRef:
                  name: sky-ai-stg-common-app-secrets
                  key: celery_result_backend
                  optional: true
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sky-ai-stg-common-app-secrets
                  key: database_url
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sky-ai-stg-common-app-secrets
                  key: openai_api_key
                  optional: true
            - name: QDRANT_URL
              valueFrom:
                secretKeyRef:
                  name: sky-ai-stg-common-app-secrets
                  key: qdrant_url
                  optional: true
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: sky-ai-stg-common-app-secrets
                  key: redis_url
                  optional: true
            - name: REDIS_PORT
              value: "6379"
            - name: DEBUG
              value: "false"
            - name: OLLAMA_BASE_URL
              value: http://127.0.0.1
