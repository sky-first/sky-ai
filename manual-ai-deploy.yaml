apiVersion: apps/v1
kind: Deployment
metadata:
  name: sky-ai-stg-common-app
  labels:
    helm.sh/chart: common-app-0.1.3
    app.kubernetes.io/name: common-app
    app.kubernetes.io/instance: sky-ai-stg
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: common-app
      app.kubernetes.io/instance: sky-ai-stg
  template:
    metadata:
      annotations:
        rollout-trigger: "2026-02-02T14:51:12Z"
      labels:
        app.kubernetes.io/name: common-app
        app.kubernetes.io/instance: sky-ai-stg
    spec:
      imagePullSecrets:
        - name: regcred
      serviceAccountName: sky-ai-stg-common-app
      enableServiceLinks: false
      securityContext:
        fsGroup: 2000
        runAsGroup: 3000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: common-app
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
              - NET_BIND_SERVICE
              drop:
              - ALL
            readOnlyRootFilesystem: true
          image: "skyacrstagingj3minh.azurecr.io/sky-poc-ai:sha-3baaa8aa774de6e622ec3591da40b9e3f7dcadc9"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8001
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /docs
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /docs
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          env:
            - name: CELERY_BROKER_URL
              valueFrom:
                secretKeyRef:
                  name: sky-ai-stg-common-app-secrets
                  key: celery_broker_url
                  optional: true
            - name: CELERY_RESULT_BACKEND
              valueFrom:
                secretKeyRef:
                  name: sky-ai-stg-common-app-secrets
                  key: celery_result_backend
                  optional: true
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sky-ai-stg-common-app-secrets
                  key: database_url
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sky-ai-stg-common-app-secrets
                  key: openai_api_key
                  optional: true
            - name: QDRANT_URL
              valueFrom:
                secretKeyRef:
                  name: sky-ai-stg-common-app-secrets
                  key: qdrant_url
                  optional: true
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: sky-ai-stg-common-app-secrets
                  key: redis_url
                  optional: true
            - name: REDIS_PORT
              value: "6379"
            - name: DEBUG
              value: "false"
            - name: OLLAMA_BASE_URL
              value: http://127.0.0.1
