apiVersion: v1
kind: Pod
metadata:
  name: treino-dev-gpu
  namespace: ollama
spec:
  restartPolicy: Never
  containers:
  - name: pytorch
    image: pytorch/pytorch:2.1.0-cuda12.1-cudnn8-runtime
    command: ["sleep", "infinity"]
    resources:
      limits:
        nvidia.com/gpu: 1  # Solicita GPU Tesla T4
        memory: "24Gi"
        cpu: "4"
      requests:
        memory: "16Gi"
        cpu: "2"
    volumeMounts:
    - name: workspace
      mountPath: /workspace
  volumes:
  - name: workspace
    emptyDir: {}
  nodeSelector:
    sky-poc-type: gpu
  tolerations:
  - key: "sku"
    operator: "Equal"
    value: "gpu"
    effect: "NoSchedule"
  - key: "kubernetes.azure.com/scalesetpriority"
    operator: "Equal"
    value: "spot"
    effect: "NoSchedule"
